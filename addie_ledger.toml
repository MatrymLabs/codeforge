# The ADDIE ledger: the MAJOR continuous-improvement cycles CodeForge has run (docs/addie_loop.md).
#
# Minor work runs the ADDIE self-check silently and files nothing here (the doctrine stays
# lightweight). Major work files a [cycle.<id>] table that closes the whole loop: analyze, design,
# develop, implement, evaluate, and next_cycle. `make addie` (and the test twin on `make check`)
# fails loud if any filed cycle skipped a phase or left the loop open. scale is "minor" or "major".

[cycle.addie_loop]
subject = "Add the ADDIE continuous-improvement loop to CodeForge itself"
scale = "major"
analyze = """CodeForge has strong point gates (ARC, Ritual, intake, qualitygate, security) but no
encoded LOOP discipline: nothing structurally stops it from building without understanding or
declaring success without evaluation. The vision asks it to learn in a loop, not move in a straight
line. Gap: a lightweight, composable self-check. Success = a machine-checkable five-phase record
that refuses the four failure modes, reusing the existing gate pattern, overriding no control."""
design = """Smallest coherent solution: kernel/addie.py, mirroring the intake.py gate (record -> gaps
-> audit -> render -> make button + test twin), plus a doctrine doc. Boundary: ADDIE adds NO
authority and overrides no control - it is the loop those controls run inside. An AddieSelfCheck
carries the five phases + next_cycle; gaps() names the four failure modes; a minor cycle is silent,
a major cycle must close the loop. Rollback: delete the part + ledger + doc + make target; nothing
depends on it. No new dependency (stdlib tomllib)."""
develop = """Built kernel/addie.py (CARD: addie): PHASES, SCALES, AddieSelfCheck, self_check() for
in-code use, gaps() validator, read_ledger/audit_addie over addie_ledger.toml, render_self_check +
render_addie. Reused the intake.py pattern rather than inventing a new gate shape. Frameless."""
implement = """Wired: make addie + python -m kernel.addie (control panel), addie_ledger.toml seeded
with this cycle (dogfooded), docs/addie_loop.md (the doctrine + how it composes with Blueprints, ARC,
AURA, Ritual, Hardware Store, testing, security, docs, fleet governance), filed in the module
registry (MOD-10.044), test twin tests/test_addie.py riding make check."""
evaluate = """Evidence: make check green with the new test twin (acceptance: this cycle passes;
refusal: a major cycle missing evaluate reports 'declared success without evaluation', missing
analyze reports 'built without understanding', unknown scale is refused, a minor cycle needs only a
subject). The gate refuses an incomplete loop, so success cannot be declared without evaluation -
the invariant is enforced on itself. Overrides no existing control; boundaries clean."""
next_cycle = """Reanalyze: should ADDIE become a read-only ARC dimension (continuous-improvement),
reading this ledger the way ARC reads its other filed evidence? And should a MUD verb ('addie')
surface the loop in the world, as 'arc' does? Both are deferred as honest next slices, not built
speculatively now."""

[cycle.addie_close_the_loop]
subject = "Close the ADDIE loop: wire it into ARC + surface it in the world"
scale = "major"
analyze = """The ADDIE ledger existed but nothing read it into readiness and it was invisible in
the world - the exact 'next cycle' the addie_loop cycle named. Gap: an ARC continuous-improvement
dimension + an in-world verb. Constraints: ARC reads only (arch law 1), MISSING is never a pass, a
dimension must cite its source; overrides no control. Success = ARC shows an honest improvement
verdict from the ledger and `addie` is reachable through the engine tick."""
design = """Smallest coherent solution: add an 'improvement' dimension to parts/arc.py that reads the
ADDIE ledger via addie.audit_addie (READY all-looped / WATCHLIST any-flagged / MISSING no-ledger,
malformed fails loud), and an `addie` verb in kernel/addie.py mirroring the `arc` verb, wired on the
command spine. No new part, no new dependency. Rollback: drop the dimension + verb + command."""
develop = """arc.py: DIMENSIONS + _improvement_dim(root) reading addie_ledger.toml, composed in
filed_review. addie.py: addie(arg) verb (status window, text is a projection). Reused the arc
dimension + verb patterns rather than inventing new shapes."""
implement = """forge.py command spine (CMD-04.077, imported + registered), filed in
registry/designations/commands.json (the command-completeness gate requires it), ARC test helper
_seed_evidence now files a clean ledger so baseline READY holds, docs/addie_loop.md deferrals flipped
to done. Verified live: ARC renders [ready] improvement from the real ledger; `addie` reachable
through handle_command."""
evaluate = """make check green; new tests: the improvement dimension (MISSING/READY/WATCHLIST, cites
its source) and an unlooped cycle holding ARC on WATCHLIST; the addie verb through the engine tick.
ARC stays honest (improvement READY only when the ledger is clean); overrides no control."""
next_cycle = """Reanalyze: the addie/arc verdicts are read-only and not filed on the inner loop
(change/patch/release stay MISSING by design). A future slice could file continuous-improvement
verdicts the way arc_ledger files release. Not built speculatively now."""
