# Emberwright -- a maker who bends raw ember; patient hands, deep magic.
ember_bolt:
  name: Ember Bolt
  kind: strike
  power: 5
  scales: magic
  mp_cost: 3
  element: FIR  # flame: the Cinder-Wight drinks it in -- bring frost to that fight
