# SEED: aethryn -- abilities.yaml (each calling's ember-forged moveset)
# `use <ability> [on <target>]` fires one; `skills` lists what your calling can wield.

# Vanguard -- ward and edge, strength and stamina.
ember_edge:
  name: Ember Edge
  kind: strike
  power: 6
  scales: strength
  mp_cost: 3
  jobs: [vanguard]

ward:
  name: Ward
  kind: heal
  power: 7
  scales: stamina
  mp_cost: 5
  cooldown: 3
  jobs: [vanguard]

guard_challenge:
  name: Guard's Challenge
  kind: taunt  # the tank's lever: forces the foe's aggro onto the wielder (no damage)
  power: 0
  mp_cost: 3
  cooldown: 2
  jobs: [vanguard]
war_cry:
  name: War Cry
  kind: buff  # empower an ally's blows (+50% strike damage) for a spell -- the party leader's rally
  power: 3
  mp_cost: 4
  cooldown: 3
  jobs: [vanguard]

# Pathfinder -- reads the wilds, strikes from the flank; speed over brute force.
