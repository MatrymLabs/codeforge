# SEED: aethryn -- quests/the_verdance.yaml (the living wild, Build Order Phase 3): cross to the
# Verdance, reach the canopy capital of Highbough, and go humble to the Heart-Grove to answer its
# Boughwarden -- the apex of a whole living continent. Self-playing from real deeds.

id: the_verdance
name: The Verdance
start: unlanded
reward_xp: 600

steps:
  - {state: unlanded,  event: land,  to: at_highbough, on_enter: highbough}
  - {state: at_highbough, event: delve, to: at_the_heart, on_enter: the_heart_grove}
  - {state: at_the_heart, event: answer, to: answered, on_defeat: boughwarden, effect: award_xp}

terminal: [answered]

labels:
  unlanded: "West of Tidewharf, the ferry threads a green channel to the Verdance -- a continent that is, in the most literal sense, alive. Land, and walk inside it."
  at_highbough: "You stand in Highbough, the Deeprooted's canopy capital. South through the breathing mire beats the Heart-Grove, the living center of the whole Reach. Delve to it -- humbly, the elders say, or not at all."
  at_the_heart: "You stand in the Heart-Grove, one creature the size of a valley, its whole attention on you. The Boughwarden guards its heart. Answer it, and the living wild will know your name."
  answered: |-
    *** THE WILD KNOWS YOUR NAME ***
    The Boughwarden lays down its guard, and the Heart-Grove's vast attention turns from trespass to
    something like welcome. You did not conquer the Verdance -- nothing conquers a living continent --
    you answered it, and were spared, and marked. The Deeprooted will speak of the Forger the wild
    let walk its heart. You have seen the First Seed's dream alive and dangerous, and lived to carry
    the sight of it on across the sea.
