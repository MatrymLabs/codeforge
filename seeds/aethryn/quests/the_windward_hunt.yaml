# SEED: aethryn -- quests/the_windward_hunt.yaml (an Ember-road / Windward Downs bounty). Thin the
# downs-stalker that works the ember-elk herds, so the caravans can graze their beasts on the downs.

id: the_windward_hunt
name: The Windward Hunt
start: contracted
reward_xp: 130

steps:
  - {state: contracted, event: hunt, to: hunted, on_defeat: downs_stalker, effect: award_xp}

terminal: [hunted]

labels:
  contracted: "The caravan-master posts a bounty: a downs-stalker works the ember-elk on the Windward Downs, and the caravans lose a draft-beast to it a season. Hunt it, and graze the downs in peace."
  hunted: |-
    *** THE DOWNS ARE QUIET ***
    The downs-stalker falls in the gold grass, and the ember-elk drift back onto the ridgelines
    unafraid. The caravan-master will graze the downs now, and the drivers will not sleep with one eye
    on the grass. A hunter's coin, honestly earned -- the road runs a little safer for it.
