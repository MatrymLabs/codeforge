# Windward Downs, the way the Concord went before it paved the Ember-road, and stand where they stood.

id: the_first_road
name: The First Road
start: rumored
reward_xp: 110

steps:
  - {state: rumored, event: find, to: found, on_enter: the_windward_downs, effect: award_xp}

terminal: [found]

labels:
  rumored: "The caravan-master speaks of the old cairns on the Windward Downs -- the first road, the way the Concord walked the Kindlands before it paved the Ember-road. Walk up onto the downs and find where they went."
  found: |-
    *** YOU WALKED THE FIRST ROAD ***
    The cairns of the first Rekindling stand on the high ground of the downs, stone piled on stone by
    hands that walked this way before there was a road to walk. From up here you can see the line they
    took, coast to capital, the long way, the human way, before the Forgework paved it straight. Someone
    should still remember the first road. Now you do.
