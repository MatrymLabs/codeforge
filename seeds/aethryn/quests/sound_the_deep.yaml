# SEED: aethryn -- quests/sound_the_deep.yaml (a DISCOVERY side-quest, not a kill-bounty)
# Rewards EXPLORATION: it plays itself from reaching the deepest floor of the Cinderdeep (on_enter),
# so a player who sounds the deep to its bottom is paid for the journey, not for a kill.

id: sound_the_deep
name: Sound the Deep
start: unheard
reward_xp: 200

steps:
  - {state: unheard, event: sound, to: sounded, on_enter: the_cinderheart, effect: award_xp}

terminal: [sounded]

labels:
  unheard: "They say the Cinderdeep has a bottom -- the Cinderheart, where the Unforging first tore the world. Few who speak of it have stood there. Reach it, and see."
  sounded: |-
    *** THE DEEP IS SOUNDED ***
    You stand on the Cinderheart, the deepest floor of the world, where a shard of the First Seed
    sank and went cold ages past. Few have looked on it and climbed back up to the light. You have
    sounded the deep to its very bottom, and carried the sight of it home.
