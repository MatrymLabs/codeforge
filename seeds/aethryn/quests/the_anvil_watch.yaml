# SEED: aethryn -- quests/the_anvil_watch.yaml (a Kollforge side-quest). Break a Forgeborn loose in
# the Anvil-Vents, so the Kollkin can work the vent it holds without feeding it a Forger a season.

id: the_anvil_watch
name: The Anvil Watch
start: held
reward_xp: 700

steps:
  - {state: held, event: break, to: broken, on_defeat: forgeborn, effect: award_xp}

terminal: [broken]

labels:
  held: "A Forgeborn -- a made thing that outlived its maker -- has taken a working vent in the Anvil-Vents, and the Kollkin lose a Forger to it every season. Break it, and give them back their fire."
  broken: |-
    *** THE VENT IS FREE ***
    The Forgeborn's grey light goes out and its plates fall slack around a fire that was never its
    own. The Kollkin move back in before the metal cools, already crying the vent open for the next
    pour. In the Kollforge they do not mourn a construct. They mourn the work it kept them from.
