# SEED: aethryn -- quests/the_broken_span.yaml (a Sundered Sky dungeon side-quest). Clear the fall-wraith
# from the last broken bridge, so a Forger can cross to the Wandering Court without being pulled after it.

id: the_broken_span
name: The Broken Span
start: barred
reward_xp: 900

steps:
  - {state: barred, event: clear, to: cleared, on_defeat: fall_wraith, effect: award_xp}

terminal: [cleared]

labels:
  barred: "The last sky-bridge to the Wandering Court is broken mid-air, and a fall-wraith rides the gap -- one the loose lands took, that pulls others after it into the endless fall. Clear it, and the crossing holds."
  cleared: |-
    *** THE SPAN HOLDS ***
    The fall-wraith comes apart in your hands and scatters into the cloud below, still falling, alone
    now. The broken bridge does not mend -- nothing up here does -- but the gap is only a gap again,
    a leap a living Forger can make. The Court drifts ahead, and nothing rides the span to stop you.
