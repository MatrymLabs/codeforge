# SEED: aethryn -- quests/greenhold_intro.yaml  (Greenhold's local quest: The Granary's Thirst)
#
# Auto-loaded by parts/world/quest.py from seeds/aethryn/quests/. A small, local loop that expands
# the named location per the seed's quest structure: a local need (the failing cistern), a
# world-level echo (old-world purification tech), a cost (the dark undercroft and its vermin), a
# visible result (the reward + standing), and an unresolved remainder (whether the old water can be
# trusted, left as a rumour). It triggers entirely off natural play, so it never collides with the
# bare `quest accept` verb: ENTER the granary to meet Wenna (offered -> accepted), TAKE the valve-key
# in the undercroft (accepted -> recovered), then return and ENTER the granary again to finish. Both
# enter-steps target the granary but fire only from their own state, so mid-quest passing is inert.
id: greenhold_granary
name: The Granary's Thirst
start: offered
reward_xp: 40
steps:
  - {state: offered, event: enter, to: accepted, on_enter: greenhold_granary}
  - {state: accepted, event: take, to: recovered, on_take: greenhold_valve_key}
  - state: recovered
    event: enter
    to: done
    on_enter: greenhold_granary
    effect: "award_xp;grant_rep:making:20"
terminal: [done]
labels:
  offered: "Somewhere in Greenhold, a keeper needs a hand. Step into the granary and hear her out."
  accepted: "Keeper Wenna's cistern has failed. Go DOWN into the undercroft and take the valve-key (mind the vermin)."
  recovered: "Carry the valve-key back UP to Keeper Wenna in the granary."
  done: "*** The valve turns, and clean water wakes in the old fountain. Greenhold will not go thirsty. ***"
