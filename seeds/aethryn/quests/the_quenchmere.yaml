# SEED: aethryn -- quests/the_quenchmere.yaml (the first sea-crossing, Build Order Phase 2): sail the
# Wreckways to the free-port Tidewharf, then delve the drowned capital of Sunhold and still its Warden
# so the Salvage Guilds can open the richest Forgework in the Reach. Self-playing from real deeds.

id: the_quenchmere
name: The Quenchmere
start: ashore
reward_xp: 500

steps:
  - {state: ashore,   event: sail,  to: at_port,   on_enter: tidewharf_plaza}
  - {state: at_port,  event: delve, to: descending, on_enter: the_drowned_sunhold}
  - {state: descending, event: still, to: opened,  on_defeat: sunhold_warden, effect: award_xp}

terminal: [opened]

labels:
  ashore: "West of Quench Harbor, a Merewright ferry runs the Wreckways to the Quenchmere -- the drowned Reach across the Cooling-Sea. Take passage, and see the wider world."
  at_port: "You stand in Tidewharf, the great free-port, a city on a hundred drowned hulls. Below the docks lies Sunhold, the capital the sea took. Delve it, if the Guilds' coin and your nerve hold."
  descending: "You walk the drowned Sunhold, lit and cold below the keels, its Forge-halls still burning. The Sunhold Warden holds the deepest hall, keeping a capital that fell an age ago. Still it, and open the deep."
  opened: |-
    *** THE DROWNED CAPITAL IS OPENED ***
    The Sunhold Warden lays down its charge at last, and the drowned ember-light of the sunken city
    steadies from a war-watch into a welcome. The Salvage Guilds will map these halls for a
    generation, and the richest unbroken Forgework in the Quenchmere is open to the world. You
    crossed the sea to a drowned Reach and walked its dead capital home -- the first of the Reaches
    beyond the cradle, and not the last.
