# SEED: aethryn -- quests/the_summit.yaml (the capstone: the far end of the Forgeward Road, at the cap)
# The endgame. Past the hand-authored marches and out the procedural Forgeward Road (parts/world/
# spiral.py), the journey ends at the Forge's Edge, where the Sovereign stands at the level ceiling.
# Reach the world's heart, best the Sovereign, and the 1-300 road is done. The stable far-end labels
# (spiral.SUMMIT_ROOM / SUMMIT_BOSS) let this arc name the end no matter how far the Road runs.

id: the_summit
name: The Forge's Edge
start: climbing
reward_xp: 5000

steps:
  - {state: climbing,    event: reach, to: at_the_summit, on_enter: the_spiral_summit}
  - {state: at_the_summit, event: crown, to: crowned,     on_defeat: spiral_sovereign, effect: award_xp}

terminal: [crowned]

labels:
  climbing: "Somewhere far east, past march upon march, the Forgeward Road ends at the world's heart. Follow it to the Forge's Edge, if you can reach it."
  at_the_summit: |-
    You stand at the Forge's Edge, at the world's far heart, where the air is only ember and memory.
    Here the Road ends -- and here, at last, you see it: the First Seed itself, dim and cracked, the
    pattern the whole world grew from, still holding the last of its light. Before it stands the
    Sovereign, grey and vast, the guardian the Unforging left to keep the broken Seed from ever being
    made whole again. It turns its cold crown toward you. Every ember you relit on the long road burns
    warm in your hands now. Put the guardian down, and end the sundering.
  crowned: |-
    *** THE SEED REMEMBERS ***
    The Sovereign falls, and its grey light goes out. In the silence after, the embers you carried --
    from the first spark on the Waking Shore to the last march of the Road -- rise from your hands and
    settle, one by one, into the cracked First Seed. Each finds the place it was torn from. The
    fracture that was the Unforging closes like a wound remembering how to be whole.
    The Seed brightens -- not to a blaze, but to the steady, singing warmth of a pattern made one
    again. Far behind you, march upon march, the whole world you crossed feels it: the Kindlands warm,
    the Cinderdeep stirs, the cold roads thaw. The sundering is answered. The world is reforged.
    You washed ashore with nothing and no memory of the craft. You leave the heart of the world the
    Forger who gathered a broken world back into one. Well forged, from the first ember to the last.
