# SEED: aethryn -- quests/the_logging_stands.yaml (a Reachwood / Woodcutters' Camp side-quest). Clear
# the bark-lurker so the Concord foresters can cut the stands again, and the camp owes you a keg.

id: the_logging_stands
name: The Logging Stands
start: barred
reward_xp: 100

steps:
  - {state: barred, event: clear, to: cleared, on_defeat: bark_lurker, effect: award_xp}

terminal: [cleared]

labels:
  barred: "The camp-keeper's foresters won't work the logging stands east: a bark-lurker, deadfall and old ember grown into a thing that swings back, has taken the cut. Clear it, and the saws sing again."
  cleared: |-
    *** THE STANDS ARE SAFE ***
    The bark-lurker comes apart into the deadfall it grew from, just wood again. The foresters take up
    their saws, and by evening the stands ring with the cut and the camp smells of fresh resin. The
    camp-keeper stands you a keg you did not ask for, and the wood is a working wood again. Quiet coin,
    honest work -- the trade that keeps a town in timber while the Forgers chase the loud reward.
