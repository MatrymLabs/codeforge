# SEED: aethryn -- quests/the_glass_gallery.yaml (a Rimefall dungeon side-quest). Put down the sentinel
# the Rime-King set in the frozen gallery, so the Silent Anvil can keep their vigil in peace.

id: the_glass_gallery
name: The Glass Gallery
start: watched
reward_xp: 620

steps:
  - {state: watched, event: still, to: stilled, on_defeat: rimebound_sentinel, effect: award_xp}

terminal: [stilled]

labels:
  watched: "In the frozen gallery north of Stillhearth, one of the makers is not as frozen as the rest: a sentinel the Rime-King set, keeping a watch three ages cold. Still it, and the vigil is the Silent Anvil's alone again."
  stilled: |-
    *** THE WATCH IS ENDED ***
    The sentinel cracks apart in its skin of rime and is still, at last, among the still. Three ages
    of watch, ended in a breath. The Silent Anvil will not thank you loudly -- they do nothing loudly
    -- but the one warm hearth of Stillhearth burns a little easier tonight, one cold eye closed.
