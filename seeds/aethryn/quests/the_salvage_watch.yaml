# SEED: aethryn -- quests/the_salvage_watch.yaml (a Quenchmere side-quest, not the main arc). Still
# the drowned-lung sentry that keeps the salvage-stair, so the wreck-divers can work Sunhold in peace.

id: the_salvage_watch
name: The Salvage Watch
start: warned
reward_xp: 320

steps:
  - {state: warned, event: still, to: stilled, on_defeat: drowned_lung_sentry, effect: award_xp}

terminal: [stilled]

labels:
  warned: "The wreck-divers of Tidewharf will not work the salvage-stair while a drowned-lung sentry keeps it, still walking a watch the sea ended an age ago. Put it down, and the stair is theirs again."
  stilled: |-
    *** THE STAIR IS QUIET ***
    The sentry's drowned-lung Forgework comes apart in the grey water and settles, at last, into the
    silt it was cut from. On the stair above, the divers unship their lamps and begin to descend
    toward Sunhold. A watch kept too long is not loyalty. Someone had to tell it the war was over.
