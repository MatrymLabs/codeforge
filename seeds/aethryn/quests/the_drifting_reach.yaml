# SEED: aethryn -- quests/the_drifting_reach.yaml (a Sundered Sky side-quest: DISCOVERY, not a kill).
# Cross the sky-bridges east of Highgate to the wandering shards, where the Drifting Court drifts.

id: the_drifting_reach
name: The Drifting Reach
start: moored
reward_xp: 800

steps:
  - {state: moored, event: cross, to: crossed, on_enter: the_drifting_reach, effect: award_xp}

terminal: [crossed]

labels:
  moored: "East of Highgate the shards drift loose, crossed only on sky-bridges of surviving Ember-road that sway on the wind. Few walk out to them. The Skyborn will mark you for it if you do."
  crossed: |-
    *** YOU WALKED THE DRIFTING REACH ***
    The last sky-bridge sways under you and holds, and you stand on a shard that answers to no map,
    trailing its waterfalls into cloud. The fall-wights drift the raw edges, still falling in a way
    that never ends. The Skyborn keep a name for those who cross to the wandering lands. Now they
    keep yours.
