# SEED: aethryn -- quests/the_channel_toll.yaml (a Verdance side-quest). Clear the channel-serpent
# from the passage the ferries thread, so the crossing into the Verdance runs safe again.

id: the_channel_toll
name: The Channel Toll
start: barred
reward_xp: 360

steps:
  - {state: barred, event: clear, to: cleared, on_defeat: channel_serpent, effect: award_xp}

terminal: [cleared]

labels:
  barred: "A channel-serpent has taken the green passage where the ferries thread into the Verdance, and it takes a toll in ferrymen. Clear it, and the crossing opens."
  cleared: |-
    *** THE CROSSING IS OPEN ***
    The serpent uncoils one last time and sinks into the warm brown water, and the channel is only a
    channel again. The Deeprooted send no thanks -- they do not grieve a predator -- but the ferrymen
    of Tidewharf will run the green passage now without counting heads at the far bank.
