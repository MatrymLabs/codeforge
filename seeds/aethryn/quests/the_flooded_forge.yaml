# SEED: aethryn -- quests/the_flooded_forge.yaml (a Quenchmere dungeon side-quest). Still the revenant
# that keeps the drowned forge, so the divers can work the deepest halls of Sunhold.

id: the_flooded_forge
name: The Flooded Forge
start: burning
reward_xp: 380

steps:
  - {state: burning, event: still, to: stilled, on_defeat: flooded_forge_revenant, effect: award_xp}

terminal: [stilled]

labels:
  burning: "In the drowned halls below Sunhold the forge still burns blue under the water, kept by a revenant of the last forge-master that will not let its work be finished. Still it, and the deep halls open."
  stilled: |-
    *** THE FORGE GOES DARK ***
    The revenant lets go of its hammer, and the blue hearths gutter out under the water at last. The
    make it could never finish sinks into the silt, done being unfinished. The Salvage-Guild's divers
    will work the deep halls now, and no one will hear the hammer in the dark anymore.
