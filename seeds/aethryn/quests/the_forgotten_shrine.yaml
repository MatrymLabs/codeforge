# SEED: aethryn -- quests/the_forgotten_shrine.yaml (a Deep Reachwood side-quest: DISCOVERY). Find the
# shrine the wood swallowed, deep past the Warden's Glade, that no one alive has stood before.

id: the_forgotten_shrine
name: The Forgotten Shrine
start: rumored
reward_xp: 150

steps:
  - {state: rumored, event: find, to: found, on_enter: the_forgotten_shrine, effect: award_xp}

terminal: [found]

labels:
  rumored: "The forest wardens speak of a shrine the deep wood swallowed, older than the town, its keeper still at a post whose purpose no one remembers. Find it, past the Warden's Glade and the deer-path east."
  found: |-
    *** YOU FOUND THE FORGOTTEN SHRINE ***
    The deer-path ends at a ring of standing Forgework the wood has half-taken back, and you are the
    first in an age to stand inside it. The Emberwrights raised this before the town, before the
    names we keep, and left offerings for a thing they never wrote down. The forest kept its secret.
    Now it has shown you. Whatever it was for, it remembers you standing here.
