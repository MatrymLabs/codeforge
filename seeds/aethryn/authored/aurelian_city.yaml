# SEED: aethryn -- authored/aurelian_city.yaml  (Aurelian City, a sky-capital of the Skyward Spires, ~L200)
#
# The Skyward Spires' canon identity: a possible surviving old-world enclave and the highest
# concentration of intact Crowncraft, sublime and precarious, with failing life-support and political
# isolation. Aurelian City clings to a floating island above the clouds, its star-college reading a
# sky the ground forgot; below it a broken transit-nexus of the old Spire Nexus still turns. The
# conflict is ordinary and fateful (wake the nexus and reconnect the isles, or leave it sealed for
# fear of what a completed circuit calls back); the clue to the larger world is the nexus; the rumour
# is left unproven. Five subareas, three voices (a star-scholar, a salvage-broker, a dock-master) that
# cross-reference, two dangers, a hollow-ingot salvage node on the outer gantry and a broker who buys
# its yield (a working economy), and readable Crowncraft lore. Installed by
# parts/world/authored_towns.py; its quests are quests/aurelian_nexus.yaml (a fetch, Knowing) and
# quests/aurelian_gantry.yaml (a hunt of a different shape, Gathering).

rooms:
  aurelian_market:
    name: The Skyhold Market
    desc: >-
      The heart of Aurelian City, a plaza of white stone on a floating island where the clouds pass
      below the railings: a market of sky-metal, star-charts, and the careful rationing of a people
      whose old life-support is failing a little each year. Ways lead OUT to the sky-bridge, NORTH to
      the star-college, WEST to the sky-docks, and EAST out onto the outer gantry.
    exits:
      out: aurelian_city
      north: aurelian_college
      west: aurelian_docks
      east: aurelian_gantry
  aurelian_docks:
    name: The Sky-Docks
    desc: >-
      Suspended berths where the isle's few working sky-craft are tended with obsessive care, because
      each one that fails is a road to another island lost for good. The market is back EAST.
    exits: {east: aurelian_market}
  aurelian_college:
    name: The Star-College
    desc: >-
      The hall of Aurelian's scholars, who read the sky with instruments the old world left and
      preserve what Crowncraft still works. They argue, endlessly and in whispers, over whether to
      wake the nexus below. A scholar keeps the routing-cores. A stair descends DOWN to the broken
      nexus; the market is back SOUTH.
    exits: {south: aurelian_market, down: aurelian_nexus}
  aurelian_nexus:
    name: The Broken Nexus
    desc: >-
      A vast old-world transit-ring under the college, a fragment of the Spire Nexus that once joined
      the sky-cities of the world: half its arc is gone into cloud, but the rest still turns, slow and
      patient, one degree a year toward a circuit it must not be allowed to complete. A routing-core
      sits loose in its cradle. Stairs climb back UP.
    exits: {up: aurelian_college}
  aurelian_gantry:
    name: The Outer Gantry
    desc: >-
      A wind-torn walk of old Crowncraft that juts from the isle's edge into open sky, where the
      salvage-crews prise hollow ingots of sky-metal from the derelict spurs the clouds have not yet
      claimed. The wind screams and the drop is forever. Something rides the high wind here that is
      not a bird. The market is back WEST.
    exits: {west: aurelian_market}
    node: hollow_ingot

hub: {room: aurelian_city, keyword: square, entry: aurelian_market}

npcs:
  aurelian_scholar:
    name: Star-Scholar Ilen
    keywords: [ilen, scholar, star-scholar]
    location: aurelian_college
    dialogue:
      - >-
        "You climbed all the way to the sky-cities. Then you are either desperate or curious, and both
        can be useful. A routing-core has worked loose in the broken nexus below, the core that lets us
        read how far the ring has turned, and without it we cannot tell how near it is to completing a
        circuit no one alive wants completed. Go down, retrieve it, bring it up to me. Do not touch the
        ring. Do not, whatever you hear, help it turn."
    topics:
      crowncraft:
        - >-
          "The Spire Nexus was the old world's road between its sky-cities. Ours is the largest piece
          that survived. We keep the Crowncraft that still works and we do not wake the parts that
          sleep, because we have read what the waking parts are for, and we would rather not."
      survivors:
        - >-
          "Are we the old world's children, or only squatters in its ruins? We do not know. Our
          life-support fails a little each year and we ration and we read the stars, and we call that
          a civilisation. Perhaps it is. Perhaps we are the last of something, keeping its light lit."
      rumor:
        - >-
          "They say the old transit-ring below still turns, one degree a year, and when it finally
          completes a circuit it will CALL something back, along the road it was built to be. They say
          it has turned a long way already. Go down, take the core, and do not help the ring."
      ilen:
        - >-
          "Star-Scholar of Aurelian, keeper of a sky the ground forgot. Someone must read the ring and
          count its turning, so that when the decision comes to wake it or wall it, it is made by people
          who KNOW. Better a frightened scholar than a hopeful one, this high up."
    hp: 0
  aurelian_broker:
    name: Salvage-Broker Nyra
    keywords: [nyra, broker, salvage-broker]
    location: aurelian_docks
    dialogue:
      - >-
        "Sky-trade, ground-born? I keep the strong draughts a body needs to work the thin high air and
        the rations that stretch a failing larder. And I buy hollow ingots, prised off the outer gantry,
        for the sky-craft the wrights can never let fail. Salvage a load and I will pay you in real coin."
    topics:
      trade:
        - >-
          "Draughts I sell, and rations, dear as everything is this high. Hollow ingots I buy, cut off
          the gantry EAST. The wrights mend the sky-craft with them, and a failed craft is an island lost,
          so I pay well and the wrights pay me."
      salvage:
        - >-
          "The outer gantry is a graveyard of old Crowncraft, sky-metal for the prising, if the wind and
          what rides it do not take you first. The crews work roped to the rail. Even so, some do not come back."
      nyra:
        - >-
          "Broker of the sky-docks, and I keep the wrights in metal and the crews in coin. Someone must
          turn a dying enclave's salvage into another year of flying. This high up, that is the whole economy."
    shop:
      sells: {grand_healing_draught: 104, greater_mana_draught: 68, water_ration: 8}
      buys: {hollow_ingot: 13}
    hp: 0
  aurelian_master:
    name: Dock-Master Perrin
    keywords: [perrin, dock-master, master]
    location: aurelian_market
    dialogue:
      - >-
        "You have the nerve for heights, I hope, because my crews have lost theirs. A wind-wraith has
        come down onto the outer gantry, EAST of the market, riding the high gusts, and it has thrown
        two of my salvage-crew off the rail into the cloud. Put it down so the crews can work the gantry
        again, and Aurelian will owe you the sky itself."
    topics:
      wraith:
        - >-
          "A thing of the high wind, half-seen, that walks the gusts along the gantry and throws a
          roped man off the rail as easy as a leaf. Go EAST and end it before the salvage stops and the
          sky-craft with it."
      gantry:
        - >-
          "The outer gantry feeds this whole isle: hollow ingots for the wrights, salvage for the trade.
          But the wind out there hunts, and lately it hunts with a purpose. My crews will not rope on without escort."
      perrin:
        - >-
          "Dock-master of Aurelian, and I keep the sky-craft flying on what the gantry gives. Lose the
          gantry and we lose the sky, and the sky is the only road we have left. Do me this turn, ground-born."
    hp: 0
  aurelian_drone:
    name: a derelict transit-drone
    keywords: [drone, transit-drone, transit]
    location: aurelian_nexus
    dialogue:
      - The transit-drone wakes with a rising whine, its broken lights fixing on you as an obstacle to clear.
    aggressive: true
    hp: 1260
    atk: 98
    xp: 188
    level: 198
    tier: normal
    attack_element: LGT
  aurelian_windwraith:
    name: a keening wind-wraith
    keywords: [wind-wraith, wraith, wind]
    location: aurelian_gantry
    dialogue:
      - The gale on the gantry gathers into a keening shape, half-seen, and reaches along the rail for you.
    aggressive: true
    hp: 1300
    atk: 100
    xp: 192
    level: 201
    tier: normal
    attack_element: WND

items:
  aurelian_routing_core:
    name: a nexus routing-core
    keywords: [routing-core, core, routing]
    location: aurelian_nexus
    lore: >-
      A sphere of clear old-world glass threaded with turning light, cold and humming, that shows the
      slow angle of the great ring and the single destination it is patiently turning toward. The
      scholars read it to count how near the circuit is to closing. None of them will say aloud what
      the reading has lately become, only that the ring turns faster than a dead machine should.
  aurelian_ration_roll:
    name: the skyhold ration-roll
    keywords: [ration-roll, roll, ration]
    location: aurelian_market
    lore: >-
      The isle's public ledger of its failing life-support, posted in the market so every soul can read
      how much air and water the old Crowncraft still makes and how fast the making dwindles. Its yearly
      columns march steadily down toward a final line the scholars have already calculated and no tribune
      will name aloud, the year the isle can no longer breathe, unless the sleeping Crowncraft is woken,
      and no one dares wake it.
