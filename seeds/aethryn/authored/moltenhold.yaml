# SEED: aethryn -- authored/moltenhold.yaml  (Moltenhold, the molten capital of the Ashen Wastes, ~L120)
#
# The map places Moltenhold as a single hub; this is its polished interior. It carries the Ashen
# Wastes' canon identity: the direct remains of the Ember Crown (the Flamewrought Forge), ruined
# industry where machines still run obsolete instructions and turn out malformed work. Beneath the
# obsidian city an old-world foundry never stopped, forging to an order no one now living gave. The
# conflict is ordinary and dangerous (wake the machine for its bounty, or wall it before it finishes);
# the clue to the larger world is the foundry itself (Ember Crown manufacturing); the rumour is left
# unproven. Installed by parts/world/authored_towns.py; its quest is quests/moltenhold_foundry.yaml.

rooms:
  moltenhold_market:
    name: The Slag Market
    desc: >-
      The heart of Moltenhold: an obsidian plaza over a lake of slow fire, its stalls trading
      salvage, coolant, and forge-iron under a sky the colour of embers. Heat comes up through the
      stone. Ways lead OUT to the cinder gate, NORTH to the Foundry Watch, and WEST to the slagworks.
    exits: {out: moltenhold, north: moltenhold_watch, west: moltenhold_slagworks}
  moltenhold_slagworks:
    name: The Slagworks
    desc: >-
      Long sheds where the wastes' salvage is broken down and recast, the workers masked against the
      fumes. Honest, dangerous work at the edge of a dead Crown. The market is back EAST.
    exits: {east: moltenhold_market}
  moltenhold_watch:
    name: The Foundry Watch
    desc: >-
      A fortified hall built to WATCH the thing below, not to use it: the Foundry Watch keeps count
      of what the old machine makes and when, and holds the stair against the day it makes too much.
      A captain keeps the ledger of castings here. Stairs lead DOWN to the foundry, the market SOUTH.
    exits: {south: moltenhold_market, down: moltenhold_foundry}
  moltenhold_foundry:
    name: The Foundry Floor
    desc: >-
      A vast Crown-built hall that never stopped: molten channels, stilled and stirring assembly
      arms, and half-formed constructs cooling where they fell, each stamped with an instruction no
      one gave. The heat is a wall. Stairs climb back UP to the watch.
    exits: {up: moltenhold_watch}

hub: {room: moltenhold, keyword: square, entry: moltenhold_market}

npcs:
  moltenhold_captain:
    name: Watch-Captain Ordric
    keywords: [ordric, captain, watch-captain]
    location: moltenhold_watch
    dialogue:
      - >-
        "You have the look of someone who has fought worse than heat. The foundry below is turning
        out a casting we do not recognise, and my watch cannot leave the stair. Go down, take the
        casting-die from the line, and bring it up to me. There is coin in it, and the Watch does not
        forget a debt."
    topics:
      foundry:
        - >-
          "It has run since before Moltenhold was raised over it. Ember Crown work, the scholars say.
          It forges to an order given in an age no one remembers, and it will not be told to stop."
      constructs:
        - >-
          "The line makes them still, malformed and half-cooled, and they walk. We put them down and
          they are made again. My whole watch is spent on holding a stair. Ask me is that a life."
      rumor:
        - >-
          "They say the foundry is not making at random. They say it is finishing something, one
          casting at a time, and one day it will be done. Go and look on the line and tell me they lie."
      ordric:
        - >-
          "Captain of the Foundry Watch, and I will die on that stair like the three captains before
          me. Someone has to stand between a city and a machine that does not sleep."
    hp: 0
  moltenhold_construct:
    name: a malformed foundry construct
    keywords: [construct, foundry, malformed]
    location: moltenhold_foundry
    dialogue:
      - The construct turns its half-finished face toward you, molten light bleeding from its seams.
    aggressive: true
    hp: 760
    atk: 54
    xp: 95
    level: 115
    tier: normal
    attack_element: FIR

items:
  moltenhold_casting_die:
    name: an unknown casting-die
    keywords: [casting-die, die, casting]
    location: moltenhold_foundry
    lore: >-
      A heavy die of dark Crown-metal, its face cut with a pattern of parts that fit no tool or
      weapon the wastes have ever known. Warm, and faintly humming, as though the foundry above still
      counts it among the castings it has yet to finish.
