# SEED: aethryn -- authored/stormreach.yaml  (Stormreach, a maritime city of The Shattered Isles, ~L180)
#
# The Shattered Isles' canon identity: a maritime frontier and broken global-passage system of storm
# seas, wreck salvage, pirate polities, and drowned infrastructure where the old transport Crown (the
# Maelstrom Rise) shattered into anomalies. Stormreach is a wreck-salvage port over a drowned old-world
# sea-gate that still opens on a tide no calendar keeps. The conflict is ordinary and cut-throat
# (salvage rights to a newly-opened facility); the clue to the larger world is the drowned gate; the
# rumour is left unproven. Five subareas, three voices (a league-captain, a dive-broker, a reef-warden)
# that cross-reference, two dangers, a saltkelp gather node off the wreck docks and a broker who buys
# its yield (a working economy), and readable salvage lore. Installed by kernel/world/authored_towns.py;
# its quests are quests/stormreach_gate.yaml (a fetch, Gathering) and quests/stormreach_reef.yaml (a
# hunt of a different shape, Warcraft).

rooms:
  stormreach_market:
    name: The Salt Market
    desc: >-
      The storm-battered heart of Stormreach, its quays loud with gulls and salvers trading the guts
      of a hundred wrecks: sea-charts, drowned relics, and rope by the mile. Every deal is watched by
      three sea-factions and a customs officer nobody trusts. Ways lead OUT to the harbour road, NORTH
      to the salvers' league, WEST to the wreck docks, and EAST out to the storm reef.
    exits:
      out: stormreach
      north: stormreach_league
      west: stormreach_docks
      east: stormreach_reef
  stormreach_docks:
    name: The Wreck Docks
    desc: >-
      Slipways of half-broken hulls hauled in from the storm seas, picked over by divers who know
      exactly what a drowned facility is worth and exactly how many never come back up. Saltkelp
      grows thick on the drowned piling, cut for its brine-essence by the shallow divers. The market
      is EAST.
    exits: {east: stormreach_market}
    node: saltkelp
  stormreach_league:
    name: The Salvers' League
    desc: >-
      The hall of the Salvers' League, where wreck-rights are bought, sold, and occasionally settled
      with knives, and the League keeps a fragile peace among privateers who would rather have none. A
      league-captain keeps the salvage-charter. A stair descends DOWN to the drowned gate; the market
      is back SOUTH.
    exits: {south: stormreach_market, down: stormreach_gate}
  stormreach_gate:
    name: The Drowned Gate
    desc: >-
      A flooded chamber of the old sea-Crown, its great gate half-open on a dark water that is not
      quite the sea outside: a drowned door that once joined the world's oceans and now opens, on the
      wrong tide, onto somewhere else. A gate-key hangs in the current. Stairs climb back UP.
    exits: {up: stormreach_league}
  stormreach_reef:
    name: The Storm Reef
    desc: >-
      The breakwater beyond the harbour, a spine of black reef where the storm seas break white and
      the deep divers work the richest wrecks, farthest from help. Something vast has been rising from
      the drowned facility below to feed among the hulls. The market is back WEST.
    exits: {west: stormreach_market}

hub: {room: stormreach, keyword: square, entry: stormreach_market}

npcs:
  stormreach_captain:
    name: League-Captain Meire
    keywords: [meire, captain, league-captain]
    location: stormreach_league
    dialogue:
      - >-
        "You dive, or you fight, or both, and Stormreach has need of all three. The drowned gate
        below has swung open on a bad tide and its gate-key is loose in the current. Whoever holds
        that key holds the salvage-rights to whatever the gate opens onto, and half the privateers in
        the isles will kill for it. Go down, take it, bring it up to me. The League pays in shares,
        and the League remembers a diver who comes back."
    topics:
      wrecks:
        - >-
          "The storm seas give up a wreck a week and a fortune in every one, if the drowned facility
          it fell from does not keep you. We license the salvage. The privateers ignore the licence.
          That is the isles for you: everyone salvaging, no one agreeing whose it is."
      gates:
        - >-
          "The old sea-Crown, the Maelstrom Rise, joined every ocean with drowned gates. When it
          shattered they went wild. Ours opens on the wrong tide, onto a sea that is not on any chart.
          We do not sail through it. We salvage what washes back."
      rumor:
        - >-
          "They say the drowned gate opens on a tide no calendar keeps, and sometimes the WRONG sea
          comes through, with the wrong things swimming in it. They say one tide it will open and not
          close. Go down, take the key, and be up the stair before the water turns."
      meire:
        - >-
          "League-Captain of Stormreach, keeper of a peace held together with rope and threat. Someone
          must stand between the salvers and each other, or the isles drown in their own quarrels. It
          is loud, wet work, and it pays."
    hp: 0
  stormreach_broker:
    name: Dive-Broker Corda
    keywords: [corda, broker, dive-broker]
    location: stormreach_docks
    dialogue:
      - >-
        "Salvage-trade, deepwater? I keep the strong draughts a diver's lungs need and the rations
        that outlast a becalming. And I buy saltkelp by the wet armful, cut off the drowned piling
        here, for the brine-essence the physic-sellers press from it. Cut a load and I will weigh it fair."
    topics:
      trade:
        - >-
          "Draughts I sell, and rope, and rations. Saltkelp I buy, cut here off the wreck docks. The
          physic-sellers press it for brine-essence and pay me, and I pay you. Wet work, but honest coin."
      saltkelp:
        - >-
          "A sea-growth thick on every drowned piling in the harbour, safe enough to cut in the
          shallows. It is the reef where the deep kelp grows that eats divers, so cut shallow and cut
          often, and leave the deep beds to braver fools."
      corda:
        - >-
          "Broker of the wreck docks, and I buy what the shallow divers cut and sell what the deep
          divers need. Someone must price the sea honestly in a port that lies for a living. I try to."
    shop:
      sells: {grand_healing_draught: 98, greater_mana_draught: 64, water_ration: 7}
      buys: {saltkelp: 10}
    hp: 0
  stormreach_warden:
    name: Reef-Warden Halloran
    keywords: [halloran, warden, reef-warden]
    location: stormreach_market
    dialogue:
      - >-
        "You have the look of a fighter who does not mind wet, and the reef needs one. Something huge
        has been rising from the drowned facility to feed among the hulls out on the storm reef, EAST
        of the harbour, and it has taken three deep divers this fortnight. Put it down so my crews can
        work the far wrecks again, and the League will cut you a full share."
    topics:
      beast:
        - >-
          "A thing out of the drowned facility, all reaching arms and cold hunger, that rises with the
          bad tide to feed on the reef. Go EAST to the storm reef and end it before the far wrecks are
          abandoned and the whole port the poorer."
      reef:
        - >-
          "The storm reef holds the richest wrecks and the worst dangers both, farthest from any help.
          The shallows are safe enough. The reef is where divers go to get rich or get kept. Lately, kept."
      halloran:
        - >-
          "Reef-warden of Stormreach, and I keep the far crews alive as best a body can in these seas.
          Lately the deep sends up worse than storms. Do me this turn and the League will not forget it."
    hp: 0
  stormreach_drowned:
    name: a drowned reaver
    keywords: [reaver, drowned, drowned-reaver]
    location: stormreach_gate
    dialogue:
      - The drowned reaver hauls up out of the black water, still gripping a cutlass gone green with age.
    aggressive: true
    hp: 1140
    atk: 88
    xp: 168
    level: 178
    tier: normal
    attack_element: WTR
  stormreach_horror:
    name: a rising reef-horror
    keywords: [reef-horror, horror, reef]
    location: stormreach_reef
    dialogue:
      - The white water heaves and a mass of pale reaching arms boils up over the reef, streaming brine.
    aggressive: true
    hp: 1200
    atk: 92
    xp: 174
    level: 181
    tier: normal
    attack_element: WTR

items:
  stormreach_gate_key:
    name: a drowned gate-key
    keywords: [gate-key, key, gate]
    location: stormreach_gate
    lore: >-
      A key of green-grown sea-Crown metal, cold and dripping, cut with a chart of currents that
      belong to no ocean anyone has sailed. Held near the drowned gate it thrums, and the water
      answers, as if key and gate still remember how the old world joined every sea to every other.
  stormreach_wreck_ledger:
    name: the League's wreck-ledger
    keywords: [wreck-ledger, ledger, wreck]
    location: stormreach_league
    lore: >-
      The Salvers' League's ledger of every wreck licensed and every diver lost, kept in a waxed book
      the damp cannot ruin. Its salvage-charts carry a second set of soundings in an uneasy hand: the
      places the drowned gate has opened over the years, each nearer the harbour than the last, as if
      the wrong sea is slowly learning the way in, and the League has decided it is better not to say so.
