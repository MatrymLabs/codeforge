# SEED: aethryn -- authored/sunmeadow.yaml  (the hand-authored interior of Sunmeadow, Veridia's pasture-town)
#
# The map places Sunmeadow as a single hub room; this is its polished, LIVED-IN interior: the village
# green, the dairy-market, the high pasture and the fold above it, and the old-world channel-house sunk
# beneath the green where the meadow's watering once ran itself. Peopled by a shepherd, a dairy-trader,
# and a grange-elder, with two quests of different shapes (a HUNT for the beast taking the flock, a
# FETCH to restart the failed sun-channel) and readable grange-lore. It expands the named location per
# the seed recipe (a role, subareas, a livelihood, a conflict, a rumour, a clue to the larger world, a
# revisitable change) at AAA density -- a place, not a signpost. The sun-channel is Veridia's canon
# identity made concrete: ordinary pasture-folk living over old-world works that once watered the
# meadow by the sun's own clock, shown through function. Loaded by parts/world/authored_towns.py; its
# quests are seeds/aethryn/quests/sunmeadow_fold.yaml (the flock-beast) and sunmeadow_channel.yaml (the
# sun-channel). The high pasture offers meadowfoil, which the dairy-trader buys for the upcountry dyers.

rooms:
  sunmeadow_green:
    name: The Sunmeadow Green
    desc: >-
      A wide village green under a generous Veridia sun, ringed by whitewashed cottages and loud with
      geese and children. This is pasture-country, fat and easy, where the cradle keeps its herds and
      cuts its hay. A capped stone shaft in the green's centre, warm to the touch, once fed the whole
      meadow its water. Ways lead OUT to the meadow road, NORTH to the dairy-market, EAST up to the
      high pasture, and DOWN the old channel-shaft.
    exits: {out: sunmeadow, north: sunmeadow_dairy, east: sunmeadow_pasture, down: sunmeadow_channelhouse}
  sunmeadow_dairy:
    name: The Dairy-Market
    desc: >-
      A shaded market of cheese-wheels, cream, and cut hay, where the pasture's plenty is weighed and
      sold. A dairy-trader keeps the busiest stall and a grange-elder rests in the shade with the look
      of one who has counted every beast in the valley twice. The green is back SOUTH.
    exits: {south: sunmeadow_green}
  sunmeadow_pasture:
    name: The High Pasture
    desc: >-
      Sweet upland grass running east to the drystone fold, dotted with grazing sheep and thick with
      the pale meadowfoil the dyers prize. The grass here is greener than it has any right to be this
      late in a dry season, as though the ground still drinks from something below. The green is back
      WEST, and the fold lies EAST.
    exits: {west: sunmeadow_green, east: sunmeadow_fold}
    node: meadowfoil
  sunmeadow_fold:
    name: The Drystone Fold
    desc: >-
      A high sheepfold of dry-laid stone at the pasture's edge, where the flock is penned against the
      night. The hurdles are splintered and the ground is dark, and the shepherds will not bring the
      sheep up here since the thing began coming down off the ridge to take them. The pasture is back WEST.
    exits: {west: sunmeadow_pasture}
  sunmeadow_channelhouse:
    name: The Channel-House
    desc: >-
      A cool old-world chamber at the foot of the green's shaft, where a ring of pale ducts meets a
      seized brass gnomon-wheel that once turned with the sun and let the meadow's water by the hour.
      The wheel has stopped, the ducts run dry, and only the greener grass above remembers what this
      place did. The shaft climbs back UP to the green.
    exits: {up: sunmeadow_green}

# How the hub connects to the interior: the hub room, the exit keyword to add, and the entry room.
hub: {room: sunmeadow, keyword: green, entry: sunmeadow_green}

# The people of Sunmeadow: a shepherd who has lost sheep to the ridge, a dairy-trader who buys the
# pasture's herb, a grange-elder who remembers the sun-channel, and the beast that has taken the fold.
npcs:
  sunmeadow_shepherd:
    name: Shepherd Isolde
    keywords: [isolde, shepherd]
    location: sunmeadow_dairy
    dialogue:
      - >-
        "You have the look of someone the sheep would be glad to see. Something comes down off the
        ridge at night and takes them from the high fold, EAST past the pasture, and my crook is no
        match for it. Go up and put the thing down before I have no flock left to fold, and Sunmeadow
        will see you well fed and better paid."
    topics:
      beast:
        - >-
          "I have not seen it whole, only the shape of it against the moon and what it leaves behind.
          Big, and quiet, and it comes for the penned sheep as if it knows they cannot run. Go EAST to
          the fold and end it. A shepherd with no flock is just a lonely walker with a stick."
      pasture:
        - >-
          "Best grazing in Veridia, that high grass, and greener every dry year while the valleys
          brown. Old Aldwin says the ground still waters itself from the channel below. I say good
          grass is good grass and I would keep more of it if the ridge-thing let me."
      isolde:
        - >-
          "Shepherd of Sunmeadow, as my father was and his mother before. Someone must keep the cradle
          in wool and mutton. It fell to me, and I do not mean to lose the flock on my watch."
    hp: 0
  sunmeadow_trader:
    name: Dairy-Trader Fenn
    keywords: [fenn, dairy-trader, trader]
    location: sunmeadow_dairy
    dialogue:
      - >-
        "Fresh off the road? I keep a traveller in draughts and rations between the cheese and the
        cream, and I buy meadowfoil by the bunch off the high pasture EAST, for the upcountry dyers
        pay for it and pass a little of it back to me. Cut a bunch while you are up there and I will
        weigh it fair, same as Greenhold's Pell would, and closer to the grass."
    topics:
      trade:
        - >-
          "Draughts and rations I sell; meadowfoil I buy, cut EAST on the high pasture where it grows
          thick. The dyers cannot colour a cloth without it and I cannot keep a stall without trade, so
          we are both glad of a gatherer."
      fenn:
        - >-
          "Dairy-trader of Sunmeadow, and I turn a valley of grass into coin a farmer can spend. Someone
          must stand between the cow and the market. It may as well be the one who weighs honest."
    shop:
      sells: {healing_draught: 24, water_ration: 3}
      buys: {meadowfoil: 5}
    hp: 0
  sunmeadow_elder:
    name: Grange-Elder Aldwin
    keywords: [aldwin, elder, grange-elder]
    location: sunmeadow_green
    dialogue:
      - >-
        "Sit in the sun a moment, traveller, and hear an old grange-elder out. The channel below this
        green watered the whole meadow once, by the sun's own clock, and a month ago the wheel stopped
        turning. Go DOWN and free the sun-key from the gnomon so the ducts can run again, before the
        pasture browns like all the rest, and the grange will not forget the turn."
    topics:
      channel:
        - >-
          "The sun-channel is old-world work, older than the grange, older than Sunmeadow. The brass
          wheel read the sun and let the water by the hour, so the meadow drank exactly its fill and
          never a drop wasted. No one living knows the make of it. We only know the grass browns without it."
      sunkey:
        - >-
          "The key sits in the stopped gnomon-wheel, pale metal in a socket cut to fit it alone. Draw
          it and the wheel turns free, and the ducts wake. Mind you, drawing it is easy. Understanding
          it is the work of a life I have not been given long enough to finish."
      rumor:
        - >-
          "They say every old work in the cradle is one machine, truly: Greenhold's fountain, Riverbend's
          weir, Elderwatch's beacons, and this channel, all cut by the same hand for the same lost
          reason. An old man says so, sitting on the one he can point to. Go down and lay your hand on it."
      aldwin:
        - >-
          "Grange-elder of Sunmeadow, keeper of the valley's count and its longer memory. Someone must
          remember that the good grass is a gift from something we no longer understand. It may as well
          be the one too old to do anything but remember."
    hp: 0
  sunmeadow_beast:
    name: the ridge-stalker
    keywords: [stalker, ridge-stalker, beast]
    location: sunmeadow_fold
    dialogue:
      - The ridge-stalker rises from among the broken hurdles, a sheep's blood on its muzzle, and fixes its pale eyes on you.
    aggressive: true
    hp: 68
    atk: 11
    xp: 29
    level: 6
    tier: normal

# The sun-key the channel quest turns on, and a readable grange-record that roots Sunmeadow's history
# and ties its old-world channel to the rest of the cradle's sleeping works.
items:
  sunmeadow_sun_key:
    name: an old-world sun-key
    keywords: [sun-key, sunkey, key, gnomon-key]
    location: sunmeadow_channelhouse
    lore: >-
      A slim wedge of pale, untarnished metal seated in the stopped gnomon-wheel, cut to a shape that
      fits its socket and no other, kin to Greenhold's valve-key and Riverbend's lock-lever down to the
      unweathered sheen. Drawn and turned, it frees the sun-wheel to read the light again and let the
      meadow's water by the hour, doing by a traveller's hand what the old channel once did by the sky.
  sunmeadow_grange_record:
    name: the Sunmeadow grange-record
    keywords: [grange-record, record, book, ledger]
    location: sunmeadow_dairy
    lore: >-
      A hide-bound grange-book chained to the dairy counter, the valley's tally of beasts and hay back
      past the founding. An old entry, the ink faded to gold, reads: "The channel watered the meadow
      again all the dry month, by no hand of ours, the wheel turning with the sun as it was made to do.
      We do not know the trick of it. We only bring in the hay and give thanks for green grass in a
      brown season." A later hand has added: "The wheel has stopped. We carry water by the pail now and
      the pasture browns at the edges. Aldwin says a stranger's hand will start it, as the old tales
      say it started before. We keep the record, and watch the grass."
