# SEED: aethryn -- authored/stonefang_keep.yaml  (Stonefang Keep, a fortress-city of Thalorin, ~L100)
#
# Thalorin's canon identity: a fortress culture and mining power whose digging exposes old structural
# systems and dangerous relic strata. Stonefang Keep is a clan-hold of smiths and deep-miners; its
# deepest drift has broken into a collapsed old-world military road that still hums. The conflict is
# ordinary and proud (which clan claims a rich relic-vein); the clue to the larger world is the old
# road; the rumour is left unproven. Five subareas, three voices (a thane, an ore-broker, a mine-
# captain) that cross-reference, two dangers, a raw-ore gather node in the working stope and a broker
# who buys its yield (a working economy), and readable claim lore. Installed by
# parts/world/authored_towns.py; its quests are quests/stonefang_drift.yaml (a fetch, Making) and
# quests/stonefang_stope.yaml (a hunt of a different shape, Warcraft).

rooms:
  stonefang_market:
    name: The Fang Market
    desc: >-
      A hall of the mountain-hold hewn under the peaks, its stalls ringing with hammered iron and
      the trade of ore, arms, and deep-salvage between the clans of Thalorin. Everything here is
      heavy and made to last. Ways lead OUT to the mountain road, NORTH to the clanhall, WEST to the
      deep forges, and EAST to the working stope.
    exits:
      out: stonefang_keep
      north: stonefang_hall
      west: stonefang_forge
      east: stonefang_stope
  stonefang_forge:
    name: The Deep Forges
    desc: >-
      Great forge-halls sunk into the living rock, their fires fed by the mountain's own heat, where
      Stonefang's smiths work iron and the stranger metals the deep gives up. The market is back EAST.
    exits: {east: stonefang_market}
  stonefang_hall:
    name: The Clanhall
    desc: >-
      The seat of the Stonefang clan, its walls hung with the axes of dead thanes and the maps of a
      hundred contested drifts. A thane keeps the claim-roll here. A stair descends DOWN into the
      collapsed drift; the market is back SOUTH.
    exits: {south: stonefang_market, down: stonefang_drift}
  stonefang_drift:
    name: The Collapsed Drift
    desc: >-
      A mine-drift that dug too deep and broke through into something older: a stretch of old-world
      road, straight and seamless, that still hums faintly under a hand. A clan keystone was lost when
      the drift came down. The dark is total but for the road's faint light. Stairs climb back UP.
    exits: {up: stonefang_hall}
  stonefang_stope:
    name: The Working Stope
    desc: >-
      An open ore-face still being worked, raw ore glinting in the lamp-light where the miners cut it
      from the living rock. Rich and dangerous ground: the deeper the vein, the closer the old strata,
      and something stone-hided has come up out of them into the stope. The market is back WEST.
    exits: {west: stonefang_market}
    node: raw_ore

hub: {room: stonefang_keep, keyword: square, entry: stonefang_market}

npcs:
  stonefang_thane:
    name: Thane Dorgan
    keywords: [dorgan, thane]
    location: stonefang_hall
    dialogue:
      - >-
        "You have a maker's hands, stranger, or a fighter's, and the drift below needs both. Our clan
        keystone, the one that marks our claim on the deep road, was lost when the drift came down.
        Go down, dig it out, and bring it up to me. Cross the wrong clan's claim and there will be
        worse than rockfall waiting. The Stonefangs pay their debts in steel."
    topics:
      mines:
        - >-
          "We dig deeper than any hold in Thalorin, and we pay for it. Every rich vein is a claim,
          every claim a quarrel, and the deepest quarrels are settled with axes, not ledgers."
      relics:
        - >-
          "The deep gives up stranger things than ore now. Metal that will not rust, roads that were
          never cut. Old-world work. We forge what we can of it and we do not ask too loudly what it was."
      rumor:
        - >-
          "They say the collapsed drift broke clean into an old-world road, and the road still HUMS,
          like it is waiting for something to travel it. They say if you follow it far enough it goes
          somewhere no map of Thalorin knows. Go down and dig, and do not follow the road."
      dorgan:
        - >-
          "Thane of the Stonefangs, third to hold this hall. A thane keeps the claim and keeps the
          peace between clans that would rather not have it. It is loud work, and it is honest."
    hp: 0
  stonefang_broker:
    name: Ore-Broker Halda
    keywords: [halda, broker, ore-broker]
    location: stonefang_forge
    dialogue:
      - >-
        "Forge-trade, flatlander? I keep the strong draughts a miner's back needs and the coolant the
        deep forges drink. And I buy raw ore by the barrow, cut fresh in the stope, to feed the fires
        the smiths never let cool. Dig it EAST and I will weigh it honest, which is more than some clans do."
    topics:
      trade:
        - >-
          "Draughts I sell, and coolant, and I buy raw ore to feed the forges. Cut it in the stope EAST
          and bring it here. The smiths burn through it faster than the miners can dig, so bring a barrow."
      ore:
        - >-
          "Raw ore, straight from the working face, before the smiths make it steel. The deeper veins
          run richer and run closer to the old strata, and the old strata are waking. Dig shallow if you value your skin."
      halda:
        - >-
          "Broker of the deep forges, and I stand between the miners who dig and the smiths who burn.
          Someone must keep the ore moving and the count straight, or a clan-hold grinds to a stop. So I do."
    shop:
      sells: {grand_healing_draught: 92, greater_mana_draught: 60, water_ration: 6}
      buys: {raw_ore: 9}
    hp: 0
  stonefang_captain:
    name: Mine-Captain Bral
    keywords: [bral, captain, mine-captain]
    location: stonefang_market
    dialogue:
      - >-
        "You have the shoulders for the deep, and I need them. Something stone-hided has come up out of
        the old strata into the working stope, EAST of here, and it has crushed two of my cutters at the
        face. Put it down so my crews can work the ore again, and the Stonefangs will owe you steel."
    topics:
      beast:
        - >-
          "A rock-hided thing, slow and strong as a fall of stone, come up from the deep strata into the
          stope. It kills at the face. Go EAST and end it before the vein is abandoned and the clan the poorer."
      stope:
        - >-
          "The working stope is our richest face, and the richest ore lies nearest the old strata that
          breed these things. We dig anyway. A clan that stops digging in Thalorin is a clan that starves."
      bral:
        - >-
          "Mine-captain of Stonefang, and I keep the faces worked and my cutters breathing. Lately the
          deep fights back harder than the rival clans do. Do me this turn and I will not forget it."
    hp: 0
  stonefang_golem:
    name: a drift-collapsed golem
    keywords: [golem, drift-golem, drift]
    location: stonefang_drift
    dialogue:
      - The golem hauls itself from the rubble, old-road metal grinding in its half-buried frame.
    aggressive: true
    hp: 680
    atk: 51
    xp: 92
    level: 98
    tier: normal
    attack_element: ERT
  stonefang_delver:
    name: a stone-hided deep-delver
    keywords: [deep-delver, delver, stone-hided]
    location: stonefang_stope
    dialogue:
      - The ore-face bulges and splits, and the deep-delver hauls its stone-plated bulk into the stope.
    aggressive: true
    hp: 720
    atk: 55
    xp: 96
    level: 101
    tier: normal
    attack_element: ERT

items:
  stonefang_clan_keystone:
    name: the Stonefang clan keystone
    keywords: [keystone, clan-keystone, stone]
    location: stonefang_drift
    lore: >-
      A blunt wedge of grey stone cut with the Stonefang mark, but set into it, where no clan-mason
      put it, is a seam of the old road's seamless metal, warm and faintly humming. Whoever last held
      this keystone set it against the old road on purpose, for a reason the claim-roll does not record.
  stonefang_claim_roll:
    name: the Stonefang claim-roll
    keywords: [claim-roll, roll, claim]
    location: stonefang_hall
    lore: >-
      The clan's roll of every drift, vein, and deep claim the Stonefangs have held or lost, kept in
      knots and iron tags a thane can read in the dark. Its deepest claims are struck through and
      re-cut in an anxious hand, redrawn again and again as the old strata rise, as though the clan is
      slowly ceding the richest ground to a claimant that carries no axe and answers no parley.
