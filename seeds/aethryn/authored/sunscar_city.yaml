# SEED: aethryn -- authored/sunscar_city.yaml  (Sunscar City, the desert capital of Zhaar, ~L80)
#
# The map places Sunscar City as a single hub; this is its polished, LIVED-IN interior at AAA density.
# It carries Zhaar's canon identity: a shard-mining frontier and archaeology economy over a secondary
# impact zone of buried cities and exposed remains. Sunscar rings the only sweet well for a hundred
# miles, and beneath it a buried city is dug for impact-glass and old-world salvage. The conflict is
# ordinary and greedy (who owns what the digging finds); the clue to the larger world is the buried
# city; the rumour is left unproven. Five subareas, three voices (a guild-master, a caravan-broker, a
# caravan-captain) that cross-reference, two dangers, a dustbloom gather node out on the dig-dunes and
# a broker who buys its yield (a working economy), and readable dig lore. Installed by
# parts/world/authored_towns.py; its quests are quests/sunscar_charter.yaml (a fetch, Gathering) and
# quests/sunscar_dunes.yaml (a hunt of a different shape, Warcraft).

rooms:
  sunscar_market:
    name: The Sunscar Bazaar
    desc: >-
      The teeming heart of Sunscar City, a sandstone maze of awnings over the desert's one sweet well,
      trading water, glass, and salvage hauled up from the buried city below. Every third stall sells
      a map to a ruin that does not exist. Ways lead OUT to the caravan road, NORTH to the diggers'
      guild, WEST to the deep wells, and EAST out onto the dig-dunes.
    exits:
      out: sunscar_city
      north: sunscar_guild
      west: sunscar_wells
      east: sunscar_dunes
  sunscar_wells:
    name: The Deep Wells
    desc: >-
      The stone throat of Sunscar's one good well, where water-sellers draw the life of the city bucket
      by bucket and guard it like gold, because here it is. The bazaar is back EAST.
    exits: {east: sunscar_market}
  sunscar_guild:
    name: The Diggers' Guild
    desc: >-
      A cool sandstone hall where the Diggers' Guild licenses every shaft into the buried city and
      takes its cut of every glass and relic hauled up. A guild-master keeps the charter of digs. A
      stair leads DOWN into the glass vault; the bazaar is back SOUTH.
    exits: {south: sunscar_market, down: sunscar_vault}
  sunscar_vault:
    name: The Glass Vault
    desc: >-
      A chamber of the buried city, its walls run to smooth impact-glass by whatever fell here in the
      old age, still holding the shapes of doors and streets no one has walked in an epoch. A guild
      charter-seal was lost among the glass. The heat is a weight. Stairs climb back UP.
    exits: {up: sunscar_guild}
  sunscar_dunes:
    name: The Dig-Dunes
    desc: >-
      The open sand beyond the city, pocked with the guild's shafts and spoil-heaps, where pale
      dustbloom opens at dusk in the churned ground the digging leaves behind. Bones older than the
      city surface here when the wind shifts, and something long has learned to den among them. The
      bazaar is back WEST.
    exits: {west: sunscar_market}
    node: dustbloom

hub: {room: sunscar_city, keyword: square, entry: sunscar_market}

npcs:
  sunscar_guildmaster:
    name: Guild-Master Ravi
    keywords: [ravi, guild-master, master]
    location: sunscar_guild
    dialogue:
      - >-
        "You have the look of someone who can walk in glass and come out. Good. A charter-seal, the
        one that licenses every dig in the buried city, was lost down in the glass vault, and without
        it every scavenger in Sunscar will be down a shaft by dusk. Go down, find it, bring it up. The
        Guild pays fair, and the Guild remembers who it owes."
    topics:
      shards:
        - >-
          "Impact-glass. The old age's cities, run to glass by whatever the gods threw down. We cut it,
          we sell it, we license the digging. The desert gives up a fortune and a hundred ways to die."
      buried:
        - >-
          "There is a whole city under Sunscar, streets and doors caught in the glass. We dig the edges.
          No one has walked its heart and come back to say what is down there. The Guild does not fund that."
      rumor:
        - >-
          "They say deep in the buried city there are lamps still burning, in streets no living foot has
          touched since the Fall. They say the glass remembers the shape of everyone who died in it. Go
          down and dig, and mind whose shape you disturb."
      ravi:
        - >-
          "Guild-Master of Sunscar, and I license the past by the cartload. Is it right, to own what the
          dead left? Above my pay. Someone must keep order at the shaft-head, or the desert eats us all."
    hp: 0
  sunscar_broker:
    name: Caravan-Broker Yusra
    keywords: [yusra, broker, caravan-broker]
    location: sunscar_market
    dialogue:
      - >-
        "Desert-trade, traveller? I keep the water a body needs to cross the sand and the draughts that
        keep the sun from cooking a brain. And I buy dustbloom by the sackful, cut out on the dig-dunes
        for the physic-sellers, if you can gather it at dusk and not meet what dens out there. Fair coin."
    topics:
      trade:
        - >-
          "Water and rations I sell, for the desert kills the unprepared before any monster does. And I
          buy dustbloom, cut EAST on the dig-dunes at dusk. The physic-sellers pay dear for it, so I can too."
      dustbloom:
        - >-
          "A pale desert-flower that only opens on ground the digging has churned, and closes with the
          dawn. The physic-sellers cannot work half their draughts without it. Dangerous ground to gather,
          which is why it pays."
      yusra:
        - >-
          "Broker of the Sunscar Bazaar, and I have priced everything the desert gives and takes. Water,
          glass, dustbloom, a guide who will not rob you. All of it has a rate, and I know it to the copper."
    shop:
      sells: {water_ration: 5, grand_healing_draught: 84, greater_mana_draught: 56}
      buys: {dustbloom: 8}
    hp: 0
  sunscar_captain:
    name: Caravan-Captain Doran
    keywords: [doran, captain, caravan-captain]
    location: sunscar_market
    dialogue:
      - >-
        "You have the walk of a fighter, and my dune-crews need one. A sand-wyrm has denned in the
        dig-dunes EAST of the bazaar, among the old bones, and it has swallowed two diggers whole. Put
        it down so my crews can work the shafts again, and the caravan-guard will call you one of ours."
    topics:
      wyrm:
        - >-
          "A sand-wyrm, old and pale and patient, that dens in the churned ground where the bones come
          up. It takes a digger a week. Go EAST onto the dunes and end it before the guild abandons the shaft."
      dunes:
        - >-
          "The dig-dunes feed Sunscar as much as the well does: glass, salvage, dustbloom. But the
          digging wakes what the sand buried, and the sand buried worse than glass. My crews go armed now."
      doran:
        - >-
          "Caravan-captain of Sunscar, and I guard what the guild digs and the road it goes out on.
          Someone must fight the desert while the diggers rob it. Do me this turn and I will not forget it."
    hp: 0
  sunscar_husk:
    name: a glass-bound husk
    keywords: [husk, glass-husk, glass]
    location: sunscar_vault
    dialogue:
      - The husk unfolds from the glass wall, a figure caught mid-stride an age ago and still walking.
    aggressive: true
    hp: 560
    atk: 45
    xp: 78
    level: 78
    tier: normal
    attack_element: ERT
  sunscar_wyrm:
    name: a pale sand-wyrm
    keywords: [sand-wyrm, wyrm, sand]
    location: sunscar_dunes
    dialogue:
      - The dune ahead lifts and pours aside, and the sand-wyrm rises pale and vast from the old bones.
    aggressive: true
    hp: 600
    atk: 48
    xp: 82
    level: 81
    tier: normal
    attack_element: ERT

items:
  sunscar_charter_seal:
    name: the guild's charter-seal
    keywords: [charter-seal, seal, charter]
    location: sunscar_vault
    lore: >-
      A heavy seal of impact-glass and old bronze, the Guild's authority to open the buried city cast
      into a thing older than the Guild by an epoch. Held to the light it shows a street-plan of a city
      no living map remembers, as if the seal were cut from a door of the buried place itself.
  sunscar_dig_ledger:
    name: the shaft-head dig-ledger
    keywords: [dig-ledger, ledger, dig]
    location: sunscar_guild
    lore: >-
      The Guild's running ledger of every shaft sunk into the buried city and every soul it swallowed,
      kept at the shaft-head so no digger can say he was not warned. Its margins carry a second tally in
      an older hand: the depth at which the diggers stop finding glass and start finding doors that are
      shut from the inside, a depth the Guild licenses no one to pass, and never explains why.
