# SEED: aethryn -- canon.yaml  (the world's LOCKED canon: never mutated by generators)
#
# This is the single source of established Aethryn canon, encoded as data so the engine and every
# generator can read it and REFUSE to contradict it (parts/world/canon.py). It is not lore prose --
# the readable Lore Bible is docs/aethryn_lore_bible.md; this is the machine-checkable canon.
#
# canon_status on each record follows the authority ladder:
#   CANON_LOCKED   -- may NOT be changed by generators (names, regions, the strike, the Seven Crowns)
#   CANON_WORKING  -- may be revised later without destructive migration (mythic titles, terminology)
# (AUTHORED_LOCAL / GENERATED_LOCAL / RUMOR are for content ELSEWHERE, not this file.)

world:
  id: aethryn
  display_name: Aethryn
  canon_status: CANON_LOCKED

# --- The established facts (CANON_LOCKED: generated content may never contradict these) ----------
facts:
  - id: fact_advanced_civilization
    canon_status: CANON_LOCKED
    text: >-
      Aethryn once held an extraordinarily advanced civilization to which the gods were openly
      present, providing abundance, healing, protection, and knowledge until miracles became ordinary
      and mortals began studying divine acts as reproducible processes.
  - id: fact_imitation
    canon_status: CANON_LOCKED
    text: >-
      Ancient technology grew so advanced it was indistinguishable from magic; mortals learned to
      imitate healing, biological creation, weather control, matter shaping, transportation,
      communication, prophecy, memory preservation, and soul manipulation.
  - id: fact_netharion
    canon_status: CANON_LOCKED
    text: >-
      The old civilization created Netharion, the first artificial god, proving that divinity could
      be manufactured rather than inherited or granted by the established gods.
  - id: fact_the_strike
    canon_status: CANON_LOCKED
    text: >-
      The gods regarded the old civilization as an existential threat and DELIBERATELY fragmented a
      celestial body, directing its pieces at the great cities. The strike was intentional; the major
      cities were intentionally targeted; the aim was to end technological and divine parity.
  - id: fact_withdrawal
    canon_status: CANON_LOCKED
    text: >-
      After the destruction the gods withdrew from open participation in the world. The modern world
      is at once a world wounded by precise celestial impacts and a world living after its gods left.
  - id: fact_uneven_survival
    canon_status: CANON_LOCKED
    text: >-
      Ancient technology survives unevenly as ruins, dormant infrastructure, automated facilities,
      broken constructs, misunderstood relics, sacred machines, hazardous devices, and knowledge
      fragments. Cultures differ in how much they understand, preserve, recover, or conceal it.

# --- Questions the world keeps OPEN: generated content may raise them only as RUMOR, never answer -
unresolved_questions:
  - Whether the gods' fear was justified.
  - Whether Netharion was benevolent, dangerous, or both.
  - Whether Netharion survived.
  - Whether all gods supported the destruction.
  - Whether some gods still monitor technological progress.
  - Whether the old civilization was about to damage reality.
  - Whether the gods acted to preserve creation, preserve their authority, or both.

# --- The Seven Crowns: the old civilization's seven principal centres (CANON_LOCKED sites) --------
# The collective name a speaker uses reveals their worldview, and each name carries its OWN tier
# (from the source seed): the neutral/common names are anchored (CANON_LOCKED), while the ideological
# names are belief, not fact, and are tagged RUMOR (they may be held sincerely but are not canon).
collective_names:
  - {id: seven_crowns,     name: The Seven Crowns,     canon_status: CANON_LOCKED, usage: neutral or scholarly}
  - {id: seven_wounds,     name: The Seven Wounds,     canon_status: CANON_LOCKED, usage: common modern}
  - {id: seven_blasphemies, name: The Seven Blasphemies, canon_status: RUMOR,      usage: god-loyalist}
  - {id: murdered_crowns,  name: The Murdered Crowns,  canon_status: RUMOR,        usage: anti-divine or restorationist}
  - {id: seven_lessons,    name: The Seven Lessons,    canon_status: RUMOR,        usage: penitential}
  - {id: seven_engines,    name: The Seven Engines,    canon_status: RUMOR,        usage: technical or relic-hunter}

seven_crowns:
  - id: the_flamewrought_forge
    map_name: The Flamewrought Forge
    mythic_title: The Ember Crown
    region: Ashen Wastes
    canon_status: CANON_LOCKED
    ancient_function: >-
      manufacturing, material shaping, constructs, weapons, large-scale engineering, and
      abundance-producing machinery.
    modern_condition: >-
      ruined industrial systems amid volcanic instability; machines still running obsolete
      instructions, malformed manufactured objects, ancient production lines.
  - id: netharions_throne
    map_name: Netharion's Throne
    mythic_title: The God-Mirror
    region: The Voidscar
    canon_status: CANON_LOCKED
    ancient_function: >-
      the creation of Netharion: artificial divinity, divine imitation, soulcraft, belief-powered
      systems, and research into constructed consciousness.
    modern_condition: >-
      the deepest known wound, reality itself damaged, physical and metaphysical laws in conflict,
      the status of Netharion uncertain. A city-sized apparatus; the gods aimed one of their greatest
      strikes here.
  - id: the_spire_nexus
    map_name: The Spire Nexus
    mythic_title: The Skychain
    region: Skyward Spires
    canon_status: CANON_LOCKED
    ancient_function: >-
      aerial transportation, long-distance transit, communication, celestial observation, and global
      route coordination.
    modern_condition: >-
      floating land and broken pathways, suspended structures, transit systems partially still active.
  - id: the_crystal_labyrinth
    map_name: The Crystal Labyrinth
    mythic_title: The Memory Deep
    region: The Deepreach
    canon_status: CANON_LOCKED
    ancient_function: >-
      archives, preserved memories, artificial intelligences, historical records, and predictive
      systems.
    modern_condition: >-
      underground and fragmented; contradictory records, damaged memory constructs, passages that
      rearrange or deceive.
  - id: korvash_crater
    map_name: Korvash Crater
    mythic_title: The Measured Throne
    region: Korvash Highlands
    canon_status: CANON_LOCKED
    ancient_function: >-
      governance, law, resource coordination, administration, and command infrastructure.
    modern_condition: >-
      the political centre destroyed to an impact crater; remnants of command and authorization
      systems, and possible oath, identity, or access-control phenomena.
  - id: heart_of_xilnath
    map_name: Heart of Xil'nath
    mythic_title: The Verdant Loom
    region: Xil'nath Jungle
    canon_status: CANON_LOCKED
    ancient_function: >-
      healing, agriculture, biological design, ecosystem management, food production, and engineered
      life.
    modern_condition: >-
      runaway biological growth and unstable abundance, artificial and natural ecosystems grown
      inseparable.
  - id: the_maelstrom_rise
    map_name: The Maelstrom Rise
    mythic_title: The Thousand Doors
    region: The Shattered Isles
    canon_status: CANON_LOCKED
    ancient_function: >-
      maritime transport, distribution, long-distance gates, and global trade and passage.
    modern_condition: >-
      shattered islands and unstable sea routes, storms, and portals that may open to the wrong
      destination.

