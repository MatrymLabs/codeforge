# SEED: aethryn -- rooms.yaml
# The flagship world (docs/world_bible.md): the Kindlands Coast, where the Age of
# Rekindling begins. Everything here was Forged and can be reforged.
# Same gates as any seed: lowercase_snake_case labels, exits must resolve.
# The FIRST room is the spawn (START_ROOM), by convention -- no hardcoded start.

template:
  desc: The Kindlands lie under a low, warm sky, the light of a world that was made.

the_waking_shore:
  name: The Waking Shore
  desc: |-
    You wake on cold sand with no memory of the craft. A single ember gutters
    at the tideline, nearly out. When your hand nears it, it flares and holds.
    Something in you answers it. A path of packed cinder leads north into town,
    and the strand runs west along the Cooling-Sea toward a harbor.
  exits:
    north: cinderhearth_square
    west: the_saltstrand

the_saltstrand:
  name: The Saltstrand
  desc: |-
    A strand of grey sand runs west along the Cooling-Sea, the first-quenched water that cooled the
    world after the Unforging. Tide-crawlers scuttle the wrack line, and the salt-wind carries the
    sound of a harbor ahead. The waking shore lies back east; a sea-cave gapes in the low cliff, down.
  exits:
    east: the_waking_shore
    west: quench_harbor
    down: the_tidecave_mouth

quench_harbor:
  name: Quench Harbor
  desc: |-
    A weathered fishing port on the Cooling-Sea, its jetties crowded with cooling-iron boats and
    salt-stiff nets. Fisherfolk mend and haul and argue prices; a harbormaster keeps the tally, and
    a dock-trader keeps a stall. The strand runs back east; south, a jetty leads out to a drowned
    reef where something older waits. West, a Merewright ferry runs the open lanes to the Quenchmere,
    the drowned Reach across the sea.
  exits:
    east: the_saltstrand
    south: the_wreck_reef
    west: the_quench_lanes

# --- The Quenchmere: the drowned archipelago across the Cooling-Sea (Continental Atlas §V). The
# --- first sea-crossing (Build Order Phase 2). A free-port capital, the Wreckways, and a drowned
# --- capital dungeon below the keels. Level-banded 18-30. ---

the_quench_lanes:
  name: The Quench Lanes
  desc: |-
    The ferry runs the open Cooling-Sea, threading the Wreckways -- reef-lanes marked not by buoys
    but by the masts of drowned ships, ten thousand of them breaking the grey water where the sea
    rose over a Reach. Brine-wights drift the shallows between the hulls. Ahead, the hundred-hulled
    silhouette of Tidewharf; back east, the coast you sailed from. North, a lane of masts leads off
    the mapped route into the deep Wreckways. South, a grey-water lane runs off the charts toward the
    Cinderwaste, the half-unmade Reach where the sea gives out into dead salt.
  exits:
    east: quench_harbor
    west: tidewharf_docks
    north: the_deep_wreckways
    south: the_ashen_crossing

tidewharf_docks:
  name: The Tidewharf Docks
  desc: |-
    The ferry ties off at Tidewharf, the great free-port of the Quenchmere, a city built across a
    hundred drowned hulls lashed and planked into one floating sprawl. Cranes haul salvage from the
    deeps; captains of every Reach cry cargo and crew. The lanes run back east; the city proper rises
    north, and a salvage-stair drops south toward the drowned capital below the keels.
  exits:
    east: the_quench_lanes
    north: tidewharf_plaza
    south: drowned_sunhold_descent
    west: the_verdant_passage

# --- The Verdance: the living wild across the Quenchmere's water (Continental Atlas §III, Build
# --- Order Phase 3). A primeval jungle-swamp that is literally alive; the Deeprooted animists; a
# --- believable ecosystem with a food chain. Level-banded 22-32. Reached by ferry from Tidewharf. ---

the_verdant_passage:
  name: The Verdant Passage
  desc: |-
    The ferry leaves the drowned Reach and threads a green channel where the Cooling-Sea gives way to
    warm brown water and the air thickens to breathing. Ahead the Verdance rises: a jungle of trees
    the size of mountains, a whole continent that is, in the most literal sense, alive. Tidewharf lies
    back east.
  exits:
    east: tidewharf_docks
    west: verdance_landing

verdance_landing:
  name: The Verdance Landing
  desc: |-
    A root-jetty where the ferry ties to a living tree that gripped it back. The understory glows with
    ember-blooms; a canopy-stalker watches from the boughs above. A root-stair climbs west toward
    Highbough, the canopy capital; a game-trail sinks south into the breathing mire, and a hunters'
    path runs north along the forest floor into the understory. The channel runs back east.
  exits:
    east: the_verdant_passage
    west: highbough
    south: the_deeproot_mire
    north: the_understory

highbough:
  name: Highbough
  desc: |-
    A city grown rather than built, in the crown of a tree so vast its boughs are avenues: Highbough,
    capital of the Deeprooted, where the people treat wild Ember as sacred and Forging as a
    conversation with a living world. A grove-elder reads the tree's moods; a canopy-trader keeps a
    hollow-stall. The landing lies back east; the bough-avenues of the city proper run west.
  exits:
    east: verdance_landing
    west: the_bough_avenues

the_deeproot_mire:
  name: The Deeproot Mire
  desc: |-
    A breathing swamp where Cinder seeps up through the roots and the dead half-return, drawn to
    warmth. Ember-blooms light black water; something risen from the mire moves through the reeds. The
    landing lies back north; deeper in, the Heart-Grove beats. Go west, into the wet dark.
  exits:
    north: verdance_landing
    west: the_rootways

the_heart_grove:
  name: The Heart-Grove
  desc: |-
    The living center of the Verdance: a single vast organism grown around a wellspring of wild Ember,
    a grove that is one creature the size of a valley. The Boughwarden guards its heart -- the apex of
    the whole continent's web, a thing the Deeprooted half-worship and wholly fear. This is the deepest
    green in the world. The rootways lie back east.
  exits:
    east: the_rootways

tidewharf_plaza:
  name: The Tidewharf Plaza
  desc: |-
    The heart of the free-port: a plaza planked across the largest of the drowned hulls, loud with
    the Port-Accord's business and the whole world's trade. The Accord Hall stands to the west; a
    Merewright captain and a Salvage-Guild agent keep their stalls here. The docks lie back south.
  exits:
    south: tidewharf_docks
    west: the_accord_hall
    north: the_deepwater_berth
    east: the_outer_lanes

the_deepwater_berth:
  name: The Deepwater Berth
  desc: |-
    Tidewharf's outbound berth, where the deep-water ferries make for the far Reaches across the
    open Cooling-Sea. Ship-captains cry their crossings: north to the frozen Rimefall, west to the
    molten Kollforge, up the sky-lanes to the Sundered Sky. The plaza lies back south. This is the
    door to the wider world.
  exits:
    south: tidewharf_plaza
    north: the_riming_passage
    west: the_molten_passage
    up: the_sky_lanes

# --- The Rimefall: the quenched north across the sea (Continental Atlas §II, Build Order Phase 4).
# --- A continent flash-frozen in the Unforging, its Emberwright cities preserved whole under the ice;
# --- the Silent Anvil keep it as a shrine to restraint. Level-banded 40-52. ---

the_riming_passage:
  name: The Riming Passage
  desc: |-
    The ferry breaks a lane through grinding floes into the Riming Sea, and the world goes white and
    still. Ahead the Rimefall rises: a continent caught mid-Forge and frozen in an instant, its cities
    standing complete under the ice, better-made than anything alive. Glass-hounds pace the floe-edge.
    The berth lies back south.
  exits:
    south: the_deepwater_berth
    north: stillhearth

stillhearth:
  name: Stillhearth
  desc: |-
    A monastery-port on the ice-edge, the one warm place in the Rimefall, kept by the Silent Anvil
    who hold this whole Reach as a shrine. Here they trade only what the ice gives up and speak in low
    voices, because in the frozen north the past is not ruined but paused. A keeper tends the one
    hearth. The passage lies back south; the deep ice stands north across the glass-gallery, a silent
    cloister opens down beneath the port, and the riming fields run west along the floe.
  exits:
    south: the_riming_passage
    north: the_glass_gallery
    down: the_silent_cloister
    west: the_riming_fields

the_frozen_court:
  name: The Frozen Court
  desc: |-
    An Emberwright capital preserved entire: a court of the golden age caught mid-gesture and frozen
    in a single instant, its makers still at their benches under a skin of clear ice, every room a
    perfect and lethal tableau. The Rime-King keeps the throne, flash-frozen mid-reign, and waking it
    would restart an Unforging mid-freeze. This is the most beautiful and most haunted room in the
    world. The rime-vault lies back south.
  exits:
    south: the_rime_vault

the_accord_hall:
  name: The Accord Hall
  desc: |-
    A council-hall raised on the deck of a drowned flagship, where the harbor-republics of the
    Port-Accord keep their fractious peace and the Quenchmere is, as much as it is anywhere, governed.
    The Accord-Speaker holds court here. The plaza lies back east.
  exits:
    east: tidewharf_plaza

drowned_sunhold_descent:
  name: The Salvage-Stair
  desc: |-
    A stair of lashed ladders and diving-bells drops from the Tidewharf docks down through the grey
    water toward Sunhold -- the Quenchmere's capital before the sea rose, walked now in drowned-lung
    Forgework that holds the cold water back a room at a time. The docks lie back up; the drowned
    capital opens below.
  exits:
    up: tidewharf_docks
    down: the_drowned_halls

the_drowned_sunhold:
  name: The Drowned Sunhold
  desc: |-
    The sunken capital, lit and cold below the keels: a Forge-city the Cooling-Sea took whole when it
    rose, its halls still burning a drowned ember-light through the green dark. The Sunhold Warden
    keeps it -- a Forged guardian set to hold the capital and never told the war was lost. This is the
    bottom of the salvage-stair, the richest unbroken Forgework in the Quenchmere. The stair lies
    back up.
  exits:
    up: the_flooded_forge

the_wreck_reef:
  name: The Wreck Reef
  desc: |-
    Out past the harbor's last jetty, a reef of drowned Forge-hulls breaks the grey water -- ships
    the Cooling-Sea took when it first rose. The Drowned Pilot still keeps the wheel of the largest
    wreck, a thing of brine and dead ember that will not let the sea be crossed. The harbor lies
    back north; a hatch in the flagship's deck drops down into the flooded hulls.
  exits:
    north: quench_harbor
    down: the_flooded_hulls

cinderhearth_square:
  name: Cinderhearth Square
  desc: |-
    The heart of Cinderhearth-on-Reach. The town forge, cold for a generation,
    has just taken flame again, and folk gather to watch it burn. A training
    dummy stands ready in the yard, and a cellar door yawns beneath the forge.
  exits:
    south: the_waking_shore
    north: old_reach_bridge
    east: reachwood_edge
    down: cold_cellar

old_reach_bridge:
  name: The Old Reach Bridge
  desc: |-
    A stone bridge over the Reach, its center plank long rotted through. Reforge
    it and the road north opens; the world remembers what you mend. Beyond lies
    the Ember-road, and somewhere down it, the capital.
  exits:
    south: cinderhearth_square
    north: the_far_reach

reachwood_edge:
  name: The Reachwood Edge
  desc: |-
    Where the town gives way to wild forest. Ember grows strange and bright in
    the undergrowth here, and not everything in the trees is friendly. A game-trail
    runs east, deeper into the Reachwood.
  exits:
    west: cinderhearth_square
    east: reachwood_hollow

reachwood_hollow:
  name: The Reachwood Hollow
  desc: |-
    Deeper into the wild wood, where the ember-light thickens and the trees lean close over an
    ember-loam floor. A thornback boar roots through the mast. The wood opens east onto a still
    glade and north into a bramble-choked warren; the town trail runs back west.
  exits:
    west: reachwood_edge
    east: wardens_glade
    north: the_bramblewarren
    south: the_woodcutters_camp

wardens_glade:
  name: The Warden's Glade
  desc: |-
    A still, green glade in the heart of the Reachwood, where the wild ember grows gentle instead
    of hungry. An old forest warden keeps this place, watching the ember and the wood that drinks
    it. The hollow lies back west; a deer-path slips east, deeper into the old wood.
  exits:
    west: reachwood_hollow
    east: the_deepwood

the_bramblewarren:
  name: The Bramblewarren
  desc: |-
    A hollow choked in ember-thorn, where the Reachwood grows angry and old. The Bramble-Wight
    roots it -- a knot of wild ember and dead wood grown almost to a mind -- and it suffers no
    Forger in its warren. The hollow lies back south; the thorns close deeper in, north.
  exits:
    south: reachwood_hollow
    north: the_thorn_heart

the_far_reach:
  name: The Far Reach
  desc: |-
    The Ember-road runs on toward Emberreach, City of the Relit Forge, and the
    Warden Gate that guards the way to the Great Spiral. A road-warden waits at
    the marker, watching who comes. The road climbs north, and it is not gentle.
  exits:
    south: old_reach_bridge
    north: emberroad_climb

cold_cellar:
  name: The Cold Cellar
  desc: |-
    Beneath the forge, a sundered making-hall the Unforging left half-real. Its
    rooms hold the steps of a simple Forge, jumbled out of their proper order.
    Cold air breathes up from a stair descending into the dark.
  exits:
    up: cinderhearth_square
    down: cellar_hearth

cellar_hearth:
  name: The Cellar Hearth
  desc: |-
    A ruined forge-hall around a dead central hearth. At the anvil stands the
    Cinder-Wight, an old smith the Unforging never let finish dying. A crack in
    the far wall breathes colder still, downward, toward the Cinderdeep.
  exits:
    up: cold_cellar
    down: cinderdeep_descent

# --- The Ember-road: the climb from the Kindlands Coast up to Emberreach. ---
# The old paved Forgework connecting capitals (world bible s.22). The Kindlands are behind
# you; the road foes here run levels ~10-13, a real step up from the coast. Fight up, or fall.

emberroad_climb:
  name: The Ember-road
  desc: |-
    The paved Forgework of the Ember-road climbs north out of the Kindlands, its
    old cinder-stones still warm underfoot. Wild ember has gone feral in the ditches,
    and stray things move where the light of Cinderhearth no longer reaches. A hollow
    opens to the east; the road runs on north toward a wayfarer's rest, and a cart-track branches
    west to a caravan post.
  exits:
    south: the_far_reach
    north: wayfarers_rest
    east: strayfire_hollow
    west: the_emberpost

strayfire_hollow:
  name: Strayfire Hollow
  desc: |-
    A blind dell off the road where feral ember pools and burns without a maker.
    Reavers of the road den here, drawn to the wild fire. It is no place to linger
    unproven, but the bold have taken good steel off the dead.
  exits:
    west: emberroad_climb

wayfarers_rest:
  name: A Wayfarer's Rest
  desc: |-
    A walled waystation on the Ember-road, its brazier kept lit for travellers by
    old Concord custom. The walls hold the strayfire back; here you can breathe.
    The road climbs the last stretch north to the gates of Emberreach.
  exits:
    south: emberroad_climb
    north: emberreach_gates

# --- Emberreach, City of the Relit Forge (world bible s.25): large, safe, service-dense. ---
# No foes inside the walls -- this is the mid-game hub: the Grand Forge, the Orders' Row,
# the Market Quarter, and the Warden Gate that teases the road up the Great Spiral.

emberreach_gates:
  name: The Gates of Emberreach
  desc: |-
    The great cinder-iron gates of Emberreach stand open under banners of the Relit
    Forge. A gate-warden of the Concord greets the road-weary. Beyond the arch the
    capital hums with the work of the Rekindling: the Grand Forge burns to the north.
  exits:
    south: wayfarers_rest
    north: the_grand_forge

the_grand_forge:
  name: The Grand Forge
  desc: |-
    The heart of Emberreach: the great relit Forge roars in the city center, and the
    Church of the First Flame keeps its light. The city's Loremaster works here, at the
    root of the world's memory. The Orders' Row lies west, the Market Quarter east, and
    the Warden Gate stands to the north.
  exits:
    south: emberreach_gates
    west: orders_row
    east: market_quarter
    north: warden_gate

orders_row:
  name: The Orders' Row
  desc: |-
    A colonnade of guild-halls: the Making, the Gathering, the Warcraft, and the Knowing
    Orders keep their doors here, where a Forger chooses a road and trains a craft. A
    recruiter watches the street for new talent come up from the coast. The Warcraft training
    yard opens off the row to the west.
  exits:
    east: the_grand_forge
    west: the_training_yard

market_quarter:
  name: The Market Quarter
  desc: |-
    Stalls and shopfronts crowd the Market Quarter, and the Cooling-Sea docks send their
    trade up from the water. A trader calls her wares over the din. Everything the wider
    Anvil makes passes through here sooner or later. East, past the last stalls, a salt-road
    runs out of the city toward the Ashwastes. North, the makers' stalls give onto the Artisans'
    Quarter.
  exits:
    west: the_grand_forge
    east: ashwastes_road
    north: the_artisans_quarter

ashwastes_road:
  name: The Salt-Road to the Ashwastes
  desc: |-
    The last road out of Emberreach runs east into a land the Unforging half-unmade: the Ashwastes,
    a desert of grey cinder under a bleached sky. Ash-jackals hunt the salt-road's edge. The city
    lies back west; ahead, the dunes.
  exits:
    west: market_quarter
    east: the_cinder_dunes

the_cinder_dunes:
  name: The Cinder Dunes
  desc: |-
    Dunes of cold ash roll to every horizon, and rare ember glints in the grey where the world
    was scoured. An Ashborn scout reads the sand here. A camp of the survivors lies north; the
    ruins and the crater beyond lie east. The salt-road runs back west.
  exits:
    west: ashwastes_road
    north: the_ashborn_camp
    east: the_scoured_ruin

the_ashborn_camp:
  name: The Ashborn Camp
  desc: |-
    A ring of salvaged tents and cooling-iron in the lee of a dune, where the Ashborn who survived
    the Unforging of this land make their stand: fatalistic, resourceful, trading salvage for what
    the wastes cannot give. A trader keeps a stall; a keeper tends the fire. The dunes lie south.
  exits:
    south: the_cinder_dunes

the_scoured_ruin:
  name: The Scoured Ruin
  desc: |-
    Half a Forge-hold stands here, scoured to glass on the day the Ashwastes were unmade -- walls
    that end in mid-air, a stair to nowhere. A salvage-wraith drifts the ruin, made of what the
    Unforging left. The crater lies east; the dunes, back west.
  exits:
    west: the_cinder_dunes
    east: the_ashen_vault

the_glass_crater:
  name: The Glass Crater
  desc: |-
    The wound at the heart of the Ashwastes: a vast crater of black glass where the Unforging first
    struck this land, still and cold and singing faintly with the ember it fused. The Ash-Colossus
    keeps it -- a giant of welded cinder the wastes grew around a scar. This is the bottom of the
    desert road. Still it, and the Ashwastes are answered. The ruin lies back west.
  exits:
    west: the_ashen_vault

warden_gate:
  name: The Warden Gate
  desc: |-
    The Concord's seat and the threshold of the Wardenmarch: beyond this gate the
    Ember-road runs east to the Coilfoot Marches and the start of the Forgeward Road.
    A Warden Sentinel of grey Forgework bars the arch, and the gate-keeper watches
    to see if you are the Forger who can put it down. This is the Warden's test.
  exits:
    south: the_grand_forge
    north: the_wardenmarch

# --- The Wardenmarch and the first marches of the Forgeward Road (world bible s.20, s.24). ---
# Past the Warden's test the long frontier begins: a flat road running east into the deepening
# wilds, one road-warden per march. The first march runs levels ~18-22 -- true above-Emberreach
# danger. The world does not climb; it opens outward toward the Forge at the world's heart.

the_wardenmarch:
  name: The Wardenmarch
  desc: |-
    Beyond the gate the Concord's own country: watch-cairns and old Forgework mark the
    road east to the Coilfoot Marches, where the Forgeward Road runs out across the world.
    The air hums with old charge. Emberreach is behind you now. The frontier is ahead, east.
  exits:
    south: warden_gate
    east: coilfoot_ascent

coilfoot_ascent:
  name: The Coilfoot March
  desc: |-
    The start of the Forgeward Road, where the old highway runs east out of the settled land
    into the wilds. Loose ember-wisps drift off the abandoned Forgework, half-alive and hostile
    to the living. The road goes on east; the Wardenmarch lies back to the west.
  exits:
    west: the_wardenmarch
    east: coil_first_landing

coil_first_landing:
  name: The First Waystation
  desc: |-
    A wide forged waystation on the road, ringed by cold road-lamps. At its center a Forgewraith
    keeps the way -- the first road-warden of the frontier, made of the wrath the Unforging left
    behind. Past it the road runs on, east into the second march.
  exits:
    west: coilfoot_ascent
    east: coil_second_ascent

# --- The second march of the Forgeward Road (world bible s.24): the road deepens, levels ~24-28. ---
# Further out than the first, colder, and hungrier. Its road-warden, the Ashlord, keeps the way.

coil_second_ascent:
  name: The Second March
  desc: |-
    The road narrows as the second march runs deeper into the wilds' cold. Revenants of fallen
    travellers walk the forged verge, grey and unfinished, mistaking the living for the way home.
    The first waystation falls away behind; the road runs on east toward a bridgespan.
  exits:
    west: coil_first_landing
    east: coil_bridgespan

coil_bridgespan:
  name: The Roadbridge
  desc: |-
    A slender Forgework bridge arcs across a chasm the Unforging tore, road-lamps guttering along
    its rail above a fall with no bottom. An Ashen Sentinel walks the span, and there is no room
    to go around. Beyond it the road reaches the second waystation.
  exits:
    west: coil_second_ascent
    east: coil_second_landing

coil_second_landing:
  name: The Second Waystation
  desc: |-
    A forged waystation where the wilds' cold burns blue. The Ashlord holds the way here -- a
    road-warden grown from a Forge-master the Unforging turned to ash and will. Past it the road
    runs on, east into the storm-wracked third march.
  exits:
    west: coil_bridgespan
    east: coil_third_ascent

# --- The third march of the Forgeward Road: deeper, storm-wracked, levels ~31-38. Each march is a ---
# harder wall than the last (world bible s.24 -- the frontier's deepening danger).

coil_third_ascent:
  name: The Third March
  desc: |-
    The road's third march runs into a standing storm of forge-lightning, the old Roadwork
    humming with charge. Stormbound husks -- travellers the wilds burned hollow -- walk the verge.
    The second waystation falls away behind; the road runs on east toward a wind-scoured reach.
  exits:
    west: coil_second_landing
    east: coil_stormreach

coil_stormreach:
  name: The Stormreach
  desc: |-
    A wind-scoured stretch of the third march where the forge-storm never breaks. A Road Harrier
    rides the gale, striking at what passes. There is no shelter here but the road, east, to the
    waystation ahead -- or back west, out of the wind.
  exits:
    west: coil_third_ascent
    east: coil_third_landing

coil_third_landing:
  name: The Third Waystation
  desc: |-
    The storm breaks open onto a vast forged waystation crowned in lightning. The Stormlord keeps
    the way -- a road-warden of living forge-storm, the third march's wall. The Forgeward Road runs
    on east into the deepening wilds, march beyond march, further than any map the Kindlands hold.
  exits:
    west: coil_stormreach

# --- The Cinderdeep (world bible: the downward branch). The coast's OTHER road: down from the ---
# cellar hearth instead of north up the Ember-road. A mid-band depths dungeon (levels ~10-15),
# a parallel to the early road -- a Forger chooses to climb the Spiral or delve the deep.

cinderdeep_descent:
  name: The Cinderdeep Descent
  desc: |-
    The crack in the hearth-wall opens into a throat of cold stone winding down below the
    coast. This is the Cinderdeep: where the Unforging's damage ran deepest and the old
    making-works drowned. Deep-crawlers ward the dark. The hearth is back up the way you came.
  exits:
    up: cellar_hearth
    down: sunken_forgeworks

sunken_forgeworks:
  name: The Sunken Forgeworks
  desc: |-
    A drowned making-hall, its anvils under black water and its lamps long cold. Drowned
    makers still move at their benches, hammering work that will never set. A vein of dead
    ember runs off to the east; the descent goes on, down, into deeper cold.
  exits:
    up: cinderdeep_descent
    east: the_cold_vein
    down: cinderdeep_maw

the_cold_vein:
  name: The Cold Vein
  desc: |-
    A seam of dead ember threads the rock here, grey and starless, and something has made
    a lair of it. A lurker of the vein feeds on what warmth strays this deep. The only way
    on is back west to the forgeworks.
  exits:
    west: sunken_forgeworks

cinderdeep_maw:
  name: The Cinderdeep Maw
  desc: |-
    The deep bottoms out in a cold maw of ruined Forgework. Here the Hollow Smith kept its
    dead anvil -- a maker the Unforging emptied and never let stop. With the Smith stilled, the
    cold below has thinned, and a drowned stair falls away DOWN into dark the coast has no map for.
  exits:
    up: sunken_forgeworks
    down: the_drowned_way

the_drowned_way:
  name: The Drowned Way
  desc: |-
    Below the maw the stair drowns entirely, and you wade a black flood that was once a
    making-canal, roofed in dead ember. Things that were makers, once, drift and turn in the
    cold current -- a sunken revenant among them, still clutching a tool for a hand. The
    forgeworks are back up the stair; ahead, the flood pours down into a deeper, older dark. A
    sealed hatch stands in the canal wall to the east, its Forgework lock long rusted.
  exits:
    up: cinderdeep_maw
    down: the_cinderheart
    east: the_sealed_vault

the_cinderheart:
  name: The Cinderheart
  desc: |-
    The deepest floor of the Cinderdeep, and its oldest wound: a vast drowned forge-heart where
    the Unforging first tore the world, so far down the sundering never healed. A shard of the
    First Seed sank here and went cold, and the Drowned Forgemaster has kept its black anvil
    around it ever since -- the last maker, hammering a world that will not set. This is the
    bottom. Sound it, and the deep is answered. The only way is back up, toward the light.
  exits:
    up: the_drowned_way

# --- The Kollforge: the molten Reach across the sea (Continental Atlas §VI, Build Order Phase 5). The
# --- surface land closest to the Forge's heat, where the world is still visibly being made; home of
# --- the Kollkin fire-Forgers and the Vent-Forges. Level-banded 50-62. Reached from the berth (west). ---

the_molten_passage:
  name: The Molten Passage
  desc: |-
    The ferry runs a black-glass channel west into rising heat, the Cooling-Sea steaming where it
    laps the Kollforge's shore. Ahead the molten Reach glows: rivers of Forgelight-lit lava, obsidian
    cities on cooling shelves, the whole land still visibly being made. Cinder-drakes ride the thermals.
    The berth lies back east; the capital glows west, and a black shelf of obsidian flats spreads south.
  exits:
    east: the_deepwater_berth
    west: emberkoll
    south: the_obsidian_flats

emberkoll:
  name: Emberkoll
  desc: |-
    The molten capital: an obsidian city raised over a lightning-lit caldera, where the Kollkin work
    the hottest, rawest ember in the world and count a cooled land as a dead one. A Vent-Forge master
    keeps the great forge; a Kollkin trader keeps a shelf-stall. The passage lies back east; north, the
    Anvil-Vents open toward the Forge below; the caldera-market glows west, and a cooling-shelf stair
    drops down toward a Kollhold the fire forgot.
  exits:
    east: the_molten_passage
    north: the_anvil_vents
    west: the_caldera_market
    down: the_cooling_shelf

the_anvil_vents:
  name: The Anvil-Vents
  desc: |-
    Where raw ember still wells up from the Forge below through vents in the world's floor, the ground
    remade with every pulse. A Forgeborn -- living Forgework that never cooled -- guards the deepest
    vent, running a purpose no one remembers. Emberkoll lies back south; north, the vent drops toward
    the Vent-Lord and the raw edge of creation.
  exits:
    south: emberkoll
    north: the_vent_gallery

the_vent_deep:
  name: The Vent Deep
  desc: |-
    The bottom of the Anvil-Vents, where the Forge's heat is close enough to feel the world being
    made and unmade at once. The Vent-Lord keeps it -- a Forgeborn grown vast on a millennium of raw
    fire, the last guardian before the Forge itself. This is the hottest place a walking Forger can
    reach. The vent-gallery lies back south.
  exits:
    south: the_vent_gallery

# --- The Sundered Sky: the floating Reach (Continental Atlas §VII, Build Order Phase 5), the last
# --- surface land and the gateway to the Great Spiral. Lands the Unforging tore loose that never
# --- fell, hung on stubborn Forgework in the high air. Level-banded 60-72. Reached from the berth (up). ---

the_sky_lanes:
  name: The Sky-Lanes
  desc: |-
    The sky-ferry rises on the world's winds off Tidewharf's berth, up past the last clouds into the
    Sundered Sky -- shards of the old supercontinent the Unforging tore loose that never fell, hung in
    the high air on stubborn Forgework, drifting slowly on the winds. Stormkin ride the currents. The
    berth lies back down.
  exits:
    down: the_deepwater_berth
    up: highgate

highgate:
  name: Highgate
  desc: |-
    The sky-Warden capital, an anchor-hold on the greatest of the drifting shards, moored by a great
    anchor-chain to the Coilfoot far below, where the Forgeward Road runs out across the world toward
    the Forge. The Skyborn keep the sky-Gates and the anchor-line -- a second way onto the frontier,
    guarded hardest of all. A sky-Warden holds the gate; an anchor-keeper keeps a stall. The lanes lie
    back down; a drift-bridge runs out east to the wandering shards; the anchor-quarter of the city
    lies south; and NORTH, past the sky-Warden's test, the anchor-line carries you down to the Coilfoot
    and the start of the Forgeward Road.
  exits:
    down: the_sky_lanes
    east: the_drifting_reach
    north: coilfoot_ascent
    south: the_anchor_quarter

the_drifting_reach:
  name: The Drifting Reach
  desc: |-
    A span of loose shards trailing waterfalls into cloud, crossed on sky-bridges of surviving
    Ember-road that sway on the wind. Fall-wights -- those the loose lands took when the world came
    apart -- drift the raw edges, still falling in a way that never ends. Highgate lies back west; the
    wandering Court drifts ahead, east.
  exits:
    west: highgate
    east: the_broken_span

the_wandering_court:
  name: The Wandering Court
  desc: |-
    A shard-city of the Emberwrights that came loose whole and never fell, drifting the high sky on
    the winds -- the Drifting Court, a place that is never in the same sky twice. The Court-Warden
    keeps it, a maker the Unforging set adrift and never let land. This is the highest a walking
    Forger stands before the Spiral. The broken span lies back west.
  exits:
    west: the_broken_span

# --- Deepening the Drowned Sunhold (Content Manufacturing Campaign): the sunken capital was one
# --- boss room; now the salvage-stair delves through the flooded halls and the drowned forge before
# --- the Warden's court, so the richest wreck in the Quenchmere plays like a real dungeon. ---
the_drowned_halls:
  name: The Drowned Halls
  desc: |-
    Below the stair the water closes over you and the drowned-lung Forgework takes the cold back a
    hand at a time. These were the Sunhold's high halls once: colonnades of green-lit stone where the
    Merewright walked dry. Drifters move between the pillars, citizens the sea kept. The stair climbs
    back up; the forge-halls open deeper down.
  exits:
    up: drowned_sunhold_descent
    down: the_flooded_forge

the_flooded_forge:
  name: The Flooded Forge
  desc: |-
    The Sunhold's own forge, drowned but not dead: its ember-hearths still burn blue under the water,
    banked against the cold that never came for them. A revenant of the last forge-master keeps the
    fires, working a making the sea interrupted an age ago and will not let it finish. Past the forge
    lies the Warden's court; the halls lie back up.
  exits:
    up: the_drowned_halls
    down: the_drowned_sunhold

# --- Deepening the Heart-Grove (Content Manufacturing Campaign): the Verdance's heart was one boss
# --- room; now the rootways wind between the mire and the grove, a living throat of the continent
# --- with its own guardian, so the deepest green plays like a delve. ---
the_rootways:
  name: The Rootways
  desc: |-
    Between the mire and the heart the wood closes to a throat: roots the girth of towers arch
    overhead, and the whole passage breathes, slow and wet, around you. The Verdance knows you are
    here. A rootbound thing the grove grew to keep its heart stirs from the living wall and turns
    toward the warmth of you. The mire lies back east; the Heart-Grove beats ahead, west.
  exits:
    east: the_deeproot_mire
    west: the_heart_grove

# --- Deepening the Frozen Court (Content Manufacturing Campaign): the Rimefall's capital was one
# --- boss room; now the delve crosses the glass gallery and the rime-vault, each with a frozen
# --- guardian, before the Rime-King's throne, so the most haunted room in the world earns its dread. ---
the_glass_gallery:
  name: The Glass Gallery
  desc: |-
    North of Stillhearth the ice takes the world whole: a gallery of the golden age under a skin of
    clear rime, its makers frozen at their benches mid-gesture, perfect and lethal. One of them is
    not as frozen as the rest -- a sentinel the Rime-King set, still keeping a watch three ages cold,
    that turns its glass face toward your warmth. Stillhearth lies back south; the vault opens north.
  exits:
    south: stillhearth
    north: the_rime_vault

the_rime_vault:
  name: The Rime-Vault
  desc: |-
    The court's treasury, or its tomb: a vault where the Emberwrights sealed the making they feared
    most, flash-frozen with everything else when the Unforging caught the Reach. The cold here is
    older than the rest, and it moves -- a wraith of unmelting ice that was a vault-keeper once, and
    keeps it still. The gallery lies back south; the throne-court stands north.
  exits:
    south: the_glass_gallery
    north: the_frozen_court

# --- Deepening the Vent-Deep (Content Manufacturing Campaign): the Kollforge's bottom was one boss
# --- room; now the vent-gallery burns between the working vents and the Vent-Lord's deep. ---
the_vent_gallery:
  name: The Vent Gallery
  desc: |-
    Deeper than the working vents, where the rock runs to slag and the Forge's heat comes up through
    the floor in sheets. A magma revenant works a vent here, a Kollkin the fire took and would not let
    go, still pouring a make that has no shape left. The Anvil-Vents lie back south; the Vent Deep
    opens north, hotter still.
  exits:
    south: the_anvil_vents
    north: the_vent_deep

# --- Deepening the Wandering Court (Content Manufacturing Campaign): the last surface boss stood in
# --- one room; now a broken span of drift-shards crosses to the Court-Warden's drifting city. ---
the_broken_span:
  name: The Broken Span
  desc: |-
    The last sky-bridge to the Wandering Court is broken mid-air, its Ember-road ending in cloud and
    beginning again a leap away, and the whole span sways. A fall-wraith rides the gap -- one the loose
    lands took, grown from an endless fall into something that pulls others after it. The drifting
    reach lies back west; the Court drifts ahead, east.
  exits:
    west: the_drifting_reach
    east: the_wandering_court

# --- The Tidecaves (Content Manufacturing Campaign): an optional early sea-cave delve off the
# --- Saltstrand, so the starting coast rewards a curious Forger with an off-path dungeon (L4-10). ---
the_tidecave_mouth:
  name: The Tidecave Mouth
  desc: |-
    A sea-cave gapes in the low cliff below the strand, half-drowned at high tide and dripping cold
    brine. Cave-crawlers clack in the dark over old wrack and older bones. The strand lies back up;
    the cave sinks deeper, down, toward a green glow.
  exits:
    up: the_saltstrand
    down: the_sunken_grotto

the_sunken_grotto:
  name: The Sunken Grotto
  desc: |-
    The cave opens into a grotto lit green by a seam of drowned ember in the far wall, its water still
    as glass. A brine-hulk rises from the pool, grown huge on a life of eating what the tide brings
    down, and turns toward the warmth of you. Whatever the sea washed into this cave over the ages
    settles in the shallows here. The cave-mouth lies back up.
  exits:
    up: the_tidecave_mouth

# --- The Deep Reachwood (Seed Scale Directive): the wood was a short stub; expand it into a real
# --- wilderness sub-zone past the Warden's Glade - a second early leveling ground, gathering groves,
# --- and a hidden shrine, so low-level Forgers spread into the forest instead of one coast path. ---
the_deepwood:
  name: The Deep Reachwood
  desc: |-
    Past the glade the wood turns old: trunks too wide to reach around, a canopy that keeps the light
    to a green dusk, and wild ember pooling in the roots where no one gathers it. An ember-lynx pads
    the branches overhead, patient. The glade lies back west; a fen glimmers north, and the deer-path
    runs on east toward a shape of old stone.
  exits:
    west: wardens_glade
    north: the_thornmere
    east: the_forgotten_shrine
    up: the_old_firewatch

the_thornmere:
  name: The Thornmere
  desc: |-
    A boggy grove where the Reachwood drinks from a black-water mere, thick with ember-blooms and the
    reed-beds the coast's fishers used to cut. A mere-lurker hunts the shallows. This is a gatherer's
    corner of the wood, quiet and far from any road; the deepwood lies back south.
  exits:
    south: the_deepwood

the_forgotten_shrine:
  name: The Forgotten Shrine
  desc: |-
    The deer-path ends at a shrine the Reachwood has half-swallowed: a ring of standing Forgework the
    Emberwrights raised before the town, its purpose lost, its keeper still at its post. Whatever was
    left as offering here still lies in the moss, untaken for an age. The deepwood lies back west.
  exits:
    west: the_deepwood

# --- Deepening the Ashwastes ruin (Seed Scale Directive): the scoured ruin was a corridor to the
# --- crater-boss; open the buried Ashen Vault between them, so Emberreach's second dungeon has an
# --- interior encounter space, a hidden find, and a mini-boss gate before the Ash-Colossus. ---
the_ashen_vault:
  name: The Ashen Vault
  desc: |-
    A stair sunk in the ruin's floor drops into a vault the Unforging buried whole: a Forge-hold's
    strongroom, its door long since scoured to glass, its air grey and unmoving. What the makers
    sealed here was never meant to be opened, and a sentinel of fused ash still keeps it, grown out
    of the vault's own walls. The ruin lies back west; the glass crater opens east, through the dark.
  exits:
    west: the_scoured_ruin
    east: the_glass_crater

# --- The Woodcutters' Camp (Seed Scale Doctrine: settlements + player distribution). A second early
# --- hub in the Reachwood, so low-level Forgers have somewhere to level, trade, gather, and take work
# --- besides the coast town - the wood is a place people live, not just a place to fight through. ---
the_woodcutters_camp:
  name: The Woodcutters' Camp
  desc: |-
    A stockade of green logs and ember-lamps in a clearing of the Reachwood: the Woodcutters' Camp,
    where the Concord's foresters cut the deadfall the wild ember leaves and haul it to the capital.
    Smoke, sawdust, and the smell of resin; a camp-keeper minds a lean-to store, a forester rests a
    saw, and a hound sleeps by the fire. The hollow trail runs back north; the logging stands lie east.
  exits:
    north: reachwood_hollow
    east: the_logging_stands

the_logging_stands:
  name: The Logging Stands
  desc: |-
    Where the foresters work: ranks of felled ember-trunks and the raw stumps between, the loam thick
    with sap and sawdust. The cutting has stirred something up - a bark-lurker, grown of deadfall and
    old ember, that the foresters will not go near. Good resin beads on the cut stumps here. The camp
    lies back west.
  exits:
    west: the_woodcutters_camp

# --- The Old Firewatch (Seed Scale Doctrine: landmarks + scenic viewpoints + lore). A ruined watch-
# --- tower on the one hill of the Reachwood, a place to climb to and see the whole launch zone laid
# --- out - a reward for the curious, not a fight. ---
the_old_firewatch:
  name: The Old Firewatch
  desc: |-
    A climb through the deepwood brings you out atop the one bare hill for leagues, crowned by a
    ruined watch-tower the Concord raised in the first years of the Rekindling and let go. From here
    the whole launch of the world lies open: the grey Cooling-Sea and the smoke of Cinderhearth to the
    west, the capital's Grand Forge glowing north, the Ashwastes' pale scar east, and far off the
    Wardenmarch and the frontier beyond. A watch-keeper's kit still hangs where the last watcher left
    it. This is the highest a Forger stands in Emberreach. The deepwood lies back down.
  exits:
    down: the_deepwood

# --- The Thorn-Heart (Seed Scale Doctrine): the Bramblewarren was a dead-end boss room; open the
# --- chamber it guards, where the wild ember the warren grew from pools untaken - a hidden find and
# --- a rare threat past the Bramble-Wight, so the warren is a small dungeon, not one fight. ---
the_thorn_heart:
  name: The Thorn-Heart
  desc: |-
    Past the Bramble-Wight the thorns close into a chamber with a living heart: a well of wild ember
    the warren grew itself around, welling up bright and untaken through a knot of ember-thorn older
    than the town. A thorn-horror uncoils from the well, grown fat on the raw ember no one dares
    gather. What pools here has drawn more than the Wight. The warren mouth lies back south.
  exits:
    south: the_bramblewarren

# --- The drowned flagship (Seed Scale Doctrine: coastal dungeon past the Wreck Reef). The reef was
# --- a dead-end boss room; open the flooded hulls below, so the coast has an optional early dungeon
# --- with a hold to plunder - a second reason to work the reef beyond the Drowned Pilot. ---
the_flooded_hulls:
  name: The Flooded Hulls
  desc: |-
    Below the reef's deck the drowned Forge-hulls lock together into a flooded maze, green light
    slanting through split planking, the water thick with silt and old salvage. A reef-drifter hunts
    the passages between the wrecks. The reef deck lies back up; the flagship's hold sinks deeper down.
  exits:
    up: the_wreck_reef
    down: the_sunken_hold

the_sunken_hold:
  name: The Sunken Hold
  desc: |-
    The flagship's hold, whole and drowned: a cargo of the first Rekindling still lashed in the dark,
    Forgework the coast shipped and lost when the sea rose. A wreck-warden - the ship's own Forged
    keeper, still at its post on the bottom - rises from the silt to hold the cargo it was set to guard.
    What the sea took and never gave back settles here. The flooded hulls lie back up.
  exits:
    up: the_flooded_hulls

# --- Capital districts (Seed Scale Doctrine: every city should feel alive; avoid skeletal cities).
# --- The training yard and the artisans' quarter give Emberreach's capital martial and maker life
# --- beyond the three hub rooms, so the city bustles and offers trainers, shops, and things to do. ---
the_training_yard:
  name: The Warcraft Training Yard
  desc: |-
    Off the Orders' Row, a sanded yard ringed by racks of practice-steel where the Warcraft Orders
    drill their own: the Vanguard's shield-wall, the Pathfinder's skirmish, the ring-work of the
    duelists. A weaponmaster runs the forms, a drill-sergeant barks the line, and a duelist waits by
    the sparring ring for anyone bold enough. The Orders' Row lies back east.
  exits:
    east: orders_row

the_artisans_quarter:
  name: The Artisans' Quarter
  desc: |-
    North of the market the makers keep their own quarter: forge-shops and glassworks and
    binderies, the ring of a hundred small hammers, the smell of hot metal and resin. A master
    artisan keeps a well-stocked shop, a journeyman smith works a commission, and a wandering
    scholar sketches the old marks on the walls. The market lies back south.
  exits:
    south: market_quarter

# --- The Emberpost + the Windward Downs (Seed Scale Doctrine: roads connect meaningful destinations;
# --- a mid-road settlement + a wilderness so the corridor is a place, not a passage). ---
the_emberpost:
  name: The Emberpost
  desc: |-
    A caravan waystation on a cart-track off the Ember-road: a walled yard of wagons, draft-beasts,
    and travellers between the coast and the capital, where the Concord's caravans re-provision and
    the road's traffic pools. A caravan-master keeps a well-found store, a road-guard leans on a
    spear, and a peddler cries oddments from the back of a cart. The road lies back east; the downs
    roll north.
  exits:
    east: emberroad_climb
    north: the_windward_downs

the_windward_downs:
  name: The Windward Downs
  desc: |-
    North of the post the Kindlands roll open into grassy downs under a wide warm sky, the wild
    ember running gold through the grass like a slow fire that never burns. Herds of ember-elk drift
    the ridgelines, and a downs-stalker works the edge of the herd. Cairns of the first Rekindling
    stand on the high points, marking a road the Concord walked before it paved the Ember-road. The
    post lies back south.
  exits:
    south: the_emberpost

# --- The Sealed Vault (Seed Scale Doctrine: hidden discoveries / off-path prize). A sealed chamber
# --- off the Drowned Way that the Cinderdeep's flood never breached, so the deep dungeon rewards the
# --- Forger who tries the rusted hatch instead of pressing straight down to the Cinderheart. ---
the_sealed_vault:
  name: The Sealed Vault
  desc: |-
    Behind the rusted hatch, a chamber the flood never reached: a dry, sealed vault the makers shut
    against the Unforging and never reopened, its air a thousand years stale. What they sealed here
    they meant to keep from the unmaking - and something has kept it, all this time, a vault-horror
    grown from the sealed dark, that turns toward the first light in an age. The drowned way lies back
    west.
  exits:
    west: the_drowned_way

# --- The Deep Wreckways + the Drowned Chapel (Seed Scale Doctrine: expand the Quenchmere to MMO
# --- density - a second leveling ground, a salvage-gathering maze, and a hidden sunken dungeon off
# --- the mapped ferry route, so the drowned Reach disperses players like Emberreach does). ---
the_deep_wreckways:
  name: The Deep Wreckways
  desc: |-
    Off the ferry's marked lane, the Wreckways deepen into a maze of drowned hulls no chart covers:
    ten thousand ships the risen sea took, locked mast to mast, their holds spilling a Reach's worth
    of salvage into the green water. Wreck-scavengers work the hulls, and so do worse things. Good
    salvage beads on every broken deck. The marked lane lies back south; a temple-mast rises north.
  exits:
    south: the_quench_lanes
    north: the_drowned_chapel

the_drowned_chapel:
  name: The Drowned Chapel
  desc: |-
    The tallest wreck in the deep Wreckways is no ship: a drowned chapel of the old Merewrights, its
    spire the mast that marks it, its nave flooded and lit by a seam of drowned ember behind the
    altar. A chapel-warden - the last keeper, drowned at its post - rises from the pews to hold the
    offering the faithful left when the sea came. The Wreckways lie back south.
  exits:
    south: the_deep_wreckways

# ============================================================================================
# THE OUTER REEFS (Great Creation Campaign) - a Quenchmere archipelago sub-region east of Tidewharf:
# a reef-lane out to Saltmarsh Landing (a salvager's outpost), the reef flats (wilderness + gathering),
# the Old Lighthouse (a landmark), and the Sunken Manse (a wreck-dungeon). Level-banded 18-30.
# ============================================================================================
the_outer_lanes:
  name: The Outer Lanes
  desc: |-
    East of Tidewharf the marked ferry-lanes give out and the Outer Reefs begin: a scatter of low
    reef-isles the risen sea left just above the water, strung on salvage-ropes and drift-bridges the
    outer folk keep. A reef-serpent works the channel between the isles. Tidewharf lies back west;
    Saltmarsh Landing sits on the first isle, east.
  exits:
    west: tidewharf_plaza
    east: saltmarsh_landing

saltmarsh_landing:
  name: Saltmarsh Landing
  desc: |-
    A salvager's outpost on the first of the Outer Reefs: stilt-houses over a tidal marsh, drying
    racks of salvage and salt-fish, and the small independent folk who work the reefs beyond the
    Guild's reach. A salvage-master keeps a well-stocked shack, a reef-fisher mends a weir, and a
    marsh-child races the tide. The reef-lanes run back west; the reef flats spread north, a lighthouse
    stands east, and a salvage-stair drops down to a sunken manse.
  exits:
    west: the_outer_lanes
    north: the_reef_flats
    east: the_old_lighthouse
    down: the_sunken_manse

the_reef_flats:
  name: The Reef Flats
  desc: |-
    North of the landing the reef bares at low tide into a mile of flats: tidal pools bright with
    brine-ember, wading-birds, and the shells and salvage the sea leaves twice a day. Mudskitters the
    size of hounds hunt the pools, and the flats are thick with brine-pearl for anyone quick between
    the tides. The landing lies back south.
  exits:
    south: saltmarsh_landing

the_old_lighthouse:
  name: The Old Lighthouse
  desc: |-
    A lighthouse of the age before the sea rose, its foot now awash, its lamp-room still above the
    tide: the outer folk keep the ember-lamp lit to mark the reef for the ferries, as their forebears
    did before the Quenchmere drowned. From the lamp-room the whole Outer Reefs spread below, and on
    a clear day the masts of the deep Wreckways and the spire of Tidewharf. A keeper tends the lamp.
    The landing lies back west.
  exits:
    west: saltmarsh_landing

the_sunken_manse:
  name: The Sunken Manse
  desc: |-
    Below the landing a salvage-stair drops into a drowned manse - the seat of a Merewright house the
    sea took whole, its halls flooded and lit by the brine-ember in its own drowned hearth. The house
    kept its wealth and its pride to the last; a manse-warden, the house's own Forged steward, still
    keeps both against the salvagers. What the house would not let go still lies in the flooded solar.
    The landing lies back up.
  exits:
    up: saltmarsh_landing
# THE VERDANCE EXPANSION (Great Creation Campaign) - the living continent grows to zone density:
# Highbough's bough-avenues + wild-ember shrine (the capital lived-in), the Understory (a forest-floor
# wilderness leveling ground), and the Sunken Ziggurat (a forgotten civilization the jungle ate whole,
# a ruin-delve). Level-banded 22-30, filling the gap between the landing and the mire.
# ============================================================================================

# --- Highbough proper: the canopy capital, more than one bough ---
the_bough_avenues:
  name: The Bough-Avenues
  desc: |-
    The city proper spreads along boughs wide as roads, houses grown into the living wood and lit by
    ember-blooms coaxed rather than kindled. Deeprooted folk go about a life the drowned Reaches never
    knew: unhurried, green, certain the tree will hold. A bough-warden of the city watch keeps the
    ways, and a canopy-child dares the high rails. Highbough's heart lies back east; a wild-ember
    shrine stands west, and a rope-and-root descent drops south to the forest floor.
  exits:
    east: highbough
    west: the_wildember_shrine
    south: the_understory

the_wildember_shrine:
  name: The Wild-Ember Shrine
  desc: |-
    Where the Deeprooted keep what the drowned Reaches spend: a shrine grown around a wellspring of
    wild Ember left to burn untouched, tended and never Forged. A grove-keeper reads the flame the way
    a smith reads a heat, and will not let a stranger take from it. The tree's own testament is carved
    in the living bark for any who can read the green. The avenues lie back east.
  exits:
    east: the_bough_avenues

# --- The Understory: the forest-floor wilderness, a leveling ground between the landing and the mire ---
the_understory:
  name: The Understory
  desc: |-
    Below the canopy the forest floor is a green dusk of buttress-roots and ember-bloom, loud with
    the calls of things that hunt the half-light. Root-boars root the leaf-mould and thornwolves work
    in packs; glowcap clusters the fallen giants for anyone with the nerve to gather the dark. The
    landing lies north, the bough-avenues climb up, and an old overgrown causeway runs west toward
    something the jungle swallowed long ago.
  exits:
    north: verdance_landing
    up: the_bough_avenues
    west: the_overgrown_causeway

# --- The Sunken Ziggurat: a forgotten civilization the Verdance ate (a ruin-delve) ---
the_overgrown_causeway:
  name: The Overgrown Causeway
  desc: |-
    A road of cut stone runs west under the roots, older than the Deeprooted and not of their making:
    a causeway of a people the jungle took whole, their glyphs still legible where the green has not
    yet closed. Root-stranglers guard the way, grown thick where the old power still hums. The
    understory lies back east; the causeway climbs the steps of a ziggurat, west.
  exits:
    east: the_understory
    west: the_ziggurat_steps

the_ziggurat_steps:
  name: The Ziggurat Steps
  desc: |-
    A stepped pyramid of black stone breaks the canopy, half-swallowed by the tree that grew through
    its crown: the seat of the forgotten people, their terraces hung with strangling root. A vine-
    wraith, the last warden of a dead faith, keeps the stair against all comers. The causeway lies
    back east; the ziggurat's sealed vault opens above, at the crown.
  exits:
    east: the_overgrown_causeway
    up: the_ziggurat_vault

the_ziggurat_vault:
  name: The Ziggurat Vault
  desc: |-
    The crown-vault of the sunken ziggurat, roofless now, the tree's heartwood grown down through it
    like a hand around a coal. Here the forgotten people kept their god: the Rootpriest-that-Endured,
    a thing half-corpse and half-tree that swallowed its own priesthood to outlast its age, and has.
    What it kept for its dead god still lies in the choked reliquary. The steps lie back down.
  exits:
    down: the_ziggurat_steps

# ============================================================================================
# THE RIMEFALL EXPANSION (Great Creation Campaign) - the frozen north grows to zone density: the
# Silent Anvil's cloister (Stillhearth lived-in + the Reach's doctrine of restraint), the Riming Fields
# (an ice-floe wilderness leveling ground), and Frosthold (a SECOND Emberwright city preserved whole
# under the ice - explorable, then a frozen-forge delve). Level-banded 40-48, below the Rime-King (52).
# ============================================================================================

# --- The Silent Anvil's cloister: Stillhearth's warm heart, the doctrine of the Reach ---
the_silent_cloister:
  name: The Silent Cloister
  desc: |-
    Beneath the port the Silent Anvil keep their cloister, warm and low and quiet as held breath: an
    order that guards the whole frozen Reach as a shrine and Forges nothing, believing the golden age
    froze because it made too much, too fast, too proud. A cloister-master keeps the rule; a novice
    sweeps rime that will not stop falling. Their creed is graven on the warm stone for any who read.
    Stillhearth lies back up.
  exits:
    up: stillhearth

# --- The Riming Fields: the ice-floe wilderness, a leveling ground on the Rimefall's edge ---
the_riming_fields:
  name: The Riming Fields
  desc: |-
    West of the port the floe opens into a field of standing ice, pressure-ridges and frozen wells
    where the Riming Sea heaved and set in a single instant. Rime-wolves course the ridges and ice-
    wights rise from the frozen wells, drawn to any warmth. Rime-crystal grows in the cold seams for
    anyone who can gather it before the cold takes their hands. Stillhearth lies back east; a beacon
    stands north on the highest ridge, and a glassway runs west toward a second frozen city.
  exits:
    east: stillhearth
    north: the_kingsroad_beacon
    west: the_glassway

the_kingsroad_beacon:
  name: The Kingsroad Beacon
  desc: |-
    A signal-tower of the golden age stands on the highest pressure-ridge, its ember-beacon long cold,
    its stair climbable still. From the top the whole Rimefall spreads white to the horizon: Stillhearth's
    one plume of smoke, the buried avenues of Frosthold, and far north under the deep ice the golden
    glint of the Frozen Court itself. The fields lie back south.
  exits:
    south: the_riming_fields

# --- Frosthold: a SECOND Emberwright city preserved whole under the ice (explorable + a delve) ---
the_glassway:
  name: The Glassway
  desc: |-
    An avenue of the golden age runs west under a roof of clear ice, its lamps and shop-signs and
    the frost-caught banners of a festival-day all preserved mid-flutter, the whole street stopped
    between one breath and the next. Frost-revenants walk it, the city's own people, still keeping to
    their errands in the ice that killed them. The fields lie back east; the city square opens west.
  exits:
    east: the_riming_fields
    west: frosthold

frosthold:
  name: Frosthold
  desc: |-
    A whole Emberwright city preserved entire under the deep ice, lesser than the Frozen Court and no
    less haunted: a market-square caught mid-day, its makers frozen at their benches and their bargains,
    a city that simply stopped. A frost-echo of the last market-master keeps the square, neither living
    nor wholly gone. The glassway lies back east; the city's great forge stands frozen at the square's
    heart, west.
  exits:
    east: the_glassway
    west: the_frozen_forge

the_frozen_forge:
  name: The Frozen Forge
  desc: |-
    The heart of Frosthold: a master-forge of the golden age caught mid-pour, a ribbon of Ember frozen
    in the very act of falling, bright and motionless as struck glass. The Frostbound Smith stands over
    it still, flash-frozen mid-strike and woken by warmth to finish a work an age overdue, and it will
    forge you into the piece if you let it. What the golden age made here is worth the cold. The square
    lies back east.
  exits:
    east: frosthold
# THE KOLLFORGE EXPANSION (Great Creation Campaign) - the molten Reach grows to zone density: the
# caldera-market (Emberkoll lived-in + the Kollkin creed), the Obsidian Flats (a lava-shelf wilderness
# leveling ground), and the Cooled Kollhold (a city that DIED cold - the Kollkin's deepest fear, mirror
# to the drowned Sunhold and frozen Frosthold). Level-banded 50-56, below the Vent-Lord (62).
# ============================================================================================

# --- Emberkoll proper: the obsidian capital, lived-in, and the Kollkin creed ---
the_caldera_market:
  name: The Caldera-Market
  desc: |-
    A market ringed around the lip of a lightning-lit caldera, its stalls roofed in cooling-glass and
    its floor warm underfoot: the Kollkin trade the hottest wares in the world here, and count heat
    itself the truest wealth. A shelf-crier hawks the day's pours; a caldera-child dares the warm rail.
    The Kollkin creed is struck in bronze at the caldera's lip for any who read. Emberkoll lies back east.
  exits:
    east: emberkoll

# --- The Obsidian Flats: a lava-shelf wilderness, a leveling ground off the Reach's entry ---
the_obsidian_flats:
  name: The Obsidian Flats
  desc: |-
    South of the passage the shore cools to a black glass shelf, cracked with slow rivers of Forgelight-
    lit lava and loud with the things that live in heat: ember-lynxes stalking the glass and slag-hulks
    heaving up from the cooling flows. Emberglass sets in the cracks for anyone quick enough to gather
    it before the next pulse. The passage lies back north; the flats break east into a cinder-vent gorge.
  exits:
    north: the_molten_passage
    east: the_cinder_gorge

the_cinder_gorge:
  name: The Cinder-Vent Gorge
  desc: |-
    A gorge where the flats crack open on a working vent, the air a shimmer of heat and cinder-fall.
    A cinder-drake nests on the far ledge, grown fat on the thermals, jealous of the gorge. This is the
    edge of the wilds, as deep as a lone Forger should push the flats. The obsidian flats lie back west.
  exits:
    west: the_obsidian_flats

# --- The Cooled Kollhold: a city that died COLD (the Kollkin's deepest fear; a dead-city delve) ---
the_cooling_shelf:
  name: The Cooling Shelf
  desc: |-
    A stair drops from Emberkoll onto a shelf where the Forgelight failed an age ago: the rock here is
    grey and dead-cold, the one place in the Kollforge the fire forgot. Slag-wraiths, Kollkin who died
    when their heat did, drift the cold rock. Emberkoll's glow lies back up; ahead, west, the dead city
    itself: Ashkoll, that cooled.
  exits:
    up: emberkoll
    west: dead_ashkoll

dead_ashkoll:
  name: Dead Ashkoll
  desc: |-
    A Kollhold that cooled and died: an obsidian city gone grey and silent when its caldera guttered
    out, its people frozen not in ice but in cold stone, mid-work at forges that will never light again.
    To the Kollkin this is the only true death, and no Kollkin will walk here. A slag-echo of the last
    Vent-master keeps the dead forge-square. The cooling-shelf lies back east; the great cold hearth
    stands at the city's dead heart, west.
  exits:
    east: the_cooling_shelf
    west: the_cold_hearth

the_cold_hearth:
  name: The Cold Hearth
  desc: |-
    The dead heart of Ashkoll: the great forge that was the city's life, its caldera a pit of grey slag,
    cold a thousand years. The Ashen Forgeborn keeps it - living Forgework that did not die when its
    heat did but went cold and mad instead, tending a fire that will never light and hating anything
    that still burns. What Ashkoll forged in its last hot age still lies unclaimed in the dead pit. The
    forge-square lies back east.
  exits:
    east: dead_ashkoll

# ============================================================================================
# THE SUNDERED SKY EXPANSION (Great Creation Campaign) - the floating Reach grows to zone density: the
# anchor-quarter (Highgate lived-in + the Skyborn creed), the Drifting Shoals (a sky-wind wilderness
# leveling ground), and the Falling Shard (a sky-isle that LOST its Forgework and falls forever - the
# Skyborn's one dread, the world's fourth dead capital by a different death). Banded 60-66, below the
# Court-Warden (72).
# ============================================================================================

# --- Highgate proper: the anchor-quarter, lived-in, and the Skyborn creed ---
the_anchor_quarter:
  name: The Anchor-Quarter
  desc: |-
    The working heart of Highgate, built around the great anchor-capstan where the chain to the Coilfoot
    runs down through the shard and out of sight into cloud: the Skyborn live their whole lives aloft,
    moored but never landed, and hold the anchor a sacred trust. An anchor-keeper minds the capstan; a
    sky-child runs the drift-rails without a tether. The Skyborn creed is cut in the capstan-drum for
    any who read. Highgate's gate lies back north; the drifting shoals open south off the shard's edge.
  exits:
    north: highgate
    south: the_drifting_shoals

# --- The Drifting Shoals: a sky-wind wilderness, a leveling ground among the loose shards ---
the_drifting_shoals:
  name: The Drifting Shoals
  desc: |-
    Off the anchor-quarter's edge a shoal of lesser shards drifts on the high wind, crossed on sway-
    bridges and trailing their waterfalls into the cloud-deep below. Stormkin ride the updrafts and
    sky-rays glide the shard-lee, hunting the warm. Stormglass grows where the lightning grounds on the
    drifting rock, for a Forger with the nerve to gather in the open sky. The anchor-quarter lies back
    north; a tilting span runs west toward a shard that is losing its hold on the air.
  exits:
    north: the_anchor_quarter
    west: the_tilting_span

# --- The Falling Shard: a sky-isle that lost its Forgework and falls forever (a dead-city delve) ---
the_tilting_span:
  name: The Tilting Span
  desc: |-
    A sky-bridge run out to a shard gone wrong: the span tilts underfoot, its far end lower than its
    near, because the shard it reaches is slowly, endlessly falling, its Forgework failing a hair a
    year. Fall-revenants keep the tilting way, those the slow fall took and never finished taking. The
    shoals lie back east; the falling shard's dead hold drops away, down.
  exits:
    east: the_drifting_shoals
    down: the_falling_hold

the_falling_hold:
  name: The Falling Hold
  desc: |-
    A shard-city that lost its Forgework and has been falling ever since, so slowly that its people
    lived and died and never knew they fell: a hold hung in an endless drop, everything in it drifted a
    hand off the floor and never landing, a whole city held in the long breath before an impact that
    will not come for an age. A drift-echo of the last anchor-keeper keeps the tilting square. The
    tilting span lies back up; the hold's dead capstan stands at its heart, down.
  exits:
    up: the_tilting_span
    down: the_anchor_deep

the_anchor_deep:
  name: The Anchor-Deep
  desc: |-
    The dead heart of the falling shard: the great capstan whose anchor-chain snapped an age ago, its
    broken links still drifting in the endless fall. The Broken Anchor-Warden keeps it - the hold's own
    guardian, set to hold the shard aloft and failing at it forever, gone wrong in the long drop, hauling
    still on a chain that leads nowhere. What the hold could not take down with it still drifts unclaimed
    by the dead capstan. The falling square lies back up.
  exits:
    up: the_falling_hold
# THE CINDERWASTE - the Grey Reach (Great Creation Campaign, Phase I: geography-first). Continental
# Atlas SIV: a continent HALF-UNFORGED, scoured to grey Cinder and glass, walked under an open bleached
# sky. The surface's answer to the Cinderdeep. Reached south across the Quenchmere's grey water. The
# fourth Reach's PHYSICAL map laid down at breadth, and the first zone built for the WIDER COMPASS:
# open-waste diagonals (ne/nw/se/sw) and thresholds keyed by the noun they open onto (market, quarter,
# waymoot, crater, vault). Level-banded 15-40. Ambient life only; dense population is a later pass.
# ============================================================================================

the_ashen_crossing:
  name: The Ashen Crossing
  desc: |-
    The ferry leaves the last charted lane and runs south into grey water: the Cooling-Sea here is
    silting to a dead salt slack, the swell dying under a rind of floating ash. Ahead the Cinderwaste
    lifts over the horizon, not a coast but an ending, a land the Unforging scoured half to nothing and
    then left. The wind smells of struck flint. The Quench lanes lie back north; the grey shore waits
    south.
  exits:
    north: the_quench_lanes
    south: the_grey_shore

the_grey_shore:
  name: The Grey Shore
  desc: |-
    Landfall on the Cinderwaste: a strand not of sand but of cold grey cinder, the sea behind giving
    out into salt-flat before it reaches true water, the land ahead a bleached waste under a sky gone
    white and enormous. Ash-crabs pick the tideline of a tide that no longer comes. A salvage-road,
    marked by the ribs of grounded ships, runs inland west to Saltring; the open dunes roll away to the
    southwest; the drowned canals crust the coast to the southeast. The crossing lies back north.
  exits:
    north: the_ashen_crossing
    west: saltring
    southwest: the_grey_dunes
    southeast: the_drowned_canals

# --- Saltring: the salvage-city capital, ringing a dry sea (noun-keyed districts) ---
saltring:
  name: Saltring
  desc: |-
    The one city of the Cinderwaste, a salvage-town built in a great ring around the basin of a sea
    that dried in an afternoon when the Unforging drank it: its houses are hulls and its walls are
    salvage, and the Ashborn who live here do not mourn the world and do not make it, they sell it back
    to itself piece by piece. A ring-warden keeps the gate. The salvage-MARKET rings the basin; the
    salvage-clan QUARTER warrens off south; the grey shore road runs back east; and a salvage-track
    climbs west onto the ash dunes toward the deep waste.
  exits:
    east: the_grey_shore
    west: the_grey_dunes
    north: the_salt_market
    market: the_salt_market
    south: the_ring_quarter
    quarter: the_ring_quarter

the_salt_market:
  name: The Salt-Market
  desc: |-
    Saltring's market, ringing the dry sea-basin on salvage-scaffold: here the Ashborn trade water and
    salvage and the rare raw Ember the waste gives up, and a thing Unforged fetches more than a thing
    made. A salt-factor keeps the scale. Below the scaffold the dry basin glares white to its far rim,
    and a crater-track drops off its floor toward the Glass Market. Saltring's ring lies back south.
  exits:
    south: saltring
    down: the_glass_market
    crater: the_glass_market

the_ring_quarter:
  name: The Ring-Quarter
  desc: |-
    The salvage-clan quarter of Saltring, a warren of hull-houses where the road-clans keep their hard
    code and their harder bargains. A clan-elder keeps the quarter's peace. This is as settled as the
    Cinderwaste gets; past the last hull the waste begins and does not forgive. Saltring's ring lies
    back north.
  exits:
    north: saltring

# --- The Glass Market: a black-market bazaar in an Unforging crater ---
the_glass_market:
  name: The Glass Market
  desc: |-
    In a crater where the Unforging struck and left the sand fused to black glass, a bazaar keeps to
    the shade of the crater-wall: the Glass Market, where anything Unforged can be bought and no
    question is asked twice. A glass-broker works the dark stalls, selling relics that should not exist.
    The rim-track climbs back up toward the Salt-Market; a glass-tunnel runs deeper under the crater
    wall, west, toward the older, worse markets no one names.
  exits:
    up: the_salt_market
    west: the_glassways

the_glassways:
  name: The Glassways
  desc: |-
    Under the crater wall the Unforging fused a warren of glass tunnels, smooth as poured night, lit
    only by the raw Ember still trapped glowing in the walls. Glass-lurkers hunt the dark bends, drawn
    to warmth. This is the edge of the buyable world; deeper in, the glass gives onto the Scoured
    Reach and the half-Forged ruins. The Glass Market lies back east; the scoured ground opens west.
  exits:
    east: the_glass_market
    west: the_scoured_reach

# --- The ash-dune wilderness (diagonals off the open waste) ---
the_grey_dunes:
  name: The Grey Dunes
  desc: |-
    A rolling waste of cold ash-dunes under the white sky, the Cinderwaste's open middle, trackless
    but for the salvage-poles the Ashborn set to walk it by. Ash-jackals course the dune-troughs and
    the wind erases your steps behind you. The grey shore lies back northeast and Saltring east; south
    the dunes give out at a horizon-long scar; and a WAYMOOT fire burns west, the one landmark in a
    land that eats landmarks.
  exits:
    northeast: the_grey_shore
    east: saltring
    south: the_ashline
    west: the_ashborn_waymoot
    waymoot: the_ashborn_waymoot

the_ashborn_waymoot:
  name: The Ashborn Waymoot
  desc: |-
    A wandering camp that is a fixed idea if not a fixed place: the Ashborn waymoot, a ring of salvage-
    fires and a water-cache the road-clans keep by unbreakable custom for any traveller the waste has
    not yet killed. A waymoot-keeper tends the cache. It is the only mercy in the Cinderwaste, and it
    is a real one. The dunes roll back east.
  exits:
    east: the_grey_dunes

# --- The drowned canals: salt-flats over sunken waterways ---
the_drowned_canals:
  name: The Drowned Canals
  desc: |-
    East of the shore the salt-flat crazes over a grid of drowned canals: an irrigation-work of the age
    before the waste, its channels now brine-crusted trenches under a skin of salt that gives way
    without warning. Salt-wraiths, the drowned of the old canal-farms, drift the sunken grid. The grey
    shore lies back northwest; the flats run on south toward the Ashline scar.
  exits:
    northwest: the_grey_shore
    south: the_ashline

# --- The Ashline: the frontier scar where the world stops being finished ---
the_ashline:
  name: The Ashline
  desc: |-
    The edge of the made world: a scar running the whole southern horizon where the Unforging simply
    stopped, and the land ends not in cliff or sea but in un-ness, a shimmer where the ground gives out
    into raw grey possibility that was never cooled into anything. To stand here is to see the world's
    hem. A line-warden of the Ashborn keeps the last safe ground. The dunes lie back north; the drowned
    canals run east; and a scoured track edges west along the scar toward the half-Forged ruins.
  exits:
    north: the_grey_dunes
    east: the_drowned_canals
    west: the_scoured_reach

# --- The Scoured Reach: a half-Forged ruin-delve where walls end in mid-air (noun-keyed vault) ---
the_scoured_reach:
  name: The Scoured Reach
  desc: |-
    Along the Ashline the ground is scoured to the bones of a Forge-hold the Unforging half-took: walls
    that end in mid-air, stairs to nothing, doorways opening on the raw grey un-ness, a building caught
    between made and unmade. Cinder-husks, the hold's own people left half-Forged, keep the standing
    rooms. The Ashline lies back east; the glassways run north to the market; and the hold's one intact
    VAULT stands deeper in, west.
  exits:
    east: the_ashline
    north: the_glassways
    west: the_unfinished_vault
    vault: the_unfinished_vault

the_unfinished_vault:
  name: The Unfinished Vault
  desc: |-
    The one room the Unforging did not reach: a sealed Forge-vault at the heart of the scoured hold,
    whole where all around it is half-unmade, holding whatever the hold's last maker died sealing
    against the grey. A cinder-colossus, welded together by the waste from the hold's own scattered
    Forgework, keeps the vault door, grown around the scar like a scab of iron. Whatever is sealed here
    is the richest unmade thing on the surface. The scoured rooms lie back east.
  exits:
    east: the_scoured_reach
