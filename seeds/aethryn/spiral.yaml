# SEED: aethryn -- spiral.yaml (procedural extension of the Forgeward Road out across the wilds)
# The world is one big FLAT land: the Forgeward Road runs OUTWARD (east) toward the Forge, never up.
# Marches 1-3 are hand-authored; this config drives a validated GENERATOR (parts/world/spiral.py)
# that extends the road march by march out to the level cap -- the 1-300 ceiling
# (parts.shelf.reward_curve.LEVEL_MAX) -- so the far end is real, not hand-typed. The whole surface
# world bands levels 1-72 across the six Reaches; the Road carries the journey from the Wardenmarch
# the rest of the way to the Forge at the world's heart. Internal labels keep the frozen `coil_`
# prefixes; the generated marches are seed-SHAPED data run through the same loader gates.

attach: coil_third_landing   # the hand-authored waystation the generated marches run east from
first_coil: 4                # marches 1-3 are hand-authored; generation continues from here
base_level: 43               # the 4th march's warden (its husk lands at 39, right above Stormlord 38)
levels_per_coil: 9           # each march further out raises the road-warden this many levels
top_level: 300               # the road's far end: the Sovereign at the world's ceiling, the Forge itself
summit_drop: sovereigns_regalia  # the legendary capstone: the final boss's reward, a cut above all gear
