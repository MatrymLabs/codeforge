# SEED: aethryn -- npcs.yaml
# hp > 0 makes an NPC attackable; xp is awarded on defeat; atk > 0 makes it strike back.
# Labels generate names ('reach_wolf' -> "the reach wolf") and keywords.

wren:
  name: Wren the Smith
  location: cinderhearth_square
  keywords: [wren, smith, shopkeeper, merchant]
  dialogue:
    - '"The old forge relit the day you washed ashore. Coincidence? In the Kindlands, nothing is."'
    - '"Blades, cloaks, a good wrench -- everything a new Forger needs. Ask and I will make it."'
    - '"That bridge north has been broken for years. Gather ember, and you could mend it yourself."'
  shop:
    # The coast's first till: a fresh Forger can heal up and arm up here before the wolves and the
    # cold cellar, so Act 1 has a real loop (fell a wolf -> coins -> a draught or a blade -> survive).
    sells:
      healing_draught: 12
      mana_draught: 12
      cinder_hammer: 40  # a starter blade (ATK 5) for coin, if you'd rather buy than delve for one
    # Wren takes coast salvage off your hands, so early ember and a spare blade are worth something.
    buys:
      ember_shard: 4
      cinder_hammer: 15

sela:
  name: Sela the Loremaster
  location: cinderhearth_square
  keywords: [sela, loremaster, scholar, elder]
  dialogue:
    - '"Everything you see was Forged from ember. What was made can be remade -- that is the first law."'
    - '"Long ago the greatest work of all, the First Seed, was sundered. We call it the Unforging."'
    - '"You can hold ember and give it lasting shape. That makes you a Forger. It also makes you dangerous."'
  # ask sela about <topic> -- a real conversation, not a cycling line.
  topics:
    unforging:
      - '"The Unforging was the day a making came apart. It sundered the First Seed and left the world half-real."'
      - '"Its scars are everywhere: the drowned cellar, the cold on the coast, the wights that never finished dying."'
    forger:
      - '"A Forger holds ember and gives it lasting shape. Every calling on the Orders'' Row is one road into that gift."'
    spiral:
      - '"The Forgeward Road runs on past Emberreach, march upon march, toward the Forge at the world''s far heart."'
      - '"They say the one who reaches its end looks upon the Forge itself. None living has."'
    cinderdeep:
      - '"Down, where the Unforging cut deepest, the making-works drowned. The Cinderdeep is the coast''s other road, and colder."'

training_dummy:
  location: cinderhearth_square
  keywords: [dummy, training, straw]
  dialogue:
    - '"..." The dummy says nothing. Struck down, it quietly reassembles itself. Things here are made.'
  hp: 20
  xp: 30

reach_wolf:
  name: a reach wolf
  location: reachwood_edge
  keywords: [wolf, reach, beast]
  dialogue:
    - The wolf bares its teeth, eyes bright with wild ember.
  hp: 15
  atk: 3  # a real fight; it strikes back (the training-ground failsafe still catches a fall)
  level: 3  # a modest step above a fresh Forger: full reward now, worth nothing once you outclass it
  tier: normal
  drops: [emberhide_hood]  # coast hide for the head slot: the Emberhide set starts here

# --- The Reachwood: a lateral forest region east of the coast (levels 5-10), an alternative to
# --- diving the cold cellar. A boar, a lore-keeping warden, and a mini-boss in the warren north. ---

thornback_boar:
  name: a thornback boar
  location: reachwood_hollow
  keywords: [boar, thornback, beast]
  dialogue:
    - The boar lowers its ember-thorned back and charges.
  hp: 26
  atk: 5
  level: 5
  tier: normal  # the Reachwood's first threat, a step past the coast wolves
  drops: [emberhide_jerkin]  # boar-hide for the body slot (the Emberhide set)

the_greenwarden:
  name: the Greenwarden
  location: wardens_glade
  keywords: [greenwarden, warden, forest, hermit]
  dialogue:
    - '"The wood drinks the wild ember and grows strange. I keep it from growing hungry."'
    - '"Few come this deep into the Reachwood. Fewer come back out of the warren, north."'
  topics:
    reachwood:
      - '"The Reachwood drank the Unforging''s spillage and never stopped growing. Green here, but wrong-green -- ember where the sap should be."'
    warren:
      - '"North of the hollow the wood turns angry: the Bramblewarren, and the Wight that roots it. Old wood, grown almost to a mind. Go armed, or do not go."'
    ember:
      - '"Wild ember is the world remembering itself in pieces. The wood remembers too much of it, and forgets it was ever only wood."'

bramble_wight:
  name: the Bramble-Wight
  location: the_bramblewarren
  keywords: [wight, bramble, wood, boss]
  dialogue:
    - '"THE WOOD... REMEMBERS..." The Bramble-Wight rises on roots of ember-thorn, reaching for you.'
  hp: 64
  atk: 9
  aggressive: true
  attack_element: ERT  # a thing of old wood and stone-root: its blows are earthen (bring wind)
  level: 10
  tier: elite  # a Reachwood mini-boss: a real off-spine challenge (x3 reward), not a lethal gate
  drops: [warden_charm]
  loot: {ember_shard: 2, nothing: 2}

road_warden:
  name: the Road-Warden
  location: the_far_reach
  keywords: [warden, road, guard, marshal]
  dialogue:
    - '"So the coast is relit. Word travels fast on the Ember-road. Emberreach lies north, Forger."'
    - '"The road runs hard from here, and the strayfire dens run thick. Go proven, or go home."'
    - '"At the capital you will choose your Order and your road. The Warden Gate tests the rest."'

cinder_wight:
  name: the Cinder-Wight
  location: cellar_hearth
  keywords: [wight, cinder, smith, boss]
  dialogue:
    - '"COLD... SO COLD..." The old smith lifts a hammer of grey cinder. It never finished dying.'
  hp: 50
  atk: 7  # the tutorial dungeon boss; learn its pattern, or reforge it rather than break it
  attack_element: FIR  # a hammer of grey cinder: its blows burn (an emberwright shrugs off the flame)
  resistances: {FIR: Immune, ICE: Weak}  # a creature of cinder: fire feeds it, frost shatters it
  level: 8  # a real gulf above the wolves: a boss-tier reward for closing it
  tier: boss  # x10 the level's base reward -- the climax of the Kindlands arc pays for the climb
  aggressive: true  # it never finished dying: strikes on the world beat (leash releases if you stop)
  lethal: true  # a real boss: fall to it and you wake in town while it recovers, no failsafe revive
  drops: [cinder_hammer]  # felled, the old smith yields its grey-cinder hammer (object instancing)
  loot: {ember_shard: 2, nothing: 3}  # and, by chance, a shard of the wild ember it hoarded

# --- The Ember-road foes (level-banded: level+tier scale the reward by the challenge gap). ---
# hp/atk are tuned for pacing; level/tier feed parts.shelf.reward_curve. A coast-fresh Forger
# (level ~5-6) fights UP here, so a kill pays well -- but the road can put you down.

cinder_stray:
  name: a cinder stray
  location: emberroad_climb
  keywords: [stray, cinder, beast, feral]
  dialogue:
    - The cinder stray circles, wild ember guttering along its spine.
  hp: 40
  atk: 6
  aggressive: true  # feral: it opens the fight on the world beat (leash releases if you disengage)
  level: 10
  tier: normal
  drops: [ember_shard]  # feral ember clings to it: a shard for the taking

road_reaver:
  name: a road reaver
  location: strayfire_hollow
  keywords: [reaver, road, brigand, raider]
  dialogue:
    - '"Toll''s gone up, coast-rat. Steel or ember -- your pick which you leave."'
  hp: 70
  atk: 11
  aggressive: true
  level: 13
  tier: elite  # a real threat: elite pays x3 the level''s base -- the road''s best return
  drops: [reaver_blade]
  loot: {ember_shard: 2, nothing: 2}

# --- Emberreach: the safe capital hub (world bible s.25). Peaceful service NPCs. ---

emberreach_warden:
  name: the Gate-Warden of Emberreach
  location: emberreach_gates
  keywords: [warden, gate, guard, concord]
  dialogue:
    - '"In from the coast, and still breathing. Welcome to Emberreach, City of the Relit Forge."'
    - '"The Grand Forge burns north. The Orders keep their Row to the west, the Market to the east."'

grandforge_loremaster:
  name: Master Ilya, the Loremaster
  location: the_grand_forge
  keywords: [ilya, loremaster, master, scholar]
  dialogue:
    - '"Sela sent word of you from the coast. The First Flame remembers every Forger who relights it."'
    - '"The Great Archive holds what the world was. The Grand Forge makes what it will be. Study both."'
    - '"The Unforging sundered the First Seed. Every ember you carry is a piece of the answer."'
  topics:
    unforging:
      - '"The Unforging was the day the First Seed broke. The world did not end -- it came apart into embers, and we have spent every age since regathering them."'
      - '"Some say a maker reached too far. Others, that the Seed chose to scatter rather than be owned. The Archive keeps both accounts and judges neither."'
    seed:
      - '"The First Seed was the pattern the whole world grew from -- one design, whole and singing. Break it, and you get a thousand embers, each holding a fragment of the tune."'
      - '"Relight enough embers in the right order, the old texts say, and the Seed remembers itself. That is the road, Forger, whether you name it so or not."'
    archive:
      - '"The Great Archive is memory made stone: every Forger, every relighting, every road walked toward the Forge. You are in it now, whether you asked to be or not."'
    spiral:
      - '"The Forgeward Road is the Seed''s spine, run out across the world. Walk it east and the world grows colder and older, nearer the first pattern. The Sovereign waits at the Forge''s Edge."'

order_recruiter:
  name: a recruiter of the Orders
  location: orders_row
  keywords: [recruiter, orders, guild, order]
  dialogue:
    - '"Four Orders keep the Row: the Making, the Gathering, the Warcraft, the Knowing. Choose well."'
    - '"A Forger without an Order is a spark without a hearth. Train a craft; earn your place."'
  topics:
    orders:
      - '"Four Orders, four crafts. The Making shapes gear and stone. The Gathering reads the wilds. The Warcraft holds the line. The Knowing keeps the truth."'
      - '"Swear to one and you learn its edge -- and it learns to fight beside you. JOIN an order when you know your own hand."'
    making:
      - '"The Order of Making are smiths and shapers -- they harden what they wear, so a blow turns aside. If you would rather build a thing than break it, this is your hearth."'
    warcraft:
      - '"The Warcraft are the ones who stand when the line bends. Sworn to them, your blows land harder. The coast needs such spines; the Road more so."'
    knowing:
      - '"The Knowing guard the truth of things -- wards and lore, the mind over the blade. They read a foe before they strike it, and take less from what they understand."'
    gathering:
      - '"The Gathering walk the wilds and bring back what they find -- a little harder to fell, a little harder felled. Balance, they call it. Survival, I call it."'

market_trader:
  name: a Market-Quarter trader
  location: market_quarter
  keywords: [trader, merchant, market, shopkeeper]
  dialogue:
    - '"Cooling-Sea goods, coast-craft, frontier salvage -- if the Anvil makes it, it crosses my stall."'
    - '"Ember-shards fetch a fair price out here. The road pays those who survive it, eh?"'
  shop:
    # Coin sinks: the early gear ladder, so a coast Forger can outfit before the road/ascent.
    sells:
      healing_draught: 12
      mana_draught: 12
      greater_healing_draught: 36   # the capital stocks the mid-tier heal for the road ahead
      cinder_hammer: 40      # a starter weapon (ATK 5, DEF 1)
      reaver_blade: 90       # the better blade (ATK 9, ACC 5)
      cindershell_plate: 140  # body armor (DEF 8, EVA 2)
      emberhide_hood: 35     # the Emberhide set, buyable so early armor is not drop-only (DEF 2, EVA 3)
      emberhide_jerkin: 55   # (DEF 4, EVA 2)
      emberhide_wraps: 45    # (DEF 3, ATK 2)
    # Coin taps: the trader buys your salvage and spare gear, so loot has a use.
    buys:
      ember_shard: 4
      hollow_ingot: 25
      reaver_blade: 30
      warden_sigil: 60

warden_keeper:
  name: the Keeper of the Warden Gate
  location: warden_gate
  keywords: [keeper, warden, gate, wardenmarch]
  dialogue:
    - '"Beyond this arch: the Wardenmarch, the Coilfoot Range, and the first marches of the Forgeward Road."'
    - '"The Sentinel is the test, Forger. Put the grey guardian down and the road ahead is yours to walk."'
    - '"Many come in from the coast sure of their spark. The Sentinel has cooled most of them. Prove it."'
  topics:
    sentinel:
      - '"The Warden Sentinel is grey iron and old duty. It does not hate you; it simply will not let a soft spark past. Harden yourself, then come to it."'
    spiral:
      - '"Past the Sentinel: the Coilfoot, then the marches, each colder and harder than the last. A road-warden holds every waystation. Few living have seen the Forge''s Edge."'
    wardenmarch:
      - '"The Wardenmarch is the threshold between the settled coast and the wild road. Cross it and the world stops being kind. Carry draughts."'

# --- The Warden's Test and the First Coil (level-banded bosses: the ascent's real danger). ---
# These run well above Emberreach. Bosses are lethal (fall and you wake in town, no failsafe) and
# boss-tier (x10 reward): felling one pays for the whole climb to it.

warden_sentinel:
  name: the Warden Sentinel
  location: warden_gate
  keywords: [sentinel, warden, guardian, grey]
  dialogue:
    - The Sentinel's grey Forgework grinds awake, and cold light kindles in its eye-slit.
  hp: 90
  atk: 14
  aggressive: true  # it bars the arch: it strikes the moment you present yourself for the test
  lethal: true  # the Warden's test is real: fall and you wake in Emberreach while it reforms
  level: 17
  tier: boss  # the gate-boss of the Warden's test -- x10 the level's base reward
  drops: [warden_sigil]  # felled, it yields the Concord sigil that marks a proven Forger

spiral_wisp:
  name: an ember-wisp
  location: coilfoot_ascent
  keywords: [wisp, ember, spiral, wraithfire]
  dialogue:
    - The ember-wisp gutters closer, half-alive and hungry for a maker's warmth.
  hp: 45
  atk: 9
  aggressive: true
  level: 18
  tier: normal
  drops: [ember_shard]

gate_forgewraith:
  name: the Wraith of the First Waystation
  location: coil_first_landing
  keywords: [forgewraith, wraith, coil, gate]
  dialogue:
    - '"YOU PRESS ON... INTO WHAT WAS UNMADE..." The Forgewraith rises in a column of grey fire.'
  hp: 120
  atk: 18
  aggressive: true
  lethal: true
  level: 22
  tier: boss  # the first Gate-boss of the Great Spiral: the ascent's first true wall
  drops: [coil_keystone, wraithlamp_circlet]  # a keystone charm and the head-slot circlet
  loot: {ember_shard: 3, nothing: 2}

# --- The Second Coil foes (the ascent climbs: levels ~25-28, one Gate-boss). ---

coil_revenant:
  name: a road revenant
  location: coil_second_ascent
  keywords: [revenant, coil, climber, grey]
  dialogue:
    - The revenant turns its unfinished face toward you, mistaking your warmth for the way home.
  hp: 60
  atk: 13
  aggressive: true
  level: 25
  tier: normal
  drops: [ember_shard]

ashen_sentinel:
  name: the Ashen Sentinel
  location: coil_bridgespan
  keywords: [sentinel, ashen, span, guardian]
  dialogue:
    - The Ashen Sentinel plants itself across the span, ash sloughing from grey Forgework.
  hp: 95
  atk: 16
  aggressive: true
  level: 26
  tier: elite  # it holds the only crossing: an elite toll for the span (x3 reward)
  drops: [ember_shard]
  loot: {ember_shard: 2, nothing: 2}

gate_ashlord:
  name: the Ashlord of the Second Waystation
  location: coil_second_landing
  keywords: [ashlord, ash, lord, coil]
  dialogue:
    - '"I WAS A MAKER... NOW I AM THE ASH OF ONE..." The Ashlord unfolds in blue-cold fire.'
  hp: 160
  atk: 22
  aggressive: true
  lethal: true
  level: 28
  tier: boss  # the Second Coil's Gate-boss: the ascent's next true wall (x10 reward)
  drops: [coil_keystone, ashlord_gauntlet]  # a keystone charm and the arm-slot gauntlet
  loot: {ember_shard: 3, nothing: 2}

# --- The Cinderdeep foes (the downward road: a mid-band depths line, levels ~10-15). ---
# A parallel to the early Ember-road -- the coast's OTHER way out. Its floor is the Hollow Smith.

deep_crawler:
  name: a deep-crawler
  location: cinderdeep_descent
  keywords: [crawler, deep, thing, dark]
  dialogue:
    - Something many-legged unfolds from the cold stone and tastes the air for warmth.
  hp: 42
  atk: 7
  aggressive: true
  level: 10
  tier: normal
  drops: [ember_shard]

drowned_maker:
  name: a drowned maker
  location: sunken_forgeworks
  keywords: [maker, drowned, smith, worker]
  dialogue:
    - The drowned maker lifts a rusted hammer, still trying to finish a work the sea took.
  hp: 55
  atk: 9
  aggressive: true
  level: 12
  tier: normal
  drops: [ember_shard, hollowiron_gauntlets]  # Hollowiron set (arm) - the Cinderdeep's armor

cold_vein_lurker:
  name: the Cold-Vein Lurker
  location: the_cold_vein
  keywords: [lurker, vein, cold, feeder]
  dialogue:
    - The lurker peels away from the dead-ember seam, starved for a living warmth.
  hp: 80
  atk: 13
  aggressive: true
  level: 14
  tier: elite  # it hoards the vein's last warmth: an elite kill (x3) for the delving
  drops: [ember_shard, hollowiron_mask]  # Hollowiron set (head)
  loot: {ember_shard: 2, nothing: 2}

hollow_smith:
  name: the Hollow Smith
  location: cinderdeep_maw
  keywords: [smith, hollow, maker, boss]
  dialogue:
    - '"EMPTY... THE WORK IS EMPTY..." The Hollow Smith raises an anvil-hammer of black iron.'
  hp: 110
  atk: 17
  aggressive: true
  lethal: true
  level: 15
  tier: boss  # the Cinderdeep's mid-boss: felling it thins the cold and opens the way deeper
  drops: [hollow_ingot, cindershell_plate, hollowiron_cleaver]  # + Cinderdeep signature weapon
  loot: {ember_shard: 3, nothing: 2}

# --- The deep Cinderdeep (below the maw): the coast's downward road bottoms out at the Cinderheart,
# --- the Unforging's oldest wound. Level-banded 18-24, a frost-typed pair (bring fire to the cold). ---

sunken_revenant:
  name: a sunken revenant of the Drowned Way
  drops: [brinescale_coat]  # Brinescale set (body)
  location: the_drowned_way
  keywords: [revenant, sunken, maker, drowned]
  dialogue:
    - The revenant turns in the black current, a maker's tool fused to its hand, and reaches for you.
  hp: 72
  atk: 15
  aggressive: true
  attack_element: ICE  # the deep's cold: its touch bites of frost
  level: 18
  tier: elite  # a real threat between the Hollow Smith and the Forgemaster (x3 reward)
  loot: {ember_shard: 2, hollow_ingot: 1, nothing: 2}

drowned_forgemaster:
  name: the Drowned Forgemaster
  location: the_cinderheart
  keywords: [forgemaster, drowned, maker, boss]
  dialogue:
    - '"IT WILL NOT SET... IT WILL NEVER SET..." The Drowned Forgemaster lifts a hammer of black ice.'
  hp: 165
  atk: 24
  aggressive: true
  lethal: true
  attack_element: ICE  # a maker of black ice: bring fire to the frozen heart of the deep
  resistances: {ICE: Resist, FIR: Weak}
  level: 24
  tier: boss  # the Cinderdeep's true bottom-boss: the deep road's real climax (x10 reward)
  drops: [drowned_seal]
  loot: {hollow_ingot: 2, ember_shard: 3, nothing: 2}

# --- The Third Coil foes (the ascent climbs on: levels ~31-38, one Gate-boss). ---

stormbound_husk:
  name: a stormbound husk
  location: coil_third_ascent
  keywords: [husk, stormbound, climber, hollow]
  dialogue:
    - The husk turns, forge-lightning arcing in its hollow chest, and reaches for your warmth.
  hp: 75
  atk: 20
  aggressive: true
  level: 31
  tier: normal
  drops: [ember_shard]

coil_harrier:
  name: the Road Harrier
  location: coil_stormreach
  keywords: [harrier, coil, storm, rider]
  dialogue:
    - The Harrier banks out of the gale, trailing forge-fire, and dives.
  hp: 120
  atk: 26
  aggressive: true
  level: 34
  tier: elite  # it owns the wind-scoured reach: an elite toll (x3) for crossing
  drops: [ember_shard]
  loot: {ember_shard: 3, nothing: 2}

gate_stormlord:
  name: the Stormlord of the Third Waystation
  location: coil_third_landing
  keywords: [stormlord, storm, lord, coil]
  dialogue:
    - '"THE ROAD DOES NOT SUFFER THE UNMADE TO PASS..." The Stormlord rises in a pillar of forge-lightning.'
  hp: 220
  atk: 32
  aggressive: true
  lethal: true
  level: 38
  tier: boss  # the Third Coil's Gate-boss: the highest wall yet (x10 reward)
  drops: [coil_keystone, stormlord_edge]
  loot: {ember_shard: 4, nothing: 2}

# --- The Ashwastes: a mid-game desert region east of the capital (levels 15-25), where a land was
# --- half-Unforged. The Ashborn survivors, a salvage-wraith in the ruins, an Ash-Colossus at the crater. ---

ash_jackal:
  name: an ash-jackal
  location: ashwastes_road
  keywords: [jackal, ash, beast]
  dialogue:
    - The jackal slinks from the grey dunes, ribs and ember showing through its ashen hide.
  hp: 44
  atk: 8
  level: 15
  tier: normal  # the wastes' road-threat, a step past the coast and reachwood

ashborn_scout:
  name: an Ashborn scout
  location: the_cinder_dunes
  keywords: [scout, ashborn, survivor]
  dialogue:
    - '"You are far from the relit forges, Forger. The Ashwastes keep nothing warm for long."'
    - '"Rare ember hides in the grey, but so do the jackals. Read the sand, or be read by it."'
  topics:
    ashwastes:
      - '"This was a land once, before the Unforging cut it half-away. Now it is a desert of cinder -- salvage, danger, and the rare ember the scouring left behind."'
    ashborn:
      - '"We are the Ashborn: what was left when this land was unmade. We do not mourn it. We salvage it, and we endure. The camp keeps its fire north."'
    colossus:
      - '"At the crater east, the Ash-Colossus keeps the deepest wound -- a giant the wastes grew around a scar. Still it, and the ash might cool at last. Or it kills you. Both are common."'

ashborn_trader:
  name: an Ashborn salvage-trader
  location: the_ashborn_camp
  keywords: [trader, salvage, ashborn, merchant]
  dialogue:
    - '"Salvage in, supplies out. The wastes give hard, but they give. What do you carry, Forger?"'
  shop:
    # A third till, mid-game: the wastes trade heals and salvaged gear for coins and materials.
    sells:
      healing_draught: 15
      mana_draught: 15
      reaver_blade: 95
      cindershell_plate: 150
    buys:
      ember_shard: 6
      hollow_ingot: 30
      warden_charm: 40
  topics:
    salvage:
      - '"Everything in the Ashwastes was something else first. A blade was a hinge; a charm was a lock. We sell the world back to itself, piece by piece."'

ash_colossus:
  name: the Ash-Colossus
  location: the_glass_crater
  keywords: [colossus, ash, giant, boss]
  dialogue:
    - '"..." The Ash-Colossus turns its glass-and-cinder head toward you, and the crater groans as it rises.'
  hp: 150
  atk: 22
  aggressive: true
  lethal: true
  attack_element: ERT  # a giant of welded stone and cinder: its blows are earthen (bring wind)
  resistances: {ERT: Resist, WND: Weak}
  level: 25
  tier: boss  # the Ashwastes' climax: a lethal boss-tier reward (x10) at the crater's bottom
  drops: [cinderglass_edge]
  loot: {ember_shard: 4, hollow_ingot: 1, nothing: 2}

# --- The Cooling-Sea: a coastal port region west of the waking shore (levels 6-14). A dialogue-rich
# --- fishing town (Quench Harbor) on the first-quenched water, and the Drowned Pilot at the reef. ---

tide_crawler:
  name: a tide-crawler
  location: the_saltstrand
  keywords: [crawler, tide, crab, beast]
  dialogue:
    - The crawler rears from the wrack, brine-ember dripping from its shell, and clacks its claws.
  hp: 30
  atk: 6
  attack_element: WTR  # a thing of the cold sea: its touch is brine and flood
  level: 6
  tier: normal  # the strand's threat, a step past the coast
  drops: [emberhide_wraps]  # shell-cured hide for the arm slot (the Emberhide set)

harbormaster:
  name: the Harbormaster of Quench
  location: quench_harbor
  keywords: [harbormaster, master, harbor, official]
  dialogue:
    - '"Quench Harbor, Forger. We fish the Cooling-Sea and mend what she breaks. Mind the reef south."'
    - '"The sea rose the day the world was Unforged and never fully went back down. We live at her edge."'
  topics:
    cooling_sea:
      - '"The Cooling-Sea is the first-quenched water -- what cooled the world after the Forge cracked. Older than the coast, colder than the deep. She gives fish and takes ships in the same tide."'
    harbor:
      - '"Quench has stood since the Relighting reached the water. Fisherfolk, menders, a trader or two. Not much, but it is ours, and it is warm."'
    wreck:
      - '"South, past the last jetty, the drowned reef -- ships the sea took when she rose. The Drowned Pilot keeps the largest of them. Fell it, and the fishing lanes open again. None of mine will try."'

quench_fisher:
  name: a Quench fisher
  location: quench_harbor
  keywords: [fisher, fisherman, netter]
  dialogue:
    - '"Good haul today, brine-ember and a silver-fin. Bad haul yesterday. That is the sea for you."'
    - '"You have the look of one who washed up. Half of Quench did. The Cooling-Sea gives, and she takes."'
  topics:
    sea:
      - '"Fish the shallows, not the reef. The reef is where the drowned things are. A fisher learns that young, or a fisher does not get old."'
    catch:
      - '"Brine-ember lights a cold hearth; silver-fin fills a cold belly. The Cooling-Sea is hard, but she is honest -- more than the Road, they say."'

dock_trader:
  name: a Quench dock-trader
  location: quench_harbor
  keywords: [trader, dock, merchant, quench]
  dialogue:
    - '"Coast-craft and cooling-sea salvage, fair prices. A harbor runs on trade, not on hymns."'
  shop:
    # A fourth till, early-mid: coastal goods traded on the water.
    sells:
      healing_draught: 13
      mana_draught: 13
      cinder_hammer: 42
    buys:
      ember_shard: 5
      cinder_hammer: 16

drowned_pilot:
  name: the Drowned Pilot
  location: the_wreck_reef
  keywords: [pilot, drowned, wreck, boss]
  dialogue:
    - '"COME... ABOARD..." The Drowned Pilot turns at the wheel, brine and dead ember streaming from it.'
  hp: 90
  atk: 12
  aggressive: true
  lethal: true
  attack_element: WTR  # a drowned thing of the cold sea: bring lightning to the water
  resistances: {WTR: Resist, LGT: Weak}
  level: 14
  tier: boss  # the Cooling-Sea's climax: a lethal boss-tier reward (x10) at the reef
  drops: [pilots_compass]
  loot: {ember_shard: 3, nothing: 2}

# --- The Quenchmere (across the sea, Continental Atlas §V): the free-port Tidewharf and the drowned
# --- Sunhold. Levels 18-30. A brine-wight in the lanes, townsfolk in the port, a boss in the deep. ---

brine_wight:
  name: a brine-wight
  drops: [brinescale_hood]  # Brinescale set (head) - the Quenchmere's armor
  location: the_quench_lanes
  keywords: [wight, brine, drowned]
  dialogue:
    - A shape of brine and dead ember rises from between the drowned masts and reaches for the ferry.
  hp: 78
  atk: 14
  aggressive: true
  attack_element: WTR  # a drowned thing of the cold sea: bring lightning to the water
  resistances: {WTR: Resist, LGT: Weak}
  level: 18
  tier: elite  # the Wreckways' threat between the coast and the free-port (x3 reward)
  loot: {ember_shard: 2, nothing: 2}

accord_speaker:
  name: the Accord-Speaker of Tidewharf
  location: the_accord_hall
  keywords: [speaker, accord, official, port]
  dialogue:
    - '"Welcome to the Quenchmere, Forger. Ten thousand islands, a hundred republics, and one rule: the lanes stay open."'
    - '"We do not have a crown. We have an Accord, and it holds because everyone needs the trade more than they need to win."'
  topics:
    quenchmere:
      - '"The Quenchmere is the Reach the Cooling-Sea rose over -- a whole land drowned when the seas came up after the Unforging. What is left is islands, wrecks, and the drowned cities below the keels."'
    accord:
      - '"The Port-Accord is not a government so much as a long argument that has agreed to keep arguing. The harbor-republics, the Merewrights, the Salvage Guilds -- all here, all rivals, all needing the lanes open."'
    sunhold:
      - '"Below the docks lies Sunhold, our capital before the sea took it. A Forged Warden still keeps it, holding halls no living thing has walked in an age. The Salvage Guilds would open it. I would not be the one to wake its keeper."'

merewright_captain:
  name: a Merewright captain
  location: tidewharf_plaza
  keywords: [captain, merewright, sailor, merchant]
  dialogue:
    - '"Cargo for any Reach, crew for any lane. The Merewrights sail where the Ember-roads cannot reach -- which is to say, everywhere that matters."'
  shop:
    # The Quenchmere till: mid-game gear and heals, and it buys salvage from the drowned cities.
    sells:
      healing_draught: 16
      mana_draught: 16
      greater_healing_draught: 38   # mid-tier heal, for a Forger past the coast draughts
      greater_mana_draught: 34
      brinescale_hood: 110     # the Quenchmere's own Brinescale set (buyable, not only dropped)
      brinescale_coat: 165
      tideglass_harpoon: 150   # the Reach's signature weapon
    buys:
      ember_shard: 7
      hollow_ingot: 35
      pilots_compass: 45
      sunhold_sigil: 90        # buys back the Reach-relic accessory
  topics:
    lanes:
      - '"The Wreckways are the only roads across the Quenchmere -- reef-lanes marked by the masts of the drowned. Follow the masts, mind the brine-wights, and you cross. Lose the masts, and you join them."'

salvage_agent:
  name: a Salvage-Guild agent
  location: tidewharf_plaza
  keywords: [agent, salvage, guild, diver]
  dialogue:
    - '"Everything the sea took is still down there, Forger, lit and cold and waiting. The Guild pays well for a diver who comes back up."'
  topics:
    salvage:
      - '"The drowned cities of the Quenchmere hold the largest unbroken Forgework outside the frozen north. Sunhold below us is the richest of all -- if you can get past what keeps it. The Guild would fund a Forger bold enough to try."'

sunhold_warden:
  name: the Sunhold Warden
  location: the_drowned_sunhold
  keywords: [warden, sunhold, guardian, boss]
  dialogue:
    - '"THE CAPITAL... STANDS..." The Sunhold Warden turns in the green dark, drowned ember burning in its Forged frame, and moves to hold the hall.'
  hp: 200
  atk: 26
  aggressive: true
  lethal: true
  attack_element: WTR  # a drowned Forged guardian: resists the flood, fears the storm (bring lightning)
  resistances: {WTR: Resist, LGT: Weak}
  level: 30
  tier: boss  # the Quenchmere's climax: a lethal boss-tier reward (x10) in the drowned capital
  drops: [sunhold_sigil, brinescale_bracers, tideglass_harpoon, brine_essence]  # + Reach essence
  loot: {hollow_ingot: 2, ember_shard: 4, nothing: 2}

# --- The Verdance (across the Quenchmere, Continental Atlas §III): the living wild. A canopy predator,
# --- the mire's returned dead, the Deeprooted of Highbough, and the Boughwarden at the Heart-Grove.
# --- Levels 22-32. A believable food chain: stalker (apex) / mire-returned (scavenger) / grove (all). ---

canopy_stalker:
  name: a canopy-stalker
  drops: [verdant_hood]  # Verdant set (head) - the Verdance's armor
  location: verdance_landing
  keywords: [stalker, canopy, cat, beast]
  dialogue:
    - The stalker drops from the boughs without a sound, ember-eyes bright, and is on you.
  hp: 90
  atk: 16
  aggressive: true
  level: 22
  tier: elite  # the Verdance's apex canopy-hunter (x3 reward); high evasion, forced to ground to fell
  loot: {ember_shard: 2, nothing: 2}

grove_elder:
  name: a Deeprooted grove-elder
  location: highbough
  keywords: [elder, grove, deeprooted, druid]
  dialogue:
    - '"You walk in a living thing, Forger. The Verdance is not a place with creatures in it -- it is one creature, and we live inside its patience."'
    - '"We do not command the wild ember. We ask it. A Forger who forgets that is a Forger the Verdance forgets to spare."'
  topics:
    verdance:
      - '"The Verdance is where wild ember was never gathered -- it simply grew, and grew, until the continent woke. This is the First Seed''s dream made real and dangerous: a world that Forges itself, with no maker''s hand to stop it."'
    deeprooted:
      - '"We are the Deeprooted. No crown, only grove-councils and reader-elders who broker between the people and the wild. We treat Forging as a conversation, because here the world can answer back."'
    heartgrove:
      - '"West through the mire beats the Heart-Grove -- the living center, one creature the size of a valley. The Boughwarden keeps it. We half-worship it and wholly fear it. Go, if the wild will have you, but go humble."'

canopy_trader:
  name: a Deeprooted canopy-trader
  location: highbough
  keywords: [trader, canopy, deeprooted, merchant]
  dialogue:
    - '"Grown goods, gathered ember, and cures the mire teaches. The wild provides, if you trade fair with it."'
  shop:
    sells:
      healing_draught: 17
      mana_draught: 17
      greater_healing_draught: 40   # mid-tier heal for the jungle depths
      greater_mana_draught: 36
      verdant_hood: 130        # the Verdance's own Verdant bark-set
      verdant_mantle: 185
      thornwood_glaive: 165    # the Reach's signature weapon
    buys:
      ember_shard: 8
      hollow_ingot: 38
      boughward_totem: 95      # buys back the Reach-relic accessory
  topics:
    mire:
      - '"South of the landing the wood turns to breathing swamp, where Cinder seeps up and the dead half-return. The mire teaches hard lessons and rare cures. Carry radiance, or carry your grave."'

mire_returned:
  name: a mire-returned
  drops: [verdant_mantle]  # Verdant set (body)
  location: the_deeproot_mire
  keywords: [returned, mire, dead, wight]
  dialogue:
    - A shape of root and grave-ember rises from the black water, half a maker the swamp gave back.
  hp: 100
  atk: 18
  aggressive: true
  attack_element: PSN  # the swamp's returned dead: their touch is rot (bring radiance, holy fire)
  resistances: {PSN: Resist, HLY: Weak}
  level: 26
  tier: elite  # the mire's scavenger-threat (x3 reward), between the canopy and the Heart-Grove
  loot: {ember_shard: 2, nothing: 2}

boughwarden:
  name: the Boughwarden
  location: the_heart_grove
  keywords: [boughwarden, warden, grove, boss]
  dialogue:
    - '"..." The Heart-Grove turns its whole vast attention on you at once, and the Boughwarden rises from its heart to answer the trespass.'
  hp: 230
  atk: 27
  aggressive: true
  lethal: true
  attack_element: ERT  # the living wild made flesh: root and stone and bloom (bring gale, wind)
  resistances: {ERT: Resist, WND: Weak}
  level: 32
  tier: boss  # the Verdance's climax: the apex of the whole ecosystem (x10 reward), a lethal guardian
  drops: [boughward_totem, verdant_vambraces, thornwood_glaive, grove_essence]  # + Reach essence
  loot: {ember_shard: 5, nothing: 2}

# --- The Rimefall (Continental Atlas §II): the quenched north. A glass-hound pack, the Silent Anvil
# --- keeper, and the flash-frozen Rime-King in the Frozen Court. Levels 40-52. Bring fire to the ice. ---

glass_hound:
  name: a glass-hound
  drops: [rimeplate_helm, rimeplate_gauntlets]  # Rimeplate set (head + arm) - the Rimefall's armor
  location: the_riming_passage
  keywords: [hound, glass, ice, beast]
  dialogue:
    - The hound forms from the frozen wild ember of the floe, silent, drawn to the sound of you.
  hp: 140
  atk: 24
  aggressive: true
  attack_element: ICE  # precipitated from frozen ember: its bite is cold (bring flame)
  resistances: {ICE: Resist, FIR: Weak}
  level: 40
  tier: elite  # the ice's apex pack-hunter (x3 reward)
  loot: {ember_shard: 3, nothing: 2}

stillhearth_keeper:
  name: a keeper of the Silent Anvil
  location: stillhearth
  keywords: [keeper, silent, anvil, monk]
  dialogue:
    - '"Speak low, Forger, and touch nothing. In the Rimefall the past is not ruined -- it is paused, and a careless hand restarts what the ice stopped."'
    - '"We are the Silent Anvil. We hold this whole Reach as a shrine to restraint. The greatest work, we teach, is the work you choose not to make."'
  topics:
    rimefall:
      - '"The Rimefall was flash-quenched in the Unforging -- a continent caught mid-Forge and frozen in an instant. Its cities stand whole under the ice, mid-gesture, better-made than anything alive can make. It is a museum of the golden age, and a grave that has not finished dying."'
    silent_anvil:
      - '"We worship the potential in unshaped ember, and hold that the greatest act is to leave some ember unforged. We are the world''s conscience, and the Rimefall is our sermon: see how the last great making ended, and be humble."'
    frozen_court:
      - '"North stands the Frozen Court -- an Emberwright capital preserved entire, its makers frozen mid-gesture, the Rime-King on his throne. Wake him, and you restart an Unforging mid-freeze. We do not go there. Neither should you."'

rime_king:
  name: the Rime-King
  location: the_frozen_court
  keywords: [king, rime, emberwright, boss]
  dialogue:
    - '"..." The ice over the throne cracks, and the Rime-King wakes mid-reign, a first-age maker the Unforging froze and you have thawed.'
  hp: 300
  atk: 30
  aggressive: true
  lethal: true
  attack_element: ICE  # a maker frozen mid-Forge: his craft is cold (bring fire to thaw the reign)
  resistances: {ICE: Resist, FIR: Weak}
  level: 52
  tier: boss  # the Rimefall's climax: a flash-frozen Emberwright, the golden age turned lethal (x10)
  drops: [stillheart, rimeplate_hauberk, rime_essence]  # Reach-relic + Rimeplate body + essence
  loot: {ember_shard: 6, nothing: 2}

# --- The Kollforge (Continental Atlas §VI): the molten Reach, closest to the Forge. Cinder-drakes and
# --- Forgeborn (Forged, still hot), the Kollkin fire-Forgers, and the Vent-Lord. Levels 50-62.
# --- Bring frost or flood to the fire (FIR foes, weak ICE/WTR). ---

cinder_drake:
  name: a cinder-drake
  drops: [emberforged_gauntlets]  # Emberforged set (arm)
  location: the_molten_passage
  keywords: [drake, cinder, dragon, beast]
  dialogue:
    - The drake wheels off a lava-shelf, wings of Forgelight, and dives on the ferry breathing fire.
  hp: 170
  atk: 28
  aggressive: true
  attack_element: FIR  # a thing of the vents: its breath is flame (bring frost)
  resistances: {FIR: Resist, ICE: Weak}
  level: 50
  tier: elite  # the molten shelf's apex flyer (x3 reward)
  loot: {ember_shard: 3, nothing: 2}

ventforge_master:
  name: a Vent-Forge master
  location: emberkoll
  keywords: [master, ventforge, kollkin, smith]
  dialogue:
    - '"You feel the heat, Forger? That is the Forge itself, close beneath us. Here we work the raw ember, before it cools, before it lies. A cooled land is a dead land."'
    - '"The Wardens call us reckless. Let them. They guard a craft they are afraid to use. We use it, at the source, and we do not apologize."'
  topics:
    kollforge:
      - '"The Kollforge is the surface land closest to the Forge''s heat -- the one place the world is still visibly being made. Every eruption remakes the map; every vent wells raw ember up from the source. We are the boldest and the most dangerous Forgers alive, and we would not trade it."'
    ventforges:
      - '"The Vent-Forges are part guild, part cult -- we compete to work the hottest, rawest ember, closest to the Forge. It kills the careless and crowns the bold. The Free Forges'' most radical wing lives here; the Wardens are barely tolerated."'
    forge:
      - '"North, past the Anvil-Vents, the ground runs on toward the Forge itself -- the source of all ember and shape. The Vent-Lord keeps the last vent before it. Reach it, and you stand where a walking Forger comes nearest to raw creation. Reach past it, and you walk the last road toward the Forge and the answer."'

kollkin_trader:
  name: a Kollkin shelf-trader
  location: emberkoll
  keywords: [trader, kollkin, shelf, merchant]
  dialogue:
    - '"Vent-forged gear and heat-craft, fair for coin or raw ember. The wares are made in living fire -- there is nothing better this side of the Forge."'
  shop:
    sells:
      healing_draught: 18
      mana_draught: 18
      grand_healing_draught: 95     # high-tier heal for the molten depths
      grand_mana_draught: 78
      forgefire_elixir: 150         # restores both pools: the endgame restorative
      emberforged_plate: 320   # the Kollforge's own Emberforged set (body + arm)
      emberforged_gauntlets: 250
      ventforge_maul: 300      # the Reach's signature weapon
    buys:
      ember_shard: 9
      hollow_ingot: 40
      vent_crown: 160          # buys back the Reach-relic head-piece
  topics:
    heat:
      - '"Work close to the Forge and everything is hotter -- the ember, the gear, the tempers. We lose Forgers to the vents every season. We also make the finest work in the world. Choose your risk."'

forgeborn:
  name: a Forgeborn
  drops: [emberforged_plate]  # Emberforged set (body) - the Kollforge's armor
  location: the_anvil_vents
  keywords: [forgeborn, construct, guardian, beast]
  dialogue:
    - The Forgeborn turns from the vent it has guarded for an age, living Forgework that never cooled, and moves to keep its charge.
  hp: 180
  atk: 30
  aggressive: true
  attack_element: FIR  # living Forgework of raw fire (bring frost)
  resistances: {FIR: Resist, ICE: Weak}
  level: 54
  tier: elite  # the vent's tireless guardian (x3 reward), between the drake and the Vent-Lord
  loot: {ember_shard: 3, hollow_ingot: 1, nothing: 2}

vent_lord:
  name: the Vent-Lord
  location: the_vent_deep
  keywords: [lord, vent, forgeborn, boss]
  dialogue:
    - '"..." The Vent-Lord rises from the deepest vent, a Forgeborn grown vast on a millennium of raw fire, the last guardian before the Forge.'
  hp: 340
  atk: 33
  aggressive: true
  lethal: true
  attack_element: FIR  # a giant of living fire: bring the flood (weak to water) or the frost
  resistances: {FIR: Resist, WTR: Weak}
  level: 62
  tier: boss  # the Kollforge's climax: the last guardian before the Forge (x10 reward)
  drops: [vent_crown, ventforge_maul, molten_essence]  # Vent-Crown + weapon + Reach essence
  loot: {ember_shard: 6, hollow_ingot: 2, nothing: 2}

# --- The Sundered Sky (Continental Atlas §VII): the floating Reach, the gateway to the Spiral. Stormkin
# --- of the high air, fall-wights of the tearing, the Skyborn of Highgate, and the Court-Warden of the
# --- Drifting Court. Levels 60-72. Bring radiance to the shadow (DRK foes, weak HLY). ---

stormkin:
  name: a stormkin
  drops: [stormward_helm]  # Stormward set (head) - the Sundered Sky's armor
  location: the_sky_lanes
  keywords: [stormkin, storm, bird, beast]
  dialogue:
    - The stormkin banks out of a thunderhead, riding the wind, and stoops on the sky-ferry.
  hp: 180
  atk: 30
  aggressive: true
  attack_element: WND  # a rider of the high winds (bring stone, earth, to ground it)
  resistances: {WND: Resist, ERT: Weak}
  level: 60
  tier: elite  # the sky's apex flyer (x3 reward)
  loot: {ember_shard: 3, nothing: 2}

sky_warden:
  name: a sky-Warden of Highgate
  location: highgate
  keywords: [warden, sky, highgate, skyborn]
  dialogue:
    - '"You have crossed the whole world to reach me, Forger. Beyond this gate the known world ends and the Forgeward Road runs on toward the Forge. Few pass. Fewer return."'
    - '"We keep the last threshold, and we keep it hardest of all. The Wardens locked the craft to guard the world. Here, at the edge of the last marches, is where that guarding matters most."'
  topics:
    sundered_sky:
      - '"The Sundered Sky is the lands the Unforging tore loose that never fell -- shards of the old world hung in the high air on stubborn Forgework, drifting on the winds. The last Reach before the Forge, and the loneliest. Beyond it, only the Road."'
    highgate:
      - '"Highgate is the sky-Wardens'' hold at the foot of the Coilfoot, the gate to the Forgeward Road. We are the Concord''s most important and most isolated holding -- the door to the endgame, guarded by the few who can bear the sky."'
    spiral:
      - '"On, past my test, the Coilfoot runs into the first marches of the Forgeward Road -- the final frontier, march upon march toward the Forge and the Sovereign at the Forge''s Edge. You have seen the whole world. Now you walk its far heart. Go, if you are ready. Nothing here is."'

anchor_keeper:
  name: a Skyborn anchor-keeper
  location: highgate
  keywords: [keeper, anchor, skyborn, merchant]
  dialogue:
    - '"Sky-craft and anchor-work, for a Forger bound onward. The winds take the unready. Buy what holds you steady before you cross what would tear you loose."'
  shop:
    sells:
      healing_draught: 20
      mana_draught: 20
      grand_healing_draught: 100    # high-tier heal for the last surface Reach
      grand_mana_draught: 82
      forgefire_elixir: 155         # restores both pools: the endgame restorative
      stormward_helm: 300      # the Sundered Sky's own Stormward set (head + body)
      stormward_cuirass: 360
      stormcaller_pike: 340    # the Reach's signature weapon
    buys:
      ember_shard: 10
      hollow_ingot: 42
      anchor_stone: 175        # buys back the Reach-relic accessory
  topics:
    winds:
      - '"East of Highgate the shards drift loose, crossed on sky-bridges that sway on the wind, and the fall-wights ride the raw edges. Out there the Drifting Court wanders, never in the same sky twice. Carry radiance, and carry a rope."'

fall_wight:
  name: a fall-wight
  drops: [stormward_cuirass]  # Stormward set (body)
  location: the_drifting_reach
  keywords: [wight, fall, drifting, dead]
  dialogue:
    - A shape of the tearing rises off a sky-bridge's edge, one the loose lands took, still falling in a way that never ends, and reaches for you.
  hp: 200
  atk: 32
  aggressive: true
  attack_element: DRK  # a thing of the Unforging's tearing (bring radiance, holy fire)
  resistances: {DRK: Resist, HLY: Weak}
  level: 64
  tier: elite  # the sky's horror (x3 reward), between the stormkin and the Court-Warden
  loot: {ember_shard: 3, nothing: 2}

court_warden:
  name: the Court-Warden
  location: the_wandering_court
  keywords: [warden, court, emberwright, boss]
  dialogue:
    - '"..." The Court-Warden turns in the drifting hall of the Wandering Court, a maker the Unforging set adrift and never let land, and moves to keep the last shard.'
  hp: 360
  atk: 34
  aggressive: true
  lethal: true
  attack_element: DRK  # a maker of the tearing sky: bring radiance (weak to holy)
  resistances: {DRK: Resist, HLY: Weak}
  level: 72
  tier: boss  # the Sundered Sky's climax: the last surface boss before the Spiral (x10 reward)
  drops: [anchor_stone, stormward_vambraces, stormcaller_pike, storm_essence]  # + Reach essence
  loot: {ember_shard: 7, hollow_ingot: 2, nothing: 2}

# --- Ecosystem enrichment (Content Manufacturing Campaign): monsters for the wilderness, dungeon,
# --- and threshold rooms that stood empty, so exploration always finds something. The safe rooms
# --- (the spawn, the rest-stop) and the puzzle rooms (the mend-the-bridge span, the jumbled cellar)
# --- stay foe-free by design. Level-banded to their Reach; materials/XP, not more gear (the Reaches
# --- are already loadout-complete). ---

salvage_wraith:
  name: a salvage-wraith
  location: the_scoured_ruin
  keywords: [wraith, salvage, ruin, unforged]
  dialogue:
    - The salvage-wraith rises out of the scoured glass, made of everything the Unforging left half-finished, and reaches for a shape to wear.
  hp: 74
  atk: 12
  aggressive: true
  attack_element: DRK  # a thing of the unmaking: entropy given a grasping hand (bring radiance)
  level: 20
  tier: elite  # the ruin's own drifter, promised by its stones: an off-spine kill (x3 reward)
  loot: {ember_shard: 3, hollow_ingot: 1, nothing: 2}

drowned_lung_sentry:
  name: a drowned-lung sentry
  location: drowned_sunhold_descent
  keywords: [sentry, drowned, sunhold, shade]
  dialogue:
    - A sentry of drowned-lung Forgework detaches from the salvage-stair, still keeping a watch the sea ended an age ago.
  hp: 88
  atk: 13
  aggressive: true
  attack_element: WTR  # a warden of the drowned capital: its blows are brine and pressure
  level: 26
  tier: elite  # the guard on the stair down to Sunhold: an elite gate on the descent (x3 reward)
  drops: [greater_healing_draught]  # a supply cache earned before the boss
  loot: {ember_shard: 3, hollow_ingot: 1, nothing: 2}

channel_serpent:
  name: a channel-serpent
  location: the_verdant_passage
  keywords: [serpent, channel, verdant, water]
  dialogue:
    - A serpent long as the ferry uncoils from the warm brown water of the channel and tastes the air for warmth.
  hp: 52
  atk: 10
  aggressive: true
  attack_element: WTR  # a thing of the drowning channel between the Reaches
  level: 22
  tier: normal  # the passage's threat, where the Cooling-Sea gives way to the Verdance
  loot: {ember_shard: 2, nothing: 2}

wharf_lurker:
  name: a wharf-lurker
  location: tidewharf_docks
  keywords: [lurker, wharf, tide, dock]
  dialogue:
    - Something long-armed and pale hauls itself up between two lashed hulls, drawn by the warmth on the planks.
  hp: 50
  atk: 9
  aggressive: true
  attack_element: WTR  # it lives in the drowned hulls the free-port is built across
  level: 20
  tier: normal  # the hazard beneath the busy docks: the deeps of Tidewharf are never truly safe
  loot: {ember_shard: 2, nothing: 2}

marchwatch_husk:
  name: a marchwatch husk
  location: the_wardenmarch
  keywords: [husk, marchwatch, warden, forgework]
  dialogue:
    - A husk in the grey Forgework of a Concord watchman stands from a cairn, still walking a post the war left behind.
  hp: 46
  atk: 8
  aggressive: true
  level: 17
  tier: normal  # the Wardenmarch's own threat, on the threshold road out to the Forgeward frontier
  loot: {ember_shard: 2, nothing: 2}

# --- City population (Content Manufacturing Campaign): ambient citizens who make the capitals feel
# --- lived-in, each carrying a `rumor` topic that points a Forger toward nearby content (a
# --- side-quest, a placed treasure, a boss). Non-combat -- they populate and guide, they do not fight. ---

wharf_dockhand:
  name: a Tidewharf dockhand
  location: tidewharf_plaza
  keywords: [dockhand, worker, wharf, tidewharf]
  dialogue:
    - '"Mind the planks, Forger -- half of Tidewharf is drowned hull, and the sea wants the other half back."'
  topics:
    rumor:
      - '"Down the salvage-stair a drowned-lung sentry still keeps its watch, and the divers won''t work past it. Still the thing, and they say a pearl waits in Sunhold below for whoever does."'

coast_child:
  name: a coast child
  location: cinderhearth_square
  keywords: [child, kid, coast, urchin]
  dialogue:
    - The child chases an ember-wisp across the square, laughing, too young yet to fear the cold.
  topics:
    rumor:
      - '"My gran says out in the Ashwastes there''s a ruin all melted to glass, and a grey thing that drifts it wearing shapes. She says there''s treasure in it. She says don''t go."'

forge_apprentice:
  name: a Grand Forge apprentice
  location: the_grand_forge
  keywords: [apprentice, forge, worker, student]
  dialogue:
    - '"One day I''ll forge something that outlives me. The masters say that''s the whole point, and the whole danger."'
  topics:
    rumor:
      - '"They bring salvage in from the Scoured Ruin sometimes -- ashglass, light as breath and hard as spite. The Forger who cleared the wraith off it wore a charm cut from the stuff. I''d like to see that."'

city_guard:
  name: an Emberreach guard
  location: the_grand_forge
  keywords: [guard, soldier, watch, concord]
  dialogue:
    - '"The Concord keeps this gate and every gate to the frontier. Cross the Wardenmarch and you leave our watch behind. Go proven."'
  topics:
    rumor:
      - '"East past the Warden Gate the road stops being kind. The Wardenmarch has husks on it now, watchmen who never stood down. First taste of the frontier, that. Last warning, too."'

grove_tender:
  name: a Deeprooted grove-tender
  location: highbough
  keywords: [tender, grove, deeprooted, gardener]
  dialogue:
    - '"We do not cut the wood, Forger. We tend it. There is a difference, and the mire is where you learn it."'
  topics:
    rumor:
      - '"A serpent has the green passage the ferries thread -- takes a ferryman a crossing. And deeper in, in the Heart-Grove itself, a seed still grows that the Boughwarden guards. Living armour, for one the wood spares."'

vent_hand:
  name: a Kollkin vent-hand
  location: emberkoll
  keywords: [hand, worker, vent, kollkin]
  dialogue:
    - '"Closer to the Forge, hotter the work. We lose a Forger to the vents most seasons, and make the finest steel in the world the same season. Fair trade, we tell ourselves."'
  topics:
    rumor:
      - '"A Forgeborn''s taken a working vent in the Anvil-Vents -- a made thing that outlived its maker, and it won''t give the fire back. Break it loose and the Kollkin will owe you a pour."'

sky_pilgrim:
  name: a sky-pilgrim
  location: highgate
  keywords: [pilgrim, wanderer, sky, skyborn]
  dialogue:
    - '"I came up the sky-ferry to see the shards before I die. They drift, you know. Nothing up here holds still but the wanting to."'
  topics:
    rumor:
      - '"East of Highgate the shards drift loose, crossed on bridges that sway. Few walk out. The Skyborn keep a name for those who do -- and out there, they say, a shard of the old sky waits for a hand bold enough to take it."'

rime_watcher:
  name: a Rimefall watcher
  location: stillhearth
  keywords: [watcher, rime, frozen, hearth]
  dialogue:
    - '"We keep the one warm hearth in the Rimefall, and we keep watch. The cold here is old, and it remembers being a fire."'
  topics:
    rumor:
      - '"The Frozen Court holds the Rime-King, flash-quenched at the height of the golden age and reigning still over a dead one. Bring fire to thaw the reign. Bring more fire than you think you need."'

# --- The Drowned Sunhold's deeper delve (Content Manufacturing Campaign): the flooded halls and the
# --- drowned forge now hold their own foes, so the sunken capital is a real dungeon, not one boss. ---

sunhold_drifter:
  name: a drifter of the drowned halls
  location: the_drowned_halls
  keywords: [drifter, drowned, halls, citizen]
  dialogue:
    - A drifter turns between the green-lit pillars, a Merewright the sea kept, still walking a hall that has been under water for an age.
  hp: 88
  atk: 13
  aggressive: true
  attack_element: WTR  # a drowned citizen of the sunken capital: its touch is brine and cold
  level: 27
  tier: normal  # the halls' threat on the delve down to the Warden (past the stair-sentry)
  loot: {ember_shard: 3, hollow_ingot: 1, nothing: 2}

flooded_forge_revenant:
  name: the revenant of the flooded forge
  location: the_flooded_forge
  keywords: [revenant, forge, master, drowned]
  dialogue:
    - '"...NOT... FINISHED..." The forge-master''s revenant rises from the blue-burning hearths, still gripping a hammer, and will not let you past its work.'
  hp: 128
  atk: 16
  aggressive: true
  attack_element: WTR  # the drowned forge-master: brine and banked ember
  level: 28
  tier: elite  # the last guardian before the Sunhold Warden: an elite gate on the delve (x3 reward)
  drops: [greater_healing_draught]  # a supply cache earned before the boss
  loot: {ember_shard: 4, hollow_ingot: 2, nothing: 2}

# --- The Heart-Grove's deeper delve (Content Manufacturing Campaign): the rootways hold the grove's
# --- own guardian, the last thing before the Boughwarden, so the Verdance's heart is a real dungeon. ---
rootbound_guardian:
  name: a rootbound guardian of the grove
  location: the_rootways
  keywords: [guardian, rootbound, grove, verdant]
  dialogue:
    - The rootways tighten, and a guardian of living ember-wood pulls itself free of the wall, grown for exactly this: to keep the heart.
  hp: 150
  atk: 18
  aggressive: true
  attack_element: ERT  # a thing of old wood and stone-root: earthen blows (bring wind)
  level: 30
  tier: elite  # the last gate before the Boughwarden: an elite guardian on the delve (x3 reward)
  drops: [greater_healing_draught]  # a supply cache earned before the boss
  loot: {ember_shard: 4, nothing: 2}

# --- The Frozen Court's deeper delve (Content Manufacturing Campaign): the glass gallery and the
# --- rime-vault hold their own frozen guardians, the gates before the Rime-King's throne. ---
rimebound_sentinel:
  name: a rimebound sentinel
  location: the_glass_gallery
  keywords: [sentinel, rimebound, glass, frozen]
  dialogue:
    - One of the frozen makers is not frozen: a sentinel cracks free of its skin of rime, three ages of watch unbroken, and comes for the warmth of you.
  hp: 240
  atk: 26
  aggressive: true
  attack_element: ICE  # a guardian of the flash-frozen court: its blows are killing cold (bring fire)
  level: 48
  tier: elite  # the gallery's gate on the delve to the Rime-King (x3 reward)
  drops: [grand_healing_draught]  # a supply cache earned before the boss
  loot: {ember_shard: 5, hollow_ingot: 1, nothing: 2}

rime_vault_keeper:
  name: the keeper of the rime-vault
  location: the_rime_vault
  keywords: [keeper, vault, rime, wraith]
  dialogue:
    - The oldest cold in the vault gathers itself into a shape and turns: a wraith that was a keeper once, and keeps the sealed making still.
  hp: 300
  atk: 30
  aggressive: true
  attack_element: ICE  # the vault's frozen keeper: unmelting cold (bring fire)
  level: 50
  tier: elite  # the last gate before the Rime-King's throne (x3 reward)
  drops: [grand_healing_draught]  # a supply cache earned before the boss
  loot: {ember_shard: 6, hollow_ingot: 2, nothing: 2}

# --- The Vent-Deep and Wandering-Court delves (Content Manufacturing Campaign): each dungeon's
# --- approach now holds a mini-boss gate before the Reach boss. ---
magma_revenant:
  name: a magma revenant
  location: the_vent_gallery
  keywords: [revenant, magma, vent, kollkin]
  dialogue:
    - The slag heaves and stands: a Kollkin the fire took, still pouring a make with no shape left, and it turns the pour toward you.
  hp: 280
  atk: 30
  aggressive: true
  attack_element: FIR  # a thing of the near Forge: its blows are living fire (bring flood)
  level: 58
  tier: elite  # the vent-gallery's gate on the delve to the Vent-Lord (x3 reward)
  drops: [grand_healing_draught]  # a supply cache earned before the boss
  loot: {ember_shard: 6, hollow_ingot: 2, nothing: 2}

fall_wraith:
  name: a fall-wraith of the broken span
  location: the_broken_span
  keywords: [wraith, fall, span, sky]
  dialogue:
    - Something rides the gap in the broken bridge: a fall-wraith, grown from an endless fall, that reaches to pull you after it into the cloud.
  hp: 340
  atk: 34
  aggressive: true
  attack_element: DRK  # a thing of the tearing sky: bring radiance (weak to holy)
  level: 68
  tier: elite  # the broken span's gate before the Court-Warden (x3 reward)
  drops: [grand_healing_draught]  # a supply cache earned before the boss
  loot: {ember_shard: 7, hollow_ingot: 2, nothing: 2}

# --- The Tidecaves' foes (Content Manufacturing Campaign): an early optional delve off the coast. ---
cave_crawler:
  name: a cave-crawler
  location: the_tidecave_mouth
  keywords: [crawler, cave, tide, crab]
  dialogue:
    - A crawler bigger than the strand's clatters out of the dark over the old bones, claws wide.
  hp: 24
  atk: 5
  aggressive: true
  attack_element: WTR  # a thing of the drowned cave: brine and cold
  level: 4
  tier: normal  # the cave-mouth's threat, a step past the strand crawlers
  loot: {ember_shard: 2, nothing: 2}

brine_hulk:
  name: the Brine-Hulk
  location: the_sunken_grotto
  keywords: [hulk, brine, grotto, tide]
  dialogue:
    - '"..." The brine-hulk heaves out of the still pool, vast and barnacled, grown huge on everything the tide ever brought down here.'
  hp: 90
  atk: 11
  aggressive: true
  attack_element: WTR  # the grotto's glutton-king: brine and crushing weight
  level: 10
  tier: elite  # the tidecave's mini-boss, an early off-path prize (x3 reward)
  drops: [tidecave_pearl]
  loot: {ember_shard: 4, nothing: 2}

# --- The Deep Reachwood's life (Seed Scale Directive): foes for the expanded forest sub-zone. ---
ember_lynx:
  name: an ember-lynx
  location: the_deepwood
  keywords: [lynx, ember, cat, wood]
  dialogue:
    - The lynx drops from the branches without a sound, ember-eyes fixed, already inside your reach.
  hp: 40
  atk: 7
  aggressive: true
  level: 8
  tier: normal  # the deepwood's hunter, a step past the glade
  loot: {ember_shard: 2, nothing: 2}

mere_lurker:
  name: a mere-lurker
  location: the_thornmere
  keywords: [lurker, mere, bog, reed]
  dialogue:
    - The reeds part and the mere-lurker rises streaming black water, jaws already wide.
  hp: 52
  atk: 9
  aggressive: true
  attack_element: WTR  # a thing of the black-water mere
  level: 9
  tier: normal  # the gatherer's-corner threat
  loot: {ember_shard: 3, reachwood_sap: 1, nothing: 2}

shrine_warden:
  name: the warden of the forgotten shrine
  location: the_forgotten_shrine
  keywords: [warden, shrine, forgework, guardian]
  dialogue:
    - '"..." The Forgework of the old shrine gathers itself upright, a keeper still at a post whose purpose no one alive remembers, and moves to keep it from you.'
  hp: 120
  atk: 14
  aggressive: true
  attack_element: HLY  # a thing of the old makers' shrine: its light is sacred (bring dark)
  level: 12
  tier: elite  # the hidden shrine's keeper, an off-path prize in the deep wood (x3 reward)
  drops: [shrine_ward]
  loot: {ember_shard: 4, nothing: 2}

# --- Emberreach ambient life (Seed Scale Directive: "the world should appear to function even when
# --- the player is absent"). Non-combat civilians, wildlife, and travelers across the launch zone,
# --- so the coast and wood feel inhabited, not staged. They populate and flavour; they do not fight. ---

reachwood_hunter:
  name: a Reachwood hunter
  location: the_deepwood
  keywords: [hunter, reachwood, tracker, forester]
  dialogue:
    - The hunter freezes, three fingers raised, then eases: not game, only a Forger. "Walk soft out here, and the wood walks soft back."
  topics:
    rumor:
      - '"The lynx you can hear. The shrine-keeper you cannot -- it stands so still the moss grows on it, east past the mere, and it does not like being found. If you go, go loud. Surprising an old Forgework is how the wood gets its hunters back in pieces."'

reachwood_doe:
  name: a reachwood doe
  location: the_thornmere
  keywords: [doe, deer, reachwood, wildlife]
  dialogue:
    - A doe lifts her head from the mere's edge, ember-eyed and unafraid, having never learned that a Forger is a thing to fear.

coast_fisher:
  name: a Quench Harbor fisher
  location: quench_harbor
  keywords: [fisher, harbor, boat, quench]
  dialogue:
    - '"Grey water gives up grey fish, and we are grateful for them," the fisher says, not looking up from a net that is more mend than net.'
  topics:
    rumor:
      - '"There is a cave below the strand, east, that we do not fish. Something grew big in the dark down there on everything the tide sent it. Put it down and the tidecave is ours again -- there is drowned ember in that grotto worth more than a season of fish."'

ember_road_pilgrim:
  name: a road pilgrim
  location: wayfarers_rest
  keywords: [pilgrim, traveller, road, wanderer]
  dialogue:
    - '"I walk the Ember-road to the Grand Forge, to see the relighting recorded and add my small name to it. Rest here a while, Forger. The road is kinder shared."'
  topics:
    rumor:
      - '"They say the Warden Gate past the capital opens onto the frontier -- the Forgeward Road, that runs east to the Forge itself. A whole life could be spent on it. Mine will not; I go only as far as the capital. But you have the look of one the road is not done with."'

cinderhearth_elder:
  name: a Cinderhearth elder
  location: cinderhearth_square
  keywords: [elder, cinderhearth, old, villager]
  dialogue:
    - '"I was a child when the coast relit, Forger. I remember the cold, and I remember the first hearth catching. Do not let a fire go out on my account. We worked too hard for the warm."'
  topics:
    rumor:
      - '"Down the cellar under the square the Unforging left a made-hall half-real, its steps all out of order. The young Forgers go down to set it right. Some come up. Mind your footing and mind the cold-crawlers, and you will be one of the some."'

# --- The Ashen Vault's keeper (Seed Scale Directive): the mini-boss gate on Emberreach's second
# --- dungeon, between the salvage-wraith and the Ash-Colossus. ---
ashvault_sentinel:
  name: a sentinel of the ashen vault
  location: the_ashen_vault
  keywords: [sentinel, vault, ashen, ash]
  dialogue:
    - The grey wall of the vault peels away and stands: a sentinel of fused ash, grown to keep a door the makers scoured to glass, and it comes for the one thing warm in the dark.
  hp: 88
  atk: 13
  aggressive: true
  attack_element: DRK  # a thing of the buried unmaking: entropy and grey ash (bring radiance)
  level: 22
  tier: elite  # the vault's gate on the Ashwastes delve to the Ash-Colossus (x3 reward)
  drops: [greater_healing_draught]
  loot: {ember_shard: 4, hollow_ingot: 1, nothing: 2}

# --- The Woodcutters' Camp life (Seed Scale Doctrine): a settlement's keeper, workers, wildlife, and
# --- the logging-stands threat, so the Reachwood hub feels like a working camp. ---
camp_keeper:
  name: the camp-keeper
  location: the_woodcutters_camp
  keywords: [keeper, camp, store, forester]
  dialogue:
    - '"Forger, is it? We cut wood here, not glory. But your coin spends. Draughts, a blade, whatever the road took off you -- the store is open."'
  topics:
    rumor:
      - '"The stands east have gone bad since the last cut -- a bark-lurker, deadfall and old ember grown into something that swings back. Put it down and the foresters will cut easy again. And they''ll owe you a keg."'
  shop:
    sells:
      healing_draught: 12
      mana_draught: 12
      cinder_hammer: 40
      emberhide_jerkin: 55
    buys:
      ember_shard: 4
      reachwood_sap: 8
      cinder_hammer: 15

camp_forester:
  name: a Concord forester
  location: the_woodcutters_camp
  keywords: [forester, woodcutter, worker, concord]
  dialogue:
    - The forester sets down a saw and flexes a cramped hand. "Deadfall only. We never cut a living ember-tree. The wood remembers who takes more than the wild gives, and the wood collects."

camp_hound:
  name: a camp hound
  location: the_woodcutters_camp
  keywords: [hound, dog, camp, wildlife]
  dialogue:
    - The hound thumps its tail once at you from beside the fire, decides you are neither food nor threat, and goes back to sleep.

bark_lurker:
  name: a bark-lurker
  location: the_logging_stands
  keywords: [lurker, bark, deadfall, wood]
  dialogue:
    - A stack of felled trunks shudders and stands: a bark-lurker, deadfall and old ember grown together into a thing that swings back, and it comes down the stand at you.
  hp: 44
  atk: 7
  aggressive: true
  attack_element: ERT  # a thing of old wood: earthen blows (bring wind)
  level: 7
  tier: normal  # the logging stands' threat, a second early leveling ground in the wood
  loot: {ember_shard: 2, reachwood_sap: 1, nothing: 2}

# --- The Old Firewatch's keeper (Seed Scale Doctrine: life at the landmark). A hermit who never
# --- stood down the watch, so the high hill has a voice, not just a view. Non-combat. ---
firewatch_hermit:
  name: the firewatch hermit
  location: the_old_firewatch
  keywords: [hermit, watcher, firewatch, keeper]
  dialogue:
    - '"They stood down the watch an age ago," the hermit says, not turning from the horizon. "I did not. Someone should still be looking outward. Sit. Look with me a while. You can see the whole beginning of the world from here."'
  topics:
    rumor:
      - '"Everything you have walked is down there, and it is the smallest part. West the sea, and beyond it Reaches you have not named. East the Wastes, and past the Wardenmarch the frontier that runs to the Forge itself. I have watched it my whole life and seen a fraction. Keep climbing, Forger. The world is always larger than the part you have lit."'

# --- The Thorn-Heart's guardian (Seed Scale Doctrine): the rare threat past the Bramble-Wight. ---
thorn_horror:
  name: a thorn-horror of the deep warren
  location: the_thorn_heart
  keywords: [horror, thorn, warren, bramble]
  dialogue:
    - The well of wild ember bulges and births a horror of living thorn, grown fat on the raw ember no forester dares cut, and it comes for the warmth of you.
  hp: 96
  atk: 13
  aggressive: true
  attack_element: ERT  # a thing of ember-thorn and old wood (bring wind)
  level: 12
  tier: elite  # the deep warren's prize, past the Bramble-Wight (x3 reward)
  drops: [wildember_charm]
  loot: {ember_shard: 5, reachwood_sap: 1, nothing: 2}

# --- The drowned flagship's foes (Seed Scale Doctrine): the coastal dungeon past the Wreck Reef. ---
reef_drifter:
  name: a reef-drifter
  location: the_flooded_hulls
  keywords: [drifter, reef, wreck, brine]
  dialogue:
    - A shape unfolds from a split hull and drifts toward you through the green water, brine-logged and patient.
  hp: 56
  atk: 9
  aggressive: true
  attack_element: WTR  # a thing of the drowned hulls: brine and cold
  level: 13
  tier: normal  # the flooded hulls' threat, an early coastal delve
  loot: {ember_shard: 3, nothing: 2}

wreck_warden:
  name: the warden of the sunken hold
  location: the_sunken_hold
  keywords: [warden, wreck, hold, keeper]
  dialogue:
    - '"..." A Forged keeper rises from the silt of the flagship''s hold, still at the post it was set to a lifetime under the sea ago, and moves to hold the cargo from you.'
  hp: 110
  atk: 14
  aggressive: true
  attack_element: WTR  # the ship's drowned keeper: brine and crushing dark
  level: 16
  tier: elite  # the drowned flagship's mini-boss, a coastal off-path prize (x3 reward)
  drops: [greater_healing_draught, tideglass_pendant]
  loot: {ember_shard: 4, hollow_ingot: 1, nothing: 2}

# --- Capital district life (Seed Scale Doctrine: a living city). Trainers, artisans, guards, and
# --- ambient citizens who make Emberreach's capital feel inhabited and worth spending time in. ---
weaponmaster:
  name: the Warcraft weaponmaster
  location: the_training_yard
  keywords: [weaponmaster, master, warcraft, trainer]
  dialogue:
    - '"Steel is honest, Forger. It does exactly what your arm tells it, no more, no less. Most Forgers die learning that their arm was lying. Drill, and stop lying to yourself."'
  topics:
    rumor:
      - '"You want to test what the drills taught you? The duelist keeps the sparring ring, and past the Warden Gate the frontier keeps a harder school. But learn the forms here first, where a mistake costs you pride and not your life."'

drill_sergeant:
  name: an Orders drill-sergeant
  location: the_training_yard
  keywords: [sergeant, drill, orders, soldier]
  dialogue:
    - '"LINE! Shields up, feet planted, eyes on the -- you. Not one of mine. Watch, then, and learn how the Concord keeps a coast: together, or not at all."'

yard_duelist:
  name: a yard duelist
  location: the_training_yard
  keywords: [duelist, sparring, ring, fighter]
  dialogue:
    - The duelist salutes with a practice-blade, loose and grinning. "The ring's open, if you like. Nothing to lose but a bruise and the story that you tried."

master_artisan:
  name: a master artisan
  location: the_artisans_quarter
  keywords: [artisan, master, maker, smith]
  dialogue:
    - '"The lowland Forgers chase the loud making -- a blade, a boss, a name. We keep the quiet ones: the hinge that holds, the binding that lasts. A world is more hinges than swords, Forger. Buy well."'
  shop:
    sells:
      healing_draught: 12
      greater_healing_draught: 36
      cindershell_plate: 140
      wraithlamp_circlet: 175
      warden_sigil: 90
    buys:
      ember_shard: 5
      hollow_ingot: 25
      reachwood_sap: 8

journeyman_smith:
  name: a journeyman smith
  location: the_artisans_quarter
  keywords: [smith, journeyman, maker, forger]
  dialogue:
    - The smith does not look up from a commission, a hinge worked and reworked. "Master says a thing is not made until it is made right. I have made this eleven times. I begin to think Master is testing my patience, not my hinges. Perhaps both are the point."

quarter_scholar:
  name: a wandering scholar
  location: the_artisans_quarter
  keywords: [scholar, wanderer, student, knowing]
  dialogue:
    - '"The old marks on these walls predate the Concord, Forger. The makers who raised the first capital signed their work, and no one now can read the signatures. I am trying. Come back when I have. Or do not; I may be a while."'
  topics:
    rumor:
      - '"There is a shrine in the deep Reachwood the marks here point to -- older than the town, its makers unnamed. And a firewatch on the hill above it. The old capital watched outward once, before it forgot to. If you climb up there, tell me what you see. I gather the world secondhand these days."'

# --- The Emberpost + Windward Downs life (Seed Scale Doctrine): a caravan settlement's traders and
# --- guards, and the downs' herds and hunter. ---
caravan_master:
  name: the caravan-master
  location: the_emberpost
  keywords: [master, caravan, trader, post]
  dialogue:
    - '"Coast to capital and back, twice a season, thirty years. The road tells you everything if you listen: where the strays gather, which stones stay warm, who to trust. Provision here, Forger. The road is long and the Wardenmarch is longer."'
  topics:
    rumor:
      - '"The downs north are quiet ground for leveling, if you can mind the stalker that works the elk. And the old cairns up there mark the first road -- before the Ember-road was paved, the Concord walked the downs. Some say the cairns still point at something worth the walk."'
  shop:
    sells:
      healing_draught: 12
      mana_draught: 12
      greater_healing_draught: 38
      reaver_blade: 92
      emberhide_wraps: 45
    buys:
      ember_shard: 4
      hollow_ingot: 25
      reaver_blade: 30

road_guard:
  name: a Concord road-guard
  location: the_emberpost
  keywords: [guard, road, concord, spear]
  dialogue:
    - '"The road is the Concord''s, coast to capital, and we keep it so a fresh Forger can walk it and live. Past the Wardenmarch it stops being ours. Enjoy the paving while you have it."'

emberpost_peddler:
  name: a road peddler
  location: the_emberpost
  keywords: [peddler, cart, oddments, trader]
  dialogue:
    - '"Charms, cures, and curiosities, Forger! Half of it works and I will not tell you which half -- that is what makes it an adventure. Copper apiece, and no refunds on the mysteries."'

ember_elk:
  name: an ember-elk
  location: the_windward_downs
  keywords: [elk, ember, herd, wildlife]
  dialogue:
    - An ember-elk lifts its head from the gold grass, antlers run through with a slow wild light, watches you a long moment, and drifts back to the herd.

downs_stalker:
  name: a downs-stalker
  location: the_windward_downs
  keywords: [stalker, downs, hunter, beast]
  dialogue:
    - Low in the gold grass the downs-stalker has been pacing you a while; it decides now, and comes fast and silent through the ember-light.
  hp: 60
  atk: 10
  aggressive: true
  level: 12
  tier: normal  # the downs' predator, a second mid-level leveling ground off the road
  loot: {ember_shard: 3, nothing: 2}

# --- The Sealed Vault's keeper (Seed Scale Doctrine: the Cinderdeep's hidden off-path elite). ---
vault_horror:
  name: a horror of the sealed vault
  location: the_sealed_vault
  keywords: [horror, vault, sealed, deep]
  dialogue:
    - The sealed dark of the vault gathers into a shape that has waited a thousand years for a door to open, and now that one has, it comes for the light you carry.
  hp: 150
  atk: 18
  aggressive: true
  attack_element: DRK  # a thing grown of the sealed unmaking (bring radiance)
  level: 20
  tier: elite  # the Cinderdeep's hidden off-path prize, off the main delve (x3 reward)
  drops: [greater_healing_draught, sealed_ember]
  loot: {ember_shard: 5, hollow_ingot: 2, nothing: 2}

# --- The Deep Wreckways life (Seed Scale Doctrine: the Quenchmere's second leveling ground + a
# --- hidden-dungeon mini-boss, plus more life in the free-port). ---
wreck_scavenger:
  name: a wreck-scavenger
  location: the_deep_wreckways
  keywords: [scavenger, wreck, diver, brine]
  dialogue:
    - A shape that was a diver once kicks up from a flooded hold, brine-logged and grasping, and does not let go of what the sea gave it.
  hp: 66
  atk: 10
  aggressive: true
  attack_element: WTR  # a thing of the drowned wrecks: brine and cold
  level: 20
  tier: normal  # the deep Wreckways' threat, a Quenchmere leveling ground off the marked lane
  loot: {ember_shard: 3, wreckways_salvage: 1, nothing: 2}

chapel_warden:
  name: the warden of the drowned chapel
  location: the_drowned_chapel
  keywords: [warden, chapel, keeper, drowned]
  dialogue:
    - '"..." A drowned keeper rises from the flooded pews of the chapel, still tending an altar the sea took an age ago, and moves to keep the offering from you.'
  hp: 140
  atk: 15
  aggressive: true
  attack_element: WTR  # the chapel's drowned keeper (brine and cold; the Merewrights warded with holy)
  level: 24
  tier: elite  # the drowned chapel's mini-boss, a Quenchmere off-path prize (x3 reward)
  drops: [greater_healing_draught, chapel_relic]
  loot: {ember_shard: 4, hollow_ingot: 1, nothing: 2}

tidewharf_diver:
  name: a Salvage-Guild diver
  location: tidewharf_docks
  keywords: [diver, salvage, guild, wharf]
  dialogue:
    - '"Everything the sea took is still down there, Forger, and the Guild pays by the pound. The deep Wreckways north are thick with it -- and thick with what guards it. I dive the shallow lanes. Braver souls dive the deep."'
  topics:
    rumor:
      - '"There is a chapel out in the deep Wreckways, the tallest wreck of them all, its spire still above the water. The Merewrights drowned praying in it. Whatever they left on that altar is still there -- and so is the one who kept it. Bring radiance to a drowned holy thing."'

# --- The Outer Reefs life (Great Creation Campaign): the reef-lane serpent, the landing's salvager
# --- folk, the flats' hunter, the lighthouse keeper, and the sunken manse's steward. ---
reef_serpent:
  name: a reef-serpent
  location: the_outer_lanes
  keywords: [serpent, reef, lane, brine]
  dialogue:
    - A serpent banded like the reef itself rises from the channel between the isles, unhurried, certain of its water.
  hp: 62
  atk: 10
  aggressive: true
  attack_element: WTR
  level: 19
  tier: normal  # the outer-lane threat, an Outer Reefs leveling ground
  loot: {ember_shard: 3, nothing: 2}

salvage_master:
  name: the salvage-master of Saltmarsh
  location: saltmarsh_landing
  keywords: [master, salvage, saltmarsh, trader]
  dialogue:
    - '"Guild works the near wrecks and takes its cut. Out here we work the far reefs and keep what we pull. Harder, and honester. Provision here, Forger, and mind the tides -- the flats will drown you if you dawdle over the pearls."'
  topics:
    rumor:
      - '"The manse below the landing was a Merewright house too proud to drown gracefully. Its steward still keeps the doors. Best it and the flooded solar is yours -- a house''s worth of pride, cast in salvage-gold. And bring radiance; the old houses warded holy."'
  shop:
    sells:
      healing_draught: 15
      greater_healing_draught: 38
      brinescale_hood: 110
      pilots_compass: 55
    buys:
      ember_shard: 6
      brine_pearl: 10
      hollow_ingot: 30

reef_fisher:
  name: a reef-fisher
  location: saltmarsh_landing
  keywords: [fisher, reef, saltmarsh, weir]
  dialogue:
    - '"Weir-fishing, reef-diving, tide-picking -- the reef gives three ways if you know it, and takes you one way if you do not. The child there knows the tides better than I do. Learn from her, not me."'

marsh_child:
  name: a marsh-child
  location: saltmarsh_landing
  keywords: [child, marsh, saltmarsh, kid]
  dialogue:
    - The marsh-child grins, gap-toothed, mud to the elbows. "Tide's going out! Pearls in the flats north, if you're quick and you're brave and you don't mind the skitters. I'm quick. Are you?"

reef_mudskitter:
  name: a reef mudskitter
  location: the_reef_flats
  keywords: [mudskitter, skitter, flats, crab]
  dialogue:
    - A mudskitter the size of a hound bursts from a tidal pool in a spray of brine, claws first.
  hp: 58
  atk: 11
  aggressive: true
  attack_element: WTR
  level: 20
  tier: normal  # the flats' threat, a gathering-ground guardian
  loot: {ember_shard: 3, brine_pearl: 1, nothing: 2}

lighthouse_keeper:
  name: the lighthouse keeper
  location: the_old_lighthouse
  keywords: [keeper, lighthouse, lamp, outer]
  dialogue:
    - '"My people have kept this lamp since before the sea rose, Forger, and we will keep it after it falls. A light that marks the reef has saved more lives than any blade. That is a making too, though the Grand Forge would not call it one."'
  topics:
    rumor:
      - '"From up here you see the whole drowned Reach: the deep Wreckways and their chapel, the manse below the landing, and far south the masts over Sunhold itself. A Forger with the nerve could spend a season out here and not see the same wreck twice. Start with the flats. End with the manse."'

manse_warden:
  name: the warden of the sunken manse
  location: the_sunken_manse
  keywords: [warden, manse, steward, drowned]
  dialogue:
    - '"The house does not receive salvagers." A Forged steward rises from the flooded solar, immaculate and drowned, and moves to keep the doors of a house a lifetime under the sea.'
  hp: 150
  atk: 16
  aggressive: true
  attack_element: WTR
  resistances: {WTR: Resist, HLY: Weak}  # an old Merewright house warded holy: bring radiance
  level: 26
  tier: elite  # the Sunken Manse's mini-boss, an Outer Reefs off-path prize (x3 reward)
  drops: [greater_healing_draught, manse_signet]
  loot: {ember_shard: 5, hollow_ingot: 2, nothing: 2}
# --- The Verdance expansion life (Great Creation Campaign): Highbough's city folk, the understory's
# --- forest-floor hunters, and the Sunken Ziggurat's dead-faith wardens. Banded 22-30. ---

# Highbough proper (non-combat life)
highbough_warden:
  name: a bough-warden of the watch
  location: the_bough_avenues
  keywords: [warden, watch, bough, guard]
  dialogue:
    - '"Welcome to Highbough, Forger, and mind the rails -- the tree is kind but the fall is not. We keep the peace the green way: slow, and sure, and rooted. You will find no cells here. The tree remembers a wrong longer than any gaol."'
  topics:
    rumor:
      - '"West of the shrine the forest floor drops into the understory -- good hunting, if the thornwolves do not hunt you first. Go far enough west and you strike the old causeway. A people lived here before us and the tree ate them whole. Their ziggurat still stands, and something in its crown still keeps their god. We do not go up the steps."'

canopy_child:
  name: a canopy-child
  location: the_bough_avenues
  keywords: [child, canopy, kid, highbough]
  dialogue:
    - The canopy-child runs the high rail without a hand for balance, grinning down. "You walk like the ground might leave! It won't. The tree holds. Everyone flat-born walks like that at first."

grove_keeper:
  name: the grove-keeper
  location: the_wildember_shrine
  keywords: [keeper, grove, shrine, priest]
  dialogue:
    - '"You may look on the wild flame, Forger, not take from it. The drowned Reaches Forge their Ember and call it mastery. We let ours burn and call it kin. Neither is wrong. But this flame is not yours." The grove-keeper does not move from the wellspring.'
  topics:
    rumor:
      - '"Read the testament in the bark if you can read the green. The tree keeps a longer memory than any archive: it remembers the people before us, and how the jungle came for them. A warning, if you have the wit to take it."'

# The Understory (forest-floor wilderness, dispersal leveling 22-24)
understory_boar:
  name: a root-boar
  location: the_understory
  keywords: [boar, root, understory, pig]
  dialogue:
    - A root-boar the size of a pony heaves up from the leaf-mould, tusks hung with torn root, and squares to charge.
  hp: 68
  atk: 12
  aggressive: true
  attack_element: ERT
  level: 22
  tier: normal  # the understory's leveling ground, an alternative to the mire for fresh Verdance climbers
  loot: {ember_shard: 3, glowcap: 1, nothing: 2}

understory_thornwolf:
  name: a thornwolf
  location: the_understory
  keywords: [thornwolf, wolf, understory, pack]
  dialogue:
    - A thornwolf slips from the buttress-roots, then another at your flank -- they hunt in a pack, and they have your scent.
  hp: 60
  atk: 14
  aggressive: true
  attack_element: WND
  level: 23
  tier: normal  # the understory's pack-threat; the glowcap guardian
  loot: {ember_shard: 3, glowcap: 1, nothing: 2}

# The Sunken Ziggurat ruin-delve (a forgotten civilization, 25 -> 28 -> 30)
causeway_strangler:
  name: a root-strangler
  location: the_overgrown_causeway
  keywords: [strangler, root, causeway, vine]
  dialogue:
    - A knot of strangling root pulls loose from the old glyph-stones, blind and questing, and reaches for the warmth of you.
  hp: 78
  atk: 15
  aggressive: true
  attack_element: ERT
  level: 25
  tier: normal  # the ruin approach, the delve's first tier
  loot: {ember_shard: 4, glowcap: 1, nothing: 2}

ziggurat_vinewraith:
  name: a vine-wraith
  location: the_ziggurat_steps
  keywords: [wraith, vine, ziggurat, warden]
  dialogue:
    - '"Turn back," the vine-wraith rasps through a throat of dead root -- the last warden of a dead faith, bound to the stair. "The god is kept. The god is not for you." It does not turn back either.'
  hp: 118
  atk: 18
  aggressive: true
  attack_element: DRK
  resistances: {DRK: Resist, HLY: Weak}  # a dead faith's warden: radiance unbinds it
  level: 28
  tier: elite  # the ziggurat's mini-boss gate (x3 reward), guarding the vault stair
  drops: [greater_healing_draught]
  loot: {ember_shard: 5, glowcap: 2, nothing: 2}

ziggurat_rootpriest:
  name: the Rootpriest-that-Endured
  location: the_ziggurat_vault
  keywords: [rootpriest, priest, ziggurat, god, endured]
  dialogue:
    - Half-corpse and half-tree, the Rootpriest unfolds from the choked reliquary -- the thing that swallowed its own priesthood to outlast its age, and did. "I endured," it breathes, in a hundred swallowed voices. "You will not."
  hp: 240
  atk: 22
  aggressive: true
  attack_element: ERT
  resistances: {ERT: Resist, PSN: Resist, FIR: Weak}  # a thing of dead wood: fire is its undoing
  level: 30
  tier: boss  # the Sunken Ziggurat's climax (x10 reward): the forgotten people's undying god
  drops: [rootpriest_censer, greater_healing_draught]
  loot: {ember_shard: 8, glowcap: 3, nothing: 1}

# --- The Rimefall expansion life (Great Creation Campaign): the Silent Anvil's cloister, the riming-
# --- fields' cold hunters, Frosthold's frozen echoes, and the Frostbound Smith. Banded 40-48. ---

# The Silent Cloister (non-combat: the doctrine of restraint)
cloister_master:
  name: the cloister-master of the Silent Anvil
  location: the_silent_cloister
  keywords: [master, cloister, anvil, monk]
  dialogue:
    - '"You come warm into a frozen shrine, Forger, and I will not stop you. But learn why we keep it. The golden age Forged everything it could and froze in the doing of it -- pride is a heat, and heat has a price the ice is still paying. We Forge nothing here. We keep. There is a making in restraint your Grand Forge has forgotten."'
  topics:
    rumor:
      - '"West on the floe stands Frosthold, a second city the ice took whole. Its people still walk their last market-day, and its great forge still holds the Frostbound Smith mid-strike. Wake it and it will finish its work on you. If you must go, go warm and go armed, and do not wake the Frozen Court beyond -- the Rime-King is one waking the world would not survive."'

cloister_novice:
  name: a novice of the Silent Anvil
  location: the_silent_cloister
  keywords: [novice, cloister, anvil, sweeper]
  dialogue:
    - The novice sweeps a rime that keeps falling, patient as stone. "The master says the sweeping is the lesson. The ice always comes back. So do we. That is the whole of the order, if you want it in one broom-stroke."

# The Riming Fields (ice-floe wilderness leveling 40-42, dispersal off the main chain)
rime_wolf:
  name: a rime-wolf
  location: the_riming_fields
  keywords: [wolf, rime, fields, pack]
  dialogue:
    - A rime-wolf, its coat grown through with frost-glass, courses down a pressure-ridge with the pack close behind.
  hp: 140
  atk: 24
  aggressive: true
  attack_element: ICE
  level: 40
  tier: normal  # the riming-fields leveling ground, an alternative to the glass-gallery chain
  loot: {ember_shard: 5, rime_crystal: 1, nothing: 2}

field_ice_wight:
  name: an ice-wight
  location: the_riming_fields
  keywords: [wight, ice, fields, frozen]
  dialogue:
    - Something rises from a frozen well on the floe, a shape of standing ice with a cold light where its heart should be, and turns toward your warmth.
  hp: 155
  atk: 26
  aggressive: true
  attack_element: ICE
  resistances: {ICE: Resist, FIR: Weak}  # a thing of ice: fire unmakes it
  level: 42
  tier: normal  # the riming-fields' harder tier; the rime-crystal guardian
  loot: {ember_shard: 6, rime_crystal: 1, nothing: 2}

# The Glassway + Frosthold (a second preserved city, a delve)
glassway_revenant:
  name: a frost-revenant
  location: the_glassway
  keywords: [revenant, frost, glassway, dead]
  dialogue:
    - A frost-revenant keeps its errand down the frozen avenue, a citizen of the golden age still walking to a shop that closed an age ago, and it does not like the warmth you bring.
  hp: 172
  atk: 28
  aggressive: true
  attack_element: ICE
  level: 43
  tier: normal  # the approach to Frosthold, the delve's outer tier
  loot: {ember_shard: 6, rime_crystal: 2, nothing: 2}

frosthold_echo:
  name: the frost-echo of the market-master
  location: frosthold
  keywords: [echo, market, master, frosthold]
  dialogue:
    - Neither living nor wholly gone, the frost-echo keeps the frozen square. "Market's open," it says, to no one, to you. "Best glass in the north, before the... before the..." It forgets, the way the frozen do, and begins again. "Market's open."
  topics:
    rumor:
      - '"The forge at the square''s heart still holds a work half-poured. The Smith stands over it, waiting for a warmth to finish by. Do not be that warmth unless you can take the heat it will give back. What it forged, though... the golden age never made better. It is in there still, if you can leave with it."'

frostbound_smith:
  name: the Frostbound Smith
  location: the_frozen_forge
  keywords: [smith, frostbound, forge, frosthold]
  dialogue:
    - The Frostbound Smith turns from a pour frozen an age mid-fall, its hammer lifting, its eyes two cold sparks waking to the warmth you brought. "You will do," it says, without malice, and swings to finish a work long overdue: you into the piece.
  hp: 520
  atk: 34
  aggressive: true
  attack_element: ICE
  resistances: {ICE: Immune, FIR: Weak}  # a golden-age master frozen mid-strike: ice cannot touch it, only fire truly bites
  level: 48
  tier: boss  # Frosthold's climax (x10 reward): a preserved master-smith, below the Rime-King (52)
  drops: [frostbound_hammer, greater_healing_draught]
  loot: {ember_shard: 12, rime_crystal: 4, nothing: 1}

# --- The Kingsroad Beacon's watcher (Great Creation Campaign): a lone Silent Anvil pilgrim keeping a
# --- dead beacon's watch, so the viewpoint is lived-in, not empty. ---
beacon_pilgrim:
  name: a pilgrim of the Silent Anvil
  location: the_kingsroad_beacon
  keywords: [pilgrim, beacon, anvil, watcher]
  dialogue:
    - The pilgrim keeps the cold beacon-watch, wrapped against a wind that never warms. "I light it each dusk, though no beacon north answers anymore. Someone should keep the road, even a road no one walks. Especially that road. Read the plaque, Forger. Nine beacons. I keep the fourth. The rest keep themselves, under the ice."
  topics:
    rumor:
      - '"From here you see the whole white Reach. Frosthold west, where the Smith still stands at his pour. The Court far north, where the King sleeps and had better keep sleeping. And between them, five drowned beacons the deep ice took. A patient Forger could find them. A wise one lets the road sleep with the King."'
# --- The Kollforge expansion life (Great Creation Campaign): the caldera-market's Kollkin, the
# --- obsidian flats' fire-hunters, and the cooled Kollhold's slag-wraiths. Banded 50-56. ---

# The Caldera-Market (non-combat: the Kollkin creed, opposite of the Silent Anvil's)
shelf_crier:
  name: a shelf-crier of the Caldera-Market
  location: the_caldera_market
  keywords: [crier, shelf, market, kollkin]
  dialogue:
    - '"Hot wares, Forger, the hottest in the world! The frozen north keeps its dead cities and calls it wisdom. We keep ours BURNING and call it living. A cooled land is a corpse -- ask Ashkoll, below, that let its fire gutter. We will not make that mistake. Buy hot, spend hot, live hot."'
  topics:
    rumor:
      - '"Down the cooling-shelf lies Ashkoll, a Kollhold that let its caldera die. To us there is no worse grave. Its Vent-master still keeps the dead square, a slag-echo of a fool who would not tend his fire, and its Forgeborn went cold and MAD in the dark. What Ashkoll forged in its last hot age is still down there. Bring it up into the light. Better it burns in a living hand than lies cold in a dead one."'

caldera_child:
  name: a caldera-child
  location: the_caldera_market
  keywords: [child, caldera, kid, kollkin]
  dialogue:
    - The caldera-child leans over the warm rail, unafraid of the glow below. "The rock is warm because the world is still being made under it! Grandmother says a cold floor means a dead house. Ours is never cold. Feel it!"

# The Obsidian Flats (lava-shelf wilderness leveling 50-52, dispersal off the entry)
flats_ember_lynx:
  name: an ember-lynx
  location: the_obsidian_flats
  keywords: [lynx, ember, flats, cat]
  dialogue:
    - An ember-lynx pads across the black glass, its coat run through with living Forgelight, and fixes you with two coal-bright eyes.
  hp: 210
  atk: 30
  aggressive: true
  attack_element: FIR
  level: 50
  tier: normal  # the obsidian-flats leveling ground, an alternative to the anvil-vents chain
  loot: {ember_shard: 8, emberglass: 1, nothing: 2}

flats_slag_hulk:
  name: a slag-hulk
  location: the_obsidian_flats
  keywords: [hulk, slag, flats, molten]
  dialogue:
    - A slag-hulk heaves up out of a cooling flow, a thing of half-set stone and trapped fire, and grinds toward your warmth.
  hp: 240
  atk: 33
  aggressive: true
  attack_element: FIR
  resistances: {FIR: Resist, WTR: Weak}  # a thing of molten slag: water cracks it
  level: 52
  tier: normal  # the flats' harder tier; the emberglass guardian
  loot: {ember_shard: 9, emberglass: 1, nothing: 2}

gorge_cinder_drake:
  name: a nesting cinder-drake
  location: the_cinder_gorge
  keywords: [drake, cinder, gorge, dragon]
  dialogue:
    - The cinder-drake rises off its ledge in a downdraft of ash, wings spread across the gorge, and screams a challenge that shakes cinder from the walls.
  hp: 320
  atk: 36
  aggressive: true
  attack_element: FIR
  resistances: {FIR: Immune, WTR: Weak}  # a drake of living fire: fire cannot touch it, water bites deep
  level: 54
  tier: elite  # the flats' apex (x3 reward): the cinder-gorge's jealous nesting drake
  drops: [greater_healing_draught, drakescale_mantle]
  loot: {ember_shard: 12, emberglass: 3, nothing: 2}

# The Cooled Kollhold (a dead-city delve, 52 -> 56)
shelf_slag_wraith:
  name: a slag-wraith
  location: the_cooling_shelf
  keywords: [wraith, slag, shelf, kollkin]
  dialogue:
    - A slag-wraith drifts up off the cold grey rock -- a Kollkin who died the moment its heat did, still cold, still reaching for a warmth to steal.
  hp: 260
  atk: 34
  aggressive: true
  attack_element: FIR
  level: 52
  tier: normal  # the dead-city approach, the delve's outer tier
  loot: {ember_shard: 9, nothing: 3}

ashkoll_echo:
  name: the slag-echo of the Vent-master
  location: dead_ashkoll
  keywords: [echo, vent, master, ashkoll]
  dialogue:
    - A slag-echo keeps the dead forge-square, cold as the stone. "The pour is late," it says, to no one. "The caldera runs low. Bank the fire, someone. Bank the... it's so cold. When did it get so cold?" It does not remember that the answer is: an age ago, and forever.
  topics:
    rumor:
      - '"The Forgeborn at the cold hearth did not die when Ashkoll did. It went on tending a fire that would not light, and the tending drove it mad. It hates anything that still burns. You burn, Forger. It will know. But the master-work in the dead pit is worth the walk into a mad thing''s hate. Ashkoll''s best, forged before the cold. Take it up to Emberkoll. Let it burn again."'

ashen_forgeborn:
  name: the Ashen Forgeborn
  location: the_cold_hearth
  keywords: [forgeborn, ashen, hearth, cold]
  dialogue:
    - Living Forgework gone cold and mad, the Ashen Forgeborn turns from a dead pit it has tended a thousand years. "You burn," it grinds, in a voice of settling slag. "The hearth is cold and YOU BURN. Give it here. Give the fire back." It comes to take your warmth for a fire that will never light.
  hp: 560
  atk: 38
  aggressive: true
  attack_element: FIR
  resistances: {FIR: Weak, WTR: Resist}  # cold dead Forgework, starved of heat: fire overloads what it craves
  level: 56
  tier: boss  # the Cooled Kollhold's climax (x10 reward): a Forgeborn that went cold and mad, below the Vent-Lord (62)
  drops: [ashkoll_masterbrand, greater_healing_draught]
  loot: {ember_shard: 14, emberglass: 4, nothing: 1}

# --- The Sundered Sky expansion life (Great Creation Campaign): the anchor-quarter's Skyborn, the
# --- drifting-shoals' wind-hunters, and the falling shard's drift-wraiths. Banded 60-66. ---

# The Anchor-Quarter (non-combat: the Skyborn creed, the fourth of the four peoples' answers)
capstan_keeper:
  name: a capstan-keeper of the Anchor-Quarter
  location: the_anchor_quarter
  keywords: [capstan, keeper, quarter, skyborn]
  dialogue:
    - '"Mind the capstan, Forger. This chain is the only thing between Highgate and the long fall, and we have kept it taut for a thousand years. The frozen north froze, the molten west cooled, the drowned Reach sank -- and we? We never landed at all. That is the Skyborn way. You do not have to touch the ground to have a home. You only have to keep the anchor."'
  topics:
    rumor:
      - '"West off the shoals hangs a shard that lost its Forgework: the Falling Hold, dropping so slow its people never knew. Its anchor snapped an age ago and its Warden hauls on the broken chain still, gone wrong in the long drop. Cut what drifts free by its dead capstan and bring it up, if the Warden lets you. And do not pity the fall. Every shard falls. The trick is only to fall slowly enough to live a life on the way down."'

sky_child:
  name: a sky-child
  location: the_anchor_quarter
  keywords: [child, sky, skyborn, kid]
  dialogue:
    - The sky-child runs the drift-rail over a mile of open cloud without a tether, laughing. "You hold on so TIGHT! The wind holds you if you let it. Grandfather says the ground-born never learn that. Are you ground-born? You hold on like one."

# The Drifting Shoals (sky-wind wilderness leveling 60-62, dispersal off the Court chain)
shoals_stormkin:
  name: a stormkin
  location: the_drifting_shoals
  keywords: [stormkin, storm, shoals, wind]
  dialogue:
    - A stormkin rides an updraft off a drifting shard, a knot of living weather and old Forgelight, and turns down the wind at your warmth.
  hp: 340
  atk: 40
  aggressive: true
  attack_element: LGT
  level: 60
  tier: normal  # the drifting-shoals leveling ground, an alternative to the drifting-reach chain
  loot: {ember_shard: 10, stormglass: 1, nothing: 2}

shoals_sky_ray:
  name: a sky-ray
  location: the_drifting_shoals
  keywords: [ray, sky, shoals, glide]
  dialogue:
    - A sky-ray slides out of the shard-lee on a still wing, wide as a sail, and banks to take you off the sway-bridge.
  hp: 360
  atk: 42
  aggressive: true
  attack_element: WND
  resistances: {WND: Resist, ERT: Weak}  # a thing of the open air: the weight of stone drags it down
  level: 62
  tier: normal  # the shoals' harder tier; the stormglass guardian
  loot: {ember_shard: 11, stormglass: 1, nothing: 2}

# The Falling Shard (a dead-city delve, 64 -> 66)
span_fall_revenant:
  name: a fall-revenant
  location: the_tilting_span
  keywords: [revenant, fall, span, tilting]
  dialogue:
    - A fall-revenant keeps the tilting way, one of those the slow drop took and never finished taking, still falling behind its own eyes, and it reaches for the warmth that stands where it cannot.
  hp: 380
  atk: 44
  aggressive: true
  attack_element: WND
  level: 64
  tier: normal  # the falling-shard approach, the delve's outer tier
  loot: {ember_shard: 12, stormglass: 2, nothing: 2}

falling_hold_echo:
  name: the drift-echo of the anchor-keeper
  location: the_falling_hold
  keywords: [echo, drift, keeper, hold]
  dialogue:
    - A drift-echo keeps the tilting square, everything about it a hand off the ground and never landing. "The chain holds," it says, certain, an age too late. "We are moored. We are not falling. My father kept the anchor and his father before, and we do not fall. We are Highgate's equal, we are... why is the floor so far? When did the floor get so far?"
  topics:
    rumor:
      - '"The Warden below still hauls on the broken chain. It does not know the anchor is gone. It does not know we fell. It will not let you near the capstan, because near the capstan is where the chain was, and the chain is all it has left. What drifts there was the hold''s best. Take it up where a chain still holds. Let something of us land, even if we never will."'

broken_anchor_warden:
  name: the Broken Anchor-Warden
  location: the_anchor_deep
  keywords: [warden, anchor, broken, capstan]
  dialogue:
    - The Broken Anchor-Warden hauls on a chain that ends in the open air, and has for an age. "The shard is moored," it grinds, straining at nothing. "I hold it aloft. I HOLD IT." It turns on you the strength it has spent a thousand years spending on a broken chain, and it is still terribly strong.
  hp: 640
  atk: 46
  aggressive: true
  attack_element: LGT
  resistances: {LGT: Resist, ERT: Weak}  # a thing of the anchored air: grounded weight breaks its hold
  level: 66
  tier: boss  # the Falling Hold's climax (x10 reward): a guardian holding a shard aloft on a chain that broke long ago, below the Court-Warden (72)
  drops: [anchor_warden_chain, greater_healing_draught]
  loot: {ember_shard: 16, stormglass: 4, nothing: 1}
# --- The Cinderwaste ambient life (Great Creation Campaign, Phase I: geography-first). One presence
# --- per room to meet the world's no-empty-room law; dense population is a later campaign. The Ashborn
# --- keep the settled rooms; the waste keeps the rest. Level-banded 15-40. ---

grey_ferryman:
  name: a grey-water ferryman
  location: the_ashen_crossing
  keywords: [ferryman, grey, crossing, boatman]
  dialogue:
    - '"Last charted water, this. Past here the sea gives up and the land ain''t much better. The Cinderwaste don''t hate you, Forger -- it just don''t notice you, which out here is worse. Saltring''s your only door. Walk to it before dark."'

grey_ash_crab:
  name: a grey ash-crab
  location: the_grey_shore
  keywords: [crab, ash, shore, grey]
  dialogue:
    - An ash-crab the colour of cold cinder sidles up the dead tideline, claws wide, defending a shore the tide abandoned.
  hp: 44
  atk: 9
  aggressive: true
  attack_element: ERT
  level: 15
  tier: normal  # the Cinderwaste's shore, the Grey Reach's low-end leveling ground
  loot: {ember_shard: 3, nothing: 2}

ring_warden:
  name: the ring-warden of Saltring
  location: saltring
  keywords: [warden, ring, saltring, gate]
  dialogue:
    - '"Saltring keeps three laws, Forger: pay the water-price, keep the road-code, and don''t open what the waste sealed. Break the first two and the clans settle it. Break the third and the waste settles it, and the waste don''t leave enough to bury. Market''s through the ring; the clan-quarter''s south. Spend, and go careful."'
  topics:
    rumor:
      - '"West and south the dunes give out at the Ashline, where the world just... stops. Past the glass-market a scoured hold stands half-unmade, and its one whole vault the last maker died sealing. Every salvage-clan wants it open. Every one that opened it is a colossus''s trophy now. The Glass Market buys what you drag out. IF you drag out."'

salt_factor:
  name: a salt-factor of the Salt-Market
  location: the_salt_market
  keywords: [factor, salt, market, trader]
  dialogue:
    - '"Water, salvage, or raw Ember -- I scale all three, and out here water''s dearest of the three, so drink before you haggle. A thing Unforged fetches more than a thing made; the waste inverts every price you knew."'
  shop:
    sells:
      healing_draught: 14
      greater_healing_draught: 36
      water_ration: 8
    buys:
      ember_shard: 6
      cinderglass_shard: 12

clan_elder:
  name: a salvage-clan elder
  location: the_ring_quarter
  keywords: [elder, clan, quarter, salvage]
  dialogue:
    - '"The road-code''s simple: leave the waymoot cache fuller than you found it, and never leave a clansman to the waste. We don''t make things out here, Forger. We don''t need to. The old world made enough for a hundred lifetimes before it broke, and we''re the ones patient enough to pick it up."'

glass_broker:
  name: a glass-broker
  location: the_glass_market
  keywords: [broker, glass, market, dealer]
  dialogue:
    - '"No questions in the Glass Market, Forger, and no refunds. Anything Unforged, I''ll buy or sell -- relics that shouldn''t exist, Ember still raw, salvage off the scoured hold. The tunnels west go deeper than the market. Don''t follow the glow past the last stall unless you like the dark biting back."'
  shop:
    sells:
      greater_healing_draught: 36
      cinderglass_shard: 20
    buys:
      cinderglass_shard: 14
      ember_shard: 7

glassways_lurker:
  name: a glass-lurker
  location: the_glassways
  keywords: [lurker, glass, glassways, dark]
  dialogue:
    - Something slides along a glass bend, catching the trapped Ember-glow in a hundred facets, and turns its cold weight toward your warmth.
  hp: 96
  atk: 16
  aggressive: true
  attack_element: DRK
  level: 24
  tier: normal  # the glassways, the crater delve's threat and the cinderglass guardian
  loot: {ember_shard: 5, cinderglass_shard: 1, nothing: 2}

dunes_ash_jackal:
  name: an ash-jackal
  location: the_grey_dunes
  keywords: [jackal, ash, dunes, pack]
  dialogue:
    - An ash-jackal lifts from a dune-trough, grey on grey, and the pack lifts with it, cutting your walking-line off from the poles.
  hp: 62
  atk: 12
  aggressive: true
  attack_element: ERT
  level: 18
  tier: normal  # the open-dune wilderness, a dispersal leveling ground
  loot: {ember_shard: 4, nothing: 2}

waymoot_keeper:
  name: the waymoot-keeper
  location: the_ashborn_waymoot
  keywords: [keeper, waymoot, cache, ashborn]
  dialogue:
    - The waymoot-keeper ladles you water without being asked, road-code before greeting. "Drink. Rest. The waste will still be there. Leave the cache fuller than you found it if you can, and if you can''t, leave it anyway and remember you owe the road. Everyone out here is owed to, and owes. That''s the only law that keeps us alive."
  topics:
    rumor:
      - '"South of here the Ashline runs the whole horizon. Stand at it and you''ll see the world''s hem, where the making just... stopped. Some fools try to walk into the un-ness. The line-warden turns back the ones she can. The waste keeps the ones she can''t. Go look. Don''t go in."'

canals_salt_wraith:
  name: a salt-wraith
  location: the_drowned_canals
  keywords: [wraith, salt, canals, drowned]
  dialogue:
    - A salt-wraith rises from a brine-trench, one of the old canal-farmers the drought drowned in reverse, crusted white and reaching for the warmth of the living.
  hp: 78
  atk: 14
  aggressive: true
  attack_element: WTR
  level: 20
  tier: normal  # the drowned-canal flats, the Grey Reach's mid leveling ground
  loot: {ember_shard: 4, nothing: 2}

line_warden:
  name: the line-warden of the Ashline
  location: the_ashline
  keywords: [warden, line, ashline, ashborn]
  dialogue:
    - The line-warden does not look away from the shimmer where the world ends. "Stand as long as you like, Forger. Look all you want. But if you feel it pulling -- and you will -- you step back. The un-ness isn''t death. Death is a thing that happened. The un-ness is a thing that never got finished happening. I''ve seen what walks out of it. Step back."
  topics:
    rumor:
      - '"West along the scar stands the scoured hold, half-taken, its walls ending in open air. A cinder-colossus keeps the one sealed vault. The waste welded that thing out of the hold''s own broken Forgework, grew it around the scar like the world scabbing over a wound. What''s in the vault is worth a clan''s fortune. Getting it is worth a clan''s funeral."'

scoured_cinder_husk:
  name: a cinder-husk
  location: the_scoured_reach
  keywords: [husk, cinder, scoured, hold]
  dialogue:
    - A cinder-husk turns in a doorway that opens on nothing, one of the hold's own people left half-Forged when the Unforging passed, still keeping a room in a house that ends in mid-air.
  hp: 130
  atk: 20
  aggressive: true
  attack_element: ERT
  level: 30
  tier: normal  # the scoured-hold ruin, the delve's outer tier
  loot: {ember_shard: 6, cinderglass_shard: 1, nothing: 2}

vault_cinder_colossus:
  name: the cinder-colossus of the sealed vault
  location: the_unfinished_vault
  keywords: [colossus, cinder, vault, scoured]
  dialogue:
    - The waste itself stands guard: a colossus welded from the scoured hold's own broken Forgework, grown around the vault-scar like iron scar-tissue. It was never made. It accreted. And it turns on you the weight of a whole half-unmade hold.
  hp: 460
  atk: 30
  aggressive: true
  attack_element: ERT
  resistances: {ERT: Resist, CRS: Weak}  # welded from unmade Forgework: the unmaking-curse is what still bites it
  level: 40
  tier: boss  # the Scoured Reach's climax (x10 reward): the waste's own guardian on the last sealed vault
  drops: [scoured_vault_seal, greater_healing_draught]
  loot: {ember_shard: 10, cinderglass_shard: 4, nothing: 1}

# --- The Cinderdeep ambient life (Great Creation Campaign, Phase I): the Unforged - entropy made
# --- hostile - escalating with depth, plus the sunken kiln's echo and the Hollow King. Banded 40-52.
# --- The unmade is undone by the made: light (HLY) and fire (FIR) bite what unmaking cannot. ---

verge_unthing:
  name: an un-thing
  location: the_unmaking_verge
  keywords: [unthing, thing, verge, unmade]
  dialogue:
    - A shape the eye cannot hold drifts the soft dark, less a creature than a place where a creature is being slowly forgotten, and it drifts toward the stubborn made-ness of you.
  hp: 200
  atk: 28
  aggressive: true
  attack_element: DRK
  resistances: {DRK: Resist, HLY: Weak}  # the unmade recoils from the made light
  level: 40
  tier: normal  # the Cinderdeep verge, the deep's near-mouth threat below the Cinderwaste
  loot: {ember_shard: 8, nothing: 3}

greydark_unforged:
  name: an Unforged drifter
  location: the_greydark
  keywords: [unforged, drifter, greydark, grey]
  dialogue:
    - Out of the grey half-real an Unforged resolves just enough to reach you: entropy that learned to want, hungry for anything that still holds a shape.
  hp: 220
  atk: 30
  aggressive: true
  attack_element: CRS
  resistances: {CRS: Resist, HLY: Weak, FIR: Weak}  # unmaking-curse made flesh; making's fire and light undo it
  level: 42
  tier: normal  # the Greydark hub, the near-deep leveling ground
  loot: {ember_shard: 9, nothing: 3}

hollow_kin:
  name: a hollow-kin
  location: the_hollow_march
  keywords: [hollow, kin, march, unforged]
  dialogue:
    - A hollow-kin unfolds from a cinder-well, a thing all edge and appetite, jealous of the raw unmade Ember pooled in the seam.
  hp: 240
  atk: 32
  aggressive: true
  attack_element: CRS
  resistances: {CRS: Resist, FIR: Weak}  # a well-guardian of the unmade; fire is its undoing
  level: 44
  tier: normal  # the hollow-march lateral wander and the cinder-well gather's guardian
  loot: {ember_shard: 9, unmade_ember: 1, nothing: 2}

unforged_reach_devourer:
  name: an Unforged devourer
  location: the_unforged_reach
  keywords: [devourer, unforged, reach, unmade]
  dialogue:
    - Here the Unforged are settled and certain, and the devourer that turns toward you has eaten the made for so long it has grown a kind of terrible shape, all mouth and forgetting.
  hp: 300
  atk: 36
  aggressive: true
  attack_element: CRS
  resistances: {CRS: Resist, DRK: Resist, HLY: Weak}  # deep unmaking; only the made light still bites
  level: 46
  tier: elite  # the Unforged Reach's apex (x3 reward), the gate to the sunken kiln
  drops: [greater_healing_draught]
  loot: {ember_shard: 12, unmade_ember: 2, nothing: 2}

kiln_echo:
  name: the kiln-echo of the master-smith
  location: the_sunken_kiln
  keywords: [echo, kiln, smith, master]
  dialogue:
    - A kiln-echo keeps the dead furnace-square, half-unmade, still working a cold forge. "Firing's due," it says, to no one, to you. "Kiln's cold. When did the kiln go cold? I made a thing to last. I made it so WELL. Why is it grey? Why is everything grey?" It cannot remember that the deep ate the answer along with the town.
  topics:
    rumor:
      - '"Down past the square the Hollow King holds the Umbral Deep - the deepest thing that still holds a shape, and it holds one only to mock the making. It ate my town. It ate my last firing. If you go down, bring the made light and the making fire, for the King is everything the deep does to a maker who stays too long. And Forger - what I forged last is still in the kiln, unmade but unbroken. Take it up into a world that still sets. Let one thing of mine leave the grey."'

hollow_king:
  name: the Hollow King
  location: the_umbral_deep
  keywords: [king, hollow, umbral, unforged]
  dialogue:
    - The Umbral Deep gathers itself into a shape that rules it: the Hollow King, an Unforged grown vast on an age of eating the made, a maker's nightmare turned inside out. "I unmake," it says, in the voice of everything that was ever forgotten. "You made yourself all this way down. Let me finish you the other direction."
  hp: 720
  atk: 44
  aggressive: true
  attack_element: CRS
  resistances: {CRS: Immune, DRK: Resist, HLY: Weak, FIR: Weak}  # the deep's crown of unmaking; only the made light and fire answer it
  level: 52
  tier: boss  # the Cinderdeep's built-descent climax (x10 reward): the deep's answer to the surface kings
  drops: [hollow_crown, greater_healing_draught]
  loot: {ember_shard: 18, unmade_ember: 5, nothing: 1}

# --- Emberreach City interiors life (Great Creation Campaign, Phase I, Layer 4): the capital's people,
# --- so the flagship city feels lived-in. Mostly non-combat; the undercity keeps two low foes. ---

flamekeeper:
  name: a flamekeeper of the First Flame
  location: the_first_flame_church
  keywords: [flamekeeper, keeper, flame, priest]
  dialogue:
    - '"Warm yourself, Forger. The First Flame is not a god to beg, it is a fire to keep -- the faith that the world was Made, and unmade, and can be Made again by hands that will not let the light go out. You Forge? Then you already pray, whether you name it or not. Read the creed if you would name it."'

grand_archivist:
  name: the archivist of the Grand Archive
  location: the_grand_archive
  keywords: [archivist, archive, loremaster, scholar]
  dialogue:
    - '"Quiet, in the Archive. This is the world''s memory, salvaged a page at a time from what the Unforging tried to forget. The Loremaster keeps the deepest shelves; I keep the rest, and I will show you the world''s own case-file if you have the wit to read it. Everything begins as a record. Even you."'

tankard_barkeep:
  name: the barkeep of the Cinder Tankard
  location: the_cinder_tankard
  keywords: [barkeep, tankard, tavern, host]
  dialogue:
    - '"Cinder-ale or news, Forger, and the ale''s cheaper. Whole Rekindling drinks here -- coast-Forgers, salvage-crews, Wardens off the march. You want to know what''s happening in the world, you don''t read the Archive, you buy a round in the Tankard. Beds up the back if the ale wins."'
  topics:
    rumor:
      - '"Everyone comes through here eventually. Word is the Ashwastes salvage is paying, if you don''t mind the glass-craters. Word is the Warden Gate''s turning back more folk than it lets north. And word is some fool opened a mouth of the Cinderdeep down past the Cinderwaste and something came up grey. Buy a round and you''ll hear worse."'
  shop:
    sells:
      healing_draught: 12
      cinder_ale: 4
    buys:
      ember_shard: 5

wayhouse_innkeeper:
  name: the Wayhouse innkeeper
  location: the_wayhouse_inn
  keywords: [innkeeper, wayhouse, inn, host]
  dialogue:
    - '"A bed, a banked fire, and nothing asked -- that''s the Wayhouse. You''re owed rest, Forger, whoever you are and whatever you did to get here. The city''s loud and the road''s long. Sleep. The Rekindling will still need making in the morning."'

making_master:
  name: the Making-master
  location: the_making_hall
  keywords: [making, master, guild, smith]
  dialogue:
    - '"So you would Make. Good. The Making Orders hold it the highest calling there is -- to take the world''s raw Ember and give it a shape that lasts. Bring me work worth a rank and I''ll judge it honestly, which is to say hard. A masterwork is not a thing you claim. It is a thing that survives me looking at it."'

knowing_master:
  name: the Knowing-master
  location: the_knowing_hall
  keywords: [knowing, master, guild, loremaster]
  dialogue:
    - '"The Making Orders shape the world; we understand it, and understanding is the older craft. To keep a thing you must first know what it is -- read the clue, trace the cause, close the case. The Knowing Orders make scholars the way the yard makes soldiers: by asking the question until it answers back."'

gathering_master:
  name: the Gathering-master
  location: the_gathering_hall
  keywords: [gathering, master, guild, pathfinder]
  dialogue:
    - '"Before a thing is made or known, it is FOUND. The Gathering Orders walk the far roads -- every Reach, every mouth of the deep -- and bring the raw world home. You want to see the map? Every wall in this hall is one. The Ashwastes, the Quenchmere, the new grey mouth below the Cinderwaste. The world''s bigger than the coast you came from, Forger. Come see how much."'
  topics:
    rumor:
      - '"Seven Reaches across the seas, the Forgeward Road east to the Forge, the Cinderdeep growing down under all of it. A Gathering Forger could walk a lifetime and not see it twice. Start near -- the Reachwood, the Ashwastes, the coast. End far. Everyone does."'

city_dockmaster:
  name: the river dockmaster
  location: the_river_docks
  keywords: [dockmaster, docks, quay, river]
  dialogue:
    - '"Barges in, barges out, tide don''t care about your hurry. The Cooling-Sea trade comes up this river into the capital and the capital''s work goes back down -- salvage, steel, Forgergoods for the Quenchmere ferries. You want passage to the drowned Reach, this is where it starts. Mind the cargo-hooks."'

undercity_drain_lurker:
  name: a drain-lurker
  location: the_undercity
  keywords: [lurker, drain, undercity, dweller]
  dialogue:
    - Something that has lived too long in the dark under the forge unfolds from a sealed cellar-mouth, pale and quick and jealous of the salvage it hoards.
  hp: 30
  atk: 6
  aggressive: true
  attack_element: DRK
  level: 6
  tier: normal  # the capital's undercity: a low city-dungeon for fresh Forgers, under the Grand Forge
  loot: {ember_shard: 2, nothing: 2}

sewers_drain_warden:
  name: a drain-warden of the watch
  location: the_sewers
  keywords: [warden, drain, sewers, watch]
  dialogue:
    - '"Watch keeps even the drains, Forger -- a city''s only as safe as its gut. Drain-kin breed down here, and worse hides from the light above. Mind yourself. And if you find a sealed cellar the city forgot, what''s in it is salvage, and salvage is the finder''s, so long as you don''t mind sharing the dark with what else wants it."'

walls_captain:
  name: the wall-captain of the gate-watch
  location: the_city_walls
  keywords: [captain, wall, watch, gate]
  dialogue:
    - The wall-captain does not lower the glass from the horizon. "First line of the capital, this wall. The Grand Forge is the heart, but a heart needs a rib-cage. Kindlands out there look green and mostly are -- but the road brings what the road brings, and the Wardenmarch beyond only holds because we hold here. Look your fill. Then go do something useful."
# --- Tidewharf City interiors life (Great Creation Campaign, Phase I, Layer 4): the free-port's people.
# --- Mostly non-combat; the bilge and underhull keep the city's low threats. Banded 12-18. ---

exchange_broker:
  name: an exchange-broker
  location: the_salvage_exchange
  keywords: [broker, exchange, salvage, trader]
  dialogue:
    - '"Buying or selling, Forger? The Exchange moves the whole drowned Reach by the crate. Salvage up from the wrecks, wreck-rights on paper, deep-lung Forgework no other port can lift. A thing off the bottom of the Quenchmere is worth more dry than it ever was afloat. Name your side."'
  shop:
    sells:
      healing_draught: 13
      greater_healing_draught: 34
    buys:
      ember_shard: 6
      brine_pearl: 9

bell_keeper:
  name: the bell-keeper of the Drowned Bell
  location: the_drowned_bell
  keywords: [bellkeeper, keeper, bell, barkeep]
  dialogue:
    - '"Welcome to the Bell, Forger. Salvage-crews to port, honest pirates to starboard, and nobody asks which you are so long as your coin''s dry. Whole Quenchmere''s news comes through on the tide. Hammocks up top if the drink wins the argument."'
  topics:
    rumor:
      - '"Guild wants the drowned cities opened; the pirate-clans want the lanes free; the Accord wants everyone to keep drinking and stop shooting. Word is the salvage off the deep Wreckways is cursed, or paying, or both. Word is the bilge is breeding again. And word is a Forger with a strong stomach can make a fortune under the planking. Or feed it."'
  shop:
    sells:
      healing_draught: 13
      water_ration: 7
    buys:
      ember_shard: 5

loft_keeper:
  name: the loft-keeper
  location: the_hull_lofts
  keywords: [loftkeeper, keeper, loft, host]
  dialogue:
    - '"Copper a night, warm and dry above the tide, and I don''t care what you did to earn the copper. The Bell''s loud below but the hull holds the noise down. Sleep, Forger. The free-port keeps the same hours as the sea, which is to say all of them."'

tide_keeper:
  name: a tide-keeper of the drowned
  location: the_tide_shrine
  keywords: [tidekeeper, keeper, shrine, merewright]
  dialogue:
    - '"Light a drowned-lamp if you''ve lost someone to the water, Forger. The First Flame in the capital says the world was made and can be made again. We Merewrights say something quieter: the sea took the old world and KEEPS it, whole and cold and lamp-lit below, and the drowned are not gone, only deep. Read the rail if you''d know the whole of it."'

guild_factor:
  name: a Salvage Guild factor
  location: the_salvage_guildhall
  keywords: [factor, guild, salvage, contract]
  dialogue:
    - '"The Guild has work, Forger, always. Wreck to open, hold to clear, a drowned city that won''t stay drowned. The pay is real and so is the cost -- read the writ before you mark it. We built this hall on a treasure-hull and we do not say how. That should tell you both what the Guild pays and what it takes."'

wharf_master:
  name: the wharf-master
  location: the_captains_wharf
  keywords: [wharfmaster, master, wharf, berth]
  dialogue:
    - '"Berth to the Rimefall, the Kollforge, the Sundered Sky, the Verdance -- every crossing in the world cries off this wharf, and every one wants crew. Coin buys a berth; a strong back earns one. The whole Reach-wide map runs through Tidewharf, Forger. This plank is the crossroads of the world, and it smells like it."'

bilge_crawler:
  name: a bilge-crawler
  location: the_bilge
  keywords: [crawler, bilge, hull, dweller]
  dialogue:
    - Something bred in the free-port's flooded gut hauls itself out of the black water between the keels, pale and swollen, jealous of the salvage in the drowned holds.
  hp: 66
  atk: 12
  aggressive: true
  attack_element: WTR
  level: 14
  tier: normal  # Tidewharf's bilge: a low city-dungeon under the planking, a place for fresh Quenchmere Forgers
  loot: {ember_shard: 3, nothing: 2}

hull_wight:
  name: the hull-wight of the underhull
  location: the_underhull
  keywords: [wight, hull, underhull, drowned]
  dialogue:
    - A hull-wight rises from a treasure-hold no salvage-crew has dared, one of the free-port's own drowned dead, crusted with a fortune it will not let the living lift.
  hp: 130
  atk: 18
  aggressive: true
  attack_element: WTR
  resistances: {WTR: Resist, LGT: Weak}  # a thing of the drowned dark; lightning off the storm-Reaches bites it
  level: 18
  tier: elite  # the underhull's prize (x3 reward): the deepest planked salvage, a drowned-hoard guardian
  drops: [hull_hoard_ring, greater_healing_draught]
  loot: {ember_shard: 6, brine_pearl: 2, nothing: 2}

# --- Mirefast life (Great Creation Campaign, Phase I): the Verdance's trade-town folk + the stiltways
# --- swamp foes + the under-stilt devourer. Banded 22-26. ---
stilt_reeve:
  name: the stilt-reeve of Mirefast
  location: mirefast
  keywords: [reeve, stilt, mirefast, warden]
  dialogue:
    - '"Welcome to Mirefast, Forger -- the one place in the Verdance an outsider''s coin is as good as a Deeprooted''s word. Highbough won''t let your kind up the tree; we''ll take your trade down here and both sides pretend that''s not a slight. Market''s along the planking, tavern''s over the water, and mind the boards after dark -- the swamp comes up through the stilts when it''s hungry."'
  topics:
    rumor:
      - '"Under the town, below the market, something''s grown fat on what the boardwalk drops. We don''t go down the ladder. A Forger who did, and came back up, would have the town''s thanks and whatever the swamp swallowed over the years -- coin, cargo, the odd trader who leaned too far. East on the stiltways the hunting''s good if the mire-serpents don''t hunt you."'

stilt_trader:
  name: a stilt-trader
  location: the_stilt_market
  keywords: [trader, stilt, market, merchant]
  dialogue:
    - '"Ember-bloom, swamp-resin, living-wood -- the Verdance gives what no forge can grow, and I''ll swap it for your steel and salt and news of the dry world. Best stall on the raft, Forger, and the only one that won''t cheat you, which out here I''ll admit is a low bar."'
  shop:
    sells:
      healing_draught: 14
      greater_healing_draught: 36
      mana_draught: 14
    buys:
      ember_shard: 6
      emberbloom: 8

mire_host:
  name: the host of the Mireside
  location: the_mireside_tavern
  keywords: [host, mireside, tavern, barkeep]
  dialogue:
    - '"Sit where the floor sways least, Forger, and drink what the swamp ferments -- you''ll not love it, but you''ll trust it, and out here that''s the same thing. Trader and Deeprooted both drink under my lamps and neither''s knifed the other yet. That''s Mirefast''s whole miracle. Lofts above if the swamp-brew wins."'

boardwalk_loft_host:
  name: a boardwalk loft-host
  location: the_boardwalk_lofts
  keywords: [host, loft, boardwalk, keeper]
  dialogue:
    - '"Screened, dry, and above the biting dark -- best sleep at the Verdance''s edge, Forger. The water rocks you and the canopy sings a mile up. Just don''t lean on the outer rail. The swamp takes one or two a season who forget the swamp is always there, and always awake."'

grove_warden:
  name: a grove-warden of Mirefast
  location: the_grove_shrine
  keywords: [warden, grove, shrine, deeprooted]
  dialogue:
    - '"You may learn the living faith here, Forger, though not in sacred Highbough -- this shrine is for the trade-town''s guests. The Deeprooted do not command wild Ember; we converse with it. The swamp is not scenery. It reads you as you read it. Read the bark, and learn to answer when the living world asks who you are."'

stiltways_serpent:
  name: a mire-serpent
  location: the_stiltways
  keywords: [serpent, mire, stiltways, snake]
  dialogue:
    - A mire-serpent pours out of a stilt-channel, banded like ember-bloom shadow, and rises level with the boardwalk rail.
  hp: 84
  atk: 15
  aggressive: true
  attack_element: PSN
  level: 22
  tier: normal  # the stiltways swamp-approach, a Verdance leveling ground + the emberbloom gather guardian
  loot: {ember_shard: 4, emberbloom: 1, nothing: 2}

stiltways_swarmkin:
  name: a swarm-kin
  location: the_stiltways
  keywords: [swarmkin, swarm, stiltways, reeds]
  dialogue:
    - The reeds along the boardwalk erupt: swarm-kin, a hundred small hungers moving as one appetite, boiling up the stilts toward your warmth.
  hp: 76
  atk: 17
  aggressive: true
  attack_element: PSN
  resistances: {PSN: Resist, FIR: Weak}  # a swarm of the mire; fire scatters what one blade cannot
  level: 24
  tier: normal  # the stiltways' harder tier
  loot: {ember_shard: 4, emberbloom: 1, nothing: 2}

stilt_mire_devourer:
  name: the mire-devourer of the under-stilts
  location: the_stilt_deeps
  keywords: [devourer, mire, understilt, deeps]
  dialogue:
    - It has grown huge on a generation of what the boardwalk let fall: the mire-devourer, a swamp-thing swollen in the dark under the market, rising through the drowned stilt-roots to take the warmth that came down the ladder.
  hp: 168
  atk: 22
  aggressive: true
  attack_element: PSN
  resistances: {PSN: Resist, FIR: Weak}  # the swamp's glutton; fire is the mire's one fear
  level: 26
  tier: elite  # Mirefast's under-stilt prize (x3 reward): what the town feeds and will not face
  drops: [mirefast_lost_purse, greater_healing_draught]
  loot: {ember_shard: 6, emberbloom: 2, nothing: 2}

# --- Venthold life (Great Creation Campaign, Phase I): the Vent-Forge fortress-guild. Non-combat
# --- fortress folk + the magma-moat and proving-vent foes. Banded 52-58. ---
gate_marshal:
  name: the gate-marshal of Venthold
  location: venthold
  keywords: [marshal, gate, venthold, warden]
  dialogue:
    - '"State your business at the muster-gate, Forger. Venthold does not care where you were born or what rank the capital gave you -- we care whether you flinch. Prove on the floor, work the vent-forges, and if you would wear our mark, take it the only way we grant it: down the proving-vent, alone, in the fire. The Wardens call us reckless. We call them cold."'
  topics:
    rumor:
      - '"The Crucible-Warden holds the bottom of the proving-vent -- a Forgeborn we set there to prove our own and never recalled, grown vast on the hottest Ember in the world. Best it and Venthold''s mark is yours by right, not our leave. Fail it and the vent keeps you. Most who go down come up humbler. Some do not come up. That is the point."'

proving_master:
  name: the proving-master
  location: the_proving_floor
  keywords: [master, proving, floor, mentor]
  dialogue:
    - '"Work the live Ember and do not flinch when the vent breathes -- that is the whole of the proving-floor, and it is harder than it sounds, because the flinch is not in your hand, it is in your nerve. The capital teaches Forgers to be careful. We teach them to be certain. There is a difference, and the vent knows it even when you do not."'

vent_forge_master:
  name: a Vent-Forge master
  location: the_vent_forges
  keywords: [master, forge, vent, smith]
  dialogue:
    - '"Feel that heat, Forger? That is Ember as it comes from the Forge itself, not a cooled scrap the capital calls raw. We work it glowing and waste none. Buy vent-forged if you can afford it -- it holds an edge the cold forges only dream of, and takes a temper only living fire can give."'
  shop:
    sells:
      greater_healing_draught: 36
      vent_forged_blade: 180
      emberglass: 22
    buys:
      ember_shard: 7
      emberglass: 14

vent_quartermaster:
  name: the Vent-Armory quartermaster
  location: the_vent_armory
  keywords: [quartermaster, armory, venthold, smith]
  dialogue:
    - '"Fortress make, Forger, and the fortress makes the best in the Kollforge. Vent-forged steel, tempered in living fire, racked and ready. I fit our proven first, but overstock goes to any who pays in coin or courage. Out here courage is the harder currency, so mostly I take coin."'
  shop:
    sells:
      greater_healing_draught: 36
      vent_forged_plate: 200
    buys:
      ember_shard: 7
      emberglass: 14

vent_guildmaster:
  name: the Vent-Forge guildmaster
  location: the_guildmaster_hall
  keywords: [guildmaster, master, hall, ventforge]
  dialogue:
    - '"So the capital sent another careful Forger to see the reckless ones. Sit in the heat, then, and hear it plain: the Wardens hold the craft should be feared. We hold that fear is just cowardice that learned to dress well. The only true making is making at the source''s edge, where the world is still hot enough to change. Read the creed on the wall. Then go prove you mean it."'

magma_moat_kin:
  name: a magma-kin
  location: the_magma_moat
  keywords: [magmakin, magma, moat, molten]
  dialogue:
    - A magma-kin hauls itself up the moat's stone lip, welded from the running fire, jealous of the emberglass cooling at the edge.
  hp: 250
  atk: 33
  aggressive: true
  attack_element: FIR
  resistances: {FIR: Resist, WTR: Weak}  # a thing of the moat's fire; water cracks it
  level: 52
  tier: normal  # Venthold's magma-moat: a fortress-perimeter leveling ground + the emberglass gather
  loot: {ember_shard: 9, emberglass: 1, nothing: 2}

vent_forgeling:
  name: a vent-forgeling
  location: the_proving_vent
  keywords: [forgeling, vent, proving, forgeborn]
  dialogue:
    - Living Forgework grown in the vent's throat blocks the descent: a vent-forgeling, lesser kin of the deep Forgeborn, set here by the fortress to turn back the unready.
  hp: 300
  atk: 36
  aggressive: true
  attack_element: FIR
  resistances: {FIR: Immune, WTR: Weak}  # vent-grown Forgework; only water bites the living fire
  level: 54
  tier: normal  # the proving-vent descent, the fortress dungeon's outer tier
  loot: {ember_shard: 10, emberglass: 2, nothing: 2}

vent_crucible_warden:
  name: the Crucible-Warden
  location: the_vent_crucible
  keywords: [warden, crucible, vent, forgeborn]
  dialogue:
    - The crucible-fire gathers itself into a guardian: the Crucible-Warden, a Forgeborn the Vent-Forges set at the bottom of the proving-vent an age ago and never recalled, grown vast on the hottest Ember in the world. "Prove it," it says, in a voice of pouring fire, "or feed it."
  hp: 560
  atk: 40
  aggressive: true
  attack_element: FIR
  resistances: {FIR: Immune, WTR: Weak}  # the crucible's own fire made warden; water is its one answer
  level: 58
  tier: boss  # Venthold's proving-vent climax (x10 reward): earn the fortress's mark by right, not rank
  drops: [venthold_mark, greater_healing_draught]
  loot: {ember_shard: 16, emberglass: 5, nothing: 1}
# --- The Wardenmarch expansion life (Great Creation Campaign, Phase I): the Concord's frontier folk +
# --- the highland wilds' foes + the sundered redoubt's dead watch. Banded 17-22. ---
march_commander:
  name: the march-commander
  location: the_wardens_keep
  keywords: [commander, march, keep, warden]
  dialogue:
    - '"You are on the Concord''s frontier now, Forger. Beyond the keep the road runs to the Coilfoot and the Forgeward Road; north the watchtowers watch what the wilds send; west the cairn-hills hold our dead and the old Forgework they died guarding. We keep the old Gates because someone must, and we have forgotten why, and we keep them anyway. That is the whole discipline of the Concord: hold the line whether or not you remember the reason."'
  topics:
    rumor:
      - '"West past the cairn-hills a redoubt of ours went half to un-ness when the Unforging breathed on it -- wall scoured to nothing, the watch caught inside. A Sentinel still holds the deep magazine, alone, half-unmade, keeping a perimeter that isn''t all there. What''s charged down there is past any surface make. Put the Sentinel down and it''s yours. It was a Warden once. Give it that much thought before you strike."'

march_drill_sergeant:
  name: a march drill-sergeant
  location: the_march_barracks
  keywords: [sergeant, drill, barracks, warden]
  dialogue:
    - '"Frontier''s no place for a soft Forger. The Concord drills hard because the wilds test harder. March-steel''s plain but it holds -- I''ll sell you the keep''s overstock, and cheap, because a Forger who dies on our frontier for want of a blade is a mark against my drilling."'
  shop:
    sells:
      healing_draught: 12
      march_steel_blade: 60
      march_steel_guard: 66
    buys:
      ember_shard: 5

march_gate_warden:
  name: the gate-warden of the Old Gate
  location: the_old_gate
  keywords: [warden, gate, ring, keeper]
  dialogue:
    - '"Stand clear of the ring, Forger, and mind the charge. This is one of the old Gates -- Emberwright work, older than the Concord, raised for a purpose no record we keep remembers. The Wardens hold it because a Gate unwatched is a door left open, and we have learned, hard, not to leave the old doors open. Read the marks if you can. I cannot. I only keep it."'

watchtower_march_wolf:
  name: a march-wolf
  location: the_watchtower_line
  keywords: [wolf, march, watchtower, pack]
  dialogue:
    - A march-wolf lopes out of a cairn-shadow along the tower line, lean and grey and unafraid, the pack fanning wide behind it.
  hp: 48
  atk: 10
  aggressive: true
  attack_element: WND
  level: 18
  tier: normal  # the watchtower line: an Emberreach mid highland leveling ground
  loot: {ember_shard: 3, nothing: 2}

cairn_march_husk:
  name: a march-husk
  location: the_cairn_hills
  keywords: [husk, march, cairn, dead]
  dialogue:
    - A march-husk drags itself up out of a Warden's cairn, drawn by the old charge, a dead guardian still trying to keep a post it no longer understands.
  hp: 56
  atk: 12
  aggressive: true
  attack_element: LGT
  level: 19
  tier: normal  # the cairn-hills highland wilderness + the charge-crystal gather guardian
  loot: {ember_shard: 3, charge_crystal: 1, nothing: 2}

redoubt_husk:
  name: a redoubt-husk
  location: the_sundered_redoubt
  keywords: [husk, redoubt, warden, sundered]
  dialogue:
    - A redoubt-husk keeps a doorway where a wall used to be, one of the Wardens the Unforging caught here, still holding a perimeter that is half made of nothing.
  hp: 70
  atk: 14
  aggressive: true
  attack_element: LGT
  level: 20
  tier: normal  # the sundered redoubt ruin, the march dungeon's outer tier
  loot: {ember_shard: 4, charge_crystal: 1, nothing: 2}

redoubt_sentinel:
  name: the fallen Warden Sentinel
  location: the_redoubt_deep
  keywords: [sentinel, warden, redoubt, magazine]
  dialogue:
    - It was a Warden Sentinel once, set to keep this magazine, and it failed its watch when the wall fell and has held this one room ever since, half-unmade and lethal with grown charge. It turns on you the whole weight of a duty it could not perform and will not abandon.
  hp: 150
  atk: 20
  aggressive: true
  attack_element: LGT
  resistances: {LGT: Resist, WTR: Weak}  # a charged Forgework guardian; water grounds it
  level: 22
  tier: elite  # the sundered redoubt's climax (x3 reward): a fallen Sentinel keeping a broken perimeter
  drops: [charged_warden_core, greater_healing_draught]
  loot: {ember_shard: 6, charge_crystal: 2, nothing: 2}

# --- Cinderhearth interiors life (Great Creation Campaign, Phase I, Layer 4): the starter town's
# --- people, all safe and welcoming - the first faces a fresh Forger meets indoors. ---
forge_hand:
  name: a forge-hand of Cinderhearth
  location: the_relit_forge
  keywords: [forgehand, hand, forge, smith]
  dialogue:
    - '"Come to see the fire? Everyone does. This forge was cold before I was born, Forger, and now it burns, and the whole coast dates itself from the day it relit. Watch the first strike -- heat, then hammer, then hold. That is the whole of Forging, and the whole of everything else too, if you think on it long enough. Welcome to the craft."'

saltrest_host:
  name: the host of the Saltrest
  location: the_saltrest_tavern
  keywords: [host, saltrest, tavern, barkeep]
  dialogue:
    - '"Sit and warm up, Forger -- you''ve the look of the newly-woken, half the coast does these days. The Waking Shore gives us a Forger a week now, blinking and cold, and we feed them and point them north to the capital and the wide world. Loft''s up the stair if you need a bed before the road. Cinderhearth looks after its own, and everyone who washes up here is ours for a night."'
  topics:
    rumor:
      - '"North over the mended bridge the Ember-road runs to Emberreach City and everything after. East the Reachwood grows wild and hungry. And down the cellar under the square, the forge''s own roots run into something the Unforging half-took -- good for a first blooding if you''re bold, but mind the cold. Most Forgers cut their teeth down there before they ever leave the coast."'

saltrest_loft_keeper:
  name: the Saltrest loft-keeper
  location: the_saltrest_loft
  keywords: [keeper, loft, saltrest, host]
  dialogue:
    - '"First safe bed of your new life, most like. Sleep well, Forger -- the road that starts on the Waking Shore runs a long way, and you''ll not always sleep so soft. The window''s on the sea. The old folk say the Cooling-Sea sings the newly-woken to sleep. I''ve never heard it. But I''ve watched a hundred tired Forgers stop crying and start snoring, so maybe they''re right."'

coast_shrine_tender:
  name: a shrine-tender
  location: the_coast_shrine
  keywords: [tender, shrine, coast, keeper]
  dialogue:
    - '"Feed the flame if you like, Forger -- a pinch of cinder, a moment''s quiet. No church here, no priest, just the little fire and whoever stops to keep it. The First Flame is simplest on the coast, where the Rekindling started: the world was Made, it can be Made again, and you woke on that shore with a fire in your hand for a reason. Read the stone. It''s the whole faith in four lines."'

fishers_net_mender:
  name: a net-mender
  location: the_fishers_row
  keywords: [mender, net, fisher, row]
  dialogue:
    - '"Mind the drying-racks, Forger. This row fed Cinderhearth through the whole cold generation, when the forge was dead and the Rekindling was just a word the old folk half-believed. The sea kept us fed while we waited for the fire. Don''t let the forge-folk tell you the Rekindling started at the anvil. It started here, at the nets, with people stubborn enough to keep eating until the world came back."'

hearthway_mother:
  name: a hearth-mother
  location: the_hearthway
  keywords: [mother, hearth, way, townsfolk]
  dialogue:
    - '"You''re one of the newly-woken, aren''t you. Come off the shore with that look. Well -- there''s a pot on if you''re hungry, and no, I won''t hear thanks for it. This lane kept the coast''s families warm through the dark years, Forger, and we didn''t do it to stop now that things are looking up. Go and do your great Forging. But eat first. The world''s not so urgent it can''t wait for you to eat."'
# --- Quench Harbor interiors life (Great Creation Campaign, Phase I, Layer 4): the coast port's
# --- working folk, safe and salt-worn - the last faces before the sea-crossing. ---
harbor_fishmonger:
  name: a fishmonger
  location: the_fish_market
  keywords: [fishmonger, monger, market, fish]
  dialogue:
    - '"Fresh off the first boat, Forger, and cheap if you buy before the ferry-crews do. Provision here before you take the strand or the sea -- a Forger who walks the coast on an empty belly is a Forger the coast keeps. Salt-fish travels; take some."'
  shop:
    sells:
      healing_draught: 11
      water_ration: 6
    buys:
      ember_shard: 5

dogwatch_host:
  name: the host of the Dogwatch
  location: the_dogwatch_tavern
  keywords: [host, dogwatch, tavern, barkeep]
  dialogue:
    - '"Warm up, Forger, the sea-damp gets in the bones. Fisherfolk to one side, ferry-crews to the other, and everyone with a tide-tale taller than the last. You bound for the Quenchmere? The drowned Reach across the water -- ferry boards at the house on the last jetty. Have a drink first. The far water keeps; it''s been keeping a thousand years."'
  topics:
    rumor:
      - '"South off the last jetty the Wreck Reef breaks the water, and the Drowned Pilot keeps the wheel of the biggest hull -- old, and angry, and worth a look if you''re bold. West the ferry runs the open lanes to Tidewharf and the whole drowned Reach beyond. Fortunes out there on the wrecks, Forger. Graves too. Same water holds both."'

dogwatch_loft_keeper:
  name: the Dogwatch loft-keeper
  location: the_dogwatch_loft
  keywords: [keeper, loft, dogwatch, host]
  dialogue:
    - '"Last coast bed before the crossing, Forger. Sleep while the ground''s still still under you -- the ferry sways all the way to the drowned Reach and the beds out there float on hulls. The sea-damp''s in the walls but the blankets are dry, and that''s the best the coast offers. Take it."'

salt_warehouse_keeper:
  name: a warehouse-keeper
  location: the_salt_warehouse
  keywords: [keeper, warehouse, salt, tally]
  dialogue:
    - '"Mind the stacks, Forger, salt-fish to the beams. This store is the coast''s real treasury -- not the relit forge up the road, whatever the capital says, but the plain fish and iron that fed Emberreach when the forge was cold. I hire strong backs by the tide if you''re short of coin and long on muscle. Honest work. The coast runs on it."'

ferry_master:
  name: the Merewright ferry-master
  location: the_ferry_house
  keywords: [ferrymaster, master, ferry, house]
  dialogue:
    - '"Booking the crossing? The lanes run west to Tidewharf, the great free-port, and from there the whole drowned Reach -- the Wreckways, the Outer Reefs, Sunhold under the keels. I know what waits on the far water, Forger, and I''ll not sugar it: the Quenchmere drowned a whole Reach and kept it, and the crossing is where the wide world starts to get its teeth. Ring the bell when you''re ready. The ferry comes."'

# --- The Warmcamp life (Great Creation Campaign, Phase I): the Ashborn salvagers of the Rimefall ice +
# --- the salvage-dig's frozen guardians. The faction conflict made flesh. Banded 42-48. ---
warmcamp_boss:
  name: the camp-boss of the Warmcamp
  location: the_warmcamp
  keywords: [boss, camp, warmcamp, ashborn]
  dialogue:
    - '"You''re not Rimekin, so you''re welcome by our fire, Forger. The Silent Anvil call this whole Reach a shrine and forbid a soul to touch it -- a thousand years of the finest making in the world, standing under the ice, and their answer is to sit on their hands and call it holy. We call it a bank. We dig, we thaw, we sell, and if the frozen dead don''t like it they can wake up and say so. Down the dig if you want to earn. Mind the frost-guard. And mind the sentinel at the bottom -- the ice fights back."'
  topics:
    rumor:
      - '"Bottom of the dig, past the frost-guard, a Rimekin sentinel keeps a reliquary the golden age sealed whole -- richest untouched make in the north, and a flash-frozen guardian woken to keep it. The Silent Anvil would say leave it. We say a treasure guarded by the dead is still a treasure. Best the sentinel and it''s yours. Bring fire; the ice hates fire, which is exactly why we love it."'

fire_tent_keeper:
  name: a fire-keeper of the Warmcamp
  location: the_fire_tent
  keywords: [firekeeper, keeper, fire, tent]
  dialogue:
    - '"Thaw your hands, Forger, and don''t start the old argument -- graveyard or bank, we''ve had it a thousand times over this fire and it never settles. The truth is both, and the Ashborn have always lived where both is the only honest answer. The Rimekin get to be pure because they''re not hungry. Out here we dig the dead because the living need to eat. Judge us when you''ve wintered on the floe."'

salvage_trade_tent:
  name: an Ashborn salvage-trader
  location: the_trade_tent
  keywords: [trader, salvage, trade, tent]
  dialogue:
    - '"Golden-age make, Forger, dug fresh from the ice and sold for what the cold left me able to charge -- which is cheap, because a relic won''t feed a camp and steel will. Better-made than anything the living forge, and yours for coin the Rimekin would faint to see change hands over their sacred dead. Buy. The dead don''t need it. You do."'
  shop:
    sells:
      greater_healing_draught: 34
      goldenage_relic_blade: 150
    buys:
      ember_shard: 7
      rime_crystal: 12

dig_frost_guardian:
  name: a frost-guardian
  location: the_salvage_dig
  keywords: [guardian, frost, dig, shaft]
  dialogue:
    - The cold itself precipitates a guardian in the shaft: a figure of clear dig-frost, grown to keep the diggers from what the ice preserves, reaching for the warmth that woke it.
  hp: 175
  atk: 26
  aggressive: true
  attack_element: ICE
  resistances: {ICE: Resist, FIR: Weak}  # frost made warden; fire is the digger's friend and its undoing
  level: 44
  tier: normal  # the salvage-dig, the Warmcamp delve's outer tier + the golden-age gate
  loot: {ember_shard: 6, rime_crystal: 1, nothing: 2}

reliquary_ice_sentinel:
  name: the Rimekin sentinel-of-the-ice
  location: the_buried_reliquary
  keywords: [sentinel, rimekin, reliquary, ice]
  dialogue:
    - Flash-frozen mid-guard and woken by the diggers' warmth, the sentinel-of-the-ice turns to finish a duty an age overdue. "The past is paused," it says, in a voice of cracking floe. "Not ruined. Not yours. TOUCH NOTHING." It moves to keep the golden age's wealth the only way the frozen north knows: forever.
  hp: 340
  atk: 34
  aggressive: true
  attack_element: ICE
  resistances: {ICE: Immune, FIR: Weak}  # a warden of the paused past; only the living fire the Ashborn wield can end it
  level: 48
  tier: boss  # the Warmcamp's climax (x10 reward): the ice's own answer to the salvagers who will not leave it be
  drops: [ice_sealed_regalia, greater_healing_draught]
  loot: {ember_shard: 12, rime_crystal: 4, nothing: 1}
# --- Highbough interiors life (Great Creation Campaign, Phase I, Layer 4): the canopy capital's
# --- grown-place folk, all non-combat. ---
canopy_monger:
  name: a canopy-monger
  location: the_canopy_market
  keywords: [monger, canopy, market, trader]
  dialogue:
    - '"Slow down, Forger -- we haggle the green way up here, which is to say we take our time, because the tree does. Coaxed ember-bloom, shaped living-wood, swamp-craft up from Mirefast. Nothing here was cut or killed to make; the Deeprooted don''t trade in death. Costs more and takes longer. Worth both."'
  shop:
    sells:
      healing_draught: 14
      greater_healing_draught: 36
      mana_draught: 14
    buys:
      emberbloom: 8
      glowcap: 6

council_reader:
  name: a grove-council reader
  location: the_grove_council
  keywords: [reader, council, grove, elder]
  dialogue:
    - '"You stand in the seat of our government, Forger, and I know it does not look like one -- no throne, no crown, no law but the moot. The Deeprooted hold that a living world cannot be ruled, only heard, and so we do not rule the Verdance, we listen to it, and broker between its moods and our needs. The drowned Reaches call it weakness. We have kept a living continent alive for an age. Read the covenant. Then say which of us is weak."'

rest_hollow_keeper:
  name: a rest-hollow keeper
  location: the_rest_hollow
  keywords: [keeper, hollow, rest, host]
  dialogue:
    - '"Rest easy, guest -- Highbough lets few outsiders up the tree, and none it does not trust, so you are welcome by the fact of being here. The bed is moss, the lamp is bloom, the swamp is a mile down and cannot reach you. Sleep high. In the morning the whole living Reach is under your feet, and it will be glad you came, in the slow way the tree is glad of things."'

# --- Remaining capital interiors life (Great Creation Campaign, Phase I, Layer 4): lodging + trade
# --- keepers for Stillhearth, Highgate, and Saltring. All non-combat. ---
ice_trader:
  name: an ice-trader of Stillhearth
  location: the_ice_market
  keywords: [trader, ice, market, rimekin]
  dialogue:
    - '"Quietly, Forger -- we trade low in the Rimefall, as we do everything. Only what the ice gives up: salvage, rime-stores, the cold''s thin bounty. We make nothing here, and buy nothing we would have to. The Silent Anvil hold that even wanting is a kind of heat. So want quietly, and buy what you need, and move on before the cold notices you stopped."'
  shop:
    sells:
      healing_draught: 15
      greater_healing_draught: 38
    buys:
      ember_shard: 7
      rime_crystal: 11

thaw_keeper:
  name: a thaw-keeper
  location: the_thawhouse
  keywords: [keeper, thaw, thawhouse, host]
  dialogue:
    - '"Warm yourself, Forger, but know the warmth is a mercy the Anvil permit, not a right you hold. One fire, banked careful, against a whole frozen Reach. Sleep while it lasts. And when you go back out on the ice, remember what the Rimefall teaches better than anywhere: heat is borrowed, always, and the cold is only ever waiting for the loan to come due."'

sky_trader:
  name: a sky-trader of Highgate
  location: the_sky_market
  keywords: [trader, sky, market, skyborn]
  dialogue:
    - '"Mind the sway and don''t look down, Forger -- the stall''s held a thousand years, it''ll hold your custom. Drifting-shard salvage, storm-glass, the last supplies before the Road. Everything a Forger needs to walk east off the edge of the settled world, sold on a plank over a mile of cloud. Buy well. There are no shops on the Forgeward Road."'
  shop:
    sells:
      greater_healing_draught: 38
      water_ration: 9
    buys:
      ember_shard: 8
      stormglass: 13

skyward_rest_keeper:
  name: a rest-keeper of the Skyward Rest
  location: the_skyward_rest
  keywords: [keeper, rest, skyward, host]
  dialogue:
    - '"Last safe sleep before the Road, Forger. Past the watch and the sky-Warden''s test there''s no bed but the bare march and no roof but the deepening sky. Sleep here while a stay still holds you. Most who go east do not come back to argue whether the bed was worth it -- but the ones who do always say it was."'

gate_watch_warden:
  name: a watch-Warden of the Gate-Watch
  location: the_gate_watch
  keywords: [warden, watch, gate, skyborn]
  dialogue:
    - '"So you would walk the Forgeward Road. Everyone thinks they are ready, Forger. The watch is where the Concord finds out. Beyond this post the road runs east to the Forge itself, each march deeper and worse, to the Sovereign at the world''s far heart. We do not stop you -- the Concord keeps doors, it does not lock them. But read the watch-stone before you go, and be certain. The Road does not send many back to reconsider."'

salvagers_rest_keeper:
  name: a rest-keeper of the Salvagers' Rest
  location: the_salvagers_rest
  keywords: [keeper, rest, salvagers, ashborn]
  dialogue:
    - '"Dry and defended, Forger, and by road-code you owe nothing for it but to leave it as you found it and help the next clansman the waste half-killed. Not warm. Nothing''s warm in the Cinderwaste. But the dust stays out and the door holds, and out here that is the whole of what a roof is for. Rest. The waste will still be grey in the morning."'
# --- The Rootdeep life (Great Creation Campaign, Phase I): the Cinderdeep below the Verdance, where
# --- unmaking and living root tangle. Grave-kin, rot-kin, unmade-kin, and the Rotheart-Warden. 28-36. ---
rootdeep_husk:
  name: a mire-drawn husk
  location: the_rootdeep_mouth
  keywords: [husk, mire, rootdeep, drawn]
  dialogue:
    - A husk the mire half-returned works the root-tangle at the deep's mouth, drawn down by the Cinder-seep, neither risen nor gone, and it turns its half-face toward your warmth.
  hp: 118
  atk: 19
  aggressive: true
  attack_element: PSN
  resistances: {PSN: Resist, FIR: Weak, HLY: Weak}  # a half-unmade dead of the mire; fire and light both bite
  level: 28
  tier: normal  # the Rootdeep mouth, the Verdance's Cinderdeep access
  loot: {ember_shard: 5, nothing: 3}

grave_root_kin:
  name: a grave-kin
  location: the_grave_roots
  keywords: [gravekin, grave, roots, kin]
  dialogue:
    - A grave-kin pulls free of the root-mesh where the dead hang caught, grown from a corpse the mire and the deep are still fighting over, and reaches for the living warmth it half-remembers.
  hp: 130
  atk: 21
  aggressive: true
  attack_element: PSN
  resistances: {PSN: Resist, HLY: Weak}  # the caught dead; radiance frees what the deep holds
  level: 30
  tier: normal  # the grave-roots, the Rootdeep leveling ground + the grave-sap gather
  loot: {ember_shard: 5, grave_sap: 1, nothing: 2}

rot_hollow_kin:
  name: a rot-kin
  location: the_rot_hollow
  keywords: [rotkin, rot, hollow, kin]
  dialogue:
    - The soft breathing dark of the rot-hollow births a rot-kin, a thing that feeds on what the deep and the Verdance leave between them, and it comes for you slow and certain.
  hp: 138
  atk: 22
  aggressive: true
  attack_element: PSN
  resistances: {PSN: Resist, FIR: Weak}  # a thing of rot; fire is the mire's answer here too
  level: 32
  tier: normal  # the rot-hollow lateral wander
  loot: {ember_shard: 6, grave_sap: 1, nothing: 2}

unmade_grove_kin:
  name: an unmade-kin
  location: the_unmade_grove
  keywords: [unmadekin, unmade, grove, kin]
  dialogue:
    - The Verdance's own life turned inside out steps from the wrong wood: an unmade-kin, half-tree and half-hollow, the living Reach unmade in the growing, and it does not know whether it wants to grow over you or unmake you, so it tries both.
  hp: 165
  atk: 26
  aggressive: true
  attack_element: CRS
  resistances: {CRS: Resist, PSN: Resist, FIR: Weak, HLY: Weak}  # living Reach + unmaking fused; fire and light both undo it
  level: 34
  tier: elite  # the unmade grove's apex (x3 reward), the gate to the Rotheart
  drops: [greater_healing_draught]
  loot: {ember_shard: 8, grave_sap: 2, nothing: 2}

rotheart_warden:
  name: the Rotheart-Warden
  location: the_rotheart
  keywords: [warden, rotheart, rootdeep, boss]
  dialogue:
    - Half-Boughwarden and half-Unforged, the Rotheart-Warden unfolds from the drowned roots - the living Reach and the unmaking grown into one guardian that hates both halves of itself. "Grown," it says, in the Boughwarden's voice. "UNMADE," it answers, in the deep's. It turns the whole of that war on you.
  hp: 400
  atk: 30
  aggressive: true
  attack_element: CRS
  resistances: {CRS: Resist, PSN: Resist, FIR: Weak, HLY: Weak}  # the war of grow-and-unmake made flesh; fire and light end it
  level: 36
  tier: boss  # the Rootdeep's climax (x10 reward): the Verdance's deep, a rotting mirror of the Heart-Grove
  drops: [rotheart_seed, greater_healing_draught]
  loot: {ember_shard: 12, grave_sap: 4, nothing: 1}
