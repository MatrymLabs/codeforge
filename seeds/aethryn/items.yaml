  mods: {DEF: 13, EVA: 4}

rimeplate_gauntlets:
  name: a pair of rimeplate gauntlets
  keywords: [gauntlets, rimeplate, rime, frost]
  location: nowhere
  slot: arm
  mods: {DEF: 11, ATK: 5}

# --- Emberforged set: the Kollforge (molten, L50-62). Plate forged at the Anvil-Vents in living
# --- fire; the Reach already yields the Vent-Crown (head), so this set fills body and arm. ---
emberforged_plate:
  name: a suit of emberforged plate
  keywords: [plate, emberforged, forge, molten]
  location: nowhere
  slot: body
  mods: {DEF: 14, "MAG DEF": 6}

emberforged_gauntlets:
  name: a pair of emberforged gauntlets
  keywords: [gauntlets, emberforged, forge, molten]
  location: nowhere
  slot: arm
  mods: {DEF: 11, ATK: 5}

# --- Stormward set: the Sundered Sky (floating shards, L60-72). Sky-Warden plate anchored with the
# --- same Forgework that holds the shards aloft, light enough to ride the wind. ---
stormward_helm:
  name: a stormward helm
  keywords: [helm, stormward, sky, warden]
  location: nowhere
  slot: head
  mods: {DEF: 12, EVA: 6}

stormward_cuirass:
  name: a stormward cuirass
  keywords: [cuirass, stormward, sky, warden]
