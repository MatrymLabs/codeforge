# SEED: aethryn -- items.yaml
# location is a plain room label; the engine tags it internally.

first_ember:
  name: the first ember
  keywords: [ember, first, spark, flame]
  location: the_waking_shore

forge_wrench:
  name: a modular forge wrench
  keywords: [wrench, tool, forge, modular]
  location: cinderhearth_square

warm_cloak:
  name: a warm traveller's cloak
  keywords: [cloak, warm, travel]
  location: cinderhearth_square

ember_shard:
  name: a shard of wild ember
  keywords: [shard, ember, wild, material]
  location: reachwood_edge
  resettable: true  # a wild-ember node: take it, and the coast regrows one once the area is quiet

cellar_key:
  name: a cold iron key
  keywords: [key, iron, cellar, cold]
  location: cold_cellar

cinder_relic:
  name: the smith's cinder relic
  keywords: [relic, cinder, smith, forgework]
  location: cellar_hearth

# Drop-only prototype: the Cinder-Wight's own weapon, never placed on the floor -- it exists only
# to be dropped when the wight falls (location: nowhere = a template spawned by loot, not seeded).
# Equippable: felling a boss now yields real gear (slot + flat stat mods), so the climb makes you
# stronger, not just richer in keepsakes. This hammer is the first weapon the ladder hands you.
cinder_hammer:
  name: a hammer of grey cinder
  keywords: [hammer, cinder, grey hammer]
  location: nowhere
  slot: weapon
  mods: {ATK: 5, DEF: 1}

# Drop-only prototype: the road reaver's blade, spawned only when a reaver falls (location: nowhere).
reaver_blade:
  name: a notched reaver's blade
  keywords: [blade, sword, reaver, notched]
  location: nowhere
  slot: weapon
  mods: {ATK: 9, ACC: 5}  # a step up from the cinder hammer: the road pays in better steel

# A placed lore relic in the capital: the Grand Forge's record of the coast's relighting.
relighting_record:
  name: the Grand Forge's relighting record
  keywords: [record, relighting, ledger, archive]
  location: the_grand_forge

# Drop-only prototypes for the ascent (location: nowhere = spawned by a boss's fall, not placed).
# The gear ladder fills every slot as you climb: weapon (hammer/blade), body (cindershell), head
# (wraithlamp), arm (ashlord gauntlet), and two accessories (sigil, keystone).
warden_sigil:
  name: the Concord's warden sigil
  keywords: [sigil, warden, concord, token]
  location: nowhere
  slot: accessory_1
  mods: {DEF: 5, MAG DEF: 5}  # the proven-Forger's ward: it turns a blow and a curse alike

coil_keystone:
  name: a keystone of the Forgeward Road
  keywords: [keystone, coil, spiral, stone]
  location: nowhere
  slot: accessory_2
  mods: {ATK: 7, MAG DEF: 6}  # a shard of the Spiral's own Forgework, worn for its edge

# Drop-only prototype: the Hollow Smith's black-iron ingot (a crafting material, not gear).
hollow_ingot:
  name: an ingot of hollow black iron
  keywords: [ingot, iron, hollow, black]
  location: nowhere

# --- Armor drops that complete the gear ladder (body / head / arm). All drop-only. ---
cindershell_plate:
  name: a plate of cindershell
  keywords: [plate, cindershell, armor, body]
  location: nowhere
  slot: body
  mods: {DEF: 8, EVA: 2}  # the Hollow Smith's dead shell, reforged into armor

wraithlamp_circlet:
  name: a wraithlamp circlet
  keywords: [circlet, wraithlamp, crown, head]
  location: nowhere
  slot: head
  mods: {MAG DEF: 8, ACC: 4}  # the Forgewraith's cold light, bound to ward the mind

ashlord_gauntlet:
  name: the Ashlord's gauntlet
  keywords: [gauntlet, ashlord, glove, arm]
  location: nowhere
  slot: arm
  mods: {ATK: 9, DEF: 5}  # the Second Coil's prize: a maker's grip turned to war

# The Third Coil's prize: a weapon a full tier above the road's blade (drop-only, Gate-boss loot).
stormlord_edge:
  name: the Stormlord's edge
  keywords: [edge, blade, stormlord, storm]
  location: nowhere
  slot: weapon
  mods: {ATK: 14, ACC: 6}  # the ascent's reward: real power for the higher climb

# Consumables: spend them for a one-shot restore (quaff <item>). Placed on the coast + shop-stocked.
healing_draught:
  name: a healing draught
  keywords: [draught, healing, potion, heal]
  location: cinderhearth_square
  resettable: true
  consume: {hp: 30}

mana_draught:
  name: a mana draught
  keywords: [draught, mana, potion]
  location: cinderhearth_square
  resettable: true
  consume: {mp: 15}

# Drop-only: the Drowned Forgemaster's seal -- the Cinderdeep's bottom-boss reward, a warding relic
# forged against the cold that never healed (an accessory_2, a defensive alternative to the keystone).
drowned_seal:
  name: the Drowned Forgemaster's seal
  keywords: [seal, drowned, forgemaster, relic]
  location: nowhere
  slot: accessory_2
  mods: {DEF: 6, MAG DEF: 5}

# Drop-only: the Great Spiral's themed Gate-warden weapons, one per elemental Coil (spiral.py drops
# the matching one, then combat's affix factory rolls a rarity onto it -- varied endgame loot).
ember_brand:
  name: an ember brand
  keywords: [brand, ember, sword, weapon]
  location: nowhere
  slot: weapon
  mods: {ATK: 10, ACC: 4}

rime_edge:
  name: a rime edge
  keywords: [rime, edge, blade, weapon]
  location: nowhere
  slot: weapon
  mods: {ATK: 10, EVA: 4}

storm_pike:
  name: a storm pike
  keywords: [storm, pike, spear, weapon]
  location: nowhere
  slot: weapon
  mods: {ATK: 11, ACC: 5}

shadow_fang:
  name: a shadow fang
  keywords: [shadow, fang, dagger, weapon]
  location: nowhere
  slot: weapon
  mods: {ATK: 12, EVA: 3}

stone_maul:
  name: a stone maul
  keywords: [stone, maul, hammer, weapon]
  location: nowhere
  slot: weapon
  mods: {ATK: 13, DEF: 3}

# Drop-only: the Reachwood mini-boss reward -- a charm of woven ember-thorn (an evasion accessory,
# an early-game alternative to the Concord's warden sigil).
warden_charm:
  name: a greenwarden's charm
  keywords: [charm, greenwarden, thorn, token]
  location: nowhere
  slot: accessory_1
  mods: {DEF: 4, EVA: 4}

# Drop-only: the Ash-Colossus's reward -- a blade of the black glass the Unforging fused (a heavy
# weapon salvaged from the crater's heart).
cinderglass_edge:
  name: a cinderglass edge
  keywords: [cinderglass, edge, blade, weapon]
  location: nowhere
  slot: weapon
  mods: {ATK: 12, ACC: 4}

# Drop-only: the Drowned Pilot's reward -- a compass of cooling-iron that still points true through
# brine and dark (an accessory that steadies hand and eye).
pilots_compass:
  name: a drowned pilot's compass
  keywords: [compass, pilot, drowned, token]
  location: nowhere
  slot: accessory_1
  mods: {ACC: 6, EVA: 3}

# Drop-only: the Sunhold Warden's reward -- the sigil of the drowned capital, cold-iron Forgework
# that never stopped burning (an accessory that wards mind and body against the deep).
sunhold_sigil:
  name: the drowned Sunhold's sigil
  keywords: [sigil, sunhold, drowned, token]
  location: nowhere
  slot: accessory_2
  mods: {DEF: 5, "MAG DEF": 6}

# Drop-only: the Boughwarden's reward -- a living totem of the Heart-Grove, ember-wood that still
# grows (an accessory that mends and shields, the Verdance's gift to one it spared).
boughward_totem:
  name: a boughward totem
  keywords: [totem, boughward, grove, relic]
  location: nowhere
  slot: accessory_1
  mods: {DEF: 5, EVA: 5}

# Drop-only: the Rime-King's reward -- the Stillheart, an Emberwright relic of unmelting ice that
# never cooled (a weapon of the frozen golden age; see the Legendary Item Catalog, the Reach-Relics).
stillheart:
  name: the Stillheart
  keywords: [stillheart, ice, blade, relic]
  location: nowhere
  slot: weapon
  mods: {ATK: 15, "MAG DEF": 6}

# Drop-only: the Vent-Lord's reward -- the Vent-Crown, a Reach-Relic of raw Forgework worn straight
# from the vents (a head-piece of living fire; see the Legendary Item Catalog, the Reach-Relics).
vent_crown:
  name: the Vent-Crown
  keywords: [crown, vent, forge, relic]
  location: nowhere
  slot: head
  mods: {ATK: 8, "MAG DEF": 8}

# Drop-only: the Court-Warden's reward -- the Anchor-Stone, a Reach-Relic that never falls, cut from
# the Forgework that holds the drifting shards aloft (an accessory; see the Legendary Item Catalog).
anchor_stone:
  name: the Anchor-Stone
  keywords: [anchor, stone, sky, relic]
  location: nowhere
  slot: accessory_2
  mods: {DEF: 7, EVA: 6}

# --- The Emberhide set (Emberreach cradle armor, levels ~1-15). A slot-complete starter kit of hide
# --- cured over coast-forge embers, dropped by the cradle's beasts so a fresh Forger can outfit
# --- head/body/arm before leaving the coast. Drop-only prototypes; combat levels + rarity-rolls them.
emberhide_hood:
  name: an emberhide hood
  keywords: [hood, emberhide, hide, cap]
  location: nowhere
  slot: head
  mods: {DEF: 2, EVA: 3}

emberhide_jerkin:
  name: an emberhide jerkin
  keywords: [jerkin, emberhide, hide, vest]
  location: nowhere
  slot: body
  mods: {DEF: 4, EVA: 2}

emberhide_wraps:
  name: a set of emberhide wraps
  keywords: [wraps, emberhide, hide, bracers]
  location: nowhere
  slot: arm
  mods: {DEF: 3, ATK: 2}

# ============================================================================================
# REGIONAL ARMOR SETS (Content Manufacturing Campaign, the wide fill). One slot-complete themed
# set per Reach (head/body/arm), dropped by that Reach's own foes so a Forger re-outfits as they
# travel. Base mods rise band to band; combat levels + rarity-rolls each drop. Drop-only prototypes.
# ============================================================================================

# --- Brinescale set: the Quenchmere (drowned archipelago, L18-30). Salvaged plate scaled like a
# --- tide-crawler's shell, worn by the Merewright wreck-divers against the cold sea. ---
brinescale_hood:
  name: a brinescale hood
  keywords: [hood, brinescale, scale, drowned]
  location: nowhere
  slot: head
  mods: {DEF: 5, "MAG DEF": 5}

brinescale_coat:
  name: a brinescale coat
  keywords: [coat, brinescale, scale, drowned]
  location: nowhere
  slot: body
  mods: {DEF: 8, EVA: 3}

brinescale_bracers:
  name: a pair of brinescale bracers
  keywords: [bracers, brinescale, scale, drowned]
  location: nowhere
  slot: arm
  mods: {DEF: 6, ACC: 3}

# --- Verdant set: the Verdance (living jungle, L22-32). Living bark-mail the Deeprooted grow rather
# --- than forge, still green, that closes its own cuts. ---
verdant_hood:
  name: a verdant bark-hood
  keywords: [hood, verdant, bark, grove]
  location: nowhere
  slot: head
  mods: {DEF: 6, EVA: 4}

verdant_mantle:
  name: a verdant bark-mantle
  keywords: [mantle, verdant, bark, grove]
  location: nowhere
  slot: body
  mods: {DEF: 9, "MAG DEF": 4}

verdant_vambraces:
  name: a pair of verdant bark-vambraces
  keywords: [vambraces, verdant, bark, grove]
  location: nowhere
  slot: arm
  mods: {DEF: 7, ACC: 4}

# --- Rimeplate set: the Rimefall (frozen north, L40-52). Flash-quenched Emberwright plate, cold to
# --- the touch and unbreaking, cut from the glass-ice of the Rime. ---
rimeplate_helm:
  name: a rimeplate helm
  keywords: [helm, rimeplate, rime, frost]
  location: nowhere
  slot: head
  mods: {DEF: 9, "MAG DEF": 6}

rimeplate_hauberk:
