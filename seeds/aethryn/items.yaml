    Left in the moss of the Forgotten Shrine, on a stone worn smooth by hands that are all dust now:
    an offering of old ember, still faintly warm. No mark says to whom. The Emberwrights raised this
    ring before the town, before the Concord, before the names we keep -- and left gifts here for a
    thing they did not write down, and trusted us to leave them be. You are the first in an age to
    stand here. Take the ember if you must; the forest kept it a long time, and will not miss it now.

# --- The Old Firewatch's content (Seed Scale Doctrine): a lore log + a viewpoint keepsake, the
# --- reward for climbing to the launch zone's one high place. Placed, findable, one-time. ---
firewatch_log:
  name: the last watcher's log
  keywords: [log, watcher, firewatch, book]
  location: the_old_firewatch
  lore: |-
    The last entries of the Old Firewatch's watch-log, the ink gone brown:
    "Day 400. The coast is relit hearth to hearth, the road runs to the capital, the Wardenmarch holds.
    From up here you can see it all catch, one fire at a time, the way you light a making from the
    inside out. They are standing down the watch -- no enemy left to watch for, they say, only the cold.
    Maybe. But I have kept this hill a long time, and I will tell you what a watcher learns: the world
    is always larger than the part of it you have lit. Keep climbing. There is always more to see."

firewatch_glass:
  name: a watcher's far-glass
  keywords: [glass, far-glass, spyglass, watcher]
  location: the_old_firewatch
  slot: accessory_2
  mods: {ACC: 6, EVA: 3}  # the last watcher's kit: it sharpens the eye (a keepsake of the high hill)

# --- The Thorn-Heart's content (Seed Scale Doctrine): the deep warren's reward + a placed cache. ---
wildember_charm:
  name: a charm of wild ember
  keywords: [charm, wildember, ember, thorn]
  location: nowhere
  slot: accessory_1
  mods: {ATK: 4, "MAG DEF": 4}  # cut from the warren's untaken ember-well, the deep warren's prize

wildember_cache:
  name: a well of untaken wild ember
  keywords: [well, ember, cache, wild]
  location: the_thorn_heart
  lore: |-
    A well of wild ember, welling up bright through the ember-thorn, untaken since before the town.
    The foresters have a rule older than the Concord: you cut the deadfall, you do not gather the
    living ember. What wells up wild belongs to the wood, and the wood keeps its debts. The Wight and
    the horror are the wood collecting. Take from the well if you must, Forger -- but know that the
    Reachwood remembers a hand that takes more than the wild gives, and the Reachwood is patient.

# --- The Sunken Hold's content (Seed Scale Doctrine): the drowned flagship's cargo + a lost manifest. ---
tideglass_pendant:
  name: a tideglass pendant
  keywords: [pendant, tideglass, hold, relic]
  location: nowhere
  slot: accessory_2
  mods: {"MAG DEF": 5, EVA: 4}  # the flagship's captain's own ward, salvaged from the sunken hold

flagship_manifest:
  name: the flagship's lost manifest
  keywords: [manifest, ledger, flagship, book]
  location: the_sunken_hold
  lore: |-
    The cargo manifest of the flagship of the first Rekindling, ink run but legible in the drowned
    dark: hearth-irons, seed-lamps, and the relit ember meant to carry warmth up the whole coast at
    once. She went down the day the Cooling-Sea rose, the manifest unmarked as delivered. All of it is
    still here, lashed and lost, a coast's worth of warmth that never arrived. They relit the Kindlands
    the slow way instead, hearth by hearth, and never knew how close the fast way came to reaching them.

# --- The Sealed Vault's content (Seed Scale Doctrine): what the makers sealed away, and why. ---
sealed_ember:
  name: a shard of sealed ember
  keywords: [ember, sealed, shard, relic]
  location: nowhere
  slot: accessory_2
  mods: {ATK: 5, DEF: 5}  # ember the makers sealed against the unmaking, worn for its stubborn heat

vault_seal_record:
  name: the vault-sealer's record
  keywords: [record, seal, vault, book]
  location: the_sealed_vault
  lore: |-
    Scratched into the vault door from the inside, in a maker's last steady hand:
    "We seal what we could not let the Unforging have: a shard of the first ember, from before the
    First Seed broke, still warm. If you have opened this, then the Rekindling came, and the world was
    relit, and you are a Forger of an age we did not live to see. Take the ember. It was always meant
    to be a beginning, not a grave. We only kept it safe until someone came who could carry it forward.
    That is you. It was always going to be you. Go and make something. That is the whole of the craft."

# --- The Deep Wreckways content (Seed Scale Doctrine): a salvage gather node, the chapel's relic,
# --- and the drowned chapel's lore. ---
wreckways_salvage:
  name: a bundle of wreckways salvage
  keywords: [salvage, wreckways, bundle, material]
  location: the_deep_wreckways
  resettable: true  # a salvage node in the deep wrecks: take it, and the sea gives up more on the reset

chapel_relic:
  name: a drowned chapel-relic
  keywords: [relic, chapel, drowned, ward]
  location: nowhere
  slot: accessory_1
  mods: {"MAG DEF": 6, DEF: 3}  # the Merewrights' altar-ward, salvaged from the drowned chapel

chapel_offering:
  name: the drowned chapel's last offering
  keywords: [offering, chapel, altar, cache]
  location: the_drowned_chapel
  lore: |-
    Left on the altar of the drowned chapel, wrapped in oilcloth against a sea that came anyway:
    the Merewrights of Sunhold prayed here to the making itself, and when the Cooling-Sea rose over
    the Reach they did not flee - they stayed, and lit the altar-lamp, and asked the craft to hold the
    water back one more hour, and one more. It did not. But the lamp is still lit, behind the altar,
    on a seam of ember the sea could not drown. They asked the wrong thing of the making. The making
    does not hold back the sea. It gives you the hands to build a boat. Take the lamp. Build something.

# --- The Outer Reefs content (Great Creation Campaign): the flats' pearl-gather, the manse's prize,
# --- and the drowned house's lore. ---
brine_pearl:
  name: a brine-pearl
  keywords: [pearl, brine, flats, material]
  location: the_reef_flats
  resettable: true  # a tidal gather in the flats: take it, and the tide leaves another on the reset

manse_signet:
  name: the drowned house's signet
  keywords: [signet, manse, house, ring]
  location: nowhere
  slot: accessory_2
  mods: {DEF: 5, "MAG DEF": 6}  # the sunken manse's steward-ring, a house's pride cast in salvage-gold

manse_ledger:
  name: the drowned house's ledger
  keywords: [ledger, manse, house, book]
  location: the_sunken_manse
  lore: |-
    The last ledger of the Merewright house that kept the Sunken Manse, its columns of salvage and
    salt and coin ruled to the final page: the house was rich, and the house was proud, and when the
    Cooling-Sea rose over the Quenchmere the house did not flee to the free-port with the common folk.
    It stayed, and shored its doors, and kept its wealth, and drowned in its own halls counting it.
    The steward kept the doors then and keeps them now. Take the signet. Wealth you will not spend on
    a boat is only ballast. The salvagers of Saltmarsh learned that. The house never did.
# --- The Verdance expansion content (Great Creation Campaign): the understory's gather, the ziggurat
# --- god's relic, and the readable lore of the shrine and the forgotten people. ---
glowcap:
  name: a cluster of glowcap
  keywords: [glowcap, cap, mushroom, understory]
  location: the_understory
  resettable: true  # the understory's gather: glowcap on the fallen giants, regrows on the reset

rootpriest_censer:
  name: the Rootpriest's censer
  keywords: [censer, rootpriest, ziggurat, relic]
  location: nowhere
  slot: accessory_1
  mods: {"MAG DEF": 8, DEF: 4}  # the undying god's reliquary-censer, torn from the Sunken Ziggurat's crown

bark_testament:
  name: the testament in the bark
  keywords: [testament, bark, shrine, tree]
  location: the_wildember_shrine
  lore: |-
    Not written but grown: the tree's own testament, carved by the slow press of the Deeprooted's
    reading hands into the living bark of the wild-ember shrine, a warning kept green for an age.
    Before the Deeprooted came a people of black stone who took the Verdance for a thing to be ruled.
    They cut the roots to lay their causeways. They caged the wild flame in their ziggurat and called
    it a god they owned. So the tree closed its hand. Not in a day: over lifetimes, root by root, until
    the black-stone people were only a shape under the green and their god a thing that ate its own
    priests to keep from dying. The Deeprooted took the lesson the black-stone people would not: you do
    not own the flame. You keep it, or it keeps you.

ziggurat_reliquary:
  name: the choked reliquary
  keywords: [reliquary, ziggurat, faith, box]
  location: the_ziggurat_vault
  lore: |-
    A reliquary of black stone, its lid grown shut with the root that killed the hand that made it.
    Inside, in a dead script the tree has nearly closed over: the last rite of the black-stone faith.
    When the roots came for the city, the priests did not flee. They fed their god instead -- their
    acolytes first, then each other, then the high priest last of all, each swallowed into the growing
    thing at the ziggurat's crown so that some part of the faith would endure when the people did not.
    It worked, after a fashion. The god endured. There was simply no longer anyone left to worship it,
    and nothing left of it worth worshipping. Endurance is not the same as living. The tree knew that.
    The priests learned it too late.

# --- The Rimefall expansion content (Great Creation Campaign): the fields' ice-gather, the Frostbound
# --- Smith's masterwork, and the readable lore of the Silent Anvil and frozen Frosthold. ---
rime_crystal:
  name: a shard of rime-crystal
  keywords: [rime, crystal, shard, fields]
  location: the_riming_fields
  resettable: true  # the riming-fields' gather: rime-crystal in the cold seams, reforms on the reset

frostbound_hammer:
  name: the Frostbound Smith's hammer
  keywords: [hammer, frostbound, smith, weapon]
  location: nowhere
  slot: weapon
  mods: {ATK: 22, ACC: 6}  # a golden-age masterwork, torn from the Frozen Forge mid-strike; the best steel in the north

anvil_creed:
  name: the creed of the Silent Anvil
  keywords: [creed, anvil, cloister, stone]
  location: the_silent_cloister
  lore: |-
    Graven small in the warm stone of the cloister, in a plain hand, the whole rule of the Silent Anvil:
    "The golden age did not fall. It froze, mid-boast, in the very act of making one thing too many. We
    do not mourn it. We keep it, so the world can walk through its pride and learn. We Forge nothing.
    Not because making is wrong, but because knowing when to stop is the harder making, and the age
    that could not learn it is under the ice for anyone to see. Sweep the rime. It comes back. So do we.
    Keep the shrine. Do not wake the King. Restraint is the last Forge, and the coldest, and the only one
    that never has to be undone."

frosthold_daybook:
  name: the market-master's daybook
  keywords: [daybook, market, frosthold, ledger]
  location: frosthold
  lore: |-
    A market-master's daybook, frozen open to its last page, the ink stopped mid-word. The entries run
    ordinary to the very end: glass sold, a festival-day's takings, a note to mend the forge-bellows, a
    daughter's name and a birthday coming. And then, in the same steady hand, the last line: "Sky went
    white at noon. The Smith says the pour is good, the best he has ever set. He will not leave it to
    cool. He says one more strike. He says --" and there the ink stops, and Frosthold with it, a whole
    city caught between a father's errand and a smith's last blow, kept perfect and kept forever in the
    one instant it should have stepped back from the heat. The Silent Anvil read this page to their
    novices. It is the whole of their creed, written by a man who did not know he was writing it.

# --- The Kingsroad Beacon's plaque (Great Creation Campaign): the viewpoint's reward for the climb. ---
beacon_plaque:
  name: the beacon's cold plaque
  keywords: [plaque, beacon, kingsroad, brass]
  location: the_kingsroad_beacon
  lore: |-
    A brass plaque at the beacon's foot, green with an age of frost: "KINGSROAD BEACON -- Fourth of the
    Nine. Lit each dusk, answered north by Frosthold's, answered north again by the Court's, so that on
    a clear night the whole Kingsroad burned from the sea to the throne, and no traveller in the
    Rimefall was ever more than a beacon from a warm door." Nine beacons. This is the fourth, and the
    last that still stands clear of the ice. The other five are somewhere north, under the deep white,
    lit for a road no one has walked since the sky went white at noon. From here you can see where two
    of them should be. Neither burns.
# --- The Kollforge expansion content (Great Creation Campaign): the flats' fire-gather, the drake's
# --- mantle and Ashkoll's masterbrand, and the readable lore of the Kollkin and the cooled dead. ---
emberglass:
  name: a shard of emberglass
  keywords: [emberglass, glass, shard, flats]
  location: the_obsidian_flats
  resettable: true  # the obsidian-flats' gather: emberglass sets in the cracks, reforms on the reset

drakescale_mantle:
  name: a mantle of cinder-drake scale
  keywords: [mantle, drake, scale, cinder]
  location: nowhere
  slot: body
  mods: {DEF: 16, "MAG DEF": 10}  # shed scale of the cinder-gorge drake, fire-proof and forge-warm

ashkoll_masterbrand:
  name: the Ashkoll masterbrand
  keywords: [masterbrand, ashkoll, brand, weapon]
  location: nowhere
  slot: weapon
  mods: {ATK: 28, ACC: 5}  # Ashkoll's last and best, forged before the cold; carried up into the light again

kollkin_creed:
  name: the Kollkin creed
  keywords: [creed, kollkin, bronze, caldera]
  location: the_caldera_market
  lore: |-
    Struck in bronze at the caldera's lip, in a bold deep hand: "HEAT IS LIFE. A cold land is a corpse,
    a cold house a grave, a cold hearth a confession. The frozen north keeps its dead and calls it
    wisdom; the drowned Reaches count their losses and call it peace. We are Kollkin. We keep the fire.
    We would rather burn out than gutter cold, and rather pour one strike too many than let the caldera
    fail. Look below at Ashkoll, that let its fire die, and know there is no worse death than the cold.
    Spend hot. Live hot. When you go, go bright." It is the exact opposite of the Silent Anvil's creed
    in the frozen north, and both peoples are certain, and both point at each other's dead cities as
    proof, and neither has noticed that the drowned, the frozen, and the cooled are all just dead.

ashkoll_last_pour:
  name: the record of the last pour
  keywords: [record, pour, ashkoll, tablet]
  location: dead_ashkoll
  lore: |-
    A work-tablet from Ashkoll's dead forge-square, its cold-scratched tally stopped mid-count. The
    Vent-master's hand runs steady and proud down the years: caldera strong, pours good, the hottest
    hold in the Kollforge, a city that would never let its fire fail as the soft southern holds did. And
    then the entries thin. "Caldera low this season, but it will rise." "Low again. We banked harder."
    "We pour less to save the heat, but the saving cools it faster." "Cold in the low quarter. We moved
    the people up." "Cold in the high quarter now." And last, in a hand gone unsteady: "We spent it all
    keeping warm and now there is nothing left to burn. We were so afraid of the cold that we fed it
    everything we had. Tell Emberkoll: it is not the cold that kills a hold. It is the fear of it."

# --- The Sundered Sky expansion content (Great Creation Campaign): the shoals' storm-gather, the
# --- Broken Warden's chain, and the readable lore of the Skyborn and the falling hold. ---
stormglass:
  name: a shard of stormglass
  keywords: [stormglass, storm, shard, shoals]
  location: the_drifting_shoals
  resettable: true  # the drifting-shoals' gather: stormglass where the lightning grounds, reforms on the reset

anchor_warden_chain:
  name: the Broken Warden's chain
  keywords: [chain, anchor, warden, weapon]
  location: nowhere
  slot: weapon
  mods: {ATK: 32, ACC: 7}  # a length of the snapped anchor-chain, still humming with the hold it can no longer keep

skyborn_creed:
  name: the Skyborn creed
  keywords: [creed, skyborn, capstan, drum]
  location: the_anchor_quarter
  lore: |-
    Cut in a ring around the capstan-drum, worn smooth by a thousand years of hands: "WE NEVER LANDED.
    The world came apart and the ground fell away and we did not fall with it -- not because we were
    spared, but because we kept the anchor and each other and did not let go. Let the drowned mourn
    their sea and the frozen keep their ice and the burned tend their fire. We keep the chain. A home
    is not a place you stand on. It is a thing you hold, together, in the open air, against the long
    fall that takes everything that lets go. Mind the capstan. Hold the line. And when your grip fails,
    as every grip fails, fall slowly, and let someone else take the chain." Of the four peoples' answers
    to the same broken world, it is the only one that does not point at a corpse to prove itself. The
    Skyborn simply kept holding on. So far, it has been enough.

falling_hold_manifest:
  name: the hold's last manifest
  keywords: [manifest, hold, falling, log]
  location: the_falling_hold
  lore: |-
    An anchor-keeper's manifest from the Falling Hold, its readings logged in a proud steady hand down
    the generations, and every reading a lie the keepers did not know they told. "Altitude holding.
    Chain sound. Moored fast, equal to Highgate." Year on year, the same: holding, sound, moored. And
    only if you read every entry in a row, across the lifetimes, do you see it: the altitude number
    dropping a hair each generation, so slowly no single keeper could catch it, the whole hold falling
    at the speed of a life so that no one living ever felt the fall. The last entry is the same as the
    first: "Altitude holding. Chain sound. Moored fast." It was written the year the floor was already
    a mile below where the first keeper stood, by a man who died certain he had never moved. Some things
    do not fall fast enough to notice. That does not mean they are not falling. Read your own manifest
    twice, Forger. Then go up, while a chain still holds.
# --- The Cinderwaste content (Great Creation Campaign, Phase I): the waste's survival trade, its
# --- cinderglass gather, the sealed vault's prize, and the readable lore of the world's hem. ---
water_ration:
  name: a water-ration
  keywords: [water, ration, drink, flask]
  location: nowhere
  consume: {hp: 15}  # the Cinderwaste's dearest trade: water, sold at the Salt-Market, drunk against the dry

cinderglass_shard:
  name: a shard of cinderglass
  keywords: [cinderglass, glass, shard, cinder]
  location: the_glassways
  resettable: true  # the glassways' gather: Unforging-fused glass, sold hot in the Glass Market, reforms on reset

scoured_vault_seal:
  name: the scoured vault's seal
  keywords: [seal, vault, scoured, sigil]
  location: nowhere
  slot: accessory_1
  mods: {"MAG DEF": 9, DEF: 5}  # the sigil the last maker died sealing the vault with; carried off the colossus

ashline_marker:
  name: the last Ashborn marker
  keywords: [marker, ashline, stone, hem]
  location: the_ashline
  lore: |-
    The last salvage-pole the Ashborn drive before the Ashline, a cross-stave hung with the tokens of
    those who walked past it and did not come back: a child's spoon, a clan-ring, a Forger's cold spark.
    Carved down the stave, re-cut each time the wind wears it faint: "THE WORLD ENDS HERE. Not in fire,
    not in flood, but in un-ness -- the place the making stopped and never started again. Do not mistake
    this for a border. A border has another side. This has only the near side, and us, and the pull. We
    are the people who live at the hem of the made world and keep each other from stepping off it. That
    is the whole of the Ashborn faith. There is nothing past the last stone worth the walk, because
    there is no past the last stone. Step back. Live in the made part. It is enough. It has to be."

vault_testament:
  name: the sealed maker's testament
  keywords: [testament, vault, maker, seal]
  location: the_unfinished_vault
  lore: |-
    Scratched inside the vault door by a hand running out of time: the testament of the scoured hold's
    last maker. "The Unforging took the east wing between one breath and the next -- I watched a wall
    become the memory of a wall and then nothing. It is coming through the hold room by room and it does
    not hurry, because to it there is no time, only the slow forgetting of things that were made. I
    cannot stop it. I can only seal this one vault so well that the un-ness has to remember, hard, that
    this room was MADE, and stumble on the remembering. Everything I could not save is a doorway to
    nothing now. This -- this stays made, because I insisted, with the last making I had, that it must.
    If you read this, the seal held. Take what is here. And know that the only wall against the unmaking
    is a made thing that refuses, absolutely, to be unmade. Refuse. It is the only Forge that matters."

# --- The Cinderdeep content (Great Creation Campaign, Phase I): the deep's raw unmade gather, the
# --- Hollow King's crown, the drowned smith's last work that outlasted the unmaking, and deep-lore. ---
unmade_ember:
  name: a bead of unmade Ember
  keywords: [unmade, ember, bead, cinderdeep]
  location: the_hollow_march
  resettable: true  # the hollow-march gather: raw Ember the deep unmade, pooled in the cinder-wells, reforms on reset

hollow_crown:
  name: the Hollow Crown
  keywords: [crown, hollow, king, umbral]
  location: nowhere
  slot: head
  mods: {"MAG DEF": 14, DEF: 8}  # torn off the Hollow King; a circle of pure unmaking that wards the maker who dares wear it

kiln_lastwork:
  name: the drowned smith's last work
  keywords: [lastwork, work, kiln, smith]
  location: the_sunken_kiln
  slot: body
  mods: {DEF: 15, "MAG DEF": 12}  # a mail the master-smith forged so well the unmaking could not break it, only grey it
  lore: |-
    The last thing the master-smith of the sunken kiln ever made, cold in the dead furnace where the
    deep swallowed the town: a coat of Forge-mail, greyed by the unmaking but whole - unmade and yet
    unbroken, because it was made too well to forget. Where the town's walls thinned to nothing and its
    people to echoes, this one thing held, for the only reason anything holds against the deep: it was
    forged by a maker who meant it to last, and meaning, it turns out, is the one material the unmaking
    cannot dissolve. Wear it down here and the deep will remember, against its will, that some things
    are made on purpose. Carry it up and it is only good mail. The greyness fades in a world that sets.

cinderdeep_reckoning:
  name: a Warden's reckoning of the deep
  keywords: [reckoning, warden, cinderdeep, record]
  location: the_greydark
  lore: |-
    A Warden-Concord reckoning-stone, driven into the Greydark's soft floor by some earlier expedition
    and half-forgotten since: "Let it be recorded, for the Forgers who come after, what the Cinderdeep
    IS, against the lies the Cinder Mysteries tell of it. It is not the world's grave. It is not its
    compost. It is the world still coming apart, slowly, at the seam the Unforging opened and no one
    closed, and it grows downward because unmaking, unlike making, needs no maker - it only needs to be
    left alone. Every Reach has a mouth into it. Every mouth widens. We do not seal the deep because we
    cannot; we only mark it, and mark the dead, and teach the living the one truth the deep exists to
    prove: that a made thing is not permanent, it is DEFENDED, and the day the makers stop defending it
    is the day it joins the grey. Go down if you must. Come up while you can. And when you are old,
    remember you were made on purpose, and defend something."

# --- Emberreach City interiors content (Great Creation Campaign, Phase I, Layer 4): the tavern's ale
# --- and the capital's two readable stones - the First Flame's creed and the world's own case-file. ---
cinder_ale:
  name: a tankard of cinder-ale
  keywords: [ale, cinder, tankard, drink]
  location: nowhere
  consume: {hp: 8}  # the Cinder Tankard's brew: warm, cheap, a small mercy sold by the barkeep

first_flame_creed:
  name: the creed of the First Flame
  keywords: [creed, flame, church, hearth]
  location: the_first_flame_church
  lore: |-
    Graven over the church hearth, in a hand that meant it: "THE WORLD WAS MADE. That is the first
    article and the last. Not born, not fallen from a god's hand, not eternal - MADE, by makers, out of
    raw Ember and will, and what was made was unmade at the Unforging, and what was unmade can be Made
    AGAIN. This is the whole of the First Flame: not that the fire is holy, but that the making is, and
    the keeping of the fire is only the keeping of the will to make. Do not worship the flame. Tend it.
    A god you beg. A fire you feed. We are not the children of the world. We are its smiths, and the
    Rekindling is our second and final chance to prove we learned the first lesson: a made thing lives
    only as long as someone keeps making it. Keep the flame. Make the world. Do not, this time, let go."

world_casefile:
  name: the world's own case-file
  keywords: [casefile, case, file, archive]
  location: the_grand_archive
  lore: |-
    The Grand Archive's founding record, the case-file the Emberwright Rememberers opened on the world
    itself: "CASE: THE UNFORGING. STATUS: open, and will not close. Known: the world was one Forged
    supercontinent; it came apart along the cooling-seas into the seven Reaches, tore lands into the
    sky, dropped others into the Cinderdeep; the makers who did it, the Emberwrights, are gone, and left
    no confession, only the wound. Unknown, and this is the Archive's whole purpose: WHY. Why the first
    makers stopped. Why a craft that could build a world was set down, and by hands that knew exactly
    what they were setting down. Every clue is a Reach. Every Reach is a page. The Forgeward Road runs
    east to where the answer sank, and a Forger who reads far enough may close the case the makers left
    open. We do not keep the memory to mourn it. We keep it to solve it. Read on. The next clue is out
    there, and it is the size of a continent."
