# SEED: aethryn -- recipes.yaml (the maker's loop: `craft <recipe>` forges materials into goods)
# Ember-shards (gathered at the resettable node, or bought/looted) and drowned ingots (boss salvage)
# become draughts and gear at the hearth -- so the maker Jobs and the drop economy have a real use.
# Each recipe's inputs/outputs are cross-checked against the seed's items at boot.

field_draught:
  name: a healing draught
  makes: healing_draught
  inputs: {ember_shard: 2}

focusing_draught:
  name: a mana draught
  makes: mana_draught
  inputs: {ember_shard: 2}

forge_a_hammer:
  name: a cinder hammer
  makes: cinder_hammer
  inputs: {ember_shard: 3, hollow_ingot: 1}

forge_plate:
  name: cindershell plate
  makes: cindershell_plate
  inputs: {hollow_ingot: 2, ember_shard: 2}

# --- The maker's loop reaches the new content (Content Manufacturing Campaign). Gather ember and
# --- salvage ingots, and forge the consumable ladder + the Emberhide starter set. The greater tiers
# --- cost more ember; the grand tiers and the elixir are gated behind boss-salvage (hollow_ingot),
# --- so crafting progresses with the journey, not ahead of it. ---
brew_greater_healing:
  name: a greater healing draught
  makes: greater_healing_draught
  inputs: {ember_shard: 5}

brew_grand_healing:
  name: a grand healing draught
  makes: grand_healing_draught
  inputs: {ember_shard: 10, hollow_ingot: 1}

brew_greater_mana:
  name: a greater mana draught
  makes: greater_mana_draught
  inputs: {ember_shard: 5}

brew_grand_mana:
  name: a grand mana draught
  makes: grand_mana_draught
  inputs: {ember_shard: 10, hollow_ingot: 1}

brew_forgefire_elixir:
  name: a forgefire elixir
  makes: forgefire_elixir
  inputs: {ember_shard: 12, hollow_ingot: 3}

stitch_emberhide_hood:
  name: an emberhide hood
  makes: emberhide_hood
  inputs: {ember_shard: 3}

stitch_emberhide_jerkin:
  name: an emberhide jerkin
  makes: emberhide_jerkin
  inputs: {ember_shard: 4}

stitch_emberhide_wraps:
  name: a set of emberhide wraps
  makes: emberhide_wraps
  inputs: {ember_shard: 3}

forge_reaver_blade:
  name: a reaver's blade
  makes: reaver_blade
  inputs: {ember_shard: 4, hollow_ingot: 2}

# The completionist endgame craft: one essence from every great Reach's boss forges the Reachlord's
# Signet, a legendary that says you conquered the whole world across the sea and the sky.
forge_reachlord_signet:
  name: the Reachlord's Signet
  makes: reachlord_signet
  inputs: {brine_essence: 1, grove_essence: 1, rime_essence: 1, molten_essence: 1, storm_essence: 1}

# Herbal salves: each biome's gather-herb (items.yaml) worked into a healing salve, so every
# forageable material feeds a real recipe (the maker's loop reaches the wilds' herbs, not just ore).
meadowfoil_salve:
  name: a herbal salve (meadowfoil)
  makes: herbal_salve
  inputs: {meadowfoil: 2}
fernshade_salve:
  name: a herbal salve (fernshade)
  makes: herbal_salve
  inputs: {fernshade: 2}
moorbell_salve:
  name: a herbal salve (moorbell)
  makes: herbal_salve
  inputs: {moorbell: 2}
saltkelp_salve:
  name: a herbal salve (saltkelp)
  makes: herbal_salve
  inputs: {saltkelp: 2}
frostmoss_salve:
  name: a herbal salve (frostmoss)
  makes: herbal_salve
  inputs: {frostmoss: 2}
cinderroot_salve:
  name: a herbal salve (cinderroot)
  makes: herbal_salve
  inputs: {cinderroot: 2}
vinesilk_salve:
  name: a herbal salve (vinesilk)
  makes: herbal_salve
  inputs: {vinesilk: 2}
dustbloom_salve:
  name: a herbal salve (dustbloom)
  makes: herbal_salve
  inputs: {dustbloom: 2}
