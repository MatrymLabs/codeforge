# Dependabot -- automated dependency vulnerability + version monitoring.
# Supply-chain hygiene (NIST SSDF RV, EO 14028): a bot watches deps so a known
# CVE surfaces as a PR, not a surprise. Bumps are reviewed like any change
# (branch -> CI green -> merge); Dependabot never merges on its own.
version: 2
updates:
  # Python runtime + dev dependencies (pyproject.toml AND uv.lock).
  #
  # `uv`, not `pip`. The pip ecosystem edits pyproject.toml and never regenerates
  # uv.lock, while ci.yml's FIRST step is `uv lock --check`. So every dependency PR
  # the bot opened failed on arrival with "The lockfile at `uv.lock` needs to be
  # updated" (PRs #855 and #856, both red for days on a defect that had nothing to
  # do with the dependency being bumped). The uv ecosystem understands pyproject.toml
  # and uv.lock together and updates both in the same PR.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "security"

  # The CI/CD workflow actions themselves (pinned action versions age out).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
