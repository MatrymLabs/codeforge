name: docs

# Validate the docs/ tree with a STRICT mkdocs build. This does NOT publish.
#
# codeforge deliberately does not publish a GitHub Pages site (founder decision,
# 2026-08-08): the portfolio page lives in the separate matrymlabs.github.io repo.
# The publish half of this workflow used to call actions/configure-pages, which
# failed on every run from 2026-08-03 because Pages is not enabled here and the
# token cannot create it. The build half is worth keeping on its own: `--strict`
# fails on broken links, missing nav entries, and doc rot.
#
# Local equivalent: `make docs-build`.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Cancel superseded runs on the SAME ref: pushing three commits to a PR otherwise runs three
# full workflows to completion and only the last answer is ever read.
#
# PULL REQUESTS ONLY, deliberately. An earlier draft used `github.ref != 'refs/heads/main'`,
# which is TRUE for a release event (its ref is the tag) and could cancel a release
# mid-publish. It is also true for schedules and tags. Cancelling main's run is its own
# hazard: "we cancelled the proof" is indistinguishable from "the proof never ran", and this
# fleet has already lost a day to exactly that ambiguity. So: cancel PR iterations, nothing
# else, ever.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Install the docs toolchain
        run: uv pip install --system mkdocs-material
      - name: Build the site (strict)
        run: mkdocs build --strict
