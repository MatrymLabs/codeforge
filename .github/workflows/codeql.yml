# CodeQL -- GitHub-native static analysis (SAST) for the code AND the workflows.
# Complements bandit (fast, local, in `make check`/CI) with GitHub's deeper semantic
# scan; results land in the Security tab. Public repos get CodeQL for free.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"  # weekly sweep (Monday), catches newly-published queries

# Cancel superseded runs on the SAME ref: pushing three commits to a PR otherwise runs three
# full workflows to completion and only the last answer is ever read.
#
# PULL REQUESTS ONLY, deliberately. An earlier draft used `github.ref != 'refs/heads/main'`,
# which is TRUE for a release event (its ref is the tag) and could cancel a release
# mid-publish. It is also true for schedules and tags. Cancelling main's run is its own
# hazard: "we cancelled the proof" is indistinguishable from "the proof never ran", and this
# fleet has already lost a day to exactly that ambiguity. So: cancel PR iterations, nothing
# else, ever.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read  # required: the analyze step reads the workflow run (get-a-workflow-run) and the `actions` language scans workflows; without it CodeQL 403s after exporting SARIF
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]  # the languages GitHub detected for this repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4
        with:
          languages: ${{ matrix.language }}

      # Python is interpreted -- no build step needed; CodeQL analyzes the source directly.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4
        with:
          category: "/language:${{ matrix.language }}"
