name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the SAME ref: pushing three commits to a PR otherwise runs three
# full workflows to completion and only the last answer is ever read.
#
# PULL REQUESTS ONLY, deliberately. An earlier draft used `github.ref != 'refs/heads/main'`,
# which is TRUE for a release event (its ref is the tag) and could cancel a release
# mid-publish. It is also true for schedules and tags. Cancelling main's run is its own
# hazard: "we cancelled the proof" is indistinguishable from "the proof never ran", and this
# fleet has already lost a day to exactly that ambiguity. So: cancel PR iterations, nothing
# else, ever.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # uv (Rust, parallel resolver) installs the dependency set far faster than pip.
      # CI-only tooling; not a runtime or pyproject dependency. Installs into the
      # setup-python interpreter via --system.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      # The pinned graph must match pyproject.toml: editing dependencies without
      # re-running `uv lock` fails here, loud, before anything installs (<1s).
      - name: Verify uv.lock is current
        run: uv lock --check

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Regenerate and verify published contracts
        run: make contracts

      - name: Prove native seed workspace contracts
        run: python scripts/native_seed_contract_proof.py

      # `make check` folds coverage into a single suite run (lint · types · pytest --cov
      # · threshold) and writes coverage.xml -- no separate coverage step needed.
      # The lint gate covers every language present, so the runner needs every language's
      # linter. Rust and Go toolchains ship with the runner image; their LINTERS do not, and
      # `make check` went green locally while CI failed on `golangci-lint: not found`. That is
      # non-negotiable 4 in one line: a green local run is not a green CI matrix.
      - name: Install the non-Python linters the omnicode gate invokes
        run: |
          rustup component add clippy rustfmt
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          shellcheck --version | head -2
          protoc --version

      # native/spine imports generated protobuf bindings that are git-ignored by ADR-0012, so the
      # module cannot BUILD, let alone lint, until codegen runs. It has therefore never been
      # inspected in CI at all. This is not a workaround; it is the step that makes spine
      # inspectable for the first time.
      - name: Regenerate the protocol-spine bindings so native/spine can be inspected
        run: make proto

      # `lint` now covers Terraform, and ubuntu-latest does NOT ship terraform: the dedicated
      # `terraform` job below installs it explicitly for exactly this reason. Without this step
      # `make check` here dies on `lint-terraform: UNVERIFIED - no terraform on PATH`, which is the
      # target refusing to report a language it cannot inspect. That refusal is correct; supplying
      # the toolchain is the fix, not silencing it. Version pinned to match the terraform job.
      - name: Install Terraform so the lint gate can inspect it
        run: |
          TF_VER=1.9.8
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o tf.zip "https://releases.hashicorp.com/terraform/${TF_VER}/terraform_${TF_VER}_linux_amd64.zip"
          unzip -o -q tf.zip -d "$HOME/.local/bin"
          rm -f tf.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the gates (check = lint · types · tests+coverage)
        run: make check

      # Blocking gate: the live end-to-end spine. Boots an isolated server on a spare
      # port with an ephemeral DB and drives the real player journey over TCP -- login,
      # look, calling, combat, ability, reward, quest, persistence, logout. A broken
      # journey blocks merge. (It once sat red at 6/16 because nothing ran it.)
      - name: Live spine smoke (end-to-end player journey)
        run: make smoke

      # Blocking gate: validate the flagship Aethryn world map (connectivity + no
      # unreachable rooms). The smoke boots the small first-forge seed, so without this
      # a seed edit that orphaned a room or broke an exit ref in the ~53k-room, 14-zone
      # Aethryn world would merge unseen. `make world-check` is `tools.world validate`.
      - name: Validate the Aethryn world map
        run: make world-check

      # Upload coverage to Codecov. Non-blocking: a Codecov outage or a missing
      # token must never turn the portfolio's build red. Public repo uploads work
      # tokenless; set the CODECOV_TOKEN secret for higher rate limits.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # Blocking gate: audit the RUNTIME dependency set (what actually ships) and fail on
      # any known CVE, upholding the "zero unresolved high/critical dependency vulns" law.
      # A documented exception uses `pip-audit --ignore-vuln <ID>` with a reason.
      - name: Runtime dependency CVE gate
        run: make audit-runtime

      # Gate canary (RD-2026-0002 #1): prove the CVE gate BLOCKS on a real defect, so a future
      # weakening of it turns THIS step red. A gate never tested against a known-vulnerable input
      # is faith, not evidence (DoD secure-coding doc: "known-vulnerable fixture").
      - name: CVE gate canary (must block on a known-vulnerable pin)
        run: make gate-canary

      # Informational, non-blocking: pip-audit scans the WHOLE environment, so an
      # unrelated CVE in build tooling (pip/setuptools) surfaces without turning the
      # build red. Review its output; the runtime gate above is what blocks.
      - name: Dependency CVE audit (whole env, informational)
        run: make audit
        continue-on-error: true

      - name: Static security scan
        run: bandit -c pyproject.toml -r parts forge.py -q

      - name: Secret scan
        run: make secrets

      # SBOM (SSDF supply-chain evidence): generate a CycloneDX bill of materials and
      # keep it as a build artifact. Reproducible from this commit; non-blocking.
      - name: Software bill of materials (SBOM)
        run: make sbom
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom-cyclonedx
          path: reports/security/sbom.cdx.json
          if-no-files-found: warn

  # Proves the ORM + Alembic migrations work against a REAL PostgreSQL, not just SQLite.
  # The unit suite (check job) stays SQLite-isolated; this job is a focused integration
  # proof, so it is intentionally NOT a required check (it cannot deadlock a merge).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: codeforge
          POSTGRES_PASSWORD: codeforge  # pragma: allowlist secret
          POSTGRES_DB: codeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://codeforge:codeforge@localhost:5432/codeforge  # pragma: allowlist secret
      POSTGRES_TEST_URL: postgresql+psycopg://codeforge:codeforge@localhost:5432/codeforge  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install dependencies (with the postgres extra)
        run: uv pip install --system -e ".[dev,postgres]"
      - name: Build the schema with Alembic (upgrade head)
        run: alembic upgrade head
      - name: Prove the ORM round-trips + the SQL analytics run on PostgreSQL
        run: pytest tests/test_postgres_integration.py tests/test_analytics.py -v

  # Drives the live HTMX dashboard with a real Chromium browser (isolated in e2e/, never in
  # `make check`). A focused front-to-back proof, so it is intentionally NOT a required check.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Install the Chromium browser (+ OS deps)
        run: python -m playwright install --with-deps chromium
      - name: Run the browser E2E suite
        run: pytest e2e -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Build the image
        run: docker build -t codeforge:ci .
      - name: Smoke-test the container boots and serves
        run: |
          docker run -d --name cf -p 4000:4000 codeforge:ci
          sleep 5
          docker logs cf
          # The gateway announces itself once the seed loads and the socket binds.
          # If the seed files went missing or a part failed to import, this line
          # never prints and the job fails loud.
          docker logs cf 2>&1 | grep -q "listening on 0.0.0.0:4000"
          docker rm -f cf
      - name: Build the API image
        run: docker build -f Dockerfile.api -t codeforge-api:ci .
      - name: Smoke-test the API serves real evidence
        run: |
          docker run -d --name cfapi -p 8000:8000 codeforge-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl -sf http://localhost:8000/api/status | grep -q '"engine":"codeforge"'
          curl -sf http://localhost:8000/api/blueprints | grep -q 'npc_combat'
          docker rm -f cfapi

  # Proves the infrastructure-as-code (deploy/terraform/) is well-formed: format,
  # provider init, and validate. It does NOT apply (that needs a Docker daemon +
  # the published image); the live demo runs on Render via render.yaml.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install Terraform
        run: |
          TF_VER=1.9.8
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o tf.zip "https://releases.hashicorp.com/terraform/${TF_VER}/terraform_${TF_VER}_linux_amd64.zip"
          unzip -o -q tf.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Format check (all modules)
        run: terraform fmt -check -recursive deploy/terraform
      - name: Init + validate (local-docker module)
        working-directory: deploy/terraform
        run: |
          terraform init -backend=false
          terraform validate
      - name: Init + validate (render module)
        working-directory: deploy/terraform/render
        run: |
          terraform init -backend=false
          terraform validate

  # The security scanners, moved from the bench to the merge.
  #
  # `make security` grew four non-Python scanners on 2026-08-17 and CI ran NONE of them: the only
  # thing it invoked from that family was `make secrets`. So git history, the Go dependency graph
  # and the filesystem surface were inspected on whichever bench happened to run the target by
  # hand, and never on the path that decides what merges. A gate the merge does not run is a
  # suggestion.
  #
  # Versions are PINNED to the ones the bench verified, so CI and the bench inspect the same tool.
  # An unpinned scanner silently changes its own verdict on a schedule nobody chose.
  #
  # security-rust is deliberately ABSENT: cargo-deny needs deny.toml, which is still on an
  # unmerged branch. Adding the step now would put a permanently red job in front of every merge,
  # and a job everyone learns to ignore protects nothing. It joins when the config lands.
  security-scanners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # gitleaks reads HISTORY; a shallow clone would scan almost nothing

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"

      - name: Install the scanners, pinned to the versions the bench verified
        run: |
          GITLEAKS_VER=8.30.1
          TRIVY_VER=0.74.0
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" | tar -xz -C "$HOME/.local/bin" gitleaks
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VER}/trivy_${TRIVY_VER}_Linux-64bit.tar.gz" | tar -xz -C "$HOME/.local/bin" trivy
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # spine imports generated bindings that are git-ignored (ADR-0012), so govulncheck cannot
      # build its call graph until codegen runs. Without this the Go scan inspects one module of two.
      - name: Regenerate the protocol-spine bindings
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          make proto

      - name: Secrets, across the whole of git history
        run: make security-secrets-history

      # SOURCE mode: reports only vulnerabilities the code can actually reach, rather than every
      # advisory touching any module in the graph.
      - name: Go dependency vulnerabilities (reachability-aware)
        run: make security-go

      - name: Filesystem scan (vulns, secrets, misconfiguration)
        run: make security-fs

  # Polyglot native extension (Rust / PyO3): build the codeforge_nav navigation kernel and prove it
  # matches the pure-Python fallback byte-for-byte (the parity test). NOT a required check -- the
  # main `check` gate runs on the fallback, so a Rust-toolchain hiccup never blocks a merge
  # (ADR-0010: Python-first, native-optional).
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the Rust toolchain (rustup, minimal)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install build + test dependencies
        run: |
          pip install maturin
          pip install -e ".[dev]"

      - name: Build + install the native navigation kernel
        run: |
          maturin build --release -m native/codeforge_nav/Cargo.toml --out dist
          pip install --no-index --find-links dist codeforge-nav

      - name: Stable-ABI (abi3) audit -- 0 violations required (T-AP-07)
        run: |
          pip install abi3audit
          abi3audit dist/codeforge_nav-*.whl

      - name: Parity + navigation tests (native backend present)
        run: python -m pytest tests/test_navigation.py -q

      - name: Benchmark evidence (non-fatal)
        run: python -u benchmarks/bench_nav.py 30000 || true

  # Polyglot service organ (Go): build + test the codeforge-edge gateway and prove it byte-matches
  # the pure-Python reference proxy (the parity test). NOT a required check -- the main `check` gate
  # runs on the fallback, so a Go-toolchain hiccup never blocks a merge (ADR-0011: Python-first,
  # native-optional, the swap chosen at launch).
  # KF-RF-2: the Rider projection was verified on ONE host, the maker's, where Rider's bundled JBR
  # happens to live. A lane proven on one machine is a claim about that machine. This job builds and
  # lints it on a runner that has never seen Rider, which is the only way the kotlin lane earns the
  # word `governed` in the Store's LANGUAGE_LANES.yaml.
  #
  # Deliberately NOT the IntelliJ Platform plugin build: that SDK is multi-gigabyte and this proves
  # the property RF-001A owes, which is that Kotlin compiles, tests run, and the projection is
  # gated. The platform dependency arrives with the order that needs an editor.
  jvm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/rider-retroforge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Temurin 24, matching the bytecode target the build pins. The maker's host compiles on
      # Rider's JBR 25 and targets 24; a runner on 21 would fail the same mismatch Gradle already
      # refused once, correctly.
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: temurin
          java-version: "24"

      - name: ktlint, the kotlin lane's instrument
        run: ./gradlew ktlintCheck --no-daemon

      - name: Build and test the projection
        run: ./gradlew build --no-daemon

  go-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"

      - name: Vet, race-test + build the Go edge
        run: |
          cd native/edge
          go vet ./...
          go test -race -count=1 ./...
          go build -o codeforge-edge .

      - name: Install the Python test deps
        run: pip install -e ".[dev]"

      - name: Parity test (Go edge present, byte-matched to the Python reference)
        run: python -m pytest tests/test_edge.py -q

      - name: Benchmark evidence (non-fatal)
        run: python -u benchmarks/bench_edge.py 400 || true

  # Polyglot protocol spine (Protocol Buffers): compile the ONE .proto to Python + Go and prove a
  # telemetry frame crosses languages byte-for-byte. NOT a required check -- the main `check` gate
  # runs on the JSON fallback, so a protobuf-toolchain hiccup never blocks a merge (ADR-0012).
  spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"

      - name: Install protoc + protoc-gen-go (pinned)
        run: |
          PROTOC_VER=27.3
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VER}/protoc-${PROTOC_VER}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install the Python deps (dev + the optional protobuf runtime)
        run: |
          pip install -e ".[dev]"
          pip install "protobuf==5.27.3"

      - name: Generate the spine bindings (Python + Go) from the one .proto
        run: make proto

      - name: Vet, race-test + build the Go spine (binding + xcheck)
        run: |
          cd native/spine
          go vet ./...
          go test -race -count=1 ./...
          go build -o xcheck/xcheck ./xcheck

      - name: Cross-language parity (Go <-> Python, one contract)
        run: python -m pytest tests/test_telemetry.py -q

      - name: Benchmark evidence (non-fatal)
        run: python -u benchmarks/bench_telemetry.py 20000 || true

  # Polyglot in-process kernel (hand-written C, raw CPython API): build the extension and prove it
  # matches the pure-Python fallback (parity + a hypothesis property test). NOT a required check --
  # the main `check` gate runs on the fallback, so a C-toolchain hiccup never blocks a merge
  # (ADR-0010: Python-first, native-optional).
  c-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Build the C text kernel as an abi3 wheel (system cc)
        run: |
          pip install build
          python -m build --wheel native/textkernel --outdir dist

      - name: Stable-ABI (abi3) audit -- 0 violations required (T-AP-07)
        run: |
          pip install abi3audit
          abi3audit dist/codeforge_textkernel-*.whl

      - name: Install the C kernel (from the audited abi3 wheel) + test deps
        run: |
          pip install --no-index --find-links dist codeforge-textkernel
          pip install -e ".[dev]"

      - name: Parity test (C kernel present, matched to the Python reference)
        run: python -m pytest tests/test_textmatch.py -q

      - name: Benchmark evidence (non-fatal)
        run: python -u benchmarks/bench_textmatch.py 20000 || true

  # Polyglot embedded scripting (sandboxed Lua via lupa): install the [lua] extra and run the SAFETY
  # suite -- every dangerous capability denied, runaway loops bounded. Evidence for a scripting organ
  # is safety, not a benchmark. NOT a required check -- the base gate runs on the "scripting
  # unavailable" fallback, so a Lua-runtime hiccup never blocks a merge (ADR-0014).
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install with the Lua extra
        run: pip install -e ".[dev,lua]"

      - name: The sandbox safety suite (capabilities denied, loops bounded)
        run: python -m pytest tests/test_scripting.py "tests/test_commands.py::test_owner_runs_a_sandboxed_script_through_the_tick" "tests/test_commands.py::test_a_sandbox_violation_returns_a_script_error_not_a_crash" -q

  # Pour drift gate (ship audit 2026-07-28, debt #2): codeforge-shelf is generated from
  # kernel/shelf via kernel.shelf_pour. This clones the published shelf and asserts a fresh pour
  # matches it, so the engine's Hardware Store and the published package can never silently
  # diverge again. NOT required -- it depends on an external clone; a hiccup should not block a merge.
  # Kept in sync automatically by .github/workflows/shelf-sync.yml (auto re-pour on every
  # shelf-touching merge to main); this gate is the safety net that catches a sync that did not run.
  shelf-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install codeforge (so kernel.shelf_pour imports)
        run: pip install -e ".[dev]"

      - name: Clone the published Hardware Store (private mirror)
        env:
          DEPLOY_KEY: ${{ secrets.SHELF_DEPLOY_KEY }}
        run: |
          # codeforge-shelf is a private mirror. Reuse the same least-privilege ed25519 deploy key
          # that shelf-sync.yml already provisions (SHELF_DEPLOY_KEY) to SSH-clone it read-only.
          # When the secret is absent (e.g. a fork PR), skip rather than hard-fail: this gate is
          # advisory by design (see the comment above) and a genuine drift still fails the assert
          # step below.
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::SHELF_DEPLOY_KEY not set; skipping the shelf-drift check (advisory gate)."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/shelf_key
          chmod 600 ~/.ssh/shelf_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/shelf_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:MatrymLabs/codeforge-shelf.git /tmp/codeforge-shelf

      - name: Assert the pour is in sync (no drift)
        run: |
          if [ ! -d /tmp/codeforge-shelf/.git ]; then
            echo "::warning::mirror not cloned (no deploy key); skipping drift assertion (advisory gate)."
            exit 0
          fi
          python -m kernel.shelf_pour --drift /tmp/codeforge-shelf
