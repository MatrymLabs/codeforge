# Auto re-pour the published Hardware Store mirror (codeforge-shelf) whenever the engine's shelf
# changes on main. The `shelf-drift` PR gate (ci.yml) enforces mirror == fresh-pour-of-engine; this
# is the missing automation that KEEPS them in lock-step, so a shelf-touching merge can never leave
# the mirror stale (which reddened shelf-drift on every later PR until a human re-poured by hand).
#
# Auth: a least-privilege ed25519 DEPLOY KEY (write to codeforge-shelf only) in the SHELF_DEPLOY_KEY
# secret -- NOT a broad PAT and NOT the default GITHUB_TOKEN (which cannot push to another repo).
# Idempotent: it only commits when the fresh pour actually differs. If the pour's own import/test
# gates fail, the step fails and NOTHING is pushed (a broken shelf is never published).
name: shelf-sync

on:
  push:
    branches: [main]
    paths:
      - "kernel/shelf/**"
      - "kernel/shelf_pour.py"
      - ".github/workflows/shelf-sync.yml"
  workflow_dispatch: {}

# Never let two syncs race the mirror push; the latest main state wins.
concurrency:
  group: shelf-sync
  cancel-in-progress: false

jobs:
  shelf-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install codeforge (so kernel.shelf_pour imports)
        run: pip install -e ".[dev]"

      - name: Re-pour the mirror and push if it changed
        env:
          DEPLOY_KEY: ${{ secrets.SHELF_DEPLOY_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "SHELF_DEPLOY_KEY secret is not set; skipping the mirror push."
            echo "Provision a write deploy key on codeforge-shelf to enable auto-sync."
            exit 0
          fi
          # Configure the least-privilege deploy key for the codeforge-shelf push only.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/shelf_key
          chmod 600 ~/.ssh/shelf_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/shelf_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          git clone git@github.com:MatrymLabs/codeforge-shelf.git /tmp/shelf

          # Re-pour: writes the mirror + proves its imports and tests pass (exit != 0 = do NOT push).
          python -m kernel.shelf_pour /tmp/shelf

          cd /tmp/shelf
          if [ -z "$(git status --porcelain)" ]; then
            echo "mirror already in sync with the engine; nothing to push."
            exit 0
          fi
          git config user.name "codeforge-shelf-bot"
          git config user.email "shelf-bot@matrymlabs.local"
          git add -A
          git commit -m "chore(shelf): auto re-pour from codeforge@${COMMIT_SHA}

          Keeps the published Hardware Store in lock-step with the engine's
          kernel/shelf. Generated by .github/workflows/shelf-sync.yml."
          git push origin HEAD:main
          echo "pushed a fresh pour of the Hardware Store to codeforge-shelf."
