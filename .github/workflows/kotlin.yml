name: kotlin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rider-retroforge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: "24"
          cache: gradle
      - name: Build the Rider projection
        working-directory: native/rider-retroforge
        run: ./gradlew build
