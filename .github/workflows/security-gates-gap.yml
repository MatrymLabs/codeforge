# Fleet Ops security-gates GAP for codeforge: adds ONLY what codeforge lacks - Grype CVE scanning
# (observe) + Cosign SBOM signing. It does NOT duplicate codeforge's existing CodeQL / Scorecard /
# bandit / detect-secrets / `make sbom`. Reconcile, don't duplicate.
name: security-gates-gap
on:
  push:
    branches: [main]
  pull_request:
# Cancel superseded runs on the SAME ref: pushing three commits to a PR otherwise runs three
# full workflows to completion and only the last answer is ever read.
#
# PULL REQUESTS ONLY, deliberately. An earlier draft used `github.ref != 'refs/heads/main'`,
# which is TRUE for a release event (its ref is the tag) and could cancel a release
# mid-publish. It is also true for schedules and tags. Cancelling main's run is its own
# hazard: "we cancelled the proof" is indistinguishable from "the proof never ran", and this
# fleet has already lost a day to exactly that ambiguity. So: cancel PR iterations, nothing
# else, ever.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  id-token: write
jobs:
  gap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: CVE scan (Grype) - OBSERVE
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          path: "."
          fail-build: false
          severity-cutoff: critical
      - name: upload grype SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
      - name: sign the SBOM (Cosign keyless)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      # --bundle, not --output-signature. Current cosign defaults to --new-bundle-format, which
      # IGNORES --output-signature and writes a bundle instead; with no --bundle path given it
      # tried to create one at the empty string and died with "open : no such file or directory".
      # That failure was misread once as the v4 installer rejecting a cosign version. It was our
      # command, not the action.
      - run: cosign sign-blob --yes sbom.cdx.json --bundle sbom.cdx.json.sigbundle

      # A signature nobody verifies is theatre. The previous step produced sbom.cdx.json.sig and
      # NOTHING in this workflow ever read it, so the repo advertised keyless Sigstore signing
      # while proving only that the signing command exited zero. This verifies the bundle against
      # the identity that produced it, so a broken or forged signature fails the gate.
      - name: verify the SBOM signature (proves the signing step did something)
        run: |
          cosign verify-blob sbom.cdx.json \
            --bundle sbom.cdx.json.sigbundle \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: checker - SBOM is schema-valid CycloneDX
        run: |
          python3 - <<'PY'
          import json,sys
          s=json.load(open("sbom.cdx.json"))
          sys.exit(0 if (s.get("bomFormat")=="CycloneDX" and s.get("specVersion") and isinstance(s.get("components"),list)) else 1)
          PY
