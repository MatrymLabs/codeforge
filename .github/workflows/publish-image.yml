# Publish the CodeForge container image to the GitHub Container Registry (GHCR).
# Free for public repos; the image lands at ghcr.io/matrymlabs/codeforge and is
# what deploy/terraform/ provisions. Publishes on merge to main and on version
# tags -- NOT on pull requests (a PR must not mutate the published `latest`).
# Uses the raw docker CLI (no third-party actions to pin), matching the `docker`
# build+smoke job in ci.yml.
name: publish-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Cancel superseded runs on the SAME ref: pushing three commits to a PR otherwise runs three
# full workflows to completion and only the last answer is ever read.
#
# PULL REQUESTS ONLY, deliberately. An earlier draft used `github.ref != 'refs/heads/main'`,
# which is TRUE for a release event (its ref is the tag) and could cancel a release
# mid-publish. It is also true for schedules and tags. Cancelling main's run is its own
# hazard: "we cancelled the proof" is indistinguishable from "the proof never ran", and this
# fleet has already lost a day to exactly that ambiguity. So: cancel PR iterations, nothing
# else, ever.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write # OIDC token for keyless Sigstore signing of the provenance
  attestations: write # write the SLSA build-provenance attestation to the registry

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/matrymlabs/codeforge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build and tag (commit sha + latest)
        run: docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .

      - name: Push and capture the pushed digest
        id: push
        run: |
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${GITHUB_SHA}" | cut -d@ -f2)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Signed SLSA build provenance (keyless via Sigstore + GitHub OIDC), attached to the image in
      # GHCR. A consumer can `gh attestation verify oci://$IMAGE@<digest> --repo MatrymLabs/codeforge`
      # to prove the image was built from THIS repo and commit by THIS workflow, not substituted.
      # Separation of duties: the pipeline attests provenance; it does not approve its own release.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # VERIFY the attestation we just wrote (RD-2026-0002 #2): a signed-but-never-verified
      # attestation is "documentation without teeth". Pin the exact repo so a substituted image
      # (built elsewhere, or not from this repo) fails the release. This closes the loop the
      # comment above only promised a consumer "can" run.
      - name: Verify build provenance (teeth on the attestation)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh attestation verify "oci://${IMAGE}@${{ steps.push.outputs.digest }}" --repo "${GITHUB_REPOSITORY}"
