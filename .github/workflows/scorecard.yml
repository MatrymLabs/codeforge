# OpenSSF Scorecard -- an independent, standardized read of this repo's supply-chain and
# security posture (branch protection, pinned actions, CI tests, SAST, token permissions,
# and more). It asserts nothing itself; it scores what the repo already does and publishes
# the result so the badge is truthful. Complements CodeQL (SAST) and the make-gated stack
# (pip-audit, bandit, detect-secrets, SBOM). Public repos publish a public score.
name: scorecard

on:
  branch_protection_rule:  # re-score when protection rules change
  schedule:
    - cron: "27 6 * * 1"  # weekly sweep (Monday), a beat after the CodeQL run
  push:
    branches: [main]

# Least-privilege by default; each step below widens only what it needs.
# Cancel superseded runs on the SAME ref: pushing three commits to a PR otherwise runs three
# full workflows to completion and only the last answer is ever read.
#
# PULL REQUESTS ONLY, deliberately. An earlier draft used `github.ref != 'refs/heads/main'`,
# which is TRUE for a release event (its ref is the tag) and could cancel a release
# mid-publish. It is also true for schedules and tags. Cancelling main's run is its own
# hazard: "we cancelled the proof" is indistinguishable from "the proof never ran", and this
# fleet has already lost a day to exactly that ambiguity. So: cancel PR iterations, nothing
# else, ever.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write  # upload the SARIF result to the Security tab
      id-token: write         # sign the published result (publish_results)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true  # required for the public badge to be truthful

      # Keep the raw SARIF as an artifact (14 days) for local review.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      # Feed the result into GitHub code scanning (Security tab).
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
        with:
          sarif_file: results.sarif
