# Rig rules for a 24-core / 32GB workstation. Heavy builds are SEQUENCED, never stacked:
# memory is the scarce resource here, not cores. workers.max is capped at 8 rather than 24 on
# purpose, because each Gradle worker forks a JVM and 24 of them will swap this box before they
# saturate it.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=8

# The daemon keeps the Kotlin compiler warm between runs, which is most of the wall-clock on a
# module this size. 2g is deliberate: large enough for kotlin-compiler-embeddable, small enough
# that a daemon left running does not compete with a Python or Rust build for the same 32GB.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC

# NOTE, deliberately not set here: any JDK toolchain pin. See build.gradle.kts, which records why
# a pinned 21 was refused (this is a Rider projection and follows the JBR Rider ships). Setting
# org.gradle.java.installations or a toolchain here would reintroduce that pin by the back door.

# Java 21 provisioning remains in settings.gradle.kts and build.gradle.kts; this file carries the
# execution policy only.