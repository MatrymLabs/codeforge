[package]
name = "codeforge_nav"
version = "0.1.0"
edition = "2021"
description = "CodeForge native world-navigation kernel (room pathfinding + reachability) via PyO3"
license = "MIT"
readme = "README.md"

[lib]
name = "codeforge_nav"
# cdylib: a C-ABI shared object Python can import; rlib so the unit tests can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
