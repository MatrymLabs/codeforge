[package]
name = "codeforge_nav"
version = "0.1.0"
edition = "2021"
description = "CodeForge native world-navigation kernel (room pathfinding + reachability) via PyO3"
license = "MIT"
readme = "README.md"

[lib]
name = "codeforge_nav"
# cdylib: a C-ABI shared object Python can import; rlib so the unit tests can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py310: build against the Stable ABI (Limited API) with a 3.10 floor, so maturin emits ONE
# cp310-abi3 wheel per platform that loads on every CPython >= 3.10 (T-AP-07). abi3audit gates it in CI.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }

[profile.release]
opt-level = 3
lto = true
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[lints.rust]
unsafe_code = "forbid"
