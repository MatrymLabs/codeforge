    title: WorldIR, schema registry, resolver, diagnostics, and pass manager
    capabilities: [compiler.world_ir, compiler.schema_registry, compiler.reference_resolver, compiler.diagnostics, compiler.pass_manager]
    dependencies: []
    exit_criteria:
      - Veridia and a minimal second world normalize through one IR
      - all references resolve through one resolver
      - compiler passes declare dependencies and deterministic inputs
      - existing room batch output remains compatible
      - proof matrix rows are green
  - id: phase_2_versioned_content_delivery
    title: Package versioning, migrations, semantic diff, cache, hotfix, and rollback
    capabilities: [compiler.content_migrations, compiler.incremental_cache, compiler.hotfix, content.rooms_prose_topology]
    dependencies: [phase_1_compiler_foundation]
    exit_criteria:
      - package and schema manifests are versioned
      - semantic record diff identifies persistence risk
      - incremental rebuild invalidates dependent records
      - hotfix validation and rollback are tested
  - id: phase_3_persistent_multiplayer_authority
    title: Sessions, transactions, social authority, and encounter authority
    capabilities: [runtime.account_character, runtime.persistence, content.items_crafting_economy, runtime.social, runtime.combat_encounters]
    dependencies: [phase_2_versioned_content_delivery]
    exit_criteria:
      - two-client lifecycle and reconnect proof passes
      - atomic item and currency flows reconcile
      - party, guild, block, moderation, and encounter proofs pass
  - id: phase_4_live_world_and_client
    title: Scoped world state, NPC simulation, progression, and client parity
    capabilities: [content.population_npc, content.quests_pressures, runtime.world_state, client.command_registry]
    dependencies: [phase_3_persistent_multiplayer_authority]
    exit_criteria:
      - Veridia end-to-end proof passes
      - second-region proof passes
      - text, GMCP, WebSocket, and accessibility matrix passes
  - id: phase_5_operations_and_release
    title: Restore, observability, load, soak, publish, and rollback
    capabilities: [operations.observability_recovery, architecture.import_boundary]
    dependencies: [phase_3_persistent_multiplayer_authority, phase_4_live_world_and_client]
    exit_criteria:
      - restore drill passes
      - crash recovery and migration proof passes
      - load and soak limits are measured
      - release and rollback evidence is complete
