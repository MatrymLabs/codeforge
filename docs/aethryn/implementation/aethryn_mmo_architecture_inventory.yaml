human_decisions:
  - id: session_takeover
    question: What duplicate-login and session takeover policy is approved for beta?
    impact: Changes persistence, security, and player experience.
  - id: loss_policy
    question: Which defeat losses are acceptable for persistent beta?
    impact: Changes economy, recovery, and migration contracts.
  - id: production_storage
    question: Which production database, backup retention, privacy retention, and recovery channel are approved?
    impact: Blocks production operations proof.
  - id: legacy_save_authority
    question: Should JSON saves be imported, frozen read-only, or retired after verified export?
    impact: Changes migration and rollback scope.
  - id: optional_mmo_modules
    question: Which guild storage, auction, public events, PvP, housing, and naval systems are P0 versus feature-flagged?
    impact: Changes the beta acceptance boundary.
known_risks:
  - dirty_worktree makes attribution of current code changes uncertain
  - full repository format, lint, and import gates are red
  - baseline test failures are not yet cleared
  - multiple content and persistence authorities can drift
  - restore has not been demonstrated
  - runtime state and encounters are process-local in important paths
recommended_sequence: [phase_1, phase_2, phase_3, phase_4, phase_5]
