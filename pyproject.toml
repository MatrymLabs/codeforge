[project]
name = "codeforge"
version = "0.1.0"
description = "A language-extensible software-engineering platform (its flagship Seed is the game Aethryn)."
requires-python = ">=3.13"
dependencies = ["pyyaml", "sqlalchemy", "fastapi", "uvicorn", "websockets", "pydantic", "structlog"]

[project.optional-dependencies]
# Optional feature extras still earn their place: the dependency gate (`make deps`) folds
# every non-dev extra into the runtime set, so `anthropic` is justified in the ledger.
ai = ["anthropic>=0.120.2"]
postgres = ["psycopg[binary]>=3.3.4"]
# Embedded Lua scripting (the sandboxed @script console; kernel.scripting). Optional: absent -> the
# feature reports itself unavailable and the game is untouched (ADR-0014). lupa bundles the runtime.
lua = ["lupa>=2.8"]
# The deep behavioral-equivalence verifier (kernel.verify_smt). Optional: absent -> the deep gate
# fails loud with an install hint and the stdlib sampler (transform_verifier) remains the default;
# CI runs without it (the symbolic tests skip). Admitted via Track-T T-EXP-08 / CAND-06. crosshair
# pulls z3-solver (which ships an aarch64 wheel).
verify = ["crosshair-tool>=0.0.109"]
# Verifier-gated Python codemods (kernel.refactor: scope-correct rename). Optional: absent -> the
# tool reports refactor_available() False and fails loud with an install hint; nothing else is
# affected. LibCST is the only lossless scope-aware codemod path (stdlib ast is lossy). deep=True
# additionally uses the [verify] extra. CI runs without it (the scope-correctness tests skip).
refactor = ["libcst>=1.9.0"]
dev = [
    # ALL PINNED, deliberately. Every tool here decides a gate verdict, and a verdict must not
    # depend on the day it ran. The lesson was learned once for ruff alone: unpinned, CI installed
    # the latest and local lagged, and a minor bump (0.15 -> 0.16) reformatted and reddened CI. The
    # same exposure was live for every other tool below, because CI runs `uv pip install -e ".[dev]"`
    # (a fresh resolve from PyPI) at 13 sites and never installs from uv.lock. `make check` could
    # change its mind with no commit behind it.
    # Bump deliberately: Dependabot proposes (uv ecosystem, so pyproject and uv.lock move together),
    # CI verifies, the founder merges. Never by drift.
    "ruff==0.16.1",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20260724",
    "import-linter==2.13",  # style-guide section 2: enforce the kernel/adapters/content direction
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "coverage==7.15.4",  # named explicitly: the coverage threshold is a gate, pytest-cov floats it
    "pip-audit==2.10.1",
    "bandit[toml]==1.9.4",
    "detect-secrets==1.5.0",
    "cyclonedx-bom==7.3.1",
    "hypothesis==6.165.2",
    "httpx2==2.9.1",
    "alembic==1.19.1",
    "mkdocs-material==9.7.7",
    "playwright==1.62.0",
]

[project.scripts]
codeforge = "adapters.cli:main"
spark = "adapters.cli:spark"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Style-guide section 2: modules are migrating from parts/ into the kernel/adapters/content layers.
packages = [
    "kernel", "kernel.evolution", "kernel.hubble", "kernel.shelf", "kernel.world",
    "adapters", "adapters.stewardship", "content",
]
py-modules = ["forge"]

[tool.setuptools.package-data]
# The browser gate serves this page; it must ship inside the installed wheel.
adapters = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Evidence artifacts record what a run actually produced. A formatter must never
# rewrite a record, so the code blocks under docs/evidence/ stay byte-for-byte as
# they were generated, even where ruff would reformat them.
extend-exclude = ["docs/evidence"]

[tool.ruff.lint]
# E/F: core errors  I: import sorting  UP: modernize syntax
# B: common bug patterns  SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
# The typecheck scope, declared here so it is the single source of truth: the Makefile,
# any IDE, and external auditors all see the same set. `e2e/` is deliberately excluded
# (it carries a second conftest.py; a whole-tree `mypy .` would collide on the basename).
files = ["kernel", "adapters", "content", "tests", "forge.py"]

# anthropic is an optional 'ai' extra (the Claude Architect brain), not installed in the
# dev/CI venv; it is lazy-imported behind the Advisor seam. Don't require its stubs here.
[[tool.mypy.overrides]]
module = "anthropic"
ignore_missing_imports = true

# codeforge_nav is the OPTIONAL native accelerator (native/codeforge_nav, Rust via PyO3), imported
# opportunistically behind a pure-Python fallback (ADR-0010). It is absent in the dev/CI venv and
# carries no type stubs, so don't require them -- whether or not the compiled kernel is built.
[[tool.mypy.overrides]]
module = "codeforge_nav"
ignore_missing_imports = true

# codeforge_textkernel is the OPTIONAL hand-written C accelerator (native/textkernel, raw CPython
# API), imported opportunistically behind a pure-Python fallback (ADR-0010). Absent in the dev/CI
# venv and a compiled module with no stubs, so don't require them -- built or not.
[[tool.mypy.overrides]]
module = "codeforge_textkernel"
ignore_missing_imports = true

# libcst is the OPTIONAL [refactor] extra. The refactor module lazy-imports it and has an
# explicit unavailable path, so the base dev/CI environment must typecheck without installing it.
[[tool.mypy.overrides]]
module = "libcst"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "libcst.*"
ignore_missing_imports = true

# lupa is the OPTIONAL Lua runtime (the [lua] extra), imported opportunistically behind a
# scripting_available() guard (ADR-0014). It ships no type stubs and is absent from the base dev/CI
# venv, so don't require them -- installed or not.
[[tool.mypy.overrides]]
module = "lupa"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail loud on typos, not silently: an unregistered marker or an unknown config
# key is a mistake, not a warning. importlib import mode is the modern default
# (no sys.path games, no __init__.py needed in tests).
addopts = "--strict-markers --strict-config --import-mode=importlib"
# Repo root on the path so tests can import the dev-only `benchmarks/` harness
# (it is not part of the installed package, unlike `parts`/`forge`).
pythonpath = ["."]
markers = [
    "property: Hypothesis property-based tests (run via `make property`)",
    "fuzz: hostile-input fuzz tests for trust-boundary gates (run via `make fuzz`)",
]

[tool.coverage.run]
# Branch coverage, not just line: line coverage proves a line ran, branch coverage
# proves both sides of every conditional were exercised. The stricter, honest measure.
branch = true

[tool.bandit]
# Reviewed suppressions, each safe by design in this codebase:
#   B101 assert  - type-narrowing invariants for mypy, not input validation.
#   B104 bind-all - the gateway and admin API are meant to accept LAN clients.
#   B506 yaml.load - the only call site uses _UniqueKeyLoader, a SafeLoader
#                    subclass that merely adds duplicate-key rejection.
skips = ["B101", "B104", "B506"]
