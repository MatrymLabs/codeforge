# Technology Intake ledger -- controlled adoption, Python-native (docs/technology_intake.md).
#
# Python owns the orchestration; every other technology enters through an explicit boundary and an
# onboarding record here. `make intake` fails if any record is INCOMPLETE (an APPROVED technology
# missing one of the ten requirements: purpose, owner, contract, security_review, license_review,
# compatibility, testing_strategy, failure_strategy, upgrade_strategy, removal_strategy) or
# INCONSISTENT (an unknown classification/decision, a NATIVE_PYTHON row that is not Python, or an
# external-hosted role with no proposed_boundary).
#
# Keys under [tech.<id>] are the intake_id. Classifications: NATIVE_PYTHON, PYTHON_PACKAGE,
# PYTHON_FRAMEWORK_EXTENSION, COMPILED_EXTENSION, SUBPROCESS_WORKER, EXTERNAL_SERVICE,
# CLIENT_TECHNOLOGY, BUILD_TARGET, RENDER_TARGET, DEV_TOOL, RESEARCH_REFERENCE, REJECTED.
# Decisions: approved, held, rejected, stdlib_first, research_only, integrate_later.

