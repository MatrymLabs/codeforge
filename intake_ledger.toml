# Technology Intake ledger -- controlled adoption, Python-native (docs/technology_intake.md).
#
# Python owns the orchestration; every other technology enters through an explicit boundary and an
# onboarding record here. `make intake` fails if any record is INCOMPLETE (an APPROVED technology
# missing one of the ten requirements: purpose, owner, contract, security_review, license_review,
# compatibility, testing_strategy, failure_strategy, upgrade_strategy, removal_strategy) or
# INCONSISTENT (an unknown classification/decision, a NATIVE_PYTHON row that is not Python, or an
# external-hosted role with no proposed_boundary).
#
# Keys under [tech.<id>] are the intake_id. Classifications: NATIVE_PYTHON, PYTHON_PACKAGE,
# PYTHON_FRAMEWORK_EXTENSION, COMPILED_EXTENSION, SUBPROCESS_WORKER, EXTERNAL_SERVICE,
# CLIENT_TECHNOLOGY, BUILD_TARGET, RENDER_TARGET, DEV_TOOL, RESEARCH_REFERENCE, REJECTED.
# Decisions: approved, held, rejected, stdlib_first, research_only, integrate_later.

# ----- approved: the Qt desktop render target (codeforge-client GUI) -------------------
[tech.pyside6]
technology_name = "PySide6"
technology_type = "GUI framework (Qt for Python bindings)"
vendor_or_maintainer = "The Qt Company (Qt for Python)"
classification = "RENDER_TARGET"
language = "python"
license = "LGPL-3.0"
provenance_status = "verified (official PyPI wheels, all target platforms)"
proposed_role = "the native desktop rendering surface for the client (mudclient-gui)"
proposed_boundary = "the codeforge-client ui_qt package; the tested spine never imports Qt"
existing_codeforge_equivalent = "the Textual TUI shell (a terminal render target); Qt is the desktop one"
capability_gap = "a native windowed desktop client; Textual renders only in a terminal"
decision = "approved"
reviewer = "Josh"
stage = "deployed"
purpose = "render the client as a native desktop app that reuses the whole tested spine"
owner = "Josh / codeforge-client"
contract = "SpineWorker Qt-signal seam + ClientConfig; no widget touches the network, no spine imports Qt"
security_review = "no network or subprocess of its own; renders local data; runs headless (offscreen) in CI"
license_review = "LGPL-3.0, dynamically linked through PySide6; compatible with the MIT application"
compatibility = "Python 3.13; wheels for linux-x64, linux-arm64, macOS, Windows"
testing_strategy = "pytest-qt headless (QT_QPA_PLATFORM=offscreen): widget, automation, and tab suites"
failure_strategy = "an optional [gui] extra; the spine and the Textual TUI run with no Qt installed"
upgrade_strategy = "pinned range PySide6>=6.5; bump deliberately, re-run the offscreen suite"
removal_strategy = "drop the ui_qt package and the [gui] extra; the spine and TUI are untouched"

