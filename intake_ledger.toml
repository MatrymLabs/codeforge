# ----- approved: lupa -- the Python<->Lua bridge for the scripting organ (ADR-0014) -----
[tech.lupa]
technology_name = "lupa"
technology_type = "Python library embedding the Lua runtime"
vendor_or_maintainer = "the lupa project (scoder)"
classification = "PYTHON_PACKAGE"
language = "python"
license = "MIT"
provenance_status = "verified (PyPI; prebuilt aarch64 wheel, bundles Lua)"
proposed_role = "embed real Lua so kernel.scripting can run sandboxed user/creator scripts"
proposed_boundary = "used only inside kernel.scripting.LuaSandbox behind scripting_available(); the game never imports it directly"
existing_codeforge_equivalent = "none -- there is no in-tree scripting engine; this is a new capability, not an accelerator"
capability_gap = "safe user extensibility: let a non-author write behaviour and run it without reaching the host"
decision = "approved"
reviewer = "Josh"
stage = "deployed"
purpose = "prove the embedded-scripting pattern -- Lua, the classic embedded language, behind a deny-by-default sandbox with a safety suite as its evidence"
owner = "Josh / codeforge"
contract = "LuaSandbox.run(code) -> ScriptResult; the sandbox guarantees pinned by tests/test_scripting.py"
security_review = "the whole point: deny-by-default whitelist env (no os/io/require/load/dofile/package/debug) + an instruction-budget hook bounding loops; scripts run with a fresh _ENV, cannot reach the counter, cannot escape. Documented limit: memory is not bounded; @script is owner-only"
license_review = "MIT (lupa) + Lua (MIT); permissive, compatible with the MIT application"
compatibility = "CPython 3.13; lupa 2.x bundling Lua 5.4/5.5; aarch64 + x86_64 wheels"
testing_strategy = "the safety suite (tests/test_scripting.py) proves every capability is denied + loops bounded when installed; the base gate tests the unavailable fallback; the lua CI job runs the full suite"
failure_strategy = "optional [lua] extra -- absent, scripting_available() is False, @script says so, the game and make check are green with no Lua runtime"
upgrade_strategy = "pin lupa>=2.0; bump deliberately and re-run the safety suite (a runtime bump could shift the stdlib surface the whitelist trusts)"
removal_strategy = "delete kernel/scripting.py, the @script command, and the [lua] extra; nothing else depends on them"
