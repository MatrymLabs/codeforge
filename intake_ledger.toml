# ----- approved: Protocol Buffers -- the protocol spine's contract language (ADR-0012) -----
[tech.protobuf]
technology_name = "Protocol Buffers (protobuf)"
technology_type = "language-neutral typed serialization format + Python/Go runtime"
vendor_or_maintainer = "Google / the Protocol Buffers project"
classification = "PYTHON_PACKAGE"
language = "python"
license = "BSD-3-Clause"
provenance_status = "verified (PyPI protobuf; google.golang.org/protobuf, pinned in native/spine/go.sum)"
proposed_role = "the single-source-of-truth wire contract for telemetry frames, compiled from one proto/telemetry.proto to Python + Go so every organ shares one typed schema"
proposed_boundary = "the optional protobuf codec in kernel.telemetry, behind a JSON reference/fallback; the generated binding is imported opportunistically (try/except)"
existing_codeforge_equivalent = "the stdlib json codec in kernel.telemetry (the always-present reference + fallback)"
capability_gap = "a typed, compact (2.5x smaller wire), CROSS-LANGUAGE contract that ad-hoc JSON dicts cannot give; the keystone the polyglot organs share"
decision = "approved"
reviewer = "Josh"
stage = "deployed"
purpose = "prove the protocol-spine pattern -- one .proto, byte-compatible across languages, behind a Python-first JSON fallback with a parity test and a benchmark"
owner = "Josh / codeforge"
contract = "proto/telemetry.proto compiled to both languages; the (kind, payload) codec interface pinned by tests/test_telemetry.py, incl. Go<->Python byte parity"
security_review = "no network, no I/O in the codec; deserialises trusted engine-produced frames; the protobuf runtime is a widely-audited Google project"
license_review = "BSD-3-Clause (both the Python runtime and google.golang.org/protobuf); permissive, compatible with the MIT application"
compatibility = "protobuf 5.27 (Python) matched to protoc 27.x; google.golang.org/protobuf v1.34.2 (Go); Python 3.13, Go 1.24"
testing_strategy = "the json reference is always tested; when the binding is built, a parity test compares protobuf vs json AND proves Go<->Python byte compatibility; benchmarks/bench_telemetry.py records size + speed"
failure_strategy = "optional -- when proto/telemetry_pb2.py is absent (no `make proto`), kernel.telemetry uses the identical json codec, so the game is green with no protobuf toolchain"
upgrade_strategy = "bump protobuf (pin) + protoc + protoc-gen-go together; regenerate via `make proto`; re-run the parity test"
removal_strategy = "delete proto/ and native/spine/ and the protobuf branch of kernel.telemetry; the json codec remains"

