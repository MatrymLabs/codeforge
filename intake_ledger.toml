# ----- approved: the Go edge gateway (first service organ, ADR-0011) -------------------
[tech.codeforge_edge]
technology_name = "codeforge-edge (Go)"
technology_type = "out-of-process service (transparent TCP edge proxy)"
vendor_or_maintainer = "CodeForge (in-tree module, native/edge)"
classification = "SUBPROCESS_WORKER"
language = "go"
license = "MIT"
provenance_status = "verified (in-tree source; Go standard library only, no third-party modules)"
proposed_role = "accept the connection flood in Go (goroutine-per-connection) and byte-proxy each client to the Python gateway, raising the thread-per-connection ceiling"
proposed_boundary = "a byte-transparent TCP proxy (listen -> backend); it never inspects the stream, so telnet/IAC stays end-to-end; selected at launch by parts.edge, which falls back to the pure-Python EdgeProxy"
existing_codeforge_equivalent = "the pure-Python EdgeProxy in parts.edge (the fallback + reference)"
capability_gap = "~2-3x faster clearing of concurrent connection floods; Go's concurrency at the connection boundary, a native-language showcase"
decision = "approved"
reviewer = "Josh"
stage = "deployed"
purpose = "prove the service-organ pattern -- Go where connection concurrency helps, behind a Python-first fallback with a byte-parity test and a benchmark"
owner = "Josh / codeforge"
contract = "the transparent-proxy behaviour, identical across the Go and Python implementations, pinned by tests/test_edge.py (byte-for-byte parity)"
security_review = "no auth, no stream inspection; a byte pump between a client and the local gateway, same trust posture as the gateway it fronts (LAN-visible); no unsafe, no third-party deps; Go's memory safety"
license_review = "MIT (in-tree); Go standard library only (BSD-style), no third-party modules to vet"
compatibility = "Go 1.24+; any POSIX host; the binary is optional and the game runs without it"
testing_strategy = "the pure-Python reference is always tested; go test covers the proxy; a byte-parity test compares Go vs Python when built; benchmarks/bench_edge.py records the connection-scaling win"
failure_strategy = "optional -- when the binary is absent, parts.edge uses the identical pure-Python EdgeProxy (or clients connect straight to the gateway), so the game is green with no Go toolchain"
upgrade_strategy = "pin the Go version in native/edge/go.mod; rebuild and re-run the parity test on a bump"
removal_strategy = "delete native/edge and the binary branch of parts.edge.run_edge; the pure-Python reference remains"

