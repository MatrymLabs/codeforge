// The CodeForge telemetry contract -- the single, language-neutral source of truth for the frames
// the engine projects to a client (today over GMCP as JSON; this schema is the typed spine every
// cross-language service shares). Compiled to Python (proto/telemetry_pb2.py) and Go
// (native/spine/telemetrypb) from this one file, so a frame encoded in one language decodes,
// field-for-field, in the other. Generated code is git-ignored and rebuilt via `make proto`.
//
// These messages mirror parts/gmcp.py exactly (Char.Vitals / Room.Info / Char.Target / Char.Quest);
// keep them in step -- the contract is only true if it carries the frames the game actually emits.
syntax = "proto3";

package codeforge.telemetry.v1;

option go_package = "codeforge/spine/telemetrypb";

// Char.Vitals -- the player's live resource bars. nextlevel is -1 at the level cap (no next
// threshold), which a client reads as "maxed" without a null.
message Vitals {
  int32 hp = 1;
  int32 maxhp = 2;
  int32 mp = 3;
  int32 maxmp = 4;
  int32 level = 5;
  int32 xp = 6;
  int32 nextlevel = 7;
}

// Room.Info -- where the player stands. num is the room's frozen label; exits maps a direction to
// the destination room label.
message Room {
  string num = 1;
  string name = 2;
  map<string, string> exits = 3;
}

// Char.Target -- the foe being fought, or absent when not in combat. element and resists are
// additive/optional: an untyped foe carries neither and an old client ignores what it can't use.
message Target {
  string name = 1;
  int32 hp = 2;
  int32 maxhp = 3;
  string element = 4;
  map<string, string> resists = 5;
}

// Char.Quest -- the player's foremost unfinished story quest.
message Quest {
  string name = 1;
  string objective = 2;
}

// The envelope: exactly one frame body. This is the one type every service sends and receives, so
// the whole telemetry channel is a single, typed contract rather than a bag of ad-hoc packages.
message Frame {
  oneof body {
    Vitals vitals = 1;
    Room room = 2;
    Target target = 3;
    Quest quest = 4;
  }
}
