id: stonehelm_order
name: The Standing Order
start: offered
reward_xp: 140
steps:
- state: offered
  event: enter
  to: accepted
  on_enter: stonehelm_tribunal
- state: accepted
  event: take
  to: recovered
  on_take: stonehelm_authority_seal
- state: recovered
  event: enter
  to: done
  effect: award_xp;grant_rep:warcraft:35
  on_enter: stonehelm_tribunal
terminal:
- done
labels:
  offered: In Stonehelm, the tribunal weighs who may rule. Step into the Tribunal
    Hall and hear the tribune.
  accepted: Descend into the command bunker and take the authority-seal from its old
    cradle (mind what still keeps a dead post, and sign nothing).
  recovered: Carry the authority-seal back UP to Tribune Valeska in the Tribunal Hall.
  done: '*** The seal is re-sworn before the claimants, and Stonehelm''s law stands
    another season, on authority borrowed from a dead world. ***'
