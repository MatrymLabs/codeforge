- state: offered
  event: enter
  to: accepted
  on_enter: westgate_tollhouse
- state: accepted
  event: take
  to: recovered
  on_take: westgate_writ
- state: recovered
  event: enter
  to: done
  effect: award_xp;grant_rep:knowing:26
  on_enter: westgate_tollhouse
