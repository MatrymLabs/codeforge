rooms:
  alder_court:
    name: Alder Court
    room_type: Town Street
    desc: 'You stand on pale riverstone cobbles between timber houses with painted
      shutters, where a carved public fountain sends a thin stream into a circular
      basin.


      The air carries lamp oil, wool, and rain, and a smith''s measured hammering
      drifts between the roofs. The town wall rises above the houses to the west.'
    exits:
      east: copper_square
      south: alder_court
    occupants:
    - A lampwright's apprentice waits beside a loaded handcart
    objects:
    - A rack of walking staffs stands near the drainage channel
    - Rows of clay jars have been arranged beneath the sheltering eaves
    replace: true
    tags:
    - veridia
    - imported_text_drop
  copper_square:
    name: Copper Square
    room_type: Market Lane
    desc: 'Dark brick paving runs through a close district of old guildhalls faced
      in gray stone, its course marked by a mosaic of the River Verin winds across
      the paving.


      Children calling across the lane echoes through the district while roasted roots
      and chimney smoke lingers near the open doorways. The road toward Riverbend
      begins beyond the southern wards.'
    exits:
      east: lantern_walk
      south: alder_court
      west: alder_court
    occupants:
    - A retired watchman sorts a stack of delivery tags
    objects:
    - A painted notice board stands near the nearest doorway
    - Freshly cut flowers have been arranged beneath a striped awning
    replace: true
    tags:
    - veridia
    - imported_text_drop
  lantern_walk:
    name: Lantern Walk
    room_type: Civic Square
    desc: 'A narrow way opens between workshops whose doors stand open to the street.
      Beneath your feet, well-worn flagstones curves around a shallow channel carries
      clear water toward the southern drains.


      Light filters down in broken bands from the narrow sky above. A line of orchard
      trees is visible through the northern gap. The smell of sawdust and beeswax
      settles over the street.'
    exits:
      east: mill_terrace
      south: copper_square
      southwest: copper_square
      west: copper_square
    occupants: []
    objects:
    - A young cooper counts copper coins into a leather purse
    - A brass route marker stands near the drainage channel
    - Three sealed crates have been arranged beneath a tiled lean-to
    replace: true
    tags:
    - veridia
    - imported_text_drop
  mill_terrace:
    name: Mill Terrace
    room_type: Residential Court
    desc: 'The street widens here into a small public space bordered by shops beneath
      overhanging upper floors. At its center, a bronze town bell hangs beneath a
      tiled shelter.


      The district feels busy without being hurried. The chiming of shop bells rises
