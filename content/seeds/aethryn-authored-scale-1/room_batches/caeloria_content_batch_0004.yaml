      west: mill_stream_crossing
      north: border_marker_stone
      south: mill_stream_crossing
    occupants: []
    objects:
    - A few stones have been arranged into a rough fire ring
    - Grass grows thickly among the old foundations
    - A faded milestone stands nearby
    replace: true
    tags: *id001
  border_marker_stone:
    name: Border Marker Stone
    room_type: Boundary
    desc: 'A tall stone pillar marks the approximate boundary between the more settled
      Caelorian lands and the approaches to Veridia. Carved letters give distances
      in both directions.


      The air is open and the landscape begins to show more of the lower country''s
      character.'
    exits:
      northeast: border_marker_stone
      southwest: wayside_inn_ruin
      north: border_marker_stone
      south: wayside_inn_ruin
    occupants: []
    objects:
    - A small shrine of stacked stones sits at the base of the pillar
    - Fresh tracks show recent traffic in both directions
    - The land continues open and green on both sides
    replace: true
    tags: *id001
