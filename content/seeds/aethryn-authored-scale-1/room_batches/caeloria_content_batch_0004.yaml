      The air carries a faint salt tang at times.'
    exits:
      west: caeloria_south_ward
      east: farmer_s_track_north
      north: farmer_s_track_north
      south: caeloria_south_ward
    occupants:
    - Children play in a small open court
    objects:
    - Laundry hangs between upper windows in the breeze
    - A wooden bench sits against a sunny wall
    replace: true
    tags: *id001
  farmer_s_track_north:
    name: Farmer's Track North
    room_type: Farm Track
    desc: 'A narrower track leaves the main road and runs toward a cluster of farm
      buildings visible in the distance. The surface is rougher and the ruts are deeper.


      The air smells of the surrounding fields and animals.'
    exits:
      south: caeloria_east_ward
      north: farmer_s_track_south
      east: farmer_s_track_south
      west: caeloria_east_ward
    occupants: []
    objects:
    - A wooden gate stands open across the track
    - A scarecrow leans at an angle in a nearby field
    - The track continues toward the farm and back to the main road
    replace: true
    tags: *id001
  farmer_s_track_south:
    name: Farmer's Track South
    room_type: Farm Track
    desc: 'Another farm track leads south from the main road into a cluster of well-kept
      fields and buildings. The land here is fertile and carefully managed.


      The air smells of turned earth and growing crops.'
    exits:
      north: orchard_road
      south: farmer_s_track_north
      east: orchard_road
      west: farmer_s_track_north
    occupants: []
    objects:
    - A wooden gate opens onto the farm track
    - Irrigation ditches run in straight lines across the fields
    - The farm buildings are visible ahead
    replace: true
    tags: *id001
  orchard_road:
    name: Orchard Road
    room_type: Farm Road
    desc: 'A pleasant road runs between two large orchards. The trees are mature and
      the air is sweet with the scent of blossom or fruit according to the season.
      Bees move steadily among the trees.


      The road surface is good and the shade is welcome on hot days.'
    exits:
      east: mill_stream_crossing
      west: farmer_s_track_south
      north: mill_stream_crossing
      south: farmer_s_track_south
    occupants: []
    objects:
    - A wooden ladder leans against one of the taller trees
    - Wicker baskets are stacked under a lean-to at the roadside
    - A stone bench sits in the shade at the end of a row
    replace: true
    tags: *id001
  mill_stream_crossing:
    name: Mill Stream Crossing
    room_type: Bridge
    desc: 'A solid wooden bridge crosses a clear stream that feeds the local mills.
      The water runs bright over pale stones and the banks are green with water plants.


      The sound of the water is constant and pleasant. The air is cooler over the
      stream.'
    exits:
      east: wayside_inn_ruin
      west: orchard_road
      north: wayside_inn_ruin
      south: orchard_road
    occupants: []
    objects:
    - A simple wooden railing runs along both sides of the bridge
    - Moss grows on the lower supports
    - The road continues on both sides into open land
    replace: true
    tags: *id001
  wayside_inn_ruin:
    name: Wayside Inn Ruin
    room_type: Ruin
    desc: 'The remains of an older wayside inn stand beside the road. Only the stone
      foundations and parts of the lower walls remain. Travelers sometimes rest among
