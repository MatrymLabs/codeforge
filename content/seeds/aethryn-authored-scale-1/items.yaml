warmcamp_tally:
  name: the Warmcamp's dig-tally
  keywords:
  - tally
  - warmcamp
  - dig
  - ledger
  location: nowhere
  slot: ''
  mods: {}
  lore: 'A dig-tally hung by the fire, the Warmcamp''s running argument written down:
    one column the diggers

    keep, of relics thawed and coin earned and mouths fed; another column someone
    else keeps, unlabeled,

    of the diggers the ice took -- the shaft-falls, the frost-guards, the ones who
    woke a sentinel and

    did not come up. The two columns run about even. Beneath them, in the camp-boss''s
    blunt hand: "The

    Rimekin say we rob a graveyard. Maybe. But a graveyard that pays its robbers in
    gold and its

    faithful in nothing is a graveyard that has picked a side, and it isn''t theirs.
    We dig because the

    living are worth more than the paused dead, and if that is heresy to the Silent
    Anvil, let them come

    warm their pure cold hands at our fire and say it to our faces. They never do.
    They''re never hungry

    enough to have to mean it." It is the whole quarrel of the frozen north, kept
    on a nail by a fire.'
deeprooted_covenant:
  name: the Deeprooted covenant
  keywords:
  - covenant
  - deeprooted
  - council
  - heartwood
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Grown into the heartwood of the grove-council hollow, read by running a hand
    along the living grain:

    "WE DO NOT RULE. This is the whole covenant of the Deeprooted, and it is harder
    to keep than any

    crown''s law. A living world cannot be ruled, only heard; a forest remembers the
    axe longer than the

    axeman lives; wild Ember grows where it wills and dies in the hand that grips
    it. So we do not

    command the Verdance and we do not command each other. We listen -- to the tree,
    to the swamp, to

    the moot, to the guest -- and we broker, and we go slow, because the living go
    slow and the dead go

    fast and we have chosen the side of the living. The drowned Reaches Forge, the
    frozen north freezes,

    the molten Reach burns, and each of them calls us weak for growing instead. Let
    them. When their

    made things have drowned and frozen and burned, the tree that grew this hollow
    will still be growing,

    and the covenant will still be true: you cannot own what is alive. You can only
    be worthy of it, and

    listen, and be a good guest in a house far older than your making. That is not
    weakness. That is the

    only strength that has ever lasted."'
gate_watch_stone:
  name: the Gate-Watch stone
  keywords:
  - stone
  - watch
  - gate
  - threshold
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Graven deep in the watch-stone at the threshold of the Forgeward Road, re-cut
    by every generation

    of sky-Wardens who have kept this post: "BEYOND HERE THE ROAD. East it runs, march
    on march, each

    deeper and worse than the last, to the Forge at the world''s far heart and the
    Sovereign that keeps

    it. This is the last threshold of the settled world. The Concord keeps it, and
    keeps it OPEN,

    because we have learned that a locked door only teaches people to break doors
    -- but we keep it

    WATCHED, so that no Forger walks east unwarned. Know before you go: the Road does
    not test your

    strength, it tests whether you know why you are walking it. The Forge at the end
    can make a world.

    The last people to reach it unmade one. Walk east if you must, Forger. Reach the
    Forge''s Edge if you

    can. But carry a reason worth the walking, because the Road strips away every
    reason that is not

    true, and a Forger who reaches the Sovereign with an empty reason becomes another
    thing the Road

    kept. The watch cannot stop you. It can only ask, one last time, the question
    the whole world hangs

    on: not CAN you make a world -- but SHOULD you, and do you know the difference.
    Go, then. We watched."'
