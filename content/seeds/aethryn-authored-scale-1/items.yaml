  mods: {}
  lore: 'The last ledger of the Merewright house that kept the Sunken Manse, its columns
    of salvage and

    salt and coin ruled to the final page: the house was rich, and the house was proud,
    and when the

    Cooling-Sea rose over the Quenchmere the house did not flee to the free-port with
    the common folk.

    It stayed, and shored its doors, and kept its wealth, and drowned in its own halls
    counting it.

    The steward kept the doors then and keeps them now. Take the signet. Wealth you
    will not spend on

    a boat is only ballast. The salvagers of Saltmarsh learned that. The house never
    did.'
glowcap:
