flagship_manifest:
  name: the flagship's lost manifest
  keywords:
  - manifest
  - ledger
  - flagship
  - book
  location: nowhere
  slot: ''
  mods: {}
  lore: 'The cargo manifest of the flagship of the first Rekindling, ink run but legible
    in the drowned

    dark: hearth-irons, seed-lamps, and the relit ember meant to carry warmth up the
    whole coast at

    once. She went down the day the Cooling-Sea rose, the manifest unmarked as delivered.
    All of it is

    still here, lashed and lost, a coast''s worth of warmth that never arrived. They
    relit the Kindlands

    the slow way instead, hearth by hearth, and never knew how close the fast way
    came to reaching them.'
sealed_ember:
