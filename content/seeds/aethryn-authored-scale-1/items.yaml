  name: a shrine-offering of old ember
  keywords:
  - offering
  - shrine
  - ember
  - cache
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Left in the moss of the Forgotten Shrine, on a stone worn smooth by hands
    that are all dust now:

    an offering of old ember, still faintly warm. No mark says to whom. The Emberwrights
    raised this

    ring before the town, before the Concord, before the names we keep -- and left
    gifts here for a

    thing they did not write down, and trusted us to leave them be. You are the first
    in an age to

    stand here. Take the ember if you must; the forest kept it a long time, and will
    not miss it now.'
firewatch_log:
  name: the last watcher's log
  keywords:
  - log
  - watcher
  - firewatch
  - book
  location: nowhere
  slot: ''
  mods: {}
  lore: 'The last entries of the Old Firewatch''s watch-log, the ink gone brown:

    "Day 400. The coast is relit hearth to hearth, the road runs to the capital, the
    Wardenmarch holds.

    From up here you can see it all catch, one fire at a time, the way you light a
    making from the

    inside out. They are standing down the watch -- no enemy left to watch for, they
    say, only the cold.

    Maybe. But I have kept this hill a long time, and I will tell you what a watcher
    learns: the world

    is always larger than the part of it you have lit. Keep climbing. There is always
    more to see."'
