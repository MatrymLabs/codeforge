heartwood_bark:
  name: the Heartwood's bark
  keywords:
  - bark
  - heartwood
  - tree
  - vale
  location: nowhere
  slot: ''
  mods: {}
  lore: 'You lay a hand on the Heartwood and the reading comes slow, in growth-rings
    older than reading: this

    tree stood before the Emberwrights raised a single Forge-city, before the making
    of the world was a

    craft anyone thought to name. It was here for the golden age and did not bow to
    it. It was here for

    the Unforging and was not unmade. It is not Forged and cannot be reforged, because
    it was never made

    at all - it simply GREW, the one thing in all the Kindlands the makers did not
    make and the unmaking

    could not touch. The First Flame folk say the world was Made and can be Made again.
    The Heartwood is

    the quiet question under that faith, the one no creed answers: what about the
    things that were never

    made, that grew on their own before the first maker lifted the first hammer, and
    outlasted every

    made thing since? Maybe the world was not only Made. Maybe some of it was always
    just growing, and

    the makers only ever added to a thing already alive, and forgot, in their pride,
    that they had come

    late to a world that did not need them. The Heartwood does not say. It only grows.
    It was growing

    before the question. It will be growing after. Sit in its shade, Forger, and be,
    for a moment, a

    thing that grew instead of a thing that was made. The Reachwood folded a valley
    closed to keep this.

    Now you know why.'
