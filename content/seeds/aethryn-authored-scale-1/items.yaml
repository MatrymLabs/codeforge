ashline_marker:
  name: the last Ashborn marker
  keywords:
  - marker
  - ashline
  - stone
  - hem
  location: nowhere
  slot: ''
  mods: {}
  lore: 'The last salvage-pole the Ashborn drive before the Ashline, a cross-stave
    hung with the tokens of

    those who walked past it and did not come back: a child''s spoon, a clan-ring,
    a Forger''s cold spark.

    Carved down the stave, re-cut each time the wind wears it faint: "THE WORLD ENDS
    HERE. Not in fire,

    not in flood, but in un-ness -- the place the making stopped and never started
    again. Do not mistake

    this for a border. A border has another side. This has only the near side, and
    us, and the pull. We

    are the people who live at the hem of the made world and keep each other from
    stepping off it. That

    is the whole of the Ashborn faith. There is nothing past the last stone worth
    the walk, because

    there is no past the last stone. Step back. Live in the made part. It is enough.
    It has to be."'
vault_testament:
  name: the sealed maker's testament
  keywords:
  - testament
  - vault
  - maker
  - seal
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Scratched inside the vault door by a hand running out of time: the testament
    of the scoured hold''s

    last maker. "The Unforging took the east wing between one breath and the next
    -- I watched a wall

    become the memory of a wall and then nothing. It is coming through the hold room
    by room and it does

    not hurry, because to it there is no time, only the slow forgetting of things
    that were made. I

    cannot stop it. I can only seal this one vault so well that the un-ness has to
    remember, hard, that

    this room was MADE, and stumble on the remembering. Everything I could not save
    is a doorway to

    nothing now. This -- this stays made, because I insisted, with the last making
    I had, that it must.

    If you read this, the seal held. Take what is here. And know that the only wall
    against the unmaking

    is a made thing that refuses, absolutely, to be unmade. Refuse. It is the only
    Forge that matters."'
unmade_ember:
  name: a bead of unmade Ember
  keywords:
  - unmade
  - ember
  - bead
  - cinderdeep
  location: nowhere
  slot: ''
  mods: {}
hollow_crown:
  name: the Hollow Crown
  keywords:
  - crown
  - hollow
  - king
  - umbral
  location: nowhere
  slot: head
  mods:
    MAG DEF: 14
    DEF: 8
kiln_lastwork:
  name: the drowned smith's last work
  keywords:
  - lastwork
  - work
  - kiln
  - smith
  location: nowhere
  slot: body
  mods:
    DEF: 15
    MAG DEF: 12
  lore: 'The last thing the master-smith of the sunken kiln ever made, cold in the
    dead furnace where the

    deep swallowed the town: a coat of Forge-mail, greyed by the unmaking but whole
    - unmade and yet

    unbroken, because it was made too well to forget. Where the town''s walls thinned
    to nothing and its

    people to echoes, this one thing held, for the only reason anything holds against
    the deep: it was

    forged by a maker who meant it to last, and meaning, it turns out, is the one
    material the unmaking

    cannot dissolve. Wear it down here and the deep will remember, against its will,
    that some things

    are made on purpose. Carry it up and it is only good mail. The greyness fades
    in a world that sets.'
cinderdeep_reckoning:
  name: a Warden's reckoning of the deep
  keywords:
  - reckoning
  - warden
  - cinderdeep
  - record
  location: nowhere
  slot: ''
  mods: {}
  lore: 'A Warden-Concord reckoning-stone, driven into the Greydark''s soft floor
    by some earlier expedition

    and half-forgotten since: "Let it be recorded, for the Forgers who come after,
    what the Cinderdeep

    IS, against the lies the Cinder Mysteries tell of it. It is not the world''s grave.
    It is not its

    compost. It is the world still coming apart, slowly, at the seam the Unforging
    opened and no one

    closed, and it grows downward because unmaking, unlike making, needs no maker
    - it only needs to be

    left alone. Every Reach has a mouth into it. Every mouth widens. We do not seal
    the deep because we

    cannot; we only mark it, and mark the dead, and teach the living the one truth
    the deep exists to

    prove: that a made thing is not permanent, it is DEFENDED, and the day the makers
    stop defending it

    is the day it joins the grey. Go down if you must. Come up while you can. And
    when you are old,

    remember you were made on purpose, and defend something."'
cinder_ale:
  name: a tankard of cinder-ale
  keywords:
  - ale
  - cinder
  - tankard
  - drink
  location: nowhere
  slot: ''
  mods: {}
  consume:
    hp: 8
first_flame_creed:
  name: the creed of the First Flame
  keywords:
  - creed
  - flame
  - church
  - hearth
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Graven over the church hearth, in a hand that meant it: "THE WORLD WAS MADE.
    That is the first

    article and the last. Not born, not fallen from a god''s hand, not eternal - MADE,
    by makers, out of

    raw Ember and will, and what was made was unmade at the Unforging, and what was
    unmade can be Made

    AGAIN. This is the whole of the First Flame: not that the fire is holy, but that
    the making is, and

    the keeping of the fire is only the keeping of the will to make. Do not worship
    the flame. Tend it.

    A god you beg. A fire you feed. We are not the children of the world. We are its
    smiths, and the

    Rekindling is our second and final chance to prove we learned the first lesson:
    a made thing lives

    only as long as someone keeps making it. Keep the flame. Make the world. Do not,
    this time, let go."'
world_casefile:
  name: the world's own case-file
  keywords:
  - casefile
  - case
  - file
  - archive
  location: nowhere
  slot: ''
  mods: {}
  lore: 'The Grand Archive''s founding record, the case-file the Emberwright Rememberers
    opened on the world

    itself: "CASE: THE UNFORGING. STATUS: open, and will not close. Known: the world
    was one Forged

    supercontinent; it came apart along the cooling-seas into the seven Reaches, tore
    lands into the

    sky, dropped others into the Cinderdeep; the makers who did it, the Emberwrights,
    are gone, and left

    no confession, only the wound. Unknown, and this is the Archive''s whole purpose:
    WHY. Why the first

    makers stopped. Why a craft that could build a world was set down, and by hands
    that knew exactly

    what they were setting down. Every clue is a Reach. Every Reach is a page. The
    Forgeward Road runs

    east to where the answer sank, and a Forger who reads far enough may close the
    case the makers left

    open. We do not keep the memory to mourn it. We keep it to solve it. Read on.
    The next clue is out

    there, and it is the size of a continent."'
hull_hoard_ring:
  name: the hull-wight's hoard-ring
  keywords:
  - ring
  - hoard
  - hull
  - wight
  location: nowhere
  slot: accessory_2
  mods:
    DEF: 4
    EVA: 5
merewright_creed:
  name: the Merewright creed
  keywords:
  - creed
  - merewright
  - rail
  - drowned
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Scrimshawed down the whale-bone rail of the tide-shrine, in a sailor''s close
    hand: "THE SEA KEEPS.

    That is our whole faith, and it is kinder than it sounds. When the cooling-seas
    rose over the

    Quenchmere they did not destroy the old world, they DROWNED it - and a drowned
    thing is not a burned

    thing or an unmade thing. It is kept. Cold, and deep, and lamp-lit, the old Forge-cities
    stand whole

    below our keels, and our drowned stand with them, not lost, only deep, waiting
    in the kept dark. The

    First Flame folk fear the losing and hold that all must be made again. We do not
    fear it. We dive to

    it. Light a lamp for your drowned and know they are down there still, kept perfect
    by the water that

    took them, and that the difference between a graveyard and a treasury is only
    whether you have the

    nerve to go down and look. We are Merewrights. We always go down and look."'
salvage_writ:
  name: a Salvage Guild writ
  keywords:
  - writ
  - guild
  - salvage
  - contract
  location: nowhere
  slot: ''
  mods: {}
  lore: 'A standard Salvage Guild work-writ, left on the factor''s table for any Forger
    to read before they

    mark it: "BE IT KNOWN the bearer contracts to open, clear, or lift salvage on
    the Guild''s account,

    for the Guild''s share, at the bearer''s risk. The Guild warrants NOTHING of what
    lies below - not the

    depth, not the dark, not the drowned that keep it. The Guild notes, without warranting
    it either,

    that the drowned Reach holds the largest unbroken Forgework in the world outside
    the frozen north,

    and that every fortune in Tidewharf was lifted by someone who read a writ exactly
    like this one and

    marked it anyway. The Guild built its hall on a treasure-hull. The Guild does
    not say how. The Guild

    suggests the bearer not ask, mark the writ, and go down. The tide waits for no
    contract." Below, a

    line for a name, and a great many names already on it, and beside a great many
    of those, a small

    inked anchor: the Guild''s mark for a Forger who did not come back up.'
emberbloom:
  name: a cluster of ember-bloom
  keywords:
  - emberbloom
  - bloom
  - ember
  - stiltways
  location: nowhere
  slot: ''
  mods: {}
mirefast_lost_purse:
  name: the town's lost purse
  keywords:
  - purse
  - lost
  - mirefast
  - hoard
  location: nowhere
  slot: accessory_1
  mods:
    EVA: 6
    ACC: 4
deeprooted_creed:
  name: the Deeprooted teaching-creed
  keywords:
  - creed
  - deeprooted
  - shrine
  - bark
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Grown, not carved, into the living bark of Mirefast''s teaching-shrine, in
    the shaped-branch script

    the Deeprooted let outsiders learn: "THE WORLD IS ALIVE, and you are not its master.
    The dry Reaches

    Forge the world - they take dead Ember and force it to a shape, and call the forcing
    mastery. We do

    not. We ask. Wild Ember grows where it wills; the swamp chooses its own channels;
    the canopy

    remembers who has cut it. To live in the Verdance is to hold a conversation with
    a thing far older

    and larger than you, and the first rule of that conversation is the one the dry
    world forgets: you

    are a guest. The First Flame folk say the world was made and can be made again.
    The frozen north

    says the making should stop. We say a thing you can only make by killing what
    was already living

    was never yours to make. Trade with us, guest. Learn the living faith. And when
    the swamp asks who

    you are - and it will - answer honestly, because it can always tell, and it is
    always listening."'
