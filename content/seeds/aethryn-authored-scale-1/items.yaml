ashen_monoliths_halfcommand:
  name: the half-finished command
  keywords:
  - half-command
  - command
  - tablet
  location: ashen_monoliths_recordtent
  slot: ''
  mods: {}
  lore: 'A tablet that ends with the words: when the gate opens, remember to...'
ashen_monoliths_cinderline:
  name: the moving cinder line
  keywords:
  - cinder-line
  - cinder
  - line
  location: ashen_monoliths_cinderfield
  slot: ''
  mods: {}
  lore: A vein of cinderium that has rearranged itself into a map of the Scorched
    Gate.
aurelian_routing_core:
  name: a nexus routing-core
  keywords:
  - routing-core
  - core
  - routing
  location: aurelian_nexus
  slot: ''
  mods: {}
  lore: A sphere of clear old-world glass threaded with turning light, cold and humming,
    that shows the slow angle of the great ring and the single destination it is patiently
    turning toward. The scholars read it to count how near the circuit is to closing.
    None of them will say aloud what the reading has lately become, only that the
    ring turns faster than a dead machine should.
aurelian_ration_roll:
  name: the skyhold ration-roll
  keywords:
  - ration-roll
  - roll
  - ration
  location: aurelian_market
  slot: ''
  mods: {}
  lore: The isle's public ledger of its failing life-support, posted in the market
    so every soul can read how much air and water the old Crowncraft still makes and
    how fast the making dwindles. Its yearly columns march steadily down toward a
    final line the scholars have already calculated and no tribune will name aloud,
    the year the isle can no longer breathe, unless the sleeping Crowncraft is woken,
    and no one dares wake it.
brightwater_sluice_token:
  name: a warden's sluice-token
  keywords:
  - sluice-token
  - token
  - warden
  location: brightwater_sluice
  slot: ''
  mods: {}
  lore: A flat token of pale, untarnished metal, its face worked with channels like
    a river seen from above. It is warm to the touch though the water is cold, as
    if some old purpose still runs in it, waiting for a gate to open.
brightwater_flood_ledger:
  name: the Brightwater flood-ledger
  keywords:
  - flood-ledger
  - ledger
  - flood
  location: brightwater_hall
  slot: ''
  mods: {}
  lore: A civic ledger of every flood the mills have survived, kept in the same careful
    hand across three centuries. Its later pages note, without comment, that the worst
    floods slacken the moment the old sluice is worked, as though the buried gates
    still answer the river, and the town has learned to profit from a thing it will
    not admit it fails to understand.
caeloria_ledger_key:
  name: a brass ledger-key
  keywords:
  - ledger-key
  - key
  - brass
  location: caeloria_court
  slot: ''
  mods: {}
  lore: A small brass key on a frayed court-ribbon, warm from a hand that held it
    too long. It unlocks the cradle in the archive where the twelfth charter-page
    is kept, the page that names the reaches bound to the crown. Someone carried it
    here to the court and left it behind a shelf of unsealed judgements, whether by
    theft or by a clerk's tired mistake the record does not say.
caeloria_charter_seal:
  name: the great seal of the heartland
  keywords:
  - seal
  - great-seal
  - charter
  location: caeloria_archive
  slot: ''
  mods: {}
  lore: 'The heavy gold matrix that presses the crown''s mark into every sealed judgement:
    a crowned tower over a field of grain, the whole realm in one small device. "By
    this seal the heartland speaks," reads the rubric cut around its rim, "and while
    the seal holds, the reaches answer. Guard the seal. Guard the charter. A kingdom
    is only the sum of what it has written down and can still prove."'
elderwatch_farlens:
  name: an old-world far-lens
  keywords:
  - far-lens
  - lens
  - cache
  - farlens
  location: elderwatch_tower
  slot: ''
  mods: {}
  lore: A disc of pale, flawless old-world glass in a bezel of the same untarnished
    metal as the tower stones, left walled in the watcher's cache. Held to the eye
    it draws the far meadows up close as a hand's breadth, sharp beyond any lens a
    Veridia grinder could cut. Whoever raised this tower meant its watchers to see
    trouble a full day before it arrived, and built the seeing into the stone.
elderwatch_watch_log:
  name: the Elderwatch watch-log
  keywords:
  - watch-log
  - log
  - roster
  - book
  location: elderwatch_hall
  slot: ''
  mods: {}
  lore: 'A thick roster-book chained to the warden''s table, its watch-lists running
    back three hundred years in a hundred different hands. An early page, the ink
    gone brown, notes plainly: "The east beacon woke of itself again this night, unlit,
    and warned us of the pass-raiders a day before the riders came. We do not know
    the trick of it. We only keep the wall, and are grateful for the old fire while
    it burns." A later hand has added beneath: "The old fire burns no more. We light
    them now ourselves, and pray we are never late."'
eldryn_city_heartsap:
  name: a phial of blighted heartsap
  keywords:
  - heartsap
  - sap
  - phial
  location: eldryn_city_roots
  slot: ''
  mods: {}
  lore: 'A slender phial of sap drawn from the deep roots where the grey rot has taken
    hold, dark and still where a healthy root would run clear and slow. Held to the
    coin-light of the canopy it shows a thing that should not be in living wood: a
    fine grey thread laced all through it, too even to be chance, as though the rot
    were not a sickness at all but a pattern, drawn into the oldest roots of the realm
    by a hand the wardens cannot name.'
eldryn_city_barkslate:
  name: the wardens' bark-slate
  keywords:
  - bark-slate
  - slate
  - tally
  location: eldryn_city_wardenhall
  slot: ''
  mods: {}
  lore: 'A broad slab of living bark the wardens have read for longer than the city
    has kept records, its surface marked with a growing tally that no hand seems to
    cut: new lines rise in it season by season, as if the wood itself keeps the count
    and the wardens only read what the roots have already chosen to record. Near the
    newest edge the lines run crooked and grey for the first time in the slate''s
    long memory, and no warden living knows what the crooked lines mean.'
frosthold_reading_core:
  name: an observatory reading-core
  keywords:
  - reading-core
  - core
  - reading
  location: frosthold_observatory
  slot: ''
  mods: {}
  lore: A sphere of frost-clear crystal threaded with lines of pale metal, cold past
    cold, that shows a turning map of the peaks when the light catches it. It reads
    the sky still, though the hall it served is buried, as if it is waiting to be
    told again where to make the storms fall.
frosthold_watch_roll:
  name: the ice-watch roll
  keywords:
  - watch-roll
  - roll
  - watch
  location: frosthold_wardroom
  slot: ''
  mods: {}
  lore: A long roll of vellum naming every soul the ice-watch has lost to the cold,
    kept nailed to the wardroom wall so no captain forgets the count. The oldest names
    are worn to shadows, but the roll has never been retired and never been full,
    as though Frosthold long ago made peace with a war that has no last page.
greenhold_valve_key:
  name: a corroded valve-key
  keywords:
  - valve-key
  - valve
  - key
  location: greenhold_undercroft
  slot: ''
  mods: {}
  lore: A heavy key of pale metal, corroded only where later hands have touched it.
    It fits the seized fountain-head exactly, as though key and fountain were made
    in the same breath, in a workshop no one now living in Greenhold could name.
greenhold_parish_record:
  name: the Greenhold parish record
  keywords:
  - record
  - parish-record
  - book
  location: greenhold_market
  slot: ''
  mods: {}
  lore: 'A water-stained parish book chained to the market well. Its oldest legible
    entry, in a hand three centuries dead, reads: "The good water failed again this
    Spring, and was woken again by a stranger''s hand, as the elders say it was in
    their grandmothers'' time. We do not write down how. We only write that Greenhold
    has never yet gone thirsty, and pray the pattern holds."'
veridia_source_charm:
  name: the keeper's charm
  keywords:
  - charm
  - keeper-charm
  - keeper
  location: source_vault
  slot: accessory_1
  mods:
    DEF: 4
    EVA: 4
veridia_source_keystone:
  name: the heart-keystone of the Source
  keywords:
  - keystone
  - heart-keystone
  - source
  location: source_heart
  slot: accessory_2
  mods:
    ATK: 6
    MAG DEF: 4
veridia_source_record:
  name: the Source master-record
  keywords:
  - master-record
  - source-record
  - dome
  location: source_heart
  slot: ''
  mods: {}
  lore: 'A single unbroken line of the old hand graven around the whole dome, above
    the stilled engine. It names no king and dates no year. It reads only: "Here the
    water is kept and measured, and let out by sun and season and need, that the valley
    above need never thirst, nor flood, nor go dark, nor brown, and never know it
    is kept at all. Let the keepers hold it gently. Let the valley forget us, and
    be well." The engine has kept the promise long after the keepers, and the promise,
    were forgotten.'
lumengrotto_record_shard:
  name: a contested record-shard
  keywords:
  - record-shard
  - shard
  - record
  location: lumengrotto_vault
  slot: ''
  mods: {}
  lore: A splinter of archive-crystal that holds a single testimony, replaying a moment
    that stops whenever you look straight at it. Whether it preserves what happened
    or only what the vault has long since decided to keep, no one in Lumengrotto can
    any longer say, and that is the whole quarrel.
lumengrotto_lamp_census:
  name: the terrace lamp-census
  keywords:
  - lamp-census
  - census
  - lamp
  location: lumengrotto_terraces
  slot: ''
  mods: {}
  lore: A tally-board the terrace-keepers hang among the beds, counting every lamp
    the town burns against every basket of glowcap the terraces yield. Its oldest
    columns record a harvest twice what the beds now give, in a hand generations gone,
    as though the deep once fed far more people by this light than Lumengrotto could
    now name, and no keeper has ever dared guess where they went.
moltenhold_casting_die:
  name: an unknown casting-die
  keywords:
  - casting-die
  - die
  - casting
  location: moltenhold_foundry
  slot: ''
  mods: {}
  lore: A heavy die of dark Crown-metal, its face cut with a pattern of parts that
    fit no tool or weapon the wastes have ever known. Warm, and faintly humming, as
    though the foundry above still counts it among the castings it has yet to finish.
moltenhold_forge_tablet:
  name: a scorched forge-tablet
  keywords:
  - forge-tablet
  - tablet
  - forge
  location: moltenhold_watch
  slot: ''
  mods: {}
  lore: 'A slab of Crown-metal the Watch keeps chained in the hall, its face a running
    tally of castings the foundry has turned out, incised by no hand the Watch has
    ever seen wield a stylus. The count only grows, and the last captains have added
    a line of their own beneath it: a guess at how many castings remain before the
    machine below decides its long work is done.'
moonshade_moon_lantern:
  name: a drowned vigil-lantern
  keywords:
  - lantern
  - vigil-lantern
  - drowned
  location: moonshade_deepwell
  slot: ''
  mods: {}
  lore: 'A small brass lantern hauled up cold and dark from the deep well, its glass
    beaded with water that will not dry and its wick drowned but whole. Hold it and
    you feel the shape of the vigil it kept: a name lowered into the dark each night
    and answered, until one night it was not. The Keeper can light it again. Whether
    the soul it watched over is still down there waiting, the well does not say.'
moonshade_drowned_roll:
  name: the roll of the drowned
  keywords:
  - roll
  - drowned-roll
  - list
  location: moonshade_shrine
  slot: ''
  mods: {}
  lore: 'A long vellum scroll kept dry under the shrine''s eave, every line a name
    the well took in the Fall and the date it was last remembered aloud. The Keeper''s
    rubric runs down the margin: "We do not carve them their deaths, only that they
    drowned remembered and by whom. A name unlit walks. A name kept rests. Lower the
    light, ring the bell, do not lose the count." The last few lines are fresh ink.'
ravenwatch_grave_token:
  name: a mourner's grave-token
  keywords:
  - grave-token
  - token
  - mourner
  location: ravenwatch_barrow
  slot: ''
  mods: {}
  lore: 'A worn coin of grey lead, its face rubbed smooth by grieving thumbs, warm
    though the barrow is cold. Hold it and you half-remember a life that is not yours:
    a road, a name half-heard, a grief that was someone else''s first. The wardens
    read such tokens to keep the dead remembered rightly.'
ravenwatch_grave_marker:
  name: a leaning grave-marker
  keywords:
  - grave-marker
  - marker
  - grave
  location: ravenwatch_chapel
  slot: ''
  mods: {}
  lore: 'A grey slate marker leaned against the chapel wall, its cut names worn to
    shadows but for the warden''s rubric at the foot: "Here we do not carve the dead
    their deeds, only that they were remembered, and by whom. A name unremembered
    walks. A name remembered rests. Keep the book."'
riverbend_lock_lever:
  name: an old-world lock-lever
  keywords:
  - lock-lever
  - lever
  - weir-lever
  location: riverbend_weirvault
  slot: ''
  mods: {}
  lore: A long bar of the same pale, untarnished metal as Greenhold's valve-key and
    Elderwatch's tower, seated in a socket cut to fit it and nothing else. Thrown
    by hand it grinds the seized weir-gears back into their track, one hard notch
    at a time, doing by main strength what the old lock once did by listening. Whoever
    built the weir never meant a hand to touch this. They left it only in case.
riverbend_lock_log:
  name: the Riverbend lock-log
  keywords:
  - lock-log
  - log
  - book
  - record
  location: riverbend_ferryhouse
  slot: ''
  mods: {}
  lore: 'A swollen, much-corrected ledger chained in the ferry-house, the lockkeepers''
    record of the weir running back past the first ferry-chain. An old entry, the
    ink run with damp, reads: "The weir tuned itself again through the spring flood,
    and no hand was laid on the gears. We do not know how it reads the river. We only
    keep the log, and cross dry." A later, firmer hand has scored beneath: "The gears
    read nothing now. We throw the lever by hand and pray the flood is kind. Merta
    says a stranger will free it, as one did before. We are not too proud to hope
    she is right."'
riverbend_river_charm:
  name: a river-worn charm
  keywords:
  - charm
  - river-charm
  - token
  location: riverbend_reeds
  slot: ''
  mods: {}
  lore: A small disc of pale old-world metal, worn smooth by the river, tucked in
    a niche at the foot of the sunken marker-stone as if left there in offering, long
    ago, by someone who understood what the stone marked. Its face carries the same
    fine gear-work as the weir below, shrunk to a keepsake, as though the whole old
    lock had once been cast in miniature and given to the river to keep.
silverwatch_tally_book:
  name: the deep tally-book
  keywords:
  - tally-book
  - book
  - tally
  - ledger
  location: silverwatch_deep
  slot: ''
  mods: {}
  lore: 'A heavy ledger bound in grey mine-leather, its pages damp from the deep and
    ruled in the clerk''s patient hand: every reach that ordered Silverwatch silver,
    every crate shipped, every payment returned. The last columns are the strange
    ones. Order after order from the reaches beyond the plains is entered, shipped,
    and then never marked RECEIVED, the tally trailing off into blank ruled lines,
    as though the far end of the world had simply stopped writing back.'
silverwatch_assay_mark:
  name: a Silverwatch assay-mark
  keywords:
  - assay-mark
  - mark
  - stamp
  - die
  location: silverwatch_assay
  slot: ''
  mods: {}
  lore: 'The iron die the assayer strikes into every proven bar: a scale-beam over
    a silver vein, and cut around the rim the town''s plain rubric. "Weighed true,
    proved true, recorded true," it reads. "A mark is a promise, and a promise is
    only worth the record that keeps it. Prove the silver. Keep the ledger. A town
    that trades on trust dies the day it stops writing down what it is owed."'
stonefang_clan_keystone:
  name: the Stonefang clan keystone
  keywords:
  - keystone
  - clan-keystone
  - stone
  location: stonefang_drift
  slot: ''
  mods: {}
  lore: A blunt wedge of grey stone cut with the Stonefang mark, but set into it,
    where no clan-mason put it, is a seam of the old road's seamless metal, warm and
    faintly humming. Whoever last held this keystone set it against the old road on
    purpose, for a reason the claim-roll does not record.
stonefang_claim_roll:
  name: the Stonefang claim-roll
  keywords:
  - claim-roll
  - roll
  - claim
  location: stonefang_hall
  slot: ''
  mods: {}
  lore: The clan's roll of every drift, vein, and deep claim the Stonefangs have held
    or lost, kept in knots and iron tags a thane can read in the dark. Its deepest
    claims are struck through and re-cut in an anxious hand, redrawn again and again
    as the old strata rise, as though the clan is slowly ceding the richest ground
    to a claimant that carries no axe and answers no parley.
stonehelm_authority_seal:
  name: the tribunal's authority-seal
  keywords:
  - authority-seal
  - seal
  - authority
  location: stonehelm_bunker
  slot: ''
  mods: {}
  lore: A cold disc of old command-metal that seems to grow heavier the longer it
    is held, stamped with an authority older than any living crown. Those who carry
    it feel, faintly, the pull to give orders and be obeyed. The tribunal re-swears
    it each generation, and each generation is a little less certain the seal serves
    them, rather than the other way about.
stonehelm_muster_roll:
  name: the old muster-roll
  keywords:
  - muster-roll
  - roll
  - muster
  location: stonehelm_barracks
  slot: ''
  mods: {}
  lore: 'A brittle roll the barracks keeps though no one can read its dead script,
    salvaged whole from the bunker generations ago: the muster of the old garrison,
    every soldier the command once counted. The quartermasters swear the names on
    it change, that soldiers long struck off reappear at the foot in fresh ink, as
    though the bunker below is still enlisting a garrison, and the roll is how it
    counts.'
stormreach_gate_key:
  name: a drowned gate-key
  keywords:
  - gate-key
  - key
  - gate
  location: stormreach_gate
  slot: ''
  mods: {}
  lore: A key of green-grown sea-Crown metal, cold and dripping, cut with a chart
    of currents that belong to no ocean anyone has sailed. Held near the drowned gate
    it thrums, and the water answers, as if key and gate still remember how the old
    world joined every sea to every other.
stormreach_wreck_ledger:
  name: the League's wreck-ledger
  keywords:
  - wreck-ledger
  - ledger
  - wreck
  location: stormreach_league
  slot: ''
  mods: {}
  lore: 'The Salvers'' League''s ledger of every wreck licensed and every diver lost,
    kept in a waxed book the damp cannot ruin. Its salvage-charts carry a second set
    of soundings in an uneasy hand: the places the drowned gate has opened over the
    years, each nearer the harbour than the last, as if the wrong sea is slowly learning
    the way in, and the League has decided it is better not to say so.'
sunmeadow_sun_key:
  name: an old-world sun-key
  keywords:
  - sun-key
  - sunkey
  - key
  - gnomon-key
  location: sunmeadow_channelhouse
  slot: ''
  mods: {}
  lore: A slim wedge of pale, untarnished metal seated in the stopped gnomon-wheel,
    cut to a shape that fits its socket and no other, kin to Greenhold's valve-key
    and Riverbend's lock-lever down to the unweathered sheen. Drawn and turned, it
    frees the sun-wheel to read the light again and let the meadow's water by the
    hour, doing by a traveller's hand what the old channel once did by the sky.
sunmeadow_grange_record:
  name: the Sunmeadow grange-record
  keywords:
  - grange-record
  - record
  - book
  - ledger
  location: sunmeadow_dairy
  slot: ''
  mods: {}
  lore: 'A hide-bound grange-book chained to the dairy counter, the valley''s tally
    of beasts and hay back past the founding. An old entry, the ink faded to gold,
    reads: "The channel watered the meadow again all the dry month, by no hand of
    ours, the wheel turning with the sun as it was made to do. We do not know the
    trick of it. We only bring in the hay and give thanks for green grass in a brown
    season." A later hand has added: "The wheel has stopped. We carry water by the
    pail now and the pasture browns at the edges. Aldwin says a stranger''s hand will
    start it, as the old tales say it started before. We keep the record, and watch
    the grass."'
sunscar_charter_seal:
  name: the guild's charter-seal
  keywords:
  - charter-seal
  - seal
  - charter
  location: sunscar_vault
  slot: ''
  mods: {}
  lore: A heavy seal of impact-glass and old bronze, the Guild's authority to open
    the buried city cast into a thing older than the Guild by an epoch. Held to the
    light it shows a street-plan of a city no living map remembers, as if the seal
    were cut from a door of the buried place itself.
sunscar_dig_ledger:
  name: the shaft-head dig-ledger
  keywords:
  - dig-ledger
  - ledger
  - dig
  location: sunscar_guild
  slot: ''
  mods: {}
  lore: 'The Guild''s running ledger of every shaft sunk into the buried city and
    every soul it swallowed, kept at the shaft-head so no digger can say he was not
    warned. Its margins carry a second tally in an older hand: the depth at which
    the diggers stop finding glass and start finding doors that are shut from the
    inside, a depth the Guild licenses no one to pass, and never explains why.'
twilight_grove_dusklamp:
  name: a failing mourning-lantern
  keywords:
  - lantern
  - mourning-lantern
  - dusklamp
  - lamp
  location: twilight_grove_hollow
  slot: ''
  mods: {}
  lore: 'A small horn lantern half-drowned in the hollow''s dark, its fernshade wick
    burned down to a slow blue ember that is somehow still lit. Lift it and you feel
    the grief it was set to keep: an old sorrow, patient and kind, still faithfully
    mourning a name even here where the name is lost. The lantern-keeper trims such
    wicks so the mourning need never finish. Let this one go dark and the grief it
    holds will have nowhere left to be but loose among the black trees.'
twilight_grove_memory_stone:
  name: a duskwell memory-stone
  keywords:
  - stone
  - memory-stone
  - duskwell
  - memory
  location: twilight_grove_well
  slot: ''
  mods: {}
  lore: 'A flat grey stone the grievers of the grove drop into the duskwell, one for
    each hour they cannot leave behind, so the well shows only that hour forever.
    Hold it and it is faintly warm, the way the barrows of Ravenwatch are said to
    be warm, as if a place could keep the last dusk of a life the way a barrow keeps
    its last thought. Cut into its face is the grove''s only rubric: "Here we do not
    finish grieving. We keep it lit. A grief mourned is kept; a grief loose walks.
    Trim the wick."'
veridia_wayfinder_compass:
  name: a wayfinder's compass
  keywords:
  - compass
  - wayfinder-compass
  - wayfinder
  location: veridia_maproom
  slot: ''
  mods: {}
  lore: The needle does not settle on a cardinal direction. It trembles toward the
    next unfinished task, then rests on the four-point sigil etched beneath the glass.
    The same mark appears on the old works beneath Greenhold, Elderwatch, Riverbend,
    and Sunmeadow.
veridia_cradle_map:
  name: the cradle road-map
  keywords:
  - map
  - road-map
  - cradle-map
  location: veridia_maproom
  slot: ''
  mods: {}
  lore: A working map of Veridia, annotated in generations of different hands. Greenhold's
    water, Elderwatch's warning, Riverbend's crossing, and Sunmeadow's light are connected
    by a single faded line that runs beneath the roads.
voidspire_stable_anchor:
  name: the watch's stable anchor
  keywords:
  - anchor
  - stable-anchor
  - stable
  location: voidspire_fracture
  slot: ''
  mods: {}
  lore: A blunt spike of no metal the wastes can name, dead cold and utterly still
    in a place where nothing else is. Socketed into the fracture, it holds one small
    patch of the wound readable and real. The wardens do not know who made it, only
    that without it the edge stops keeping its shape.
voidspire_watch_creed:
  name: the Wardens' creed-stone
  keywords:
  - creed-stone
  - creed
  - stone
  location: voidspire_watch
  slot: ''
  mods: {}
  lore: 'A plain slab set at the head of the descent, cut with the only three lines
    every Warden of the Scars swears: We do not close it. We do not open it. We hold.
    Beneath them, in a hundred smaller hands across the years, the wardens who have
    kept this watch have each added a single scratched mark for a season survived
    at the edge, so the stone reads as much as a tally of endurance as a creed, and
    the newest marks are cut deepest, as though the holding has lately grown harder.'
westgate_writ:
  name: a sealed writ
  keywords:
  - writ
  - sealed-writ
  - seal
  location: westgate_road
  slot: ''
  mods: {}
  lore: A folded writ of stiff reach-paper, its wax seal unbroken and its sender's
    mark pressed into it too faintly to read, cold though the night is warm. It was
    carried up the road out of the fraying reaches and set down at the milestone by
    a hand that did not stay to clear the toll. The Knowing way is to log every line
    and prove it later; this one has no line, and the tollkeeper cannot close his
    register until it does. What the seal holds, and who meant it to come up the road
    unlisted, the writ does not say and will not say until a hand that has the right
    to it breaks the wax.
westgate_milestone:
  name: the leaning milestone
  keywords:
  - milestone
  - stone
  - marker
  location: westgate_tollhouse
  slot: ''
  mods: {}
  lore: 'The old boundary-stone of Westgate, hauled in from the western road when
    it would not stop leaning, its cut rubric worn but legible: "Here the valley ends
    and the heartland begins. Clear the toll. State your road. Be counted." Below,
    a warden''s later hand has scratched a second line that no clerk has yet dared
    to sand away: "The road runs both ways, and lately the reaches count us."'
wildgrowth_tally_stone:
  name: the compact's tally-stone
  keywords:
  - tally-stone
  - tally
  - stone
  location: wildgrowth_rootdeep
  slot: ''
  mods: {}
  lore: 'A smooth stone marked with a growing tally that no hand seems to cut: new
    notches appear in it season by season, as if the wood itself keeps a count of
    something, and the compact only reads what the roots have already decided to record.'
wildgrowth_pact_leaf:
  name: the pressed pact-leaf
  keywords:
  - pact-leaf
  - leaf
  - pact
  location: wildgrowth_lodge
  slot: ''
  mods: {}
  lore: A single broad leaf pressed flat and kept under glass in the lodge, older
    than any warden yet still faintly green. Veins run through it in lines too even
    to be wild, the same pattern as the channels in the root deep below, as though
    the leaf and the roots were drawn by one hand in a season no living warden can
    name.
zulkarak_design_key:
  name: a laboratory design-key
  keywords:
  - design-key
  - key
  - design
  location: zulkarak_lab
  slot: ''
  mods: {}
  lore: 'A key of living amber that pulses faintly, warm as a held creature, its inner
    grain shifting like a thing still growing. The physicians read it to tell the
    Loom''s safe designs from its lethal ones. What it truly is, none can say: a tool,
    a seed, or a small unfinished piece of the old work itself.'
zulkarak_bloom_register:
  name: the physicians' bloom-register
  keywords:
  - bloom-register
  - register
  - bloom
  location: zulkarak_lodge
  slot: ''
  mods: {}
  lore: 'The lodge''s running register of every new life the jungle has budded and
    the physicians'' verdict on each: medicine, murder, or unknown. The unknown column
    is the longest and grows fastest, and a note in the newest hand admits what no
    physic-master says aloud: that the register is losing the race, that the Loom
    designs faster than a city of healers can judge, and always has.'
