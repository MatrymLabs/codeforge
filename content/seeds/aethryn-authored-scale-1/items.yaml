  lore: 'Scratched into the vault door from the inside, in a maker''s last steady
    hand:

    "We seal what we could not let the Unforging have: a shard of the first ember,
    from before the

    First Seed broke, still warm. If you have opened this, then the Rekindling came,
    and the world was

    relit, and you are a Forger of an age we did not live to see. Take the ember.
    It was always meant

    to be a beginning, not a grave. We only kept it safe until someone came who could
    carry it forward.

    That is you. It was always going to be you. Go and make something. That is the
    whole of the craft."'
wreckways_salvage:
