  - ledger
  - archive
  location: nowhere
  slot: ''
  mods: {}
  lore: 'THE RELIGHTING OF THE KINDLANDS COAST, as kept by the Grand Forge.

    When the Unforging cooled the coast to grey, the Concord did not rebuild. It RELIT
    -- hearth by

    hearth, room by room, in the old order the makers left. The rule was written first
    and never

    since amended: relight nothing you cannot keep warm. A fire you cannot tend is
    a second

    unmaking, slower and crueller than the first. The coast you walk was warmed by
    that patience.'
