    MAG DEF: 10
ashkoll_masterbrand:
  name: the Ashkoll masterbrand
  keywords:
  - masterbrand
  - ashkoll
  - brand
  - weapon
  location: nowhere
  slot: weapon
  mods:
    ATK: 28
    ACC: 5
kollkin_creed:
  name: the Kollkin creed
  keywords:
  - creed
  - kollkin
  - bronze
  - caldera
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Struck in bronze at the caldera''s lip, in a bold deep hand: "HEAT IS LIFE.
    A cold land is a corpse,

    a cold house a grave, a cold hearth a confession. The frozen north keeps its dead
    and calls it

    wisdom; the drowned Reaches count their losses and call it peace. We are Kollkin.
    We keep the fire.

    We would rather burn out than gutter cold, and rather pour one strike too many
    than let the caldera

    fail. Look below at Ashkoll, that let its fire die, and know there is no worse
    death than the cold.

    Spend hot. Live hot. When you go, go bright." It is the exact opposite of the
    Silent Anvil''s creed

    in the frozen north, and both peoples are certain, and both point at each other''s
    dead cities as

    proof, and neither has noticed that the drowned, the frozen, and the cooled are
    all just dead.'
ashkoll_last_pour:
  name: the record of the last pour
  keywords:
  - record
  - pour
  - ashkoll
  - tablet
  location: nowhere
  slot: ''
  mods: {}
  lore: 'A work-tablet from Ashkoll''s dead forge-square, its cold-scratched tally
    stopped mid-count. The

    Vent-master''s hand runs steady and proud down the years: caldera strong, pours
    good, the hottest

    hold in the Kollforge, a city that would never let its fire fail as the soft southern
    holds did. And

    then the entries thin. "Caldera low this season, but it will rise." "Low again.
    We banked harder."

    "We pour less to save the heat, but the saving cools it faster." "Cold in the
    low quarter. We moved

    the people up." "Cold in the high quarter now." And last, in a hand gone unsteady:
    "We spent it all

    keeping warm and now there is nothing left to burn. We were so afraid of the cold
    that we fed it

    everything we had. Tell Emberkoll: it is not the cold that kills a hold. It is
    the fear of it."'
stormglass:
  name: a shard of stormglass
  keywords:
  - stormglass
  - storm
  - shard
  - shoals
  location: nowhere
  slot: ''
  mods: {}
anchor_warden_chain:
  name: the Broken Warden's chain
  keywords:
  - chain
  - anchor
  - warden
  - weapon
  location: nowhere
  slot: weapon
  mods:
    ATK: 32
    ACC: 7
skyborn_creed:
  name: the Skyborn creed
  keywords:
  - creed
  - skyborn
  - capstan
  - drum
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Cut in a ring around the capstan-drum, worn smooth by a thousand years of
    hands: "WE NEVER LANDED.

    The world came apart and the ground fell away and we did not fall with it -- not
    because we were

    spared, but because we kept the anchor and each other and did not let go. Let
    the drowned mourn

    their sea and the frozen keep their ice and the burned tend their fire. We keep
    the chain. A home

    is not a place you stand on. It is a thing you hold, together, in the open air,
    against the long

    fall that takes everything that lets go. Mind the capstan. Hold the line. And
    when your grip fails,

    as every grip fails, fall slowly, and let someone else take the chain." Of the
    four peoples'' answers

    to the same broken world, it is the only one that does not point at a corpse to
    prove itself. The

    Skyborn simply kept holding on. So far, it has been enough.'
falling_hold_manifest:
  name: the hold's last manifest
  keywords:
  - manifest
  - hold
  - falling
  - log
  location: nowhere
  slot: ''
  mods: {}
  lore: 'An anchor-keeper''s manifest from the Falling Hold, its readings logged in
    a proud steady hand down

    the generations, and every reading a lie the keepers did not know they told. "Altitude
    holding.

    Chain sound. Moored fast, equal to Highgate." Year on year, the same: holding,
    sound, moored. And

    only if you read every entry in a row, across the lifetimes, do you see it: the
    altitude number

    dropping a hair each generation, so slowly no single keeper could catch it, the
    whole hold falling

    at the speed of a life so that no one living ever felt the fall. The last entry
    is the same as the

    first: "Altitude holding. Chain sound. Moored fast." It was written the year the
    floor was already

    a mile below where the first keeper stood, by a man who died certain he had never
    moved. Some things

    do not fall fast enough to notice. That does not mean they are not falling. Read
    your own manifest

    twice, Forger. Then go up, while a chain still holds.'
