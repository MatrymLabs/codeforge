old_gate_marks:
  name: the marks of the Old Gate
  keywords:
  - marks
  - gate
  - ring
  - glyphs
  location: nowhere
  slot: ''
  mods: {}
  lore: 'The marks graven around the Old Gate''s ring, in the Emberwright hand the
    Concord can no longer fully

    read - but a Forger who has walked far enough begins to make them out: "GATE THE
    SECOND OF THE NINE.

    Set here by the makers before the Unforging, to open where a Gate answers a Gate.
    What lies through

    is not another place but another WHEN - the Gates did not cross the world, they
    crossed the making

    of it, so that a maker could step back to the hour a thing was Forged and mend
    it at the root." Below,

    in a later, cruder hand - a Warden''s, not a maker''s: "We do not open it. We
    do not know how, and we

    are glad we do not. A door to the hour of making is a door to the hour of UNmaking,
    and the last

    people who could open these Gates used them to break the world. We keep the Gate
    shut. That is the

    Concord''s whole purpose, and it is enough: not to make, not to unmake, but to
    KEEP - to hold the old

    doors closed until someone wiser than the makers comes to say which ought to be
    opened. No one has."'
coast_shrine_words:
  name: the words on the shrine-stone
  keywords:
  - words
  - shrine
  - stone
  - coast
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Cut small in the coast shrine-stone, in a plain hand, the First Flame faith
    in the four lines the

    fisherfolk teach their children: "The world was Made. / The world was unmade.
    / The world can be

    Made again. / You woke with a fire in your hand -- so begin." No church wrote
    this, no order approved

    it; a Cinderhearth fisher cut it the year the forge relit, and it has outlasted
    every grander creed

    in the capital because it is the only one a cold, frightened, newly-woken Forger
    actually needs. The

    grand Church of the First Flame in Emberreach City has a hearth-creed a hundred
    lines long. This is

    the same faith, worn down by the sea to the part that floats. Begin, it says.
    That is all. Begin.'
ferry_crossing_chart:
  name: the Wreckways crossing-chart
  keywords:
  - chart
  - wreckways
  - ferry
  - crossing
  location: nowhere
  slot: ''
  mods: {}
  lore: 'The Merewright ferry-house''s master-chart of the open crossing, inked and
    re-inked over generations:

    the lanes west to Tidewharf drawn not between buoys but between the masts of drowned
    ships, ten

    thousand of them marked where the Cooling-Sea rose over the Quenchmere and kept
    it. A margin-note in

    the ferry-master''s hand: "The crossing is where a coast Forger stops being a
    coast Forger. East of

    here the world is Emberreach - warm, relit, watched, forgiving. West of here it
    is the wide Anvil,

    and the wide Anvil does not forgive, it only pays. Every Reach is reached across
    this water. Learn

    it, and the whole world opens. Fear it, and stay on the coast and mend nets, and
    there is no shame

    in that either - the nets fed us longer than the forge has. But if you would see
    the world the

    makers broke, it starts here, at this bell, on this water. Ring it when you mean
    it."'
