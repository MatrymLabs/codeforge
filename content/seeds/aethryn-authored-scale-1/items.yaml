  - ventforge
  - hall
  - metal
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Struck in living metal on the guildmaster''s wall, still warm to the touch:
    "FEAR IS COWARDICE THAT

    LEARNED TO DRESS WELL. The Wardens hold the craft should be feared, the Silent
    Anvil hold it should

    be stopped, the frozen north keeps its dead as proof. We are the Vent-Forges,
    and we hold the

    opposite of all of them: that the only true making is making at the source''s
    edge, where the world

    is still hot enough to change, and that a Forger who will not work in living fire
    is not careful, he

    is finished. The capital calls us reckless. Let them. Reckless is what the cautious
    call the brave

    when the brave are proven right. Work the vent. Do not flinch. And when they tell
    you the world is

    too dangerous to keep making -- and they will, in the north and the halls and
    the cold -- remember

    that everything they are afraid of losing, someone reckless made first, at an
    edge exactly this hot."'
