  name: a well of untaken wild ember
  keywords:
  - well
  - ember
  - cache
  - wild
  location: nowhere
  slot: ''
  mods: {}
  lore: 'A well of wild ember, welling up bright through the ember-thorn, untaken
    since before the town.

    The foresters have a rule older than the Concord: you cut the deadfall, you do
    not gather the

    living ember. What wells up wild belongs to the wood, and the wood keeps its debts.
    The Wight and

    the horror are the wood collecting. Take from the well if you must, Forger --
    but know that the

    Reachwood remembers a hand that takes more than the wild gives, and the Reachwood
    is patient.'
