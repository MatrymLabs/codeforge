  - altar
  - cache
  location: nowhere
  slot: ''
  mods: {}
  lore: 'Left on the altar of the drowned chapel, wrapped in oilcloth against a sea
    that came anyway:

    the Merewrights of Sunhold prayed here to the making itself, and when the Cooling-Sea
    rose over

    the Reach they did not flee - they stayed, and lit the altar-lamp, and asked the
    craft to hold the

    water back one more hour, and one more. It did not. But the lamp is still lit,
    behind the altar,

    on a seam of ember the sea could not drown. They asked the wrong thing of the
    making. The making

    does not hold back the sea. It gives you the hands to build a boat. Take the lamp.
    Build something.'
brine_pearl:
