# SEED: aethryn -- generation_contract.yaml  (the generator's contract, as machine-checkable data)
#
# The source seed's GENERATION_CONTRACT, encoded so the engine can enforce it instead of trusting a
# generator to remember it (kernel/world/generation_contract.py). Every procedurally generated area
# must carry the required fields, draw from a real historical layer, and (across a batch of minor
# areas) fall roughly into the archetype distribution below. The forbidden changes are the hard
# lines no generator may cross. This is the contract the cave forge is measured against.

# Every generated area must carry all of these (empty or missing == a defective area).
required_area_fields:
  - identity              # one sentence: why this place could only exist in Aethryn
  - parent_region         # the canon region it belongs to
  - canon_tier            # its provenance tier (a generated area is C3)
  - historical_layer      # which age of the world it speaks to
  - local_livelihood      # how ordinary people survive nearby
  - active_conflict       # a live tension of people, environment, belief, or resources
  - ordinary_experience   # what a normal person feels here
  - hazard                # one distinctive danger
  - traversal_identity    # how it is moved through
  - larger_world_clue     # a thread pointing at a bigger regional or world mystery
  - unresolved_mystery    # one question it leaves open
  - gameplay_hooks        # what a player can do here
  - creator_extension_hooks  # how a developer could extend it
  - state_changes         # one revisitable change player action can make
  - generation_seed       # the seed that produced it (reproducibility)
  - provenance            # source, seed, parent, tier (the audit trail)

# The historical layers an area may speak to (the world's arc, from the world bible).
historical_layers:
  - pre-utopian
  - age of plenty
  - the imitation
  - the starfall
  - collapse era
  - successor era
  - recent event

# Across generated MINOR areas, the archetype mix should roughly hold (a recommendation, checked with
# a tolerance, not a hard per-area rule): not every cave is an old-world laboratory.
minor_area_archetypes:
  - {id: natural,     share: 0.35, note: natural or ecological spaces}
  - {id: present_use, share: 0.20, note: mines, cellars, smuggler routes, local shelters, current use}
  - {id: old_world,   share: 0.20, note: old-world service tunnels or buried infrastructure}
  - {id: scar,        share: 0.15, note: impact fractures or Scarcraft spaces}
  - {id: faction,     share: 0.10, note: cult, faction, or quest-specific sites}

# The shape a substantial dungeon should move through, in order.
dungeon_grammar:
  - threshold      # why entry matters
  - orientation    # establish local rules and navigation
  - escalation     # increase danger or complexity
  - revelation     # expose a truth, contradiction, or historical layer
  - choice         # force a meaningful tradeoff
  - aftermath      # change the world, faction relations, access, or knowledge

# The hard lines: no generator may do any of these (they would break C0/C1 canon).
forbidden_changes:
  - Rename Aethryn
  - Make the divine strike accidental
  - Make Netharion a natural-born god
  - Erase or replace map regions
  - Relocate the Seven Crowns without author approval
  - Resolve open mysteries as objective truth without author approval
