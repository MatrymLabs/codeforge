    display_name: a riverstone buckler
    keywords: [buckler, shield, riverstone, guard]
    family_id: buckler
    category: shield
    short_description: A compact wood-and-riverstone shield for carts, gates, and narrow lanes.
    ground_description: A round buckler shows a riverstone boss and a fresh leather hand strap.
    examine_description: The buckler's alder core is faced with a thin riverstone disk and bound in boar hide. It turns a glancing blow without making a gate worker carry a wall, though it occupies the arm that might otherwise hold a tool.
    equipped_description: The riverstone boss sits forward as a small, dependable line of cover.
    damaged_description: The leather rim is scuffed and one stone-facing rivet has loosened.
    broken_description: The core has split around the boss; it is no longer safe to trust in a charge.
    use_feedback: You bring the riverstone buckler up and close the gap.
    repair_feedback: The rim is re-laced and the boss riveted back into the alder core.
    crafting_feedback: The smith seats riverstone into an alder disk and binds the rim.
    salvage_feedback: The stone boss and iron fittings survive the broken core.
    materials: [alder_haft, riverstone, boar_hide, veridian_iron_fitting]
    construction_method: carved, faced, riveted, and bound
    maker_tradition: Greenhold road wardens
    source_regions: [veridia]
    ownership_default: militia_issue
    weight: 1.9
    stackable: false
    value: 30
    rarity: common
    level_band: [1, 8]
    durability_profile: field_gear
