    display_name: a wrought Veridian iron bar
    keywords: [bar, iron, wrought, material]
    family_id: component
    category: ingredient
    short_description: A narrow bar of locally smelted iron, ready for a smith's bench.
    ground_description: A warm-grey iron bar lies beside the work surface, its scale hammered flat.
    examine_description: The bar is not elegant, but its grain is even and its edges are squared for measuring. Greenhold smiths value this consistency because farm repairs must be repeatable.
    primary_use: forging fittings, spearheads, and sword blanks
    materials: [veridian_iron_ore]
    construction_method: smelted and hammered
    maker_tradition: Greenhold market smithing
    source_regions: [veridia]
    ownership_default: communal_use
    weight: 1.0
    stackable: true
    stack_limit: 20
    value: 7
    rarity: common
    merchant_eligible: true
    recipe_ids: [forge_veridian_fitting, forge_greenhold_field_spear, forge_greenhold_arming_sword]
  alder_haft:
    display_name: a seasoned alder haft
    keywords: [haft, alder, handle, wood, material]
    family_id: component
    category: ingredient
    short_description: A straight alder handle seasoned above a Greenhold cookfire.
    ground_description: A pale alder haft leans against the bench, shaved smooth where a hand will grip it.
    examine_description: The wood is light, springy, and sealed at the grain. Its maker left enough flex for a field tool without making it soft at the socket.
    primary_use: fitting tools, spears, and bucklers
    materials: [alder_wood]
    construction_method: coppiced, seasoned, and shaved
    maker_tradition: Greenhold fieldcraft
    source_regions: [veridia]
    ownership_default: communal_use
    weight: 0.5
    stackable: true
    stack_limit: 10
    value: 4
    rarity: common
    merchant_eligible: true
    recipe_ids: [shape_alder_haft]
  veridian_iron_fitting:
    display_name: a Veridian iron fitting
    keywords: [fitting, bracket, iron, component]
    family_id: component
    category: ingredient
    short_description: A drilled iron fitting used to bind local wood and metal into working goods.
    ground_description: A small iron bracket sits in a tray of filings, its holes aligned for a repairer's rivets.
    examine_description: "The fitting is deliberately plain: two drilled holes, one squared shoulder, and a face filed smooth enough not to split a leather strap. It is the sort of part a settlement keeps making because carts keep breaking."
    primary_use: assembling tools and bucklers
    materials: [veridian_iron_ore, alder_wood]
    construction_method: forged and drilled
    maker_tradition: Greenhold repair benches
    source_regions: [veridia]
    ownership_default: communal_use
    weight: 0.3
    stackable: true
    stack_limit: 20
    value: 10
    rarity: common
    merchant_eligible: true
    recipe_ids: [assemble_riverstone_buckler]
  greenhold_field_spear:
    display_name: a Greenhold field spear
    keywords: [spear, field, militia, greenhold, weapon]
    family_id: field_spear
    category: weapon
    short_description: A two-handed spear issued to field guards and road wardens.
    ground_description: A long alder shaft carries a leaf-shaped iron head, kept ready beside the gate rather than scattered as loot.
    examine_description: The spearhead is narrow enough for a boar charge and broad enough to discourage a rush through a cartway. The shaft is alder, the socket is iron, and a blue-green cord identifies Greenhold road service. Its reach buys space at the cost of a slower recovery.
    equipped_description: The long alder shaft extends the wielder's line while the Greenhold cord marks a tool of organized road work.
    damaged_description: The iron head is still true, but the alder shaft has begun to splinter near the socket.
    broken_description: The split haft can no longer hold a thrust; the head is salvageable but the spear is unsafe.
    use_feedback: You set the Greenhold spear and hold the cartway at reach.
    repair_feedback: A new haft and two rivets return the spear to service.
    crafting_feedback: The smith seats the iron head into a seasoned alder haft.
    salvage_feedback: The head can be recovered as iron; the split haft returns as kindling.
    materials: [wrought_veridian_iron, alder_haft, boar_hide]
    construction_method: forged, hafted, and leather-bound
    maker_tradition: Greenhold road wardens
    source_regions: [veridia]
    ownership_default: military_issue
    weight: 3.0
    stackable: false
    value: 38
    rarity: common
    level_band: [1, 8]
    quality_profile: standard
    durability_profile: field_gear
    repair_profile: field_spear_repair
    salvage_profile: field_spear_salvage
    merchant_eligible: true
    loot_eligible: true
    equipment_slot: weapon
    weapon:
      handedness: two
      damage_type: thrust
      reach: 2
      cadence: 2
      accuracy: 1
      base_damage_budget: 7
      operating_cost: 0
      special_properties: []
  greenhold_arming_sword:
    display_name: a Greenhold arming sword
    keywords: [sword, arming, militia, greenhold, weapon]
    family_id: arming_sword
    category: weapon
    short_description: A balanced one-handed sword made for militia patrols and caravan escorts.
    ground_description: A service sword rests in a plain leather scabbard, its brass-free iron fittings chosen for easy replacement.
    examine_description: The blade is a practical length for a gate or wagon lane. Its iron core is locally worked, its grip is alder wrapped in boar leather, and its modest balance favors a quick second cut over a single heavy blow.
    equipped_description: The Greenhold sword sits close to the body, ready for a second cut in a crowded lane.
    damaged_description: The edge has rolled in two places and the leather grip is loosening.
    broken_description: The blade is too warped for safe work, though its iron can still return to the smith.
    use_feedback: You draw the Greenhold sword for close work.
    repair_feedback: The smith straightens the edge and rebinds the grip.
    crafting_feedback: The blade is ground, balanced, and fitted to an alder grip.
    salvage_feedback: The blade yields iron; the grip yields a small leather strap.
    materials: [wrought_veridian_iron, alder_haft, boar_hide]
    construction_method: forged, ground, and grip-bound
    maker_tradition: Greenhold market smithing
    source_regions: [veridia]
    ownership_default: merchant_stock
    weight: 1.8
    stackable: false
    value: 42
    rarity: common
    level_band: [1, 8]
    durability_profile: field_gear
    repair_profile: sword_repair
    salvage_profile: sword_salvage
    merchant_eligible: true
    loot_eligible: true
    equipment_slot: weapon
    weapon:
      handedness: one
      damage_type: slash
      reach: 1
      cadence: 1
      accuracy: 2
      base_damage_budget: 7
      operating_cost: 0
      special_properties: []
  greenhold_roadwarden_bow:
    display_name: a Greenhold road-warden bow
    keywords: [bow, roadwarden, patrol, greenhold, weapon]
    family_id: roadwarden_bow
    category: weapon
    short_description: A short patrol bow built from seasoned alder and a replaceable cord.
    ground_description: A compact bow lies in a waxed cloth sleeve, kept dry for the road watch.
    examine_description: The bow is short enough for a hedge path and strong enough for a warning shot. Its alder limbs are backed with cured hide; the design accepts local repairs, but it expects arrows and space rather than close combat.
    equipped_description: The road-warden bow stays light in the hand, made for hedges and watch platforms.
    damaged_description: One limb has lost its spring and the bowstring is dry-cracked.
    broken_description: The limb is split; it cannot be drawn until a bowyer replaces the backing.
    use_feedback: You nock an arrow and keep the road at distance.
    repair_feedback: The bowyer replaces the cord and backs the tired limb.
    crafting_feedback: The alder limbs are tillered until both bends agree.
    salvage_feedback: The bow yields a usable cord and a short alder stave.
    materials: [alder_haft, boar_hide]
    construction_method: seasoned, tillered, and hide-backed
    maker_tradition: Greenhold road wardens
    source_regions: [veridia]
    ownership_default: military_issue
    weight: 1.0
    stackable: false
    value: 35
    rarity: common
    level_band: [1, 8]
    durability_profile: field_gear
    repair_profile: bow_repair
    salvage_profile: bow_salvage
