    category: tool
    short_description: A replaceable iron hoe head fitted to a seasoned alder handle.
    ground_description: A field hoe rests blade-down by the furrow, too useful to be mistaken for loose loot.
    examine_description: The hoe's iron head is narrow for working between barley rows and its alder handle is long enough to save a farmer's back. The socket is a standard Greenhold size, so a farm can repair it without waiting for a traveling maker.
    damaged_description: The edge is blunted and the handle has a shallow split.
    broken_description: The head has pulled from the socket; field work must stop until it is fitted again.
    use_feedback: You turn the soil with the field hoe.
    repair_feedback: A new fitting and a trimmed haft return the hoe to the furrow.
    crafting_feedback: The iron head is socketed onto a seasoned alder handle.
    salvage_feedback: The head is retained for reforging and the haft becomes kindling.
    materials: [wrought_veridian_iron, alder_haft]
    construction_method: forged and hafted
    maker_tradition: Greenhold fieldcraft
    source_regions: [veridia]
    ownership_default: household_property
