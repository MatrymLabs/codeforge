    display_name: a ditchwarden's work jacket
    keywords: [jacket, workwear, ditchwarden, armor]
    family_id: light_workwear
    category: armor
    short_description: Waxed field cloth reinforced at the elbows for wet maintenance work.
    ground_description: A waxed jacket hangs from a peg beside the ditch map, its elbows dark from honest use.
    examine_description: The jacket is layered linen with cured boar-leather elbow patches and a strip of alder toggles. It sheds rain and protects against tools, but it is not plate and does not pretend to be.
    equipped_description: The waxed jacket carries the smell of rain, leather, and the ditch bank.
    damaged_description: Water has lifted the wax at one shoulder and the elbow patch is thinning.
    broken_description: The seams have opened enough that it no longer keeps rain or tools out.
    use_feedback: You settle into the jacket's familiar work fit.
    repair_feedback: Fresh wax and a leather patch restore the jacket's weatherproof seams.
    crafting_feedback: The tailor cuts field cloth around a reinforced work pattern.
    salvage_feedback: The leather patches and sound cloth are separated for reuse.
    materials: [boar_hide, alder_wood]
    construction_method: cut, stitched, and waxed
    maker_tradition: Greenhold fieldcraft
    source_regions: [veridia]
