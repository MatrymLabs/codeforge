  veridian_iron_ore:
    display_name: a chunk of Veridian iron ore
    keywords: [ore, iron, veridia, material]
    family_id: ingredient
    category: ingredient
    short_description: A palm-sized ore chunk gathered from the shallow road cuts outside Greenhold.
    ground_description: Dark iron-flecked stone rests among the field grit, marked for sorting rather than display.
    examine_description: The ore carries red-brown iron through a grey matrix. It is heavy for its size and still rough from shallow picking; the Greenhold smiths sort pieces like this before smelting.
    primary_use: smelting into wrought Veridian iron
    materials: [veridian_iron_ore]
    construction_method: gathered
    maker_tradition: Greenhold field prospecting
    source_regions: [veridia]
    ownership_default: unowned
    weight: 1.2
    stackable: true
