    keywords: [spade, tool, ditch, maintenance]
    family_id: farm_tool
    category: tool
    short_description: A narrow iron spade made for clearing Greenhold drainage channels.
    ground_description: A ditch spade leans against the channel wall, its narrow blade still wet with field mud.
    examine_description: The spade is narrower than a field shovel so it can work between a ditch wall and its living alder roots. Its iron blade and replaceable haft are standard civic maintenance stock.
    damaged_description: Mud has packed the socket and the blade edge is rolled.
    broken_description: The haft has split below the socket; the channel must wait for a replacement.
