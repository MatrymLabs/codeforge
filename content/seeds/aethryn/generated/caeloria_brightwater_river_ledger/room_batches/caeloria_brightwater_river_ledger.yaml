  brightwater_sluice:
    name: The Old Sluice
    presentation_version: aethryn-room-v1
    desc: 'A flooded chamber older than the mills holds pale channels and seized flow-gates
      that once ruled the river without a hand, while a quiet mechanical pulse waits
      behind the water.


      The Caeloria setting makes its hazard, threshold, and puzzle work purpose visible
      in the riverstone market and licensing hall with ledgers and seals built where
      river market, millrace, flooded lower weirs, and a cold old sluice meets the
      route.'
