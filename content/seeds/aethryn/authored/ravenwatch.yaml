# SEED: aethryn -- authored/ravenwatch.yaml  (Ravenwatch, a timber town of Duskwood Vale, ~L20)
#
# Duskwood's canon identity: a folkloric frontier of memory, burial, and ambiguous supernatural
# danger, where some sites preserve the emotional or mnemonic consequences of the collapse.
# Ravenwatch is a timber town under the black eaves, its wardens keeping an old barrow sealed. The
# conflict is ordinary and sad (grave-robbers want in, the wardens keep it shut); the clue to the
# larger world is the barrow itself (a place that keeps memory); the rumour is left unproven.
# Installed by kernel/world/authored_towns.py; its quest is quests/ravenwatch_barrow.yaml.

rooms:
  ravenwatch_market:
    name: The Raven Market
    desc: >-
      A close timber square under the black eaves of Duskwood, its roofs loud with roosting ravens
      and its stalls trading pelts, charms, and quiet. Folk here speak low and lock their doors early,
      and lately they lock them earlier. Ways lead OUT to the forest road, NORTH to the wardens'
      chapel, WEST to the roost, and EAST under the black eaves.
    exits:
      out: ravenwatch
      north: ravenwatch_chapel
      west: ravenwatch_roost
      east: ravenwatch_eaves
  ravenwatch_roost:
    name: The Roost
    desc: >-
      A hall of trappers and mourners where the ravens are fed and the dead are remembered, its rafters
      thick with black wings. It is warmer than it looks. The market is back EAST.
    exits: {east: ravenwatch_market}
  ravenwatch_chapel:
    name: The Wardens' Chapel
    desc: >-
      A low chapel of grey stone where Duskwood's wardens keep the rites of memory and the keys to the
      old barrow beneath. They do not open it. They keep it. A warden tends the mourning-book here. A
      stair descends DOWN into the barrow; the market is back SOUTH.
    exits: {south: ravenwatch_market, down: ravenwatch_barrow}
  ravenwatch_barrow:
    name: The Old Barrow
    desc: >-
      A cold earthen vault older than the town, its niches holding the long dead and, the wardens say,
      the last thoughts of the dead as well. Lie still too long here and you may remember what is not
      yours to remember. A grave-token has gone missing from its cradle. Stairs climb back UP.
    exits: {up: ravenwatch_chapel}
  ravenwatch_eaves:
    name: The Black Eaves
    desc: >-
      The wood presses close here, the ravens gone silent, the mist thick between black trunks. This
      is where the townsfolk stopped walking after dusk: something grief-shaped moves under the eaves,
      wearing sorrow like a cloak. The lit square is back WEST.
    exits: {west: ravenwatch_market}

hub: {room: ravenwatch, keyword: square, entry: ravenwatch_market}

npcs:
  ravenwatch_warden:
    name: Warden Mabb
    keywords: [mabb, warden]
    location: ravenwatch_chapel
    dialogue:
      - >-
        "You have gentle feet, for a stranger. Good. A grave-token has been worked loose in the old
        barrow below, and if it is lost the mourning-book cannot be closed and the dead go unremembered.
        Go down, take it up gently, and bring it to me. Do not lie down among the niches. Whatever you
        remember down there, it is not yours."
    topics:
      barrows:
        - >-
          "We do not open the barrows. We KEEP them. The dead of Duskwood remember, and a barrow holds
          their last thought like water in a bowl. Spill it and you carry it. That is the whole of our craft."
      memory:
        - >-
          "The Fall left more than ruins here. It left grief, and grief has a memory of its own in these
          woods. Some of what haunts the Vale is only sorrow that has forgotten it is dead."
      rumor:
        - >-
          "They say if you lie down among the niches and are still enough, the barrow will speak you the
          last thought of whoever lay there. They say some who did never remembered their own name after.
          Go down, take the token, and do not lie down."
      mabb:
        - >-
          "Warden of Ravenwatch, keeper of the mourning-book. Someone must remember the dead correctly,
          or the woods will remember them wrong. It is quiet work, and it does not end."
    hp: 0
  ravenwatch_widow:
    name: the Widow Enna
    keywords: [enna, widow, mourner]
    location: ravenwatch_roost
    dialogue:
      - >-
        "You are not from the Vale, or you would not meet my eye so. Sit by the ravens a while.
        Grief is the only crop that never fails in Duskwood, and I have a rich harvest of it."
    topics:
      grief:
        - >-
          "My husband walked into the eaves a year gone and did not come back a man. The thing out
          there now wears his sorrow, or my own, I cannot tell which. Someone brave should end it,
          for his sake and mine."
      wood:
        - >-
          "The Duskwood keeps what it takes. Not the body always, but the grief of it, and grief
          walks. Warden Mabb will tell you it is only sorrow forgetting it is dead. She is not wrong,
          and it is no comfort at all."
      warden:
        - >-
          "Mabb keeps the mourning-book, and she is right to. But a book remembers the dead, and out
          in the eaves something is trying to be remembered, and there is a difference she will not say aloud."
      enna:
        - >-
          "The Widow Enna, they call me, as if a name were a thing you keep after. I keep the roost
          warm and the ravens fed, and I wait, which is the whole trade of Duskwood."
    hp: 0
  ravenwatch_trader:
    name: Pelt-Trader Osric
    keywords: [osric, trader, pelt-trader]
    location: ravenwatch_market
    dialogue:
      - >-
        "Trade before dark, stranger, we close early here. I keep the draughts a body needs to walk
        Duskwood and come back, and I buy fernshade off any forager brave enough to cut it in the
        wood, for the grief-charms the Widow makes. Buy what you need and be indoors by dusk. I mean it."
    topics:
      trade:
        - >-
          "Draughts I sell, healing and mana both, and charms against the dark. Fernshade I buy, cut
          in the Duskwood shade, for the wardens' rites and the Widow's charms. Bring a bundle by daylight."
      dark:
        - >-
          "Something walks the eaves after dusk, wearing sorrow like a cloak, and the town locks early
          for it. I do not go east past the square once the ravens go quiet. Neither should you, laden or not."
      osric:
        - >-
          "Pelt-trader of Ravenwatch, and I keep the town in draughts and charms and small comforts.
          Someone must sell the living what they need to outlast the dead. In Duskwood, that is a trade."
    shop:
      sells: {healing_draught: 22, mana_draught: 22}
      buys: {fernshade: 5}
    hp: 0
  ravenwatch_wight:
    name: a barrow-wight
    keywords: [wight, barrow-wight, barrow]
    location: ravenwatch_barrow
    dialogue:
      - The wight rises from a niche, wearing a face that is trying to remember whose it was.
    aggressive: true
    hp: 130
    atk: 15
    xp: 22
    level: 18
    tier: normal
    attack_element: DRK
  ravenwatch_hollow:
    name: the hollow man of the eaves
    keywords: [hollow, hollow-man, man]
    location: ravenwatch_eaves
    dialogue:
      - The hollow man turns, wearing a grief that is almost a face, and reaches for you as if it knows you.
    aggressive: true
    hp: 150
    atk: 17
    xp: 28
    level: 20
    tier: normal
    attack_element: DRK

items:
  ravenwatch_grave_token:
    name: a mourner's grave-token
    keywords: [grave-token, token, mourner]
    location: ravenwatch_barrow
    lore: >-
      A worn coin of grey lead, its face rubbed smooth by grieving thumbs, warm though the barrow is
      cold. Hold it and you half-remember a life that is not yours: a road, a name half-heard, a grief
      that was someone else's first. The wardens read such tokens to keep the dead remembered rightly.
  ravenwatch_grave_marker:
    name: a leaning grave-marker
    keywords: [grave-marker, marker, grave]
    location: ravenwatch_chapel
    lore: >-
      A grey slate marker leaned against the chapel wall, its cut names worn to shadows but for the
      warden's rubric at the foot: "Here we do not carve the dead their deeds, only that they were
      remembered, and by whom. A name unremembered walks. A name remembered rests. Keep the book."
