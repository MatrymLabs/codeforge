# SEED: aethryn -- authored/wildgrowth.yaml  (Wildgrowth, a forest frontier of Eldryn Forest, ~L50)
#
# Eldryn's canon identity: an ancient forest with a memory deeper than any kingdom, where it is never
# certain whether the growth is wholly natural or old-world ecology still running. Wildgrowth is a
# forest-compact town holding the road against a wild that keeps taking it back. Beneath it a root
# deep is an old ecological-maintenance space whose roots seem to remember every hand that tended
# them. The conflict is ordinary (cut the growth back, or let it grow); the clue to the larger world
# is the root deep; the rumour is left unproven. Five subareas, three voices (a warden, a forage-
# broker, a road-keeper) that cross-reference, two dangers, a fernshade gather node and a broker who
# buys its yield (a working economy), and readable pact lore. Installed by
# kernel/world/authored_towns.py; its quests are quests/wildgrowth_root.yaml (a fetch, Gathering) and
# quests/wildgrowth_thorns.yaml (a hunt of a different shape, Warcraft).

rooms:
  wildgrowth_green:
    name: The Compact Green
    desc: >-
      The gathering-heart of Wildgrowth: a broad green ringed by timber halls, where the forest-folk
      trade forage and forest-lore and argue over the road. Roots have cracked the paving and no one
      hurries to mend it. Ways lead OUT to the forest road, NORTH to the Wardens' Lodge, WEST to the
      foragers' rest, and EAST to the thornwall where the wild presses in.
    exits:
      out: wildgrowth
      north: wildgrowth_lodge
      west: wildgrowth_rest
      east: wildgrowth_thornwall
  wildgrowth_rest:
    name: The Foragers' Rest
    desc: >-
      A long low hall of drying herbs, honey, and the day's forage, warm with woodsmoke and the talk
      of folk who know every leaf in the Eldryn. The green is back EAST.
    exits: {east: wildgrowth_green}
  wildgrowth_lodge:
    name: The Wardens' Lodge
    desc: >-
      The hall of the forest compact, its walls grown from living trunks that the wardens tend rather
      than cut. Here the pact between the town and the old wood is kept. A warden holds the tally of
      the deep. A stair descends DOWN into the roots; the green is back SOUTH.
    exits: {south: wildgrowth_green, down: wildgrowth_rootdeep}
  wildgrowth_rootdeep:
    name: The Root Deep
    desc: >-
      A cavern of vast pale roots older than the forest above, laid in channels too even to be wild.
      Sap moves in them like slow blood, and the air tastes of green and iron. Something tends this
      place still. Stairs climb back UP to the lodge.
    exits: {up: wildgrowth_lodge}
  wildgrowth_thornwall:
    name: The Thornwall
    desc: >-
      The wild edge of Wildgrowth, where the forest throws up a living wall of thorn and briar that
      the road-keepers cut back and the Eldryn grows again by morning. Pale fernshade thrives in the
      thorn-shade, gathered by those brave enough to reach it. Something heavier than deer moves
      beyond the briars. The green is back WEST.
    exits: {west: wildgrowth_green}
    node: fernshade

hub: {room: wildgrowth, keyword: square, entry: wildgrowth_green}

npcs:
  wildgrowth_warden:
    name: Warden Sela
    keywords: [sela, warden]
    location: wildgrowth_lodge
    dialogue:
      - >-
        "You have the sense not to trample what you cannot name, I hope. The deep roots have taken
        the old tally-stone the compact reads to keep our pact with the wood. Go down, free it from
        the roots, and bring it up to me. The forest-folk pay their debts in more than coin."
    topics:
      growth:
        - >-
          "The wood takes the road back a little every season. Some say cut it; the compact says a
          road is a small thing and the Eldryn is old. We hold the pact and we do not win, only keep."
      roots:
        - >-
          "The deep roots are laid too straight to be wild. My grandmother tended them and said they
          remember every hand. I have felt them turn toward me in the dark. Make of that what you will."
      rumor:
        - >-
          "They say the deep roots hold a grudge, and remember every axe the town ever swung. They
          say the Great Tree remembers more. Go down and lay your hand on a root and listen."
      sela:
        - >-
          "Warden of the compact, keeper of the pact between Wildgrowth and the wood. Someone must
          speak for the forest that cannot speak, and be answered by roots that maybe can."
    hp: 0
  wildgrowth_broker:
    name: Broker Fenn
    keywords: [fenn, broker, forager]
    location: wildgrowth_rest
    dialogue:
      - >-
        "Forage-trade, walker? I keep what the deep wood costs a body: draughts for the road, and I
        buy fernshade by the bundle for the healers, if you have the arms to gather it out at the
        thornwall. The Eldryn gives freely to those who ask, and dear to those who take."
    topics:
      trade:
        - >-
          "Draughts I sell; fernshade I buy. Gather it in the thorn-shade at the wall and the healers
          upcountry will bless your name and I will fill your purse. Both are worth having."
      fernshade:
        - >-
          "A pale leaf that only grows where the thorn keeps the light thin. The healers cannot work
          without it, and the thornwall is the one place near town it still grows thick. Mind the wild."
      fenn:
        - >-
          "Broker of the Foragers' Rest. I turn what the wood gives into what the town needs, and take
          my cut in the middle. An honest trade, and a warm hall to do it in."
    shop:
      sells: {healing_draught: 34, mana_draught: 34, water_ration: 4}
      buys: {fernshade: 7}
    hp: 0
  wildgrowth_keeper:
    name: Road-Keeper Oren
    keywords: [oren, road-keeper, keeper]
    location: wildgrowth_green
    dialogue:
      - >-
        "You look like you can swing at more than briars. Good. Something has been denning past the
        thornwall, EAST of the green, big enough to take a road-crew, and my folk will not go out to
        cut while it lairs there. Put it down and Wildgrowth keeps its road another season."
    topics:
      beast:
        - >-
          "A thorn-tangled thing, half-briar and all teeth, grown bold on the crews it has scattered.
          It lairs past the wall, EAST. End it and the road-keepers will owe you the road itself."
      road:
        - >-
          "We cut the wild back and the wild grows it in. That is the whole of the job, and the whole
          of the war. Sela says hold the pact; I say hold the road. We are both right, and both losing."
      oren:
        - >-
          "Road-keeper of Wildgrowth, and my back tells the years of it. Someone must keep the way
          open, or the Eldryn closes over this town like water over a dropped stone."
    hp: 0
  wildgrowth_rootbeast:
    name: a bristling spore-hound
    keywords: [spore-hound, hound, beast]
    location: wildgrowth_rootdeep
    dialogue:
      - The spore-hound bristles, a cloud of pale spores rising from its hackles.
    aggressive: true
    hp: 390
    atk: 33
    xp: 55
    level: 48
    tier: normal
    attack_element: PSN
  wildgrowth_thornbeast:
    name: a thorn-tangled maw-stalker
    keywords: [maw-stalker, stalker, thornbeast]
    location: wildgrowth_thornwall
    dialogue:
      - The briars shudder and part, and the maw-stalker unfolds from the thornwall on too many legs.
    aggressive: true
    hp: 430
    atk: 36
    xp: 60
    level: 50
    tier: normal
    attack_element: ERT

items:
  wildgrowth_tally_stone:
    name: the compact's tally-stone
    keywords: [tally-stone, tally, stone]
    location: wildgrowth_rootdeep
    lore: >-
      A smooth stone marked with a growing tally that no hand seems to cut: new notches appear in it
      season by season, as if the wood itself keeps a count of something, and the compact only reads
      what the roots have already decided to record.
  wildgrowth_pact_leaf:
    name: the pressed pact-leaf
    keywords: [pact-leaf, leaf, pact]
    location: wildgrowth_lodge
    lore: >-
      A single broad leaf pressed flat and kept under glass in the lodge, older than any warden yet
      still faintly green. Veins run through it in lines too even to be wild, the same pattern as the
      channels in the root deep below, as though the leaf and the roots were drawn by one hand in a
      season no living warden can name.
