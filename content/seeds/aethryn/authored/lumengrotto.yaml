# SEED: aethryn -- authored/lumengrotto.yaml  (Lumengrotto, an archive-town of The Deepreach, ~L100)
#
# The Deepreach's canon identity: a vast underground realm of the Crystal Labyrinth (the Memory Deep),
# archives and artificial minds, fragmented and partly self-rearranging, holding contradictory
# records. Lumengrotto is a crystal-lit town grown up around a spur of the old archive, its people
# living by the light of records they cannot fully read. Beneath it a memory-vault still keeps
# testimony, though what it keeps and what it invents are not always told apart. The conflict is
# ordinary (whose account of an old crime the town believes); the clue to the larger world is the
# archive; the rumour is left unproven. Five subareas, three voices (an archivist, a terrace-keeper, a
# delve-warden) that cross-reference, two dangers, a glowcap gather node on the fungal terraces and a
# keeper who buys its yield (a working economy), and readable archive lore. Installed by
# kernel/world/authored_towns.py; its quests are quests/lumengrotto_archive.yaml (a fetch, Knowing) and
# quests/lumengrotto_gallery.yaml (a hunt of a different shape, Gathering).

rooms:
  lumengrotto_market:
    name: The Lumen Market
    desc: >-
      The heart of Lumengrotto, lit not by fire but by veins of pale crystal that run through the
      cavern like caught daylight. Deep-folk trade fungus, ore, and copied records under a ceiling
      that glows. Ways lead OUT to the deep road, NORTH to the archive-house, WEST to the fungal
      terraces, and EAST into the dark gallery where the crystal-light fails.
    exits:
      out: lumengrotto
      north: lumengrotto_archive
      west: lumengrotto_terraces
      east: lumengrotto_gallery
  lumengrotto_terraces:
    name: The Fungal Terraces
    desc: >-
      Stepped beds of pale, luminous fungus tended in the crystal-light, the deep's own harvest.
      Glowcap grows thickest here, cut for food and lamp-light both. Farmers work who have never seen
      a sky and do not miss it. The market is back EAST.
    exits: {east: lumengrotto_market}
    node: glowcap
  lumengrotto_archive:
    name: The Archive-House
    desc: >-
      A hall of copyists and readers built against a spur of the old Crystal Labyrinth, where the
      town keeps the records it can reach and argues over the ones it cannot. An archivist keeps the
      key to the deeper vault. A stair descends DOWN into the memory-vault; the market is back SOUTH.
    exits: {south: lumengrotto_market, down: lumengrotto_vault}
  lumengrotto_vault:
    name: The Memory-Vault
    desc: >-
      A deeper chamber of the old archive, its crystal shelves half-melted and rearranging, showing
      faces and voices that stop when you look straight at them. Testimony is kept here, true and
      false in the same light. Something files it still. Stairs climb back UP.
    exits: {up: lumengrotto_archive}
  lumengrotto_gallery:
    name: The Dark Gallery
    desc: >-
      Where the crystal veins run out and the deep goes truly black, a raw gallery the delve-wardens
      hold as the town's edge. The glow of the market dies behind you. Something that hunts by the
      cold and the sound of a heartbeat waits where the light does not reach. The market is back WEST.
    exits: {west: lumengrotto_market}

hub: {room: lumengrotto, keyword: square, entry: lumengrotto_market}

npcs:
  lumengrotto_archivist:
    name: Archivist Vell
    keywords: [vell, archivist]
    location: lumengrotto_archive
    dialogue:
      - >-
        "You came down the deep road on purpose, so you are either brave or paid. Good. There is a
        record-shard loose in the memory-vault below, and it holds testimony the town has quarrelled
        over for a hundred years. Go down, take it from the shelf, and bring it up to me. Then perhaps
        we will finally know what happened, or perhaps only what the vault decided to keep."
    topics:
      archive:
        - >-
          "The vault keeps testimony, but it does not always keep it TRUE. It rearranges. A shelf you
          read yesterday says otherwise today. We copy what we can and we distrust all of it, wisely."
      records:
        - >-
          "The whole town lives by copied records and cannot agree on a single old crime. One shard
          could settle it. Or the vault has been filing a lie so long it has become the only account."
      rumor:
        - >-
          "They say the vault does not only KEEP memory, it MAKES it, and some of what the town
          remembers never happened. They say the deep minds are still down there, sorting. Go and read."
      vell:
        - >-
          "Archivist of Lumengrotto, keeper of a key to a vault I do not trust. Someone must read the
          old records, even knowing the reading changes them. Better a doubter than a believer, down here."
    hp: 0
  lumengrotto_keeper:
    name: Terrace-Keeper Muir
    keywords: [muir, keeper, terrace-keeper]
    location: lumengrotto_terraces
    dialogue:
      - >-
        "Deep-trade, surface-walker? I keep the draughts a delver needs and the light that keeps the
        dark honest. And I buy glowcap by the basket, cut here on the terraces, for the lamps and the
        pot both. Everything Lumengrotto eats and sees by starts on these beds. Mind you do not trample."
    topics:
      trade:
        - >-
          "Draughts I sell, and lamp-oil pressed from the caps. Glowcap I buy, cut right here on the
          terraces. The deep would go dark and hungry without it, so cut a basket and I will pay you well."
      glowcap:
        - >-
          "The pale fungus that lights this town. It feeds us and lamps us, and it only grows in the
          crystal-glow. Past the light, in the dark gallery, nothing grows but the things that eat us."
      muir:
        - >-
          "Terrace-keeper of Lumengrotto, third of my line to tend these beds. Someone must grow the
          light the archivists read by. They keep the memory; I keep the lamp lit. Both are the town."
    shop:
      sells: {grand_healing_draught: 88, greater_mana_draught: 58, water_ration: 6}
      buys: {glowcap: 9}
    hp: 0
  lumengrotto_warden:
    name: Delve-Warden Sorrel
    keywords: [sorrel, warden, delve-warden]
    location: lumengrotto_market
    dialogue:
      - >-
        "You have the eyes of someone who has fought in the dark. Good. A gallery-stalker has come up
        out of the black EAST of the market, and it has taken two of my delvers where the crystal-light
        fails. Go and end it before it comes into the glow, and the delve-wardens will call you kin of
        the deep."
    topics:
      stalker:
        - >-
          "A blind thing that hunts by the cold and the drum of a heart. It dens in the dark gallery,
          EAST, where our light gives out. Go and put it down before it learns the way to the terraces."
      dark:
        - >-
          "The town lives in the crystal-glow, but the deep is mostly dark, and the dark is mostly
          teeth. We hold the gallery as the town's edge. Some nights the edge moves, and never our way."
      sorrel:
        - >-
          "Delve-warden of Lumengrotto. I keep the dark out of the light. It is a losing hold on a good
          night and a funeral on a bad one, but someone must stand where the crystal ends. So I stand."
    hp: 0
  lumengrotto_wraith:
    name: a flickering memory-wraith
    keywords: [wraith, memory-wraith, memory]
    location: lumengrotto_vault
    dialogue:
      - The wraith wears a face that keeps changing, and none of them are glad to see you.
    aggressive: true
    hp: 660
    atk: 50
    xp: 90
    level: 100
    tier: normal
    attack_element: DRK
  lumengrotto_stalker:
    name: a blind gallery-stalker
    keywords: [gallery-stalker, stalker, blind]
    location: lumengrotto_gallery
    dialogue:
      - Something vast and eyeless turns toward the sound of you, and the dark gallery goes silent.
    aggressive: true
    hp: 700
    atk: 53
    xp: 94
    level: 103
    tier: normal
    attack_element: ERT

items:
  lumengrotto_record_shard:
    name: a contested record-shard
    keywords: [record-shard, shard, record]
    location: lumengrotto_vault
    lore: >-
      A splinter of archive-crystal that holds a single testimony, replaying a moment that stops
      whenever you look straight at it. Whether it preserves what happened or only what the vault has
      long since decided to keep, no one in Lumengrotto can any longer say, and that is the whole quarrel.
  lumengrotto_lamp_census:
    name: the terrace lamp-census
    keywords: [lamp-census, census, lamp]
    location: lumengrotto_terraces
    lore: >-
      A tally-board the terrace-keepers hang among the beds, counting every lamp the town burns against
      every basket of glowcap the terraces yield. Its oldest columns record a harvest twice what the
      beds now give, in a hand generations gone, as though the deep once fed far more people by this
      light than Lumengrotto could now name, and no keeper has ever dared guess where they went.
