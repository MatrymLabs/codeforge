# SEED: aethryn -- rooms.yaml  (GENERATED from the world map by tools/emit_map_world.py)
# The canonical map of Aethryn: 14 zones, their settlements, dungeons, and landmarks,
# connected by the map's roads and sea-routes. The FIRST room is the spawn (Veridia).

veridia:
  name: Veridia
  desc: |-
    The Veridia zone (levels 1-30): green starter valleys of rivers and open road, where every journey begins. Within its bounds lie Greenhold, Elderwatch, Riverbend, Sunmeadow. Roads and routes run on to the neighbouring lands.
  exits:
    east: caeloria
    south: duskwood_vale
    north: frostspire_peaks
    greenhold: greenhold
    elderwatch: elderwatch
    riverbend: riverbend
    sunmeadow: sunmeadow

greenhold:
  name: Greenhold
  desc: |-
    A walled market-town of green fields, the first stop of every new traveller. It lies within Veridia (levels 1-30); the zone road runs back out to the wider land.
  exits:
    out: veridia

elderwatch:
  name: Elderwatch
  desc: |-
    An old watch-town on the veridia road, its tower long unmanned. It lies within Veridia (levels 1-30); the zone road runs back out to the wider land.
  exits:
    out: veridia

riverbend:
  name: Riverbend
  desc: |-
    A fishing town where the river folds back on itself under willow. It lies within Veridia (levels 1-30); the zone road runs back out to the wider land.
  exits:
    out: veridia

sunmeadow:
  name: Sunmeadow
  desc: |-
    A hamlet of hayfields and beehives on the sunniest downs in veridia. It lies within Veridia (levels 1-30); the zone road runs back out to the wider land.
  exits:
    out: veridia

duskwood_vale:
  name: Duskwood Vale
  desc: |-
    The Duskwood Vale zone (levels 20-50): a shadowed forest-vale of old growth and older secrets. Within its bounds lie Ravenwatch, Moonshade, Twilight Grove, The Black Hollow. Roads and routes run on to the neighbouring lands.
  exits:
    north: veridia
    east: eldryn_forest
    south: zhaar_desert
    ravenwatch: ravenwatch
    moonshade: moonshade
    twilight: twilight_grove
    the: the_black_hollow

ravenwatch:
  name: Ravenwatch
  desc: |-
    A timber town under the eaves, its roofs black with roosting ravens. It lies within Duskwood Vale (levels 20-50); the zone road runs back out to the wider land.
  exits:
    out: duskwood_vale

moonshade:
  name: Moonshade
  desc: |-
    A moonlit glade-town where the duskwood folk trade by lantern. It lies within Duskwood Vale (levels 20-50); the zone road runs back out to the wider land.
  exits:
    out: duskwood_vale

twilight_grove:
  name: Twilight Grove
  desc: |-
    A hidden grove-village where the dusk never quite lifts. It lies within Duskwood Vale (levels 20-50); the zone road runs back out to the wider land.
  exits:
    out: duskwood_vale

the_black_hollow:
  name: The Black Hollow
  desc: |-
    A lightless hollow beneath a split oak, mouth of a dungeon of the deep wood. It lies within Duskwood Vale (levels 20-50); the zone road runs back out to the wider land.
  exits:
    out: duskwood_vale

caeloria:
  name: Caeloria
  desc: |-
    The Caeloria zone (levels 30-60): the heartland kingdom of golden plains and the high road. Within its bounds lie Caeloria City, Brightwater, Silverwatch, Westgate, Starfall Temple. Roads and routes run on to the neighbouring lands.
  exits:
    west: veridia
    south: eldryn_forest
    northeast: frostspire_peaks
    east: ashen_wastes
    caeloria: caeloria_city
    brightwater: brightwater
    silverwatch: silverwatch
    westgate: westgate
    starfall: starfall_temple

caeloria_city:
  name: Caeloria City
  desc: |-
    The capital of the heartland, its gold-crowned towers ruling the central plains. It lies within Caeloria (levels 30-60); the zone road runs back out to the wider land.
  exits:
    out: caeloria

brightwater:
  name: Brightwater
  desc: |-
    A river-city of mills and bright weirs east of the capital. It lies within Caeloria (levels 30-60); the zone road runs back out to the wider land.
  exits:
    out: caeloria

silverwatch:
  name: Silverwatch
  desc: |-
    A silver-mining town on the plains' southern edge. It lies within Caeloria (levels 30-60); the zone road runs back out to the wider land.
  exits:
    out: caeloria

westgate:
  name: Westgate
  desc: |-
    The western gate-town where veridia's road meets the heartland. It lies within Caeloria (levels 30-60); the zone road runs back out to the wider land.
  exits:
    out: caeloria

starfall_temple:
  name: Starfall Temple
  desc: |-
    A fallen-star temple on the plains, its crater a dungeon of light and dust. It lies within Caeloria (levels 30-60); the zone road runs back out to the wider land.
  exits:
    out: caeloria

eldryn_forest:
  name: Eldryn Forest
  desc: |-
    The Eldryn Forest zone (levels 50-80): an ancient forest kingdom grown around a tree older than any crown. Within its bounds lie Eldryn City, Wildgrowth, Greenmist, The Great Tree. Roads and routes run on to the neighbouring lands.
  exits:
    north: caeloria
    west: zhaar_desert
    east: ashen_wastes
    south: korvash_highlands
    eldryn: eldryn_city
    wildgrowth: wildgrowth
    greenmist: greenmist
    the: the_great_tree

eldryn_city:
  name: Eldryn City
  desc: |-
    The forest capital, its halls grown into living trunks the size of towers. It lies within Eldryn Forest (levels 50-80); the zone road runs back out to the wider land.
  exits:
    out: eldryn_forest

wildgrowth:
  name: Wildgrowth
  desc: |-
    A frontier town where the forest is always trying to take the road back. It lies within Eldryn Forest (levels 50-80); the zone road runs back out to the wider land.
  exits:
    out: eldryn_forest

greenmist:
  name: Greenmist
  desc: |-
    A town of the eastern eaves, wrapped in a green mist that never burns off. It lies within Eldryn Forest (levels 50-80); the zone road runs back out to the wider land.
  exits:
    out: eldryn_forest

the_great_tree:
  name: The Great Tree
  desc: |-
    The heart of eldryn forest, a tree said to be older than the oldest kingdom. It lies within Eldryn Forest (levels 50-80); the zone road runs back out to the wider land.
  exits:
    out: eldryn_forest

frostspire_peaks:
  name: Frostspire Peaks
  desc: |-
    The Frostspire Peaks zone (levels 60-90): the frozen north of glacier-crowned peaks and howling passes. Within its bounds lie Frosthold, Winter's Grasp, Ironwall Pass, Glacial Bastion. Roads and routes run on to the neighbouring lands.
  exits:
    south: veridia
    southwest: caeloria
    east: thalorin
    frosthold: frosthold
    winters: winters_grasp
    ironwall: ironwall_pass
    glacial: glacial_bastion

frosthold:
  name: Frosthold
  desc: |-
    A fortress-city carved into the ice at the roof of the world. It lies within Frostspire Peaks (levels 60-90); the zone road runs back out to the wider land.
  exits:
    out: frostspire_peaks

winters_grasp:
  name: Winter's Grasp
  desc: |-
    A high town on the glacier's edge, where the cold has a grip and a will. It lies within Frostspire Peaks (levels 60-90); the zone road runs back out to the wider land.
  exits:
    out: frostspire_peaks

ironwall_pass:
  name: Ironwall Pass
  desc: |-
    The gate-town of the great pass, the only road through the peaks. It lies within Frostspire Peaks (levels 60-90); the zone road runs back out to the wider land.
  exits:
    out: frostspire_peaks

glacial_bastion:
  name: Glacial Bastion
  desc: |-
    An ice-locked bastion on the northern crags, a dungeon of the frozen dead. It lies within Frostspire Peaks (levels 60-90); the zone road runs back out to the wider land.
  exits:
    out: frostspire_peaks

zhaar_desert:
  name: Zhaar Desert
  desc: |-
    The Zhaar Desert zone (levels 80-130): a vast scorched desert of dunes, ruins, and buried fire. Within its bounds lie Sunscar City, Red Dune, Sandspire Ruins, The Obsidian Pit, Scorchstone Keep. Roads and routes run on to the neighbouring lands.
  exits:
    north: duskwood_vale
    east: eldryn_forest
    southeast: korvash_highlands
    sunscar: sunscar_city
    red: red_dunes
    sandspire: sandspire_ruins
    the: the_obsidian_pit
    scorchstone: scorchstone_keep

sunscar_city:
  name: Sunscar City
  desc: |-
    The desert capital, a sandstone city ringing the only sweet well for a hundred miles. It lies within Zhaar Desert (levels 80-130); the zone road runs back out to the wider land.
  exits:
    out: zhaar_desert

red_dunes:
  name: Red Dune
  desc: |-
    A caravan-outpost among the great red dunes of the deep desert. It lies within Zhaar Desert (levels 80-130); the zone road runs back out to the wider land.
  exits:
    out: zhaar_desert

sandspire_ruins:
  name: Sandspire Ruins
  desc: |-
    The half-buried spires of a civilisation the desert swallowed. It lies within Zhaar Desert (levels 80-130); the zone road runs back out to the wider land.
  exits:
    out: zhaar_desert

the_obsidian_pit:
  name: The Obsidian Pit
  desc: |-
    A black glass pit where the desert cracks open onto the fire below. It lies within Zhaar Desert (levels 80-130); the zone road runs back out to the wider land.
  exits:
    out: zhaar_desert

scorchstone_keep:
  name: Scorchstone Keep
  desc: |-
    A heat-blasted keep on a scorchstone mesa, held by things that do not burn. It lies within Zhaar Desert (levels 80-130); the zone road runs back out to the wider land.
  exits:
    out: zhaar_desert

xilnath_jungle:
  name: Xil'nath Jungle
  desc: |-
    The Xil'nath Jungle zone (levels 90-150): a vast living jungle that shifts its own canopy and swallows the unwary. Within its bounds lie Zul'karak, Mistvale, Shifting Canopy, Heart of Xil'nath. Roads and routes run on to the neighbouring lands.
  exits:
    west: ashen_wastes
    north: shattered_isles
    east: skyward_spires
    zulkarak: zulkarak
    mistvale: mistvale
    shifting: shifting_canopy
    heart: heart_of_xilnath

zulkarak:
  name: Zul'karak
  desc: |-
    A ziggurat-city of a jungle people, half-reclaimed by the green. It lies within Xil'nath Jungle (levels 90-150); the zone road runs back out to the wider land.
  exits:
    out: xilnath_jungle

mistvale:
  name: Mistvale
  desc: |-
    A stilt-town in a jungle vale that is never out of the mist. It lies within Xil'nath Jungle (levels 90-150); the zone road runs back out to the wider land.
  exits:
    out: xilnath_jungle

shifting_canopy:
  name: Shifting Canopy
  desc: |-
    A stretch of jungle whose canopy is never the same path twice. It lies within Xil'nath Jungle (levels 90-150); the zone road runs back out to the wider land.
  exits:
    out: xilnath_jungle

heart_of_xilnath:
  name: Heart of Xil'nath
  desc: |-
    The beating green heart of the jungle, a dungeon that is one living thing. It lies within Xil'nath Jungle (levels 90-150); the zone road runs back out to the wider land.
  exits:
    out: xilnath_jungle

thalorin:
  name: Thalorin
  desc: |-
    The Thalorin zone (levels 100-140): a harsh mountain realm of iron keeps and deep mines. Within its bounds lie Stonefang Keep, Boulderfall, Khazgor Peaks, Dreadmaw Hold, Irondeep Mines. Roads and routes run on to the neighbouring lands.
  exits:
    west: frostspire_peaks
    south: ashen_wastes
    east: shattered_isles
    stonefang: stonefang_keep
    boulderfall: boulderfall
    khazgor: khazgor_peaks
    dreadmaw: dreadmaw_hold
    irondeep: irondeep_mines

stonefang_keep:
  name: Stonefang Keep
  desc: |-
    A fanged mountain keep guarding the thalorin heights. It lies within Thalorin (levels 100-140); the zone road runs back out to the wider land.
  exits:
    out: thalorin

boulderfall:
  name: Boulderfall
  desc: |-
    A town built in the rubble of an ancient rockslide, and used to it. It lies within Thalorin (levels 100-140); the zone road runs back out to the wider land.
  exits:
    out: thalorin

khazgor_peaks:
  name: Khazgor Peaks
  desc: |-
    The iron-grey peaks that give thalorin its spine. It lies within Thalorin (levels 100-140); the zone road runs back out to the wider land.
  exits:
    out: thalorin

dreadmaw_hold:
  name: Dreadmaw Hold
  desc: |-
    A hold in the northern crags named for what waits in its lowest hall. It lies within Thalorin (levels 100-140); the zone road runs back out to the wider land.
  exits:
    out: thalorin

irondeep_mines:
  name: Irondeep Mines
  desc: |-
    The deepest iron mines in the world, dug too far and abandoned in a hurry. It lies within Thalorin (levels 100-140); the zone road runs back out to the wider land.
  exits:
    out: thalorin

ashen_wastes:
  name: Ashen Wastes
  desc: |-
    The Ashen Wastes zone (levels 120-170): a scorched volcanic waste of lava-fields and standing fire. Within its bounds lie Moltenhold, Cinderfire, Ashen Monoliths, The Flamewrought Forge, The Scorched Gate. Roads and routes run on to the neighbouring lands.
  exits:
    west: eldryn_forest
    north: thalorin
    east: xilnath_jungle
    south: korvash_highlands
    moltenhold: moltenhold
    cinderfire: cragfire
    ashen: ashen_monoliths
    the: the_flamewrought_forge
    the_scorched_gate: the_scorched_gate

moltenhold:
  name: Moltenhold
  desc: |-
    The molten capital, an obsidian city over a lake of living fire. It lies within Ashen Wastes (levels 120-170); the zone road runs back out to the wider land.
  exits:
    out: ashen_wastes

cragfire:
  name: Cinderfire
  desc: |-
    A town raised on cooling cinder, its forges never cold and never safe. It lies within Ashen Wastes (levels 120-170); the zone road runs back out to the wider land.
  exits:
    out: ashen_wastes

ashen_monoliths:
  name: Ashen Monoliths
  desc: |-
    Black monoliths standing in the ash, older than the fire that scoured them. It lies within Ashen Wastes (levels 120-170); the zone road runs back out to the wider land.
  exits:
    out: ashen_wastes

the_flamewrought_forge:
  name: The Flamewrought Forge
  desc: |-
    A forge-dungeon wrought in living flame at the heart of the wastes. It lies within Ashen Wastes (levels 120-170); the zone road runs back out to the wider land.
  exits:
    out: ashen_wastes

the_scorched_gate:
  name: The Scorched Gate
  desc: |-
    A gate of black iron over a stair into the burning deep. It lies within Ashen Wastes (levels 120-170); the zone road runs back out to the wider land.
  exits:
    out: ashen_wastes

korvash_highlands:
  name: Korvash Highlands
  desc: |-
    The Korvash Highlands zone (levels 150-200): storm-wracked highlands of crag-forts and a crater that should not be. Within its bounds lie Stonehelm, Highreach, Thunderhold, Shunderhold, Ancient Overlook, Korvash Crater. Roads and routes run on to the neighbouring lands.
  exits:
    north: ashen_wastes
    northwest: zhaar_desert
    down: the_deepreach
    southeast: the_voidscar
    stonehelm: stonehelm
    highreach: highreach
    thunderhold: thunderhold
    shunderhold: shunderhold
    ancient: ancient_overlook
    korvash: korvash_crater

stonehelm:
  name: Stonehelm
  desc: |-
    A helm of grey stone crowning the highest holdable crag in korvash. It lies within Korvash Highlands (levels 150-200); the zone road runs back out to the wider land.
  exits:
    out: korvash_highlands

highreach:
  name: Highreach
  desc: |-
    The highest town a road reaches before the crags give out. It lies within Korvash Highlands (levels 150-200); the zone road runs back out to the wider land.
  exits:
    out: korvash_highlands

thunderhold:
  name: Thunderhold
  desc: |-
    A hold where the storms break first and hardest. It lies within Korvash Highlands (levels 150-200); the zone road runs back out to the wider land.
  exits:
    out: korvash_highlands

shunderhold:
  name: Shunderhold
  desc: |-
    A shattered sister-hold to thunderhold, half its walls down the mountain. It lies within Korvash Highlands (levels 150-200); the zone road runs back out to the wider land.
  exits:
    out: korvash_highlands

ancient_overlook:
  name: Ancient Overlook
  desc: |-
    An overlook of old stone with all the southern world laid out below. It lies within Korvash Highlands (levels 150-200); the zone road runs back out to the wider land.
  exits:
    out: korvash_highlands

korvash_crater:
  name: Korvash Crater
  desc: |-
    A crater the highlands grew around, a dungeon down into the wound. It lies within Korvash Highlands (levels 150-200); the zone road runs back out to the wider land.
  exits:
    out: korvash_highlands

shattered_isles:
  name: The Shattered Isles
  desc: |-
    The The Shattered Isles zone (levels 180-230): a broken archipelago of citadels and a maelstrom that eats the sea. Within its bounds lie Stormreach, Saltwind Harbor, Blackreef Citadel, The Maelstrom Rise. Roads and routes run on to the neighbouring lands.
  exits:
    west: thalorin
    south: xilnath_jungle
    east: skyward_spires
    stormreach: stormreach
    saltwind: saltwind_harbor
    blackreef: blackreef_citadel
    the: the_maelstrom_rise

stormreach:
  name: Stormreach
  desc: |-
    A storm-lashed island city, the last safe harbour of the broken sea. It lies within The Shattered Isles (levels 180-230); the zone road runs back out to the wider land.
  exits:
    out: shattered_isles

saltwind_harbor:
  name: Saltwind Harbor
  desc: |-
    A wind-scoured harbour where every ship for the isles takes on crew. It lies within The Shattered Isles (levels 180-230); the zone road runs back out to the wider land.
  exits:
    out: shattered_isles

blackreef_citadel:
  name: Blackreef Citadel
  desc: |-
    A citadel on a black reef, a dungeon the tide half-drowns each night. It lies within The Shattered Isles (levels 180-230); the zone road runs back out to the wider land.
  exits:
    out: shattered_isles

the_maelstrom_rise:
  name: The Maelstrom Rise
  desc: |-
    A violent maelstrom said to fall away to unknown depths. It lies within The Shattered Isles (levels 180-230); the zone road runs back out to the wider land.
  exits:
    out: shattered_isles

skyward_spires:
  name: Skyward Spires
  desc: |-
    The Skyward Spires zone (levels 200-250): floating spires of arcane stone drifting the high eastern air. Within its bounds lie Aurelian City, Celestial Observatory, The Spire Nexus. Roads and routes run on to the neighbouring lands.
  exits:
    west: shattered_isles
    south: the_voidscar
    aurelian: aurelian_city
    celestial: celestial_observatory
    the: the_spire_nexus

aurelian_city:
  name: Aurelian City
  desc: |-
    A golden city on the greatest floating spire, capital of the sky. It lies within Skyward Spires (levels 200-250); the zone road runs back out to the wider land.
  exits:
    out: skyward_spires

celestial_observatory:
  name: Celestial Observatory
  desc: |-
    An observatory on a lone spire, reading a sky no one else can reach. It lies within Skyward Spires (levels 200-250); the zone road runs back out to the wider land.
  exits:
    out: skyward_spires

the_spire_nexus:
  name: The Spire Nexus
  desc: |-
    A floating convergence of arcane energies, a dungeon of raw sky-power. It lies within Skyward Spires (levels 200-250); the zone road runs back out to the wider land.
  exits:
    out: skyward_spires

the_deepreach:
  name: The Deepreach
  desc: |-
    The The Deepreach zone (levels 100-250): a vast underground realm of forge-cities and living crystal beneath the world. Within its bounds lie Deepforge City, Lumengrotto, Shadowfissure, The Crystal Labyrinth. Roads and routes run on to the neighbouring lands.
  exits:
    up: korvash_highlands
    east: the_voidscar
    deepforge: deepforge_city
    lumengrotto: lumengrotto
    shadowfissure: shadowfissure
    the: the_crystal_labyrinth

deepforge_city:
  name: Deepforge City
  desc: |-
    The great underground forge-capital, lit by the fire it never lets go out. It lies within The Deepreach (levels 100-250); the zone road runs back out to the wider land.
  exits:
    out: the_deepreach

lumengrotto:
  name: Lumengrotto
  desc: |-
    A grotto-town lit by luminous crystal, deep under the western reach. It lies within The Deepreach (levels 100-250); the zone road runs back out to the wider land.
  exits:
    out: the_deepreach

shadowfissure:
  name: Shadowfissure
  desc: |-
    A town clinging to the walls of a fissure that drops past the light. It lies within The Deepreach (levels 100-250); the zone road runs back out to the wider land.
  exits:
    out: the_deepreach

the_crystal_labyrinth:
  name: The Crystal Labyrinth
  desc: |-
    A labyrinth of living crystal that grows new walls behind you. It lies within The Deepreach (levels 100-250); the zone road runs back out to the wider land.
  exits:
    out: the_deepreach

the_voidscar:
  name: The Voidscar
  desc: |-
    The The Voidscar zone (levels 250-300): a wound in the world where reality unravels and the oldest evil waits. Within its bounds lie Voidspire, Dark Expanse, Netharion's Throne, The Rifted Abyss. Roads and routes run on to the neighbouring lands.
  exits:
    northwest: korvash_highlands
    north: skyward_spires
    west: the_deepreach
    voidspire: voidspire
    dark: dark_expanse
    netharions: netharions_throne
    the: the_rifted_abyss

voidspire:
  name: Voidspire
  desc: |-
    A spire of un-stone at the wound's edge, the last hold before the end. It lies within The Voidscar (levels 250-300); the zone road runs back out to the wider land.
  exits:
    out: the_voidscar

dark_expanse:
  name: Dark Expanse
  desc: |-
    An expanse of dark where the ground gives out into unravelling. It lies within The Voidscar (levels 250-300); the zone road runs back out to the wider land.
  exits:
    out: the_voidscar

netharions_throne:
  name: Netharion's Throne
  desc: |-
    The seat of the oldest evil beneath the surface, the world's last dungeon. It lies within The Voidscar (levels 250-300); the zone road runs back out to the wider land.
  exits:
    out: the_voidscar

the_rifted_abyss:
  name: The Rifted Abyss
  desc: |-
    A rift into the abyss below the world, where reality comes apart. It lies within The Voidscar (levels 250-300); the zone road runs back out to the wider land.
  exits:
    out: the_voidscar

