# SEED: aethryn -- fields.yaml  (AUTHORED: the World Topology Doctrine's trail-to-field zones)
# A zone listed here grows an OPEN, WORLD-SHAPED FIELD for its wilderness instead of a linear
# trail-chain (kernel/world/fieldzone.py + kernel/world/worldgen.py): terrain reads the zone's
# BIOME (sand in the desert, cliff-broken ice on the glacier, dense forest over marsh in the
# jungle, boggy moor, broken ash on the volcanic flats, shore + sea-inlets on the coast), rivers
# and elevation shape movement, roads thread the open ground between landmarks (trail + field),
# and the trail's living content (foes, gather nodes, guardians) is scattered across it.
#
# Each row is DESIGN data: a human picks a seed + landmarks that generate a reachable, world-
# shaped field (the loader REFUSES one that is not). biome/attach/level band come from the map
# (they mirror the zone), so every field ALIGNS with its zone. tools/emit_map_world.py skips a
# field-backed zone's trail (FIELD_BACKED), so this file and wildlands.yaml never collide.

# Veridia -- the cradle (the pilot). Open meadowland, a river with a ford + bridge, roads.
veridia:
  name: The Veridia Wilds
  region: Veridia
  biome: temperate-meadow
  attach: veridia
  attach_dir: west
  level_min: 1
  level_max: 30
  width: 28
  height: 22
  seed: 9
  river_source: [14, 20]
  landmarks:
    - {at: [4, 4], name: "The Cradle Cairn", kind: site}
    - {at: [13, 10], name: "Meadowmoot", kind: site}
    - {at: [23, 17], name: "The Old Watchtower", kind: dungeon}

