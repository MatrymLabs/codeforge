# SEED: aethryn -- quests/greenhold_source.yaml  (Greenhold's delve quest: The Heart of the Cradle)
#
# Auto-loaded by kernel/world/quest.py from seeds/aethryn/quests/. The cradle's capstone, a DELVE that
# ties the four settlement stories together: Greenhold's fountain, Riverbend's weir, Elderwatch's beacon,
# and Sunmeadow's sun-channel all point here, to the one machine's heart, reached by the deep old-world
# stair below Greenhold's undercroft. Scholar Ilric on the deep stair sends you down; the quest arms when
# you ENTER the stair-landing and completes when you DEFEAT the elite Warden of the Source at the
# reservoir-heart, three levels down past the tender and the sentinel. A local prompt (go down and prove
# the impossible), a world-level revelation (the four works are one, and this is their well), a real cost
# (an elite fight far above the cradle band), a visible result (XP + the in-heart keystone and the
# vault's charm, and Knowing standing for bringing back the truth), and an open remainder (who built it,
# and for whom, left graven and unanswered on the dome). Rewards the Knowing order (scholars and
# lorekeepers), the discipline that earned the descent. Off-path: not part of the starter path, and its
# foes far outmatch a new hero -- the descent is a "come back stronger" hook under the cradle's first town.
id: greenhold_source
name: The Heart of the Cradle
start: offered
reward_xp: 130
steps:
  - {state: offered, event: enter, to: descending, on_enter: greenhold_deepstair}
  - state: descending
    event: defeat
    to: done
    on_defeat: source_warden
    effect: "award_xp;grant_rep:knowing:40"
terminal: [done]
labels:
  offered: "Scholar Ilric says the cradle's four old works are one machine, and the stair below Greenhold's undercroft is its throat. Go DOWN from the granary undercroft to the deep stair and hear him out."
  descending: "Down past the Gallery of Names and the Channel-Junction lies the Reservoir-Heart, and the elite Warden of the Source that guards it. Reach the heart and put the Warden down (mind the tender and the sentinel on the way, and the sealed alcove NORTH of the junction). These foes far outmatch the cradle: go strong."
  done: "*** The Warden falls, and the stilled engine at the cradle's heart lies open at last. The heart-keystone is yours to take, the master-record is yours to read, and Scholar Ilric will have the truth of what feeds the valley. Greenhold, Riverbend, Elderwatch, Sunmeadow: one well, one promise, kept a thousand years past the keepers who made it. ***"
