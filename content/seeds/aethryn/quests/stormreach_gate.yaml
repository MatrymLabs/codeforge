name: The Drowned Gate
start: offered
reward_xp: 165
steps:
  - {state: offered, event: enter, to: accepted, on_enter: stormreach_league}
  - {state: accepted, event: take, to: recovered, on_take: stormreach_gate_key}
  - state: recovered
    event: enter
    to: done
    on_enter: stormreach_league
    effect: "award_xp;grant_rep:gathering:35"
