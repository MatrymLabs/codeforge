rooms:
  skyward_spires_cloudfall_verge:
    name: Cloudfall Verge
    room_type: Floating Frontier
    desc: 'You stand on a pale stone road suspended above the cloud sea amid low islands
      drifting above endless cloud. Nearby, a brass beacon marks the first safe landing.


      The clouds below briefly part to reveal impossible depth. The place feels carefully
      maintained at the edge of danger. A chain of floating roads climbs toward the
      central spires.'
    exits:
      east: skyward_spires_windcut_approach
      south: skyward_spires_cloudfall_verge
      out: skyward_spires
    occupants: []
    objects:
    - A cloudwarden checks the anchor lines with a hooked staff
    - A white-winged courier hawk watches from the customs arch
    - A coil of silver anchor rope rests beneath a waxed cover
    replace: true
    tags:
    - aethryn
    - skyward_spires
    - imported_text_drop
  skyward_spires_windcut_approach:
    name: Windcut Approach
    room_type: Skyward Verge
    desc: 'A wind-scoured shelf of white rock carries the route through low islands
      drifting above endless cloud. Along it, a row of anchor pylons descends into
      cloud.


      The air carries wet rope and mineral dust. A nearby stone island drifts several
      feet sideways, leaving the area open to every wind. Storm clouds gather far
      to the north.'
    exits:
