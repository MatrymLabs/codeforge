batch:
  id: aethryn_voidscar_csv_0003
  sequence: 3
  status: ready
  size: 15
  final: true
  link_inference: ordered_route
rooms:
  voidscar_0001:
    name: Riven Threshold
    room_type: Voidscar Verge
    desc: 'Here, a strip of gray-black gravel lies within dead scrub beneath a bruised
      sky. A mile marker has been melted into a twisted hook. Nearby, loose stones
      rise a handspan before dropping again.


      The scene remains strained by unseen pressure beneath ashen afternoon light.
      The smell of rain that never reaches the ground follows every movement. Nearby,
      something heavy drags far beyond the ridge. The last intact watchtower stands
      far to the northwest.'
    exits:
      east: voidscar_0002
      south: voidscar_0001
    occupants: []
    objects:
    - Three iron warning stakes have been driven into the gravel
    - A tethered pack lizard refuses to face the rift
    - A strip of red cloth marks ground declared unsafe
    replace: true
    tags:
    - voidscar
    - imported_csv_drop
    notes: The Voidscar / The Voidscar Boundary / levels 250-252
  voidscar_0002:
    name: Silent Crossing
    room_type: Voidscar Verge
    desc: 'The route narrows at a narrow shelf of volcanic rock, within broken hills
      whose shadows point the wrong way. A barricade of fused shields blocks half
      the road. A moment later, the ground shivers as though something enormous turned
      below.


      Under the colorless daylight, distance is difficult to judge. The atmosphere
      feels watchful and exposed. The air tastes of ozone and scorched leather, while
      distant thunder rolls beneath the earth. The Voidscar opens wider to the east.'
    exits:
      east: voidscar_0003
      south: voidscar_0001
      west: voidscar_0001
    occupants: []
    objects:
    - An empty suit of frontier armor kneels beside the wall
    - A pale scavenger bird watches from a broken spear
    - A weather-stained evacuation notice hangs from a stone post
    replace: true
    tags:
    - voidscar
    - imported_csv_drop
    notes: The Voidscar / The Voidscar Boundary / levels 250-252
  voidscar_0003:
    name: Ashen Crossing
    room_type: Voidscar Verge
    desc: 'The route follows the edge of a cracked basalt road, with abandoned earthworks
      facing the rift on either side. An abandoned checkpoint crouches behind a shattered
      wall. At intervals, the horizon bends inward for a heartbeat.


      Nothing here settles into ordinary stillness. Under the cold shine of the rift,
      the surroundings take on a severe clarity. The air carries metallic dust, and
      a cracked bell rings once without being touched. No living vegetation is visible
      ahead.'
    exits:
      east: voidscar_0004
      south: voidscar_0002
      southeast: voidscar_0004
      west: voidscar_0002
    occupants: []
    objects:
    - A bundle of unused bridge rope has hardened like stone
    - A strip of red cloth marks ground declared unsafe
    - A collapsed supply wagon rests beside the road
    replace: true
    tags:
    - voidscar
    - imported_csv_drop
    notes: The Voidscar / The Voidscar Boundary / levels 250-252
  voidscar_0004:
    name: Hollow Crossing
    room_type: Voidscar Verge
    desc: 'A break in shallow trenches filled with black dust reveals a road paved
      with fused stone. A watch platform overlooks the first visible fracture. Without
      warning, a distant silhouette repeats itself several paces apart.


      The place feels like the edge of a held breath beneath a dim radiance without
      a source. A trace of cold ash and iron lingers in the air. Nearby, a warning
      chain knocks against stone. The safer western road has vanished behind the hills.'
    exits:
      east: voidscar_0005
      south: voidscar_0003
      southwest: voidscar_0003
      west: voidscar_0003
    occupants: []
    objects:
    - A scarred frontier warden studies the eastern horizon
    - An empty suit of frontier armor kneels beside the wall
    - Three iron warning stakes have been driven into the gravel
    replace: true
    tags:
    - voidscar
    - imported_csv_drop
    notes: The Voidscar / The Voidscar Boundary / levels 250-252
  voidscar_0005:
    name: Broken Crossing
    room_type: Voidscar Verge
    desc: 'A difficult path continues through low ridges split by violet seams and
      reaches a worn military causeway. Here, a line of warning obelisks leans toward
      the south. Elsewhere, a violet seam opens and seals without sound.


      Under a thin violet glow, every hard edge becomes visible, leaving the place
      abandoned but not empty. The air smells of dry stone and old smoke. Nearby,
      wind whistles through arrow slits. Dark Expanse lies beyond the broken ridges.'
    exits:
      south: voidscar_0006
      west: voidscar_0004
    occupants: []
    objects:
    - A collapsed supply wagon rests beside the road
    - A tethered pack lizard refuses to face the rift
    - A strip of red cloth marks ground declared unsafe
