batch:
  id: aethryn_veridia_massive_0013
  sequence: 13
  status: ready
  size: 105
  final: true
  link_inference: ordered_route
  source: Aethryn_Veridia_Massive_Batch_MaxEffort.txt
  imported_rooms: 104
  anchor_room: greenhold
  anchor_exit: wards
rooms:
  veridia_massive_alder_court:
    name: Alder Court
    room_type: Town Street
    desc: 'You stand on pale riverstone cobbles between timber houses with painted
      shutters, where a carved public fountain sends a thin stream into a circular
      basin.


      The air carries lamp oil, wool, and rain, and a smith''s measured hammering
      drifts between the roofs. The town wall rises above the houses to the west.'
    exits:
      east: veridia_massive_copper_square
      south: veridia_massive_alder_court
      west: veridia_massive_alder_court
      north: veridia_massive_copper_square
      out: greenhold
    occupants:
    - A lampwright's apprentice waits beside a loaded handcart
    objects:
    - A rack of walking staffs stands near the drainage channel
    - Rows of clay jars have been arranged beneath the sheltering eaves
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_copper_square:
    name: Copper Square
    room_type: Market Lane
    desc: 'Dark brick paving runs through a close district of old guildhalls faced
      in gray stone, its course marked by a mosaic of the River Verin that winds across
      the paving.


      Children calling across the lane echoes through the district while roasted roots
      and chimney smoke lingers near the open doorways.'
    exits:
      east: veridia_massive_lantern_walk
      south: veridia_massive_alder_court
      west: veridia_massive_alder_court
      north: veridia_massive_lantern_walk
    occupants:
    - A retired watchman sorts a stack of delivery tags
    objects:
    - A painted notice board stands near the nearest doorway
    - Freshly cut flowers have been arranged beneath a striped awning
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_lantern_walk:
    name: Lantern Walk
    room_type: Civic Square
    desc: 'Wide flagstones of river-worn slate form a quiet civic square lit by hanging
      iron lanterns that sway gently even in still air. Tall alder trees grow in iron
      cages at each corner, their leaves whispering against the stone.


      The air is cooler here and carries the faint scent of beeswax and old parchment.'
    exits:
      north: veridia_massive_riverstone_gate
      east: veridia_massive_riverstone_gate
      south: veridia_massive_copper_square
      west: veridia_massive_copper_square
    occupants:
    - A young clerk carries a ledger under one arm
    - A pair of street musicians tune a fiddle and a small drum
    objects:
    - Stacks of folded pamphlets rest on a public table
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_riverstone_gate:
    name: Riverstone Gate
    room_type: Town Gate
    desc: 'Massive double doors of iron-banded oak stand open within a deep arch of
      pale riverstone. The gatehouse towers rise on either side, their arrow slits
      dark and watchful.


      The smell of wet wool and horse sweat mixes with the cleaner air of the open
      fields.'
    exits:
      north: veridia_massive_woolwright_s_row
      south: veridia_massive_lantern_walk
      east: veridia_massive_woolwright_s_row
      west: veridia_massive_lantern_walk
    occupants: []
    objects:
    - A toll chest sits bolted to the gatehouse wall
    - A weather-stained map of Veridia is pinned beside the postern door
    - Muddy boot prints track in both directions across the threshold
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_woolwright_s_row:
    name: Woolwright's Row
    room_type: Craft Lane
    desc: 'Narrow timber houses lean toward one another over a lane paved with uneven
      river cobbles. Every doorway displays a hanging sign of spun wool or dyed cloth.
      Steam rises from open vats behind the houses.


      The air is thick with the smell of lanolin, woodsmoke, and wet fleece.'
    exits:
      north: veridia_massive_temple_court
      south: veridia_massive_riverstone_gate
      west: veridia_massive_riverstone_gate
      east: veridia_massive_temple_court
    occupants:
    - A woman cards wool on a low stool outside her door
    objects:
    - Bales of raw fleece are stacked under a canvas lean-to
    - A length of bright green cloth has been stretched on a wooden frame to dry
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_temple_court:
    name: Temple Court
    room_type: Sacred Ground
    desc: 'Smooth gray flagstones form a quiet courtyard before the Temple of the
      Verdant. Tall white-barked birches grow in careful rows, their leaves casting
      shifting green light across the stones.


      The air is cooler here and carries the faint scent of crushed mint and old incense.'
    exits:
      east: veridia_massive_guard_barracks_yard
      south: veridia_massive_woolwright_s_row
      west: veridia_massive_woolwright_s_row
      north: veridia_massive_guard_barracks_yard
    occupants:
    - A young acolyte sweeps the courtyard with a birch-twig broom
    objects:
    - Clay bowls of spring water rest on the altar steps
    - A wooden collection box is bolted to the temple wall
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_guard_barracks_yard:
    name: Guard Barracks Yard
    room_type: Military
    desc: 'A square of hard-packed earth lies between the town wall and a long stone
      building with narrow windows. Weapon racks stand under a sloping roof and a
      pair of practice dummies lean against the wall.


      The smell of oil, leather, and damp stone is strong.'
    exits:
      south: veridia_massive_temple_court
      west: veridia_massive_temple_court
      east: veridia_massive_baker_s_alley
      north: veridia_massive_baker_s_alley
    occupants:
    - A young recruit sits on a bench polishing a helmet
    objects:
    - A water barrel and a dipper stand near the door
    - A notice board lists watch rotations in neat handwriting
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_baker_s_alley:
    name: Baker's Alley
    room_type: Side Street
    desc: 'This narrow alley smells strongly of fresh bread and woodsmoke. Low timber
      buildings lean close overhead and the cobbles are scattered with flour dust
      and fallen crumbs.


      Warm light spills from an open bakery door.'
    exits:
      north: veridia_massive_tannery_lane
      south: veridia_massive_guard_barracks_yard
      east: veridia_massive_tannery_lane
      west: veridia_massive_guard_barracks_yard
    occupants:
    - A flour-dusted apprentice carries a tray of cooling loaves
    objects:
    - A small cat sleeps on a windowsill above a stack of empty flour sacks
    - A wooden bench has been placed against the warm bakery wall
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_tannery_lane:
    name: Tannery Lane
    room_type: Craft District
    desc: The air here is sharp with the smell of curing hides and woodsmoke. Low
      stone buildings with wide open doors line a sloping lane that drains toward
      the river. Stretched hides hang on wooden frames.
    exits:
      north: veridia_massive_harbor_watch_steps
      south: veridia_massive_baker_s_alley
      west: veridia_massive_baker_s_alley
      east: veridia_massive_harbor_watch_steps
    occupants:
    - A tanner works a hide over a wooden beam
    objects:
    - Bundles of bark and vats of dark liquid stand under a rough shelter
    - A large wooden drying rack holds several finished pieces of leather
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_harbor_watch_steps:
    name: Harbor Watch Steps
    room_type: River Access
    desc: 'Wide stone steps lead down from the town level toward a small wooden landing
      on the River Verin. Mooring posts stand in the water and a pair of small boats
      are tied alongside.


      The river smells clean and cold. Gulls call overhead.'
    exits:
      up: veridia_massive_tannery_lane
      north: veridia_massive_civic_hall_entrance
      south: veridia_massive_tannery_lane
      east: veridia_massive_civic_hall_entrance
    occupants:
    - A fisherman mends a net on the lowest step
    objects:
    - A coil of rope and a wooden bucket sit near the posts
    - A simple sign warns of the current's strength after heavy rain
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_civic_hall_entrance:
    name: Civic Hall Entrance
    room_type: Civic
    desc: 'Broad stone steps rise to the heavy oak doors of Greenhold''s civic hall.
      Carved river stones form the lintel and two iron lanterns flank the entrance.


      The air smells of old wood and beeswax.'
    exits:
      south: veridia_massive_harbor_watch_steps
      east: veridia_massive_old_well_court
      west: veridia_massive_harbor_watch_steps
      north: veridia_massive_old_well_court
    occupants:
    - A clerk stands just inside the doorway with a ledger
    objects:
    - A pair of stone benches face each other across the steps
    - A bronze plaque records the founding year of the current hall
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_old_well_court:
    name: Old Well Court
    room_type: Residential
    desc: 'A quiet residential court centers on an ancient stone well whose wooden
      cover is worn smooth by generations of hands. Timber houses with flower boxes
      surround the space.


      The air is still and carries the scent of cooking herbs and damp stone.'
    exits:
      north: veridia_massive_smithy_lane
      east: veridia_massive_smithy_lane
      south: veridia_massive_civic_hall_entrance
      west: veridia_massive_civic_hall_entrance
    occupants:
    - A child turns the well handle while an older woman holds a bucket
    objects:
    - Clay pots of herbs grow along the sunny side of the court
    - A wooden bench circles part of the well
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_smithy_lane:
    name: Smithy Lane
    room_type: Craft Street
    desc: 'The ringing of hammer on anvil is constant here. Open-fronted forges line
      both sides of a short, soot-stained street. Sparks fly into the air with every
      strike and the heat is noticeable even from the middle of the lane.


      The air smells of hot metal, coal smoke, and quenched iron.'
    exits:
      north: veridia_massive_herbalist_s_row
      south: veridia_massive_old_well_court
      east: veridia_massive_herbalist_s_row
      west: veridia_massive_old_well_court
    occupants:
    - A burly smith works a glowing billet on a large anvil
    objects:
    - Tongs, hammers, and unfinished tools hang from the forge walls
    - A water trough for quenching stands outside the nearest forge
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_herbalist_s_row:
    name: Herbalist's Row
    room_type: Quiet Street
    desc: 'Narrow timber houses with green-painted shutters line this quieter street.
      Bundles of drying herbs hang from almost every eave and the air is thick with
      the scent of mint, yarrow, and dried lavender.


      A small garden of medicinal plants grows in a fenced plot beside one house.'
    exits:
      north: veridia_massive_candlewright_street
      south: veridia_massive_smithy_lane
      east: veridia_massive_candlewright_street
      west: veridia_massive_smithy_lane
    occupants:
    - An older woman sorts dried leaves on a long wooden table
    objects:
    - Clay jars and small cloth bags are arranged neatly on a shelf under the eaves
    - A wooden sign shaped like a mortar and pestle hangs above the nearest door
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_candlewright_street:
    name: Candlewright Street
    room_type: Craft Street
    desc: 'The smell of beeswax and tallow is strong along this short street of candle
      makers. Windows display rows of finished candles in many sizes and the occasional
      colored taper.


      Warm yellow light spills from several open workshops even in daylight.'
    exits:
      north: veridia_massive_river_view_terrace
      south: veridia_massive_herbalist_s_row
      west: veridia_massive_herbalist_s_row
      east: veridia_massive_river_view_terrace
    occupants:
    - A young apprentice dips wicks into a pot of melted wax
    objects:
    - Racks of cooling candles stand in neat rows under a lean-to
    - A large iron cauldron of wax simmers over a low fire
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_river_view_terrace:
    name: River View Terrace
    room_type: Overlook
    desc: 'A short row of houses stands on a slight rise with clear views down to
      the River Verin. The street is paved with the same pale riverstone as the rest
      of the inner wards and a low stone wall runs along the river side.


      The air is fresher here and carries the scent of the water below.'
    exits:
      north: veridia_massive_market_lane_east
      south: veridia_massive_candlewright_street
      east: veridia_massive_market_lane_east
      down: veridia_massive_market_lane_east
    occupants:
    - A woman sits on the wall sewing while watching the river
    objects:
    - Clay flower pots line several windowsills
    - A narrow set of steps leads down toward the harbor landing
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_market_lane_east:
    name: Market Lane East
    room_type: Market
    desc: 'This continuation of the market district is narrower and more crowded with
      permanent stalls. Cloth awnings create a patchwork of shade and the ground is
      littered with discarded vegetable leaves and straw.


      The mixed smells of produce, cheese, and fresh bread fill the air.'
    exits:
      west: veridia_massive_river_view_terrace
      east: veridia_massive_quiet_court
      north: veridia_massive_quiet_court
      south: veridia_massive_river_view_terrace
    occupants:
    - A cheese seller cuts samples from a large wheel
    - A small boy tries to interest passersby in wooden whistles
    objects:
    - Baskets of early apples and root vegetables sit on low tables
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_quiet_court:
    name: Quiet Court
    room_type: Residential
    desc: 'A small, almost hidden court opens off the main streets. The cobbles are
      cleaner here and a single young tree grows in the center. The surrounding houses
      are modest but well-kept.


      The air is still and quiet. Only distant town sounds reach this place.'
    exits:
      west: veridia_massive_wallside_alley
      south: veridia_massive_market_lane_east
    occupants: []
    objects:
    - A wooden bench sits beneath the tree
    - A pair of laundry lines stretch between upper windows
    - A cat watches from a sunny windowsill
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_wallside_alley:
    name: Wallside Alley
    room_type: Side Alley
    desc: 'This narrow alley runs hard against the inner face of the town wall. The
      stones of the wall are cool and damp and the alley itself is always in shadow.
      Drainage channels run along the base of the wall.


      The air smells of wet stone and moss.'
    exits:
      north: veridia_massive_fountain_square
      south: veridia_massive_quiet_court
      east: veridia_massive_fountain_square
    occupants: []
    objects:
    - A stack of firewood has been piled against the wall
    - A narrow wooden door set into the wall leads to a postern
    - Moss and small ferns grow in the cracks between the wall stones
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_fountain_square:
    name: Fountain Square
    room_type: Civic
    desc: 'A larger public fountain dominates this open square. Water spills from
      the mouths of carved river fish into a wide circular basin. Benches of pale
      stone surround the fountain and the square is popular at most hours.


      The sound of falling water is constant and pleasant. The air is cooler near
      the basin.'
    exits:
      north: veridia_massive_north_market
      south: veridia_massive_wallside_alley
      east: veridia_massive_north_market
      west: veridia_massive_wallside_alley
    occupants:
    - Children sail small wooden boats in the fountain
    - A street vendor sells roasted nuts from a small cart
    objects:
    - Pigeons strut around the basin edge looking for scraps
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_north_market:
    name: North Market
    room_type: Outer Market
    desc: 'Open-air stalls of rough timber and canvas fill a broad packed-earth square
      just inside the northern wall. Merchants call their wares while carts rattle
      in from the river road.


      The mixed smells of fresh bread, smoked fish, and horse dung hang in the air.'
    exits:
      south: veridia_massive_fountain_square
      east: veridia_massive_south_pasture_gate
      west: veridia_massive_fountain_square
      north: veridia_massive_south_pasture_gate
    occupants:
    - A spice merchant arranges clay jars on a low table
    - A boy sells roasted chestnuts from a handcart
    - A pair of dogs sleep beneath an empty stall
    objects: []
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_south_pasture_gate:
    name: South Pasture Gate
    room_type: Town Edge
    desc: 'A simple wooden gate stands open in the low stone wall that marks the southern
      edge of Greenhold. Beyond it the land falls away into rolling green pasture
      dotted with sheep.


      The wind carries the clean smell of grass and damp earth.'
    exits:
      north: veridia_massive_east_wall_path
      south: veridia_massive_north_market
      east: veridia_massive_east_wall_path
      west: veridia_massive_north_market
    occupants:
    - A shepherd leans on the gatepost chewing a stem of grass
    objects:
    - A half-empty water trough stands just inside the wall
    - Fresh hoofprints and sheep droppings mark the track
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_east_wall_path:
    name: East Wall Path
    room_type: Town Wall
    desc: 'A narrow path of packed earth runs along the inside of Greenhold''s eastern
      wall. Arrow slits open at regular intervals and the wall walk can be reached
      by wooden ladders.


      The wind is stronger here and carries the scent of the open fields beyond the
      wall.'
    exits:
      north: veridia_massive_west_wall_path
      south: veridia_massive_south_pasture_gate
      west: veridia_massive_south_pasture_gate
      up: veridia_massive_south_pasture_gate
    occupants: []
    objects:
    - A ladder leans against the wall leading up to the walk
    - A stack of spare spears rests under a small shelter
    - Moss grows thick on the lower stones of the wall
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_west_wall_path:
    name: West Wall Path
    room_type: Town Wall
    desc: 'This stretch of wall path runs along the western side of Greenhold where
      the land drops more sharply toward the river. The stones are darker with age
      and damp.


      The river can be heard faintly below. The air smells of wet stone and willow.'
    exits:
      north: veridia_massive_stable_yard
      south: veridia_massive_east_wall_path
      east: veridia_massive_stable_yard
      down: veridia_massive_stable_yard
    occupants:
    - A guard leans on the parapet looking westward
    objects:
    - A small iron-bound chest is bolted near the postern
    - Ivy has begun to climb the lower courses of the wall
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_stable_yard:
    name: Stable Yard
    room_type: Outer Ward
    desc: A wide yard of hard earth and scattered straw stands beside a long timber
      stable. Horses shift in their stalls and the smell of hay, manure, and leather
      is strong.
    exits:
      north: veridia_massive_carters_rest
      east: veridia_massive_carters_rest
      south: veridia_massive_west_wall_path
      west: veridia_massive_west_wall_path
    occupants:
    - A stablehand brushes down a bay mare
    objects:
    - Bales of hay are stacked against the stable wall
    - A wooden mounting block stands near the yard entrance
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_carters_rest:
    name: Carters' Rest
    room_type: Outer Yard
    desc: 'An open yard just inside the southern gate serves as a resting place for
      wagons and carters. Several carts stand with their shafts raised and horses
      crop grass along the wall.


      The air smells of dust, horse, and woodsmoke from a small cookfire.'
    exits:
      north: veridia_massive_north_gate_approach
      south: veridia_massive_stable_yard
      east: veridia_massive_north_gate_approach
      west: veridia_massive_stable_yard
    occupants:
    - A carter sits on a wagon bed eating bread and cheese
    objects:
    - A water barrel and dipper stand under a lean-to
    - Spare wagon wheels lean against the wall in a neat row
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_north_gate_approach:
    name: North Gate Approach
    room_type: Outer Gate
    desc: 'The northern gate of Greenhold is smaller than the main riverstone gate
      but still solid. Two guard towers flank a heavy wooden door that stands open
      during daylight hours. The road beyond leads into the northern pastures.


      The air is cooler and carries the scent of open grassland.'
    exits:
      south: veridia_massive_carters_rest
      north: veridia_massive_east_gate_path
      east: veridia_massive_east_gate_path
      west: veridia_massive_carters_rest
    occupants:
    - A pair of guards check the occasional cart
    objects:
    - A wooden board lists current tolls and notices
    - Mud from the road has been tracked across the threshold
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_east_gate_path:
    name: East Gate Path
    room_type: Outer Gate
    desc: 'A secondary gate opens eastward toward the meadows and the road to Elderwatch.
      The gate is simpler, with a single tower and a reinforced wooden door. Outside,
      the land opens quickly into pasture.


      The wind carries the smell of grass and distant forest.'
    exits:
      west: veridia_massive_north_gate_approach
      east: veridia_massive_wall_walk_north
      north: veridia_massive_wall_walk_north
      south: veridia_massive_north_gate_approach
    occupants:
    - A guard sits on a stool just inside the gate
    objects:
    - A small shrine to safe travel stands beside the gatepost
    - Wagon ruts deepen immediately beyond the threshold
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_wall_walk_north:
    name: Wall Walk North
    room_type: Town Wall
    desc: 'The wall walk here offers a clear view northward across the pastures. The
      stone parapet is chest-high and worn smooth by years of weather and watchmen.
      Ladders lead down to the outer wards at intervals.


      The wind is strong and clean. Greenhold''s rooftops spread out to the south.'
    exits:
      south: veridia_massive_east_gate_path
      east: veridia_massive_wall_walk_south
      west: veridia_massive_east_gate_path
      down: veridia_massive_wall_walk_south
    occupants:
    - A guard paces slowly along the walk
    objects:
    - A covered signal fire pit sits ready but unlit
    - Arrow slits look outward across the open land
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_wall_walk_south:
    name: Wall Walk South
    room_type: Town Wall
    desc: 'From this section of the wall the southern meadows and the distant tree
      line of Duskwood are visible. The stones underfoot are uneven in places where
      repairs have been made over the years.


      The air smells of the open fields. A hawk circles high above the meadows.'
    exits:
      north: veridia_massive_outer_stable_paddock
      east: veridia_massive_outer_stable_paddock
      west: veridia_massive_wall_walk_north
      down: veridia_massive_outer_stable_paddock
    occupants: []
    objects:
    - A spare quiver of arrows hangs from a peg on the parapet
    - A wooden shelter offers brief protection from rain
    - The town roofs fall away to the north
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_outer_stable_paddock:
    name: Outer Stable Paddock
    room_type: Paddock
    desc: 'A larger paddock of open grass lies just outside the stable yard, enclosed
      by a solid wooden fence. Several horses graze here during the day. A water trough
      and a hay rack stand at one end.


      The air smells of grass and horse. Flies buzz around the trough.'
    exits:
      west: veridia_massive_wall_walk_south
      east: veridia_massive_riverbend_outer_market
      north: veridia_massive_riverbend_outer_market
    occupants:
    - A stablehand moves among the horses with a halter
