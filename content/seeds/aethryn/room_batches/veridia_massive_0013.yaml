    objects:
    - A small side alcove contains a nest of dried grass and fur
    - Water seeps from a crack in the wall and joins the main stream
    - The passage continues both downward and slightly to the east
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_glowing_pool_chamber:
    name: Glowing Pool Chamber
    room_type: Cave
    desc: 'The passage opens into a rounded chamber dominated by a clear pool that
      glows with the same soft green light as the moss. The water is cold and still.
      Stalactites hang from the ceiling and the walls are slick with moisture.


      The air is very still and carries only the smell of wet stone and mineral. The
      glow is strong enough to read by.'
    exits:
      west: veridia_massive_lower_moss_passage
      up: veridia_massive_lower_moss_passage
      north: veridia_massive_side_alcove
    occupants: []
    objects:
    - A flat ledge of stone runs along one side of the pool
    - Small pale fish move slowly in the glowing water
    - A narrow crack in the far wall suggests a possible continuation
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_side_alcove:
    name: Side Alcove
    room_type: Cave
    desc: 'A small dry alcove opens off the main passage. The floor is higher and
      the air is a little less damp. Someone has used this space as a temporary camp
      in the past.


      The green glow from the main passage provides dim light.'
    exits:
      out: veridia_massive_forest_edge_clearing
    occupants: []
    objects:
    - A ring of stones forms an old fire pit
    - A few pieces of dry wood and some discarded bones remain
    - The alcove offers a place to rest out of the main draft
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_forest_edge_clearing:
    name: Forest Edge Clearing
    room_type: Forest Edge
    desc: 'A small natural clearing opens among the first true trees of the eastern
      wood. Sunlight reaches the ground here in shifting patches. The undergrowth
      is thick around the edges but the center is open and grassy.


      The air is cooler and smells strongly of leaf mold and growing things.'
    exits:
      west: veridia_massive_side_alcove
      east: veridia_massive_old_oak_grove
      north: veridia_massive_old_oak_grove
      south: veridia_massive_side_alcove
    occupants: []
    objects:
    - A fallen oak provides a natural seat and table
    - A faint trail continues deeper into the wood to the east
    - Animal tracks of several kinds cross the clearing
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_old_oak_grove:
    name: Old Oak Grove
    room_type: Light Forest
    desc: 'Several massive oaks grow close together here, their branches interlocking
      overhead. The ground is thick with centuries of leaf litter and soft moss. Little
      undergrowth survives in the deep shade.


      The air is still and cool. The only sounds are the occasional creak of old wood
      and the drip of water from the canopy after rain.'
    exits:
      north: veridia_massive_deer_trail_1
      south: veridia_massive_forest_edge_clearing
      east: veridia_massive_deer_trail_1
      west: veridia_massive_forest_edge_clearing
    occupants: []
    objects:
    - A hollow in the largest oak shows signs of old use as a shelter
    - A scatter of acorn shells and small bones lies near the hollow
    - Faint paths lead outward between the trunks in several directions
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_deer_trail_1:
    name: Deer Trail 1
    room_type: Light Forest
    desc: 'A narrow but clear game trail winds between the trees. The ground is soft
      and marked with many hoofprints. The canopy is high and the undergrowth is thinner
      along the trail itself.


      The air smells of damp earth and green leaves. Occasional shafts of light reach
      the forest floor.'
    exits:
      northeast: veridia_massive_deer_trail_2
      southwest: veridia_massive_old_oak_grove
      northwest: veridia_massive_old_oak_grove
      southeast: veridia_massive_deer_trail_2
    occupants: []
    objects:
    - A large patch of disturbed earth shows where deer have been bedding
    - A broken branch hangs at head height where a large animal passed
    - Birds fall silent as travelers move along the trail
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_deer_trail_2:
    name: Deer Trail 2
    room_type: Light Forest
    desc: 'The game trail continues deeper into the wood, becoming slightly less distinct
      in places where the undergrowth closes in. The trees are older and the light
      is dimmer.


      The smell of the forest is strong and complex. Distant bird calls echo among
      the trunks.'
    exits:
      southwest: veridia_massive_beech_hollow
      northeast: veridia_massive_beech_hollow
      north: veridia_massive_beech_hollow
      south: veridia_massive_deer_trail_1
    occupants:
    - The trail shows signs of regular use by both animals and the occasional human
    objects:
    - A large fallen tree creates a natural obstacle that the trail detours around
    - Moss-covered stones break the surface of the ground in several places
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_beech_hollow:
    name: Beech Hollow
    room_type: Light Forest
    desc: 'A shallow hollow among mature beech trees holds a thicker carpet of leaf
      litter and a few scattered boulders. The light that reaches the ground is soft
      and green.


      The air is still and quiet. The beech mast underfoot is thick in places.'
    exits:
      north: veridia_massive_stream_crossing
      south: veridia_massive_deer_trail_2
      east: veridia_massive_stream_crossing
      west: veridia_massive_deer_trail_2
    occupants: []
    objects:
    - A large boulder offers a place to sit and rest
    - Animal paths cross the hollow in several directions
    - The surrounding trees form a natural shelter from wind and light rain
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_stream_crossing:
    name: Stream Crossing (Forest)
    room_type: Light Forest
    desc: 'A small clear stream runs through the eastern wood, its banks soft and
      muddy. Stepping stones have been placed at the best crossing point and the trail
      continues on the far side.


      The sound of running water is pleasant and constant. The air is cooler near
      the stream.'
    exits:
      east: veridia_massive_deep_thicket
      west: veridia_massive_beech_hollow
      north: veridia_massive_deep_thicket
      south: veridia_massive_beech_hollow
    occupants: []
    objects:
    - Moss and ferns grow thickly along the banks
    - A fallen log provides an alternative crossing a short distance upstream
    - Animal tracks are thick in the soft ground near the water
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_deep_thicket:
    name: Deep Thicket
    room_type: Dense Undergrowth
    desc: 'The undergrowth here is thick with brambles, young trees, and tangled vines.
      Progress is slow and the trail is faint. The canopy overhead is almost continuous.


      The air is still and humid. Visibility is limited to a few paces in any direction.'
    exits:
      north: veridia_massive_second_cave_mouth
      south: veridia_massive_stream_crossing
      east: veridia_massive_second_cave_mouth
      west: veridia_massive_stream_crossing
    occupants: []
    objects:
    - Thorns catch at clothing and skin with every movement
    - A few clearer animal tunnels run through the denser growth
    - The sound of the wider forest is muffled by the thickness of the plants
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_second_cave_mouth:
    name: Second Cave Mouth
    room_type: Cave Entrance
    desc: 'A narrower opening in a different rocky outcrop leads into another small
      cave system. The entrance is partially blocked by a fallen stone and the air
      that issues from it is cool and slightly musty.


      Ferns grow thickly around the entrance. The smell of earth and stone is strong.'
    exits:
      out: veridia_massive_deep_thicket
      down: veridia_massive_second_cave_chamber
      east: veridia_massive_second_cave_chamber
    occupants: []
    objects:
    - Scratches on the rock suggest regular use by small animals
    - A faint draft indicates the cave continues some distance
    - Loose stones make the first steps into the darkness careful work
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_second_cave_chamber:
    name: Second Cave Chamber
    room_type: Cave
    desc: 'A low, irregular chamber opens beyond the entrance. The floor is uneven
      rock and the ceiling is low enough that taller travelers must stoop. A few bones
      and scraps of fur litter one corner.


      The air is still and cool. Only faint light reaches this far from the entrance.'
    exits:
      out: veridia_massive_second_cave_mouth
      down: veridia_massive_root_chamber
      west: veridia_massive_second_cave_mouth
    occupants: []
    objects:
    - A narrow passage continues deeper into the hill
    - Water seeps slowly down one wall, leaving a dark stain
    - The chamber has the feeling of a place used more by animals than by people
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_root_chamber:
    name: Root Chamber
    room_type: Cave
    desc: 'Thick tree roots push through the ceiling and walls of this small chamber,
      creating a tangle of living wood and stone. The air is damp and smells strongly
      of earth and growing things.


      A thin stream of water runs among the roots and disappears into a crack in the
      floor.'
    exits:
      up: veridia_massive_second_cave_chamber
      east: veridia_massive_overlook_crag
      west: veridia_massive_second_cave_chamber
    occupants: []
    objects:
    - The green glow of luminous moss is present but weaker here
    - A small dry ledge offers a place to sit out of the worst of the damp
    - The roots form natural handholds and obstacles
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  veridia_massive_overlook_crag:
    name: Overlook Crag
    room_type: Hills
    desc: 'A rocky crag rises above the surrounding hills, offering a wide view across
      Veridia. The top is mostly bare stone with a few hardy plants growing in cracks.
      The wind is strong and constant.


      From here Greenhold, the river, the meadows, and the edge of the eastern wood
      are all clearly visible on a clear day.'
    exits:
      down: veridia_massive_overlook_crag
      north: veridia_massive_overlook_crag
      south: veridia_massive_root_chamber
      east: veridia_massive_overlook_crag
      west: veridia_massive_root_chamber
    occupants:
    - The path down is steep but manageable with care
    objects:
    - A natural seat has been worn into the stone by weather and use
    - A small cairn of stones stands at the highest point
    replace: true
    tags:
    - aethryn
    - veridia
    - imported_text_drop
  greenhold:
    name: Greenhold
    desc: A walled market-town of green fields, the first stop of every new traveller.
      It lies within Veridia (levels 1-30); the zone road runs back out to the wider
      land.
    exits:
      out: veridia
      in: greenhold_inn
      market: greenhold_store
      square: greenhold_market
      wards: veridia_massive_alder_court
    replace: true
    tags:
    - aethryn
    - room_drop_anchor
    notes: Adds wards -> veridia_massive_alder_court to enter the imported drop.
