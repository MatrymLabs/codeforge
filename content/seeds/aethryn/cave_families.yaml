# SEED: aethryn -- cave_families.yaml  (regional variants for the one reusable cave area-family)
#
# The prompt: implement caves as ONE reusable area family with regional variants. This is the DATA
# that varies it: for each canon region, the cave subtypes, entrance types, biome, creature / hazard
# / resource families, landmarks, an optional hidden feature, and a naming grammar the deterministic generator
# (kernel/world/caves.py) composes from. Content is data, never code; the generator is only its
# factory. Every generated cave inherits its region's identity from the row here, so a Veridia cave
# reads like Veridia and a Frostspire cave reads like Frostspire.
#
# All generated caves are stamped GENERATED_LOCAL: they expand the world locally and may NEVER
# invent global canon (no gods, no pantheon, no answer on Netharion, no new continents). Anything
# touching those is a RUMOR, never an assertion.

# Shared defaults every region inherits unless it overrides them (references, not duplication).
defaults:
  min_rooms: 5
  max_rooms: 18
  return_route: an understandable way back to the surface

veridia:
  biome: temperate
  subtypes: [river cave, farm cellar, limestone hollow, old road shelter]
  entrances: [natural opening, cellar breach, collapsed road]
  creatures: [cave bat, blind newt, burrow rat, pale spider]
  hazards: [slick flowstone, a sudden drop, rising damp, a loose ceiling]
  resources: [a clearwater spring, saltpetre crust, cave mushrooms, a clay seam]
  landmarks: [a still underground pool, a farmer's forgotten cache, a vein of pale crystal]
  hidden: [a bricked-up alcove, a hidden fishing shrine]
  livelihoods: [farming, river fishing, road trade]
  naming:
    adjectives: [Damp, Still, Pale, Winding, Low]
    nouns: [Hollow, Passage, Grotto, Undercroft, Cut]

