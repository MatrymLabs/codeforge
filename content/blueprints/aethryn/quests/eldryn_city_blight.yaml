# SEED: aethryn -- quests/eldryn_city_blight.yaml  (Eldryn City's quest: The Grey in the Roots)
# Auto-loaded. Local need (a rot has taken the deep roots and the wardens cannot name it), world
# echo (a sickness rising in the oldest roots of the realm, where the forest's memory runs deepest),
# a cost (a walk down into the blighted deep and back), a result (the healers gain a clean sample to
# study), an unresolved remainder (what the rot is, and whether the Great Tree can be saved, is never
# proven). Natural triggers: ENTER the wardens' hall -> TAKE the blighted heartsap from the deep
# roots -> ENTER the wardens' hall. Rewards XP + Gathering standing (the forest capital tends the
# wood, it does not master it).
id: eldryn_city_blight
name: The Grey in the Roots
start: offered
reward_xp: 60
steps:
  - {state: offered, event: enter, to: accepted, on_enter: eldryn_city_wardenhall}
  - {state: accepted, event: take, to: recovered, on_take: eldryn_city_heartsap}
  - state: recovered
    event: enter
    to: done
    on_enter: eldryn_city_wardenhall
    effect: "award_xp;grant_rep:gathering:30"
terminal: [done]
labels:
  offered: "In Eldryn City, the grove-warden frets over a grey rot risen in the deep roots. Step into the wardens' hall in the northern trunk and hear her."
  accepted: "Go DOWN into the deep roots below the court and draw a phial of the blighted heartsap where the rot runs darkest."
  recovered: "Carry the phial of blighted heartsap back up to Grove-Warden Thessaly in the wardens' hall."
  done: "*** The phial is in Thessaly's hand, and the capital's healers have a clean sample of the rot to study at last. What the grey thread laced through the heartsap truly is, and whether the Great Tree can be saved, no warden living can yet say. ***"
