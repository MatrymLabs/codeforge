  accepted: "Descend into the root deep and free the compact's tally-stone from the roots (mind the spore-hound)."
  recovered: "Carry the tally-stone back UP to Warden Sela in the lodge."
  done: "*** The tally-stone is home, and the pact with the wood holds another year. The forest-folk will remember it. ***"
