# remember). Natural triggers, no accept-verb collision: ENTER the lodge -> TAKE the stone -> ENTER
# the lodge. Rewards XP + standing with the Gathering order (the foragers and forest-tenders).
id: wildgrowth_root
name: The Deep Tally
start: offered
reward_xp: 70
steps:
  - {state: offered, event: enter, to: accepted, on_enter: wildgrowth_lodge}
  - {state: accepted, event: take, to: recovered, on_take: wildgrowth_tally_stone}
