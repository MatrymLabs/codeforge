# SEED: aethryn -- quests/silverwatch_tally.yaml  (Silverwatch's quest: The Deep Tally)
# Auto-loaded. Local need (the deep tally-book was carried below and never brought up, so the season's
# assay cannot be sealed), world echo (the reaches beyond the plains have gone quiet, order by order,
# and only the ledger noticed), a cost (a walk down into the deep workings and back), a result (the
# tally is on the clerk's desk and the season can close), an unresolved remainder (why the reaches
# fell silent, and what took the book below, is never proven).
# Natural triggers: ENTER the tally-hall -> TAKE the tally-book from the deep -> ENTER the tally-hall.
# Rewards XP + Knowing standing (Caeloria, and its mining towns, rule by record, not by the sword).
id: silverwatch_tally
name: The Deep Tally
start: offered
reward_xp: 44
steps:
  - {state: offered, event: enter, to: accepted, on_enter: silverwatch_tally}
  - {state: accepted, event: take, to: recovered, on_take: silverwatch_tally_book}
  - state: recovered
    event: enter
    to: done
    on_enter: silverwatch_tally
    effect: "award_xp;grant_rep:knowing:26"
terminal: [done]
labels:
  offered: "In Silverwatch, the tally-clerk has lost the deep tally-book to the workings below. Step into the tally-hall and hear him."
  accepted: "The deep tally-book went down on the last shift and never came up. Take it up from the deep workings under the mine-head."
  recovered: "Carry the deep tally-book back to Tally-Clerk Sennic in the tally-hall."
  done: "*** The deep tally-book is back on Sennic's desk, the season's assay can be sealed, and Silverwatch is once more a town that knows what it is owed. But the last columns still trail off into blank ruled lines, order after order from the reaches beyond the plains shipped and never marked RECEIVED, and no ledger in the heartland can say why the far world has stopped writing back. ***"
