# SEED: aethryn -- quest.yaml (the world's opening arc, map world)
id: the_endless_journey
name: The Endless Journey
start: offered
reward_xp: 60

steps:
  - {state: offered,  event: accept, to: accepted}
  # Completing the first road earns XP and a little standing with the Making Order (the makers who
  # keep the roads) -- the reputation web that faction-gated content is unlocked through.
  - {state: accepted, event: enter,  to: done, on_enter: greenhold, effect: "award_xp;grant_rep:making:40"}

terminal: [done]

labels:
  offered: "Aethryn is vast. Accept the road, and begin."
  accepted: "Make for Greenhold in Veridia, and take your first step into the world."
  done: "*** The journey has begun. The whole world is open. ***"
